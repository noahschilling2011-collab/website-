<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS</title>
<!-- Als data-URL eingebettet: sonst fragt der Browser /favicon.ico an und
     bekommt einen 404 in die Konsole. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%226%22%20fill%3D%22%230a0a0c%22/%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23f2b544%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%223.2%22/%3E%3Cpath%20d%3D%22M12%202.6v3.2M12%2018.2v3.2M2.6%2012h3.2M18.2%2012h3.2%22/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ---------------------------------------------------------------------------
   JARVIS — Phase 1, Walking Skeleton.

   Ein linearer Verlauf, kein Konversations-Browser: das Schema aus
   docs/phases/PHASE-01.md kennt genau eine Tabelle `messages`.

   Akzent ist ein warmes Bernstein — bewusst nicht das übliche Indigo. Genau
   eine Akzentfarbe, sonst Graustufen (0.3).
--------------------------------------------------------------------------- */

:root {
  --bg-0: #0a0a0c;
  --bg-1: #121216;
  --bg-2: #1a1a20;
  --bg-3: #22222a;

  --text:      #e8e8ec;
  --text-loud: #f4f4f7;
  --text-dim:  #9a9aa4;   /* 5.0:1 auch auf der akzentgetönten Fläche */

  --accent:      #f2b544;
  --accent-soft: rgba(242, 181, 68, 0.14);
  --accent-line: rgba(242, 181, 68, 0.35);
  --on-accent:   #17140c;

  --danger: #f2726b;
  --ok:     #5fcf8e;

  --line: rgba(255, 255, 255, 0.09);

  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 24px; --s-6: 32px;

  --step--1: clamp(0.83rem, 0.80rem + 0.15vw, 0.90rem);
  --step-0:  clamp(0.94rem, 0.91rem + 0.20vw, 1.02rem);
  --step-1:  clamp(1.13rem, 1.06rem + 0.35vw, 1.32rem);

  /* 0.3: ruhige Animationen, 200–400 ms, cubic-bezier(0.4, 0, 0.2, 1) */
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  font-size: var(--step-0);
  line-height: 1.55;
  color: var(--text);
  background-color: var(--bg-0);
  /* Struktur hinter dem Glas. Ohne das ist backdrop-filter sinnlos. */
  background-image:
    radial-gradient(900px 620px at 12% -8%,  rgba(242, 181, 68, 0.10), transparent 62%),
    radial-gradient(760px 560px at 92% 108%, rgba(86, 132, 214, 0.10), transparent 60%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

.glass {
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
}
@supports not (backdrop-filter: blur(1px)) {
  .glass { background: rgba(22, 22, 28, 0.94); }
}

/* --- Gerüst --------------------------------------------------------------- */

.app {
  display: grid;
  /* Die Spalte muss ausdrücklich begrenzt werden: eine implizite Grid-Spalte
     ist auto = max-content und wächst mit dem breitesten Kind. */
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100dvh;
  max-width: 900px;
  margin: 0 auto;
}

.topbar {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-4) var(--s-5);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.brand-mark {
  width: 30px; height: 30px;
  flex: none;
  display: grid; place-items: center;
  border-radius: 9px;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
}
.brand-name {
  margin: 0;
  font-size: var(--step-0);
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--text-loud);
}
.brand-phase { font-size: 11px; letter-spacing: 0.06em; color: var(--text-dim); }

.status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--s-2);
  min-width: 0;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex: none; }
.dot.is-ok  { background: var(--ok); }
.dot.is-bad { background: var(--danger); }
.status-text {
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.model-chip {
  flex: none;
  padding: 3px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
}

.thread {
  overflow-y: auto;
  padding: var(--s-5) var(--s-5) var(--s-6);
  display: flex;
  flex-direction: column;
  gap: var(--s-4);
  scroll-behavior: smooth;
}

.msg { max-width: min(70ch, 88%); animation: rise 320ms var(--ease) both; }
.msg-user { align-self: flex-end; }
.msg-assistant, .msg-error { align-self: flex-start; }

.bubble {
  padding: var(--s-3) var(--s-4);
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-1);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.msg-user .bubble {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  border-bottom-right-radius: 5px;
}
.msg-assistant .bubble { border-bottom-left-radius: 5px; }
.msg-error .bubble { border-color: rgba(242, 114, 107, 0.45); color: #ffd9d6; }

/* --- Gedächtnis-Ansicht (Phase 3) ---------------------------------------- */

.kopf-btn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  transition: color 200ms var(--ease), border-color 200ms var(--ease),
              background 200ms var(--ease);
}
.kopf-btn:hover { color: var(--text-loud); border-color: var(--accent-line); }
.kopf-btn[aria-pressed="true"] {
  color: var(--accent);
  border-color: var(--accent-line);
  background: var(--accent-soft);
}

.panel {
  position: fixed;
  inset: 0 0 0 auto;
  z-index: 30;
  width: min(460px, 92vw);
  display: flex;
  flex-direction: column;
  border-width: 0 0 0 1px;
  border-radius: 0;
  transform: translateX(102%);
  transition: transform 300ms var(--ease);
}
.panel.is-open { transform: none; }
.panel-kopf {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-4) var(--s-5);
  border-bottom: 1px solid var(--line);
}
.panel-kopf h2 {
  margin: 0;
  font-size: var(--step-0);
  font-weight: 500;
  color: var(--text-loud);
}
.panel-zu {
  margin-left: auto;
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border: 0; border-radius: 8px;
  background: none; color: var(--text-dim); cursor: pointer;
}
.panel-zu:hover { background: var(--bg-2); color: var(--text); }
.panel-koerper { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s-4) var(--s-5); }
.panel-fuss {
  padding: var(--s-3) var(--s-5) max(var(--s-4), env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
  display: flex;
  gap: var(--s-2);
}
.panel-fuss input {
  flex: 1;
  min-width: 0;
  padding: 8px var(--s-3);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg-0);
}
.panel-fuss button {
  flex: none;
  padding: 8px var(--s-3);
  border: 0; border-radius: 10px;
  background: var(--accent); color: var(--on-accent);
  cursor: pointer;
}

.fakt {
  padding: var(--s-3) 0;
  border-bottom: 1px solid var(--line);
  animation: rise 300ms var(--ease) both;
}
.fakt-text { overflow-wrap: anywhere; }
.fakt-text[contenteditable="true"] {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 6px;
}
.fakt-zeile {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s-2);
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
}
.fakt-kat {
  padding: 1px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
}
.fakt-konflikt {
  margin-top: 6px;
  padding: 6px var(--s-3);
  border-radius: 8px;
  border: 1px solid rgba(242, 114, 107, 0.45);
  background: rgba(242, 114, 107, 0.08);
  color: #ffd9d6;
  font-size: 11px;
}
.fakt-aktion {
  border: 0; background: none; padding: 2px 6px;
  color: var(--text-dim); cursor: pointer; font-size: 11px;
  border-radius: 6px;
}
.fakt-aktion:hover { background: var(--bg-2); color: var(--text); }
.fakt-aktion.is-loeschen:hover { color: var(--danger); }
.panel-leer { color: var(--text-dim); text-align: center; padding: var(--s-6) 0; }

/* --- Plan eines Auftrags (Phase 4) --------------------------------------- */

.plan {
  margin-top: var(--s-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.02);
  overflow: hidden;
}
.plan-kopf {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding: 8px var(--s-3);
  font-size: 11px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--line);
}
.plan-abbrechen {
  margin-left: auto;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: none;
  color: var(--text-dim);
  font-size: 11px;
  padding: 2px 10px;
  cursor: pointer;
}
.plan-abbrechen:hover { color: var(--danger); border-color: rgba(242,114,107,0.5); }

.schritt {
  display: flex;
  gap: var(--s-3);
  padding: 8px var(--s-3);
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  font-size: var(--step--1);
}
.schritt:first-of-type { border-top: 0; }
.schritt-marke {
  flex: none;
  width: 16px; height: 16px;
  margin-top: 3px;
  border-radius: 50%;
  border: 1.5px solid var(--text-dim);
  display: grid;
  place-items: center;
  font-size: 9px;
  color: var(--bg-0);
}
.schritt.is-running .schritt-marke {
  border-color: var(--accent);
  animation: puls 1.4s ease-in-out infinite;
}
.schritt.is-done .schritt-marke { background: var(--ok); border-color: var(--ok); }
.schritt.is-failed .schritt-marke { background: var(--danger); border-color: var(--danger); }
.schritt.is-skipped { opacity: 0.5; }
.schritt-koerper { min-width: 0; flex: 1; }
.schritt-agent {
  display: inline-block;
  margin-left: 6px;
  padding: 0 7px;
  border: 1px solid var(--accent-line);
  border-radius: 999px;
  font-size: 10px;
  color: var(--accent);
}
.schritt-note { margin-top: 3px; font-size: 11px; color: var(--text-dim); }
.schritt.is-failed .schritt-note { color: #ffb9b4; }
.plan-fuss {
  padding: 6px var(--s-3);
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--text-dim);
}
.plan-fuss.is-abbruch { color: #ffb9b4; }

@keyframes puls {
  0%, 100% { box-shadow: 0 0 0 0 rgba(242, 181, 68, 0.4); }
  50%      { box-shadow: 0 0 0 5px rgba(242, 181, 68, 0); }
}

/* --- Rückfrage vor einer Aktion mit Außenwirkung (Phase 5) ---------------- */

.frage {
  margin: var(--s-2) var(--s-3) var(--s-3);
  border: 1px solid var(--accent-line);
  border-radius: 12px;
  background: var(--accent-soft);
  overflow: hidden;
}
.frage-kopf {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding: 8px var(--s-3);
  font-size: 11px;
  color: var(--accent);
  border-bottom: 1px solid var(--accent-line);
}
.frage-stufe {
  margin-left: auto;
  padding: 1px 8px;
  border: 1px solid var(--accent-line);
  border-radius: 999px;
  font-size: 10px;
}
.frage pre {
  margin: 0;
  padding: var(--s-3);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: var(--step--1);
  color: var(--text);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 320px;
  overflow-y: auto;
}
.frage-knoepfe {
  display: flex;
  gap: var(--s-2);
  padding: 0 var(--s-3) var(--s-3);
}
.frage-knoepfe button {
  padding: 7px var(--s-4);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 500;
}
.frage-ja { background: var(--accent); color: var(--on-accent); }
.frage-nein {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--line) !important;
}
.frage-nein:hover { color: var(--danger); border-color: rgba(242,114,107,0.5) !important; }
.frage-hinweis { padding: 0 var(--s-3) var(--s-3); font-size: 11px; color: var(--text-dim); }

/* --- Werkzeugaufrufe, aufklappbar (Phase 2, DoD 6) ------------------------ */

.tools {
  margin-top: var(--s-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.02);
  overflow: hidden;
}
.tools > summary {
  padding: 6px var(--s-3);
  font-size: 11px;
  color: var(--text-dim);
  cursor: pointer;
  list-style: none;
  user-select: none;
  transition: color 200ms var(--ease), background 200ms var(--ease);
}
.tools > summary::-webkit-details-marker { display: none; }
.tools > summary::before {
  content: "▸";
  display: inline-block;
  margin-right: 6px;
  transition: transform 200ms var(--ease);
}
.tools[open] > summary::before { transform: rotate(90deg); }
.tools > summary:hover { color: var(--text); background: var(--bg-2); }

.tool {
  padding: var(--s-3);
  border-top: 1px solid var(--line);
  font-size: var(--step--1);
}
.tool-kopf {
  display: flex;
  align-items: baseline;
  gap: var(--s-2);
  flex-wrap: wrap;
}
.tool-name {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--accent);
}
.tool-name.is-bad { color: var(--danger); }
.tool-dauer { font-size: 11px; color: var(--text-dim); margin-left: auto; }
.tool pre {
  margin: var(--s-2) 0 0;
  padding: var(--s-2) var(--s-3);
  border-radius: 8px;
  background: var(--bg-0);
  color: var(--text-dim);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 260px;
  overflow-y: auto;
}
.tool-quellen {
  margin: var(--s-2) 0 0;
  padding-left: 1.1em;
  font-size: 11px;
}
.tool-quellen a { color: var(--accent); overflow-wrap: anywhere; }

.empty {
  margin: auto;
  max-width: 46ch;
  text-align: center;
  color: var(--text-dim);
  animation: rise 380ms var(--ease) both;
}
.empty h2 {
  margin: 0 0 var(--s-2);
  font-size: var(--step-1);
  font-weight: 500;
  color: var(--text-loud);
  letter-spacing: -0.01em;
}
.empty p { margin: 0; }

.typing { display: inline-flex; gap: 5px; align-items: center; height: 1.55em; }
.typing i {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-dim);
  animation: pulse 1.25s ease-in-out infinite;
}
.typing i:nth-child(2) { animation-delay: 0.16s; }
.typing i:nth-child(3) { animation-delay: 0.32s; }

/* --- Eingabe -------------------------------------------------------------- */

.composer-wrap {
  padding: 0 var(--s-5) max(var(--s-5), env(safe-area-inset-bottom, 0px));
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: var(--s-3);
  padding: var(--s-2) var(--s-2) var(--s-2) var(--s-4);
  border-radius: 16px;
  transition: border-color 200ms var(--ease);
}
.composer:focus-within { border-color: var(--accent-line); }

.composer textarea {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  resize: none;
  background: transparent;
  padding: 10px 0;
  min-height: 1.5em;
  max-height: 200px;
  line-height: 1.5;
}
.composer textarea::placeholder { color: var(--text-dim); }
/* Das outline:none oben schlägt die globale :focus-visible-Regel (höhere
   Spezifität). Ohne diesen Ersatz wäre das Feld per Tastatur unsichtbar. */
.composer textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 8px;
}

.btn-send {
  flex: none;
  display: grid;
  place-items: center;
  width: 38px; height: 38px;
  border: 0;
  border-radius: 11px;
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
  transition: transform 200ms var(--ease), opacity 200ms var(--ease);
}
.btn-send:hover:not(:disabled) { transform: translateY(-1px); }
.btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

.hint {
  margin: var(--s-2) var(--s-1) 0;
  font-size: 11px;
  color: var(--text-dim);
  min-height: 1.4em;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
@keyframes pulse {
  0%, 100% { opacity: 0.25; transform: translateY(0); }
  50%      { opacity: 1;    transform: translateY(-3px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

@media (max-width: 600px) {
  .thread, .composer-wrap { padding-left: var(--s-4); padding-right: var(--s-4); }
  .topbar { padding-left: var(--s-4); padding-right: var(--s-4); }
  .msg { max-width: 94%; }
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar glass">
    <span class="brand-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M12 2.6v3.2M12 18.2v3.2M2.6 12h3.2M18.2 12h3.2"></path>
        <path d="M5.4 5.4l2.3 2.3M16.3 16.3l2.3 2.3M18.6 5.4l-2.3 2.3M7.7 16.3l-2.3 2.3"></path>
      </svg>
    </span>
    <h1 class="brand-name">JARVIS</h1>
    <span class="brand-phase" id="brand-phase"></span>
    <button class="kopf-btn" id="btn-memory" type="button" aria-pressed="false">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 3a4 4 0 0 0-4 4v10a4 4 0 0 0 8 0V7a4 4 0 0 0-4-4zM8 9h8M8 15h8"></path>
      </svg>
      Gedächtnis
    </button>
    <span class="status">
      <span class="dot" id="health-dot"></span>
      <span class="status-text" id="health-text">verbinde…</span>
      <span class="model-chip" id="model-chip">—</span>
    </span>
  </header>

  <div class="thread" id="thread" aria-live="polite" aria-busy="false"></div>

  <div class="composer-wrap">
    <form class="composer glass" id="composer">
      <textarea id="input" rows="1" placeholder="Schreib etwas…" aria-label="Nachricht"></textarea>
      <button class="btn-send" id="btn-send" type="submit" aria-label="Senden">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.5 12h13M12 5.5l6 6.5-6 6.5"></path>
        </svg>
      </button>
    </form>
    <p class="hint" id="hint"></p>
  </div>

  <aside class="panel glass" id="memory-panel" aria-label="Gedächtnis" aria-hidden="true">
    <div class="panel-kopf">
      <h2>Was JARVIS über dich weiß</h2>
      <button class="panel-zu" id="memory-zu" type="button" aria-label="Schließen">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>
    <div class="panel-koerper" id="memory-liste"></div>
    <form class="panel-fuss" id="memory-form">
      <input id="memory-neu" placeholder="Fakt hinzufügen…" aria-label="Neuer Fakt">
      <button type="submit">Merken</button>
    </form>
  </aside>
</div>

<script>
(function () {
  'use strict';

  // Wird beim Ausliefern vom Backend eingesetzt. Das ist der JARVIS-Token,
  // nicht der Modell-Key — der verlässt das Backend nie (0.4.1).
  var TOKEN = '__JARVIS_TOKEN__';

  // Zustand lebt in Variablen, nicht in localStorage: in manchen Umgebungen
  // ist die API nicht verfügbar und die Seite stürbe an der ersten Zeile.
  var busy = false;

  var el = {
    thread:    document.getElementById('thread'),
    form:      document.getElementById('composer'),
    input:     document.getElementById('input'),
    send:      document.getElementById('btn-send'),
    hint:      document.getElementById('hint'),
    chip:      document.getElementById('model-chip'),
    phase:     document.getElementById('brand-phase'),
    healthDot: document.getElementById('health-dot'),
    healthTxt: document.getElementById('health-text'),
    memBtn:    document.getElementById('btn-memory'),
    memPanel:  document.getElementById('memory-panel'),
    memZu:     document.getElementById('memory-zu'),
    memListe:  document.getElementById('memory-liste'),
    memForm:   document.getElementById('memory-form'),
    memNeu:    document.getElementById('memory-neu')
  };

  function api(path, options) {
    var opts = options || {};
    opts.headers = { 'X-Jarvis-Token': TOKEN };
    if (opts.body !== undefined) {
      opts.headers['content-type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    return fetch(path, opts).then(function (res) {
      return res.text().then(function (raw) {
        var data = null;
        try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
        if (!res.ok) {
          var detail = (data && data.detail) || raw || ('HTTP ' + res.status);
          if (typeof detail !== 'string') detail = JSON.stringify(detail);
          var err = new Error(detail);
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  function toolNode(call) {
    var box = document.createElement('div');
    box.className = 'tool';

    var kopf = document.createElement('div');
    kopf.className = 'tool-kopf';

    var name = document.createElement('span');
    name.className = 'tool-name' + (call.ok ? '' : ' is-bad');
    name.textContent = call.name + '(' + argumentText(call.arguments) + ')';

    var dauer = document.createElement('span');
    dauer.className = 'tool-dauer';
    dauer.textContent = (call.ok ? '' : 'fehlgeschlagen · ') + (call.duration_ms || 0) + ' ms';

    kopf.appendChild(name);
    kopf.appendChild(dauer);
    box.appendChild(kopf);

    var ausgabe = call.display || call.error || '';
    if (ausgabe) {
      var pre = document.createElement('pre');
      pre.textContent = ausgabe;
      box.appendChild(pre);
    }

    if (call.sources && call.sources.length) {
      var liste = document.createElement('ul');
      liste.className = 'tool-quellen';
      call.sources.forEach(function (url) {
        var li = document.createElement('li');
        // Nur http(s) wird verlinkt — eine URL aus dem Netz ist nichts,
        // dem man ein href blind anvertraut.
        if (/^https?:\/\//i.test(url)) {
          var a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = url;
          li.appendChild(a);
        } else {
          li.textContent = url;
        }
        liste.appendChild(li);
      });
      box.appendChild(liste);
    }
    return box;
  }

  function argumentText(args) {
    if (!args) return '';
    try {
      return Object.keys(args).map(function (k) {
        return k + '=' + JSON.stringify(args[k]);
      }).join(', ');
    } catch (e) { return ''; }
  }

  function toolsNode(calls) {
    var details = document.createElement('details');
    details.className = 'tools';
    var summary = document.createElement('summary');
    var fehler = calls.filter(function (c) { return !c.ok; }).length;
    summary.textContent = calls.length + (calls.length === 1 ? ' Werkzeug' : ' Werkzeuge')
      + ': ' + calls.map(function (c) { return c.name; }).join(', ')
      + (fehler ? ' · ' + fehler + ' fehlgeschlagen' : '');
    details.appendChild(summary);
    calls.forEach(function (c) { details.appendChild(toolNode(c)); });
    return details;
  }

  function messageNode(role, content, toolCalls) {
    var wrap = document.createElement('div');
    wrap.className = 'msg msg-' + role;
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    // textContent, niemals innerHTML: der Inhalt kommt aus einem Modell.
    bubble.textContent = content;
    wrap.appendChild(bubble);
    if (toolCalls && toolCalls.length) wrap.appendChild(toolsNode(toolCalls));
    return wrap;
  }

  function showEmpty() {
    el.thread.textContent = '';
    var box = document.createElement('div');
    box.className = 'empty';
    var h = document.createElement('h2');
    h.textContent = 'Womit fangen wir an?';
    var p = document.createElement('p');
    p.textContent = 'Der Verlauf liegt lokal in SQLite und ist nach einem Neustart noch da.';
    box.appendChild(h); box.appendChild(p);
    el.thread.appendChild(box);
  }

  function scrollDown() {
    requestAnimationFrame(function () { el.thread.scrollTop = el.thread.scrollHeight; });
  }

  function appendError(text) {
    var wrap = document.createElement('div');
    wrap.className = 'msg msg-error';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    el.thread.appendChild(wrap);
    scrollDown();
  }

  function thinkingNode() {
    var wrap = document.createElement('div');
    wrap.className = 'msg msg-assistant';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    var dots = document.createElement('span');
    dots.className = 'typing';
    dots.setAttribute('aria-label', 'JARVIS denkt nach');
    for (var i = 0; i < 3; i++) dots.appendChild(document.createElement('i'));
    bubble.appendChild(dots);
    wrap.appendChild(bubble);
    return wrap;
  }

  function setBusy(value) {
    busy = value;
    el.send.disabled = value;
    el.input.disabled = value;
    el.thread.setAttribute('aria-busy', value ? 'true' : 'false');
  }

  function loadHistory() {
    return api('/api/messages').then(function (messages) {
      if (!messages || !messages.length) { showEmpty(); return; }
      el.thread.textContent = '';
      messages.forEach(function (m) {
        el.thread.appendChild(messageNode(m.role, m.content, m.tool_calls));
      });
      scrollDown();
    });
  }

  function loadHealth() {
    return api('/api/health').then(function (h) {
      el.chip.textContent = h.model;
      el.phase.textContent = 'Phase ' + h.phase;
      el.healthDot.className = 'dot ' + (h.status === 'ok' ? 'is-ok' : 'is-bad');
      if (h.provider_error) {
        el.healthTxt.textContent = h.provider_error;
      } else if (h.provider === 'fake') {
        el.healthTxt.textContent = 'Fake-Anbieter — kein echtes Modell, keine Kosten';
      } else {
        el.healthTxt.textContent = spendText(h.spend);
      }
    }).catch(function (err) {
      el.healthDot.className = 'dot is-bad';
      el.healthTxt.textContent = err.status === 401
        ? 'Token abgelehnt — Seite neu laden'
        : 'Backend nicht erreichbar';
    });
  }

  function spendText(spend) {
    if (!spend || !spend.calls) return 'noch kein Modellaufruf';
    var s = spend.calls + ' Aufrufe · ' + (spend.in_tokens + spend.out_tokens) + ' Token';
    return spend.prices_configured
      ? s + ' · ' + spend.cost_eur.toFixed(4) + ' €'
      : s + ' · Preise nicht in .env eingetragen';
  }

  // --- Plan eines Auftrags (Phase 4) --------------------------------------

  var MARKE = { done: '✓', failed: '✕', skipped: '–', running: '', pending: '' };

  function schrittNode(schritt) {
    var box = document.createElement('div');
    box.className = 'schritt is-' + schritt.status;

    var marke = document.createElement('span');
    marke.className = 'schritt-marke';
    marke.textContent = MARKE[schritt.status] || '';
    box.appendChild(marke);

    var koerper = document.createElement('div');
    koerper.className = 'schritt-koerper';

    var titel = document.createElement('div');
    // Der Runner haengt bei einem Retry den Grund an die Beschreibung — für
    // die Liste reicht die erste Zeile.
    titel.textContent = schritt.description.split('\n')[0];
    if (schritt.agent) {
      var agent = document.createElement('span');
      agent.className = 'schritt-agent';
      agent.textContent = schritt.agent;
      titel.appendChild(agent);
    }
    koerper.appendChild(titel);

    var hinweise = [];
    if (schritt.attempts > 1) hinweise.push(schritt.attempts + ' Versuche');
    if (schritt.status === 'failed' && schritt.note) hinweise.push(schritt.note);
    if (hinweise.length) {
      var note = document.createElement('div');
      note.className = 'schritt-note';
      note.textContent = hinweise.join(' · ');
      koerper.appendChild(note);
    }

    box.appendChild(koerper);
    return box;
  }

  function frageNode(daten) {
    var frage = daten.confirmation;
    var box = document.createElement('div');
    box.className = 'frage';

    var kopf = document.createElement('div');
    kopf.className = 'frage-kopf';
    kopf.textContent = 'JARVIS möchte ' + frage.tool + ' ausführen';
    var stufe = document.createElement('span');
    stufe.className = 'frage-stufe';
    stufe.textContent = frage.permission;
    kopf.appendChild(stufe);
    box.appendChild(kopf);

    // Exakt das, was passieren würde — textContent, der Inhalt kommt aus
    // einem Modell.
    var pre = document.createElement('pre');
    pre.textContent = frage.preview;
    box.appendChild(pre);

    var knoepfe = document.createElement('div');
    knoepfe.className = 'frage-knoepfe';

    function antworte(erlauben) {
      knoepfe.textContent = '';
      var warte = document.createElement('span');
      warte.className = 'frage-hinweis';
      warte.textContent = erlauben ? 'wird ausgeführt…' : 'abgelehnt';
      knoepfe.appendChild(warte);
      api('/api/tasks/' + daten.id + '/confirm', {
        method: 'POST', body: { approve: erlauben }
      }).catch(function (err) { meldung(err.message); });
    }

    var ja = document.createElement('button');
    ja.type = 'button';
    ja.className = 'frage-ja';
    ja.textContent = 'Ausführen';
    ja.addEventListener('click', function () { antworte(true); });

    var nein = document.createElement('button');
    nein.type = 'button';
    nein.className = 'frage-nein';
    nein.textContent = 'Nicht ausführen';
    nein.addEventListener('click', function () { antworte(false); });

    knoepfe.appendChild(ja);
    knoepfe.appendChild(nein);
    box.appendChild(knoepfe);

    var hinweis = document.createElement('p');
    hinweis.className = 'frage-hinweis';
    hinweis.textContent = 'Ohne Antwort passiert nichts. Nach '
      + Math.round((frage.timeout_s || 600) / 60) + ' Minuten wird der Auftrag abgebrochen.';
    box.appendChild(hinweis);

    return box;
  }

  function planNode(daten, onAbbruch) {
    var box = document.createElement('div');
    box.className = 'plan';

    var kopf = document.createElement('div');
    kopf.className = 'plan-kopf';
    var laeuft = daten.status === 'running' || daten.status === 'pending';
    var fertig = daten.steps.filter(function (s) { return s.status === 'done'; }).length;
    kopf.textContent = laeuft
      ? 'Plan läuft — ' + fertig + '/' + daten.steps.length + ' Schritten'
      : 'Plan · ' + daten.status + ' · ' + fertig + '/' + daten.steps.length;

    if (laeuft && onAbbruch) {
      var stop = document.createElement('button');
      stop.type = 'button';
      stop.className = 'plan-abbrechen';
      stop.textContent = 'abbrechen';
      stop.addEventListener('click', onAbbruch);
      kopf.appendChild(stop);
    }
    box.appendChild(kopf);

    daten.steps.forEach(function (schritt) { box.appendChild(schrittNode(schritt)); });

    if (daten.confirmation) box.appendChild(frageNode(daten));

    var fuss = document.createElement('div');
    fuss.className = 'plan-fuss';
    var teile = [];
    if (daten.spent_tokens) teile.push(daten.spent_tokens + ' Token');
    if (daten.spent_tool_calls) teile.push(daten.spent_tool_calls + ' Werkzeugaufrufe');
    if (daten.spent_cost_eur) teile.push(daten.spent_cost_eur.toFixed(4) + ' €');
    if (daten.abort_reason) {
      fuss.className += ' is-abbruch';
      teile.unshift('Abgebrochen: ' + daten.abort_reason);
    }
    fuss.textContent = teile.join(' · ');
    if (teile.length) box.appendChild(fuss);

    return box;
  }

  var ENDZUSTAENDE = ['done', 'failed', 'aborted_budget', 'cancelled'];

  function send(text) {
    setBusy(true);
    el.hint.textContent = '';

    if (el.thread.querySelector('.empty')) el.thread.textContent = '';
    el.thread.appendChild(messageNode('user', text));

    var wartend = thinkingNode();
    el.thread.appendChild(wartend);
    scrollDown();

    var started = Date.now();
    var planBox = null;

    api('/api/tasks', { method: 'POST', body: { goal: text } })
      .then(function (start) {
        return neuerPlan(start.task_id, wartend, started);
      })
      .catch(function (err) {
        wartend.remove();
        appendError(err.message);
        setBusy(false);
        el.input.focus();
      });

    function neuerPlan(taskId, platzhalter, begonnen) {
      // Phase 7 ersetzt dieses Polling durch einen Ereignisstrom. Bis dahin
      // ist ein Intervall von 700 ms der Kompromiss zwischen "man sieht was"
      // und "der Server wird nicht mit Anfragen zugeschüttet".
      var abgebrochen = false;

      function abbrechen() {
        abgebrochen = true;
        api('/api/tasks/' + taskId + '/cancel', { method: 'POST' })
          .catch(function (err) { meldung(err.message); });
      }

      function tick() {
        return api('/api/tasks/' + taskId).then(function (daten) {
          var neuerKasten = planNode(daten, abgebrochen ? null : abbrechen);
          if (planBox) { planBox.replaceWith(neuerKasten); }
          else { platzhalter.before(neuerKasten); }
          planBox = neuerKasten;

          if (ENDZUSTAENDE.indexOf(daten.status) === -1) {
            var pause = daten.confirmation ? 300 : 700;
            return new Promise(function (weiter) { setTimeout(weiter, pause); }).then(tick);
          }

          platzhalter.remove();
          var antwort = messageNode('assistant', daten.result || 'Kein Ergebnis.');
          planBox.after(antwort);
          scrollDown();

          el.hint.textContent = 'Fertig in ' + ((Date.now() - begonnen) / 1000).toFixed(1)
            + ' s · Vorgang ' + taskId + ' · ' + daten.status;
          if (el.memPanel.classList.contains('is-open')) ladeGedaechtnis();
          setBusy(false);
          el.input.focus();
          return loadHealth();
        });
      }
      return tick();
    }
  }

  el.form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = el.input.value.trim();
    if (!text || busy) return;
    el.input.value = '';
    autogrow();
    send(text);
  });

  el.input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      el.form.requestSubmit();
    }
  });

  function autogrow() {
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, 200) + 'px';
  }
  el.input.addEventListener('input', autogrow);

  // --- Gedächtnis (Phase 3) ---------------------------------------------

  var fakten = [];

  function faktNode(fakt) {
    var box = document.createElement('div');
    box.className = 'fakt';

    var text = document.createElement('div');
    text.className = 'fakt-text';
    text.textContent = fakt.text;
    box.appendChild(text);

    if (fakt.conflicts_with) {
      var partner = fakten.filter(function (f) { return f.id === fakt.conflicts_with; })[0];
      var warnung = document.createElement('div');
      warnung.className = 'fakt-konflikt';
      warnung.textContent = 'Widerspricht möglicherweise #' + fakt.conflicts_with
        + (partner ? ': ' + partner.text : '')
        + ' — beide stehen noch da. Was gilt, entscheidest du.';
      box.appendChild(warnung);
    }

    var zeile = document.createElement('div');
    zeile.className = 'fakt-zeile';

    var kat = document.createElement('span');
    kat.className = 'fakt-kat';
    kat.textContent = fakt.category;
    zeile.appendChild(kat);

    var wann = document.createElement('span');
    wann.textContent = fakt.created_at.slice(0, 10);
    zeile.appendChild(wann);

    var luecke = document.createElement('span');
    luecke.style.marginLeft = 'auto';
    zeile.appendChild(luecke);

    var bearbeiten = document.createElement('button');
    bearbeiten.type = 'button';
    bearbeiten.className = 'fakt-aktion';
    bearbeiten.textContent = 'bearbeiten';
    bearbeiten.addEventListener('click', function () {
      if (text.isContentEditable) { text.blur(); return; }
      text.contentEditable = 'true';
      text.focus();
      bearbeiten.textContent = 'speichern';
    });
    text.addEventListener('blur', function () {
      if (!text.isContentEditable) return;
      text.contentEditable = 'false';
      bearbeiten.textContent = 'bearbeiten';
      var neu = text.textContent.trim();
      if (!neu || neu === fakt.text) { text.textContent = fakt.text; return; }
      api('/api/memory/' + fakt.id, { method: 'PATCH', body: { text: neu } })
        .then(ladeGedaechtnis)
        .catch(function (err) { text.textContent = fakt.text; meldung(err.message); });
    });
    text.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); text.blur(); }
      if (e.key === 'Escape') { text.textContent = fakt.text; text.blur(); }
    });
    zeile.appendChild(bearbeiten);

    if (fakt.conflicts_with) {
      var loesen = document.createElement('button');
      loesen.type = 'button';
      loesen.className = 'fakt-aktion';
      loesen.textContent = 'Widerspruch erledigt';
      loesen.addEventListener('click', function () {
        api('/api/memory/' + fakt.id, { method: 'PATCH', body: { resolve_conflict: true } })
          .then(ladeGedaechtnis).catch(function (err) { meldung(err.message); });
      });
      zeile.appendChild(loesen);
    }

    var loeschen = document.createElement('button');
    loeschen.type = 'button';
    loeschen.className = 'fakt-aktion is-loeschen';
    loeschen.textContent = 'löschen';
    loeschen.addEventListener('click', function () {
      if (!window.confirm('Diesen Eintrag löschen?\n\n' + fakt.text)) return;
      api('/api/memory/' + fakt.id, { method: 'DELETE' })
        .then(ladeGedaechtnis).catch(function (err) { meldung(err.message); });
    });
    zeile.appendChild(loeschen);

    box.appendChild(zeile);
    return box;
  }

  function meldung(text) { el.hint.textContent = text; }

  function ladeGedaechtnis() {
    return api('/api/memory').then(function (liste) {
      fakten = liste || [];
      el.memListe.textContent = '';
      if (!fakten.length) {
        var leer = document.createElement('p');
        leer.className = 'panel-leer';
        leer.textContent = 'Noch nichts gemerkt. JARVIS merkt sich nur, worum du '
          + 'ihn bittest — nicht den ganzen Chat.';
        el.memListe.appendChild(leer);
        return;
      }
      fakten.forEach(function (f, i) {
        var node = faktNode(f);
        node.style.animationDelay = Math.min(i, 8) * 40 + 'ms';
        el.memListe.appendChild(node);
      });
    }).catch(function (err) { meldung('Gedächtnis: ' + err.message); });
  }

  function memoryOffen(offen) {
    el.memPanel.classList.toggle('is-open', offen);
    el.memPanel.setAttribute('aria-hidden', offen ? 'false' : 'true');
    el.memBtn.setAttribute('aria-pressed', offen ? 'true' : 'false');
    if (offen) ladeGedaechtnis();
  }

  el.memBtn.addEventListener('click', function () {
    memoryOffen(!el.memPanel.classList.contains('is-open'));
  });
  el.memZu.addEventListener('click', function () { memoryOffen(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') memoryOffen(false);
  });

  el.memForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = el.memNeu.value.trim();
    if (!text) return;
    el.memNeu.value = '';
    api('/api/memory', { method: 'POST', body: { text: text } })
      .then(function (d) {
        if (d && d.conflict) {
          meldung('Achtung: widerspricht möglicherweise "' + d.conflict.text + '"');
        }
        return ladeGedaechtnis();
      })
      .catch(function (err) { meldung(err.message); });
  });

  el.hint.textContent = 'Enter senden · Umschalt+Enter neue Zeile';
  showEmpty();
  loadHealth();
  loadHistory().catch(function (err) { appendError(err.message); });
})();
</script>
</body>
</html>
