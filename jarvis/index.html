<!-- FIX-06 Abschnitt 5: die Palette steht EINMAL, hier und in

<link rel="stylesheet" href="/static/system.css">
<style>
/* ---------------------------------------------------------------------------
   JARVIS — Phase 1, Walking Skeleton.

   Ein linearer Verlauf, kein Konversations-Browser: das Schema aus
   docs/phases/PHASE-01.md kennt genau eine Tabelle `messages`.

   Akzent ist ein warmes Bernstein — bewusst nicht das übliche Indigo. Genau
   eine Akzentfarbe, sonst Graustufen (0.3).
--------------------------------------------------------------------------- */

/* Die Palette stand frueher hier. Seit FIX-06 Abschnitt 5 liegt sie in
   `static/system.css` — einmal, fuer beide Seiten und fuer den Globus. Die
   englischen Namen (`--bg-0`, `--accent`, `--line`, `--ease` …) gibt es dort
   weiter, aber nur noch als Zeiger auf die deutschen. So bleibt jede Regel
   in dieser Datei gueltig, ohne dass die Werte an zwei Orten stehen. */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  font-size: var(--step-0);
  line-height: 1.55;
  color: var(--text);
  background-color: var(--bg-0);
  /* Struktur hinter dem Glas. Ohne das ist backdrop-filter sinnlos. */
  background-image:
    /* Hier standen zwei Farben, die keiner Palette angehoerten: ein
       vierter Bernstein dicht neben --akzent, und der zweite Akzent, den
       der Kopf von static/system.css fuer abgeschafft erklaert. Jetzt
       zweimal derselbe Akzent, unten schwaecher.
       Die alten Werte stehen ABSICHTLICH nicht hier: der Waechter
       durchsucht auch Kommentare, und ein Kommentar, der ihn rot macht,
       ist genau die Falle, die er verhindern soll. Sie stehen in
       test_nur_die_eine_akzentfarbe_und_die_zwei_signalfarben. */
    radial-gradient(900px 620px at 12% -8%,  rgba(240, 180, 92, 0.10), transparent 62%),
    radial-gradient(760px 560px at 92% 108%, rgba(240, 180, 92, 0.06), transparent 60%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea { font: inherit; color: inherit; }

/* `:focus-visible`, `.glass` und der Reduced-Motion-Block stehen seit
   FIX-06 Abschnitt 5 in `static/system.css`. */

/* --- Gerüst --------------------------------------------------------------- */

.app {
  display: grid;
  /* Die Spalte muss ausdrücklich begrenzt werden: eine implizite Grid-Spalte
     ist auto = max-content und wächst mit dem breitesten Kind. */
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100dvh;
  max-width: 900px;
  margin: 0 auto;
}

.topbar {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-4) var(--s-5);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
/* --- Der Reaktor ---------------------------------------------------------
   Das Markensymbol ist der einzige Ort, an dem JARVIS dauernd sichtbar ist.
   Statt eines Kaestchens mit Rahmen zeigt es jetzt, was das System gerade
   TUT - acht Zustaende, eine Rangfolge.
   Kasten und Rahmen fallen weg: das Symbol selbst traegt den Zustand, ein
   Rahmen drumherum wuerde nur mit ihm konkurrieren. */
.brand-mark {
  width: 30px; height: 30px;
  flex: none;
  display: grid; place-items: center;
  color: var(--akzent);
}
.brand-mark .kern   { opacity: 1; }
.brand-mark .strahl { opacity: .3; }
.brand-mark .reaktor-ring { opacity: 0; }

/* Rangfolge, von unten nach oben: was den Nutzer BRAUCHT, schlaegt jeden
   Betriebszustand. Entschieden wird sie in `reaktorZustand()`, nicht hier -
   CSS kennt keine Rangfolge, nur Spezifitaet, und die waere die falsche
   Sprache dafuer. */
.brand-mark[data-zustand="ruhe"]   { color: var(--text-leise); }
.brand-mark[data-zustand="ruhe"]   .kern   { opacity: .45; }
.brand-mark[data-zustand="ruhe"]   .strahl { opacity: .25; }

.brand-mark[data-zustand="wartet"] .kern   { opacity: 1; }
.brand-mark[data-zustand="wartet"] .strahl { opacity: .4; }

/* Kein Drehen: das Symbol ist 16 px gross, da wird Rotation zu Flimmern.
   Nur der Kern atmet. */
@keyframes reaktor-atmet { 0% { opacity: .7; } 50% { opacity: 1; } 100% { opacity: 1; } }
.brand-mark[data-zustand="denkt"]  .kern   { animation: reaktor-atmet 2.4s ease-in-out infinite; }
.brand-mark[data-zustand="denkt"]  .strahl { opacity: .85; }

.brand-mark[data-zustand="werkzeug"] .kern   { opacity: 1; }
.brand-mark[data-zustand="werkzeug"] .strahl { opacity: .3; }

/* Hoeren und Sprechen: dieselbe Welle, gegenlaeufig. Nach innen heisst
   "kommt herein", nach aussen "geht hinaus". */
@keyframes reaktor-rein { from { transform: scale(1.9); opacity: 0; }
                          50% { opacity: .55; }
                          to   { transform: scale(1);   opacity: 0; } }
@keyframes reaktor-raus { from { transform: scale(1);   opacity: 0; }
                          50% { opacity: .55; }
                          to   { transform: scale(1.9); opacity: 0; } }
.brand-mark[data-zustand="hoert"]   { color: var(--ab); }
.brand-mark[data-zustand="hoert"]   .reaktor-ring { animation: reaktor-rein 1.1s linear infinite; }
.brand-mark[data-zustand="spricht"] { color: var(--akzent); }
.brand-mark[data-zustand="spricht"] .reaktor-ring { animation: reaktor-raus 1.1s linear infinite; }

/* Einmalig, nicht endlos: ein Fehlschlag ist ein Ereignis, kein Zustand.
   Die Vorlage nennt 180 ms und 400 ms. Beides waere eine fuenfte und sechste
   Dauer; `--dauer-tupf` (140) und `--dauer-rein` (380) liegen so nah daran,
   dass der Unterschied nicht zu sehen ist - der Bruch im System dagegen
   schon. */
@keyframes reaktor-blitz        { from { opacity: 1; } to { opacity: .35; } }
@keyframes reaktor-blitz-strahl { from { opacity: 1; } to { opacity: .25; } }
.brand-mark[data-zustand="fehl"] { color: var(--ab); }
.brand-mark[data-zustand="fehl"] .kern   { animation: reaktor-blitz var(--dauer-tupf) linear 1 both; }
.brand-mark[data-zustand="fehl"] .strahl { animation: reaktor-blitz-strahl var(--dauer-tupf) linear 1 both; }

@keyframes reaktor-abkuehlen { from { opacity: 1; } to { opacity: .6; } }
.brand-mark[data-zustand="fertig"] { color: var(--auf); }
.brand-mark[data-zustand="fertig"] svg    { animation: reaktor-abkuehlen var(--dauer-rein) linear 1 both; }
.brand-mark[data-zustand="fertig"] .kern  { opacity: 1; }
.brand-mark[data-zustand="fertig"] .strahl{ opacity: .6; }
.brand-name {
  margin: 0;
  font-size: var(--step-0);
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--text-loud);
}
.brand-phase { font-size: 11px; letter-spacing: 0.06em; color: var(--text-dim); }

.status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--s-2);
  min-width: 0;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex: none; }
.dot.is-ok  { background: var(--ok); }
.dot.is-bad { background: var(--danger); }
.status-text {
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.model-chip {
  flex: none;
  padding: 3px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
}

.thread {
  /* display kommt aus .thread.is-active - sonst bleibt der Chat sichtbar,
     wenn eine andere Ansicht aktiv ist. */
  display: none;
  overflow-y: auto;
  padding: var(--s-5) var(--s-5) var(--s-6);
  flex-direction: column;
  gap: var(--s-4);
  scroll-behavior: smooth;
}

.msg { max-width: min(70ch, 88%); animation: rise var(--dauer-rein) var(--kurve-rein) both; }
.msg-user { align-self: flex-end; }
.msg-assistant, .msg-error { align-self: flex-start; }

.bubble {
  padding: var(--s-3) var(--s-4);
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-1);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.msg-user .bubble {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  border-bottom-right-radius: 5px;
}
.msg-assistant .bubble { border-bottom-left-radius: 5px; }
.msg-error .bubble { border-color: rgba(242, 114, 107, 0.45); color: #ffd9d6; }

/* --- Gedächtnis-Ansicht (Phase 3) ---------------------------------------- */

.kopf-btn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  transition: color var(--dauer-tupf) var(--kurve-rein), border-color var(--dauer-tupf) var(--kurve-rein),
              background var(--dauer-tupf) var(--kurve-rein);
}
.kopf-btn:hover { color: var(--text-loud); border-color: var(--accent-line); }
.kopf-btn[aria-pressed="true"] {
  color: var(--accent);
  border-color: var(--accent-line);
  background: var(--accent-soft);
}

.panel {
  position: fixed;
  inset: 0 0 0 auto;
  z-index: 30;
  width: min(460px, 92vw);
  display: flex;
  flex-direction: column;
  border-width: 0 0 0 1px;
  border-radius: 0;
  transform: translateX(102%);
  /* Asymmetrisch, wie alles andere: rein 380 ms mit der Rein-Kurve, raus
     220 ms mit der Raus-Kurve. Vorher fuhr es in beide Richtungen gleich. */
  transition: transform var(--dauer-raus) var(--kurve-raus);
}
.panel.is-open { transform: none; }
.panel.is-open { transition: transform var(--dauer-rein) var(--kurve-rein); }
.panel-kopf {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-4) var(--s-5);
  border-bottom: 1px solid var(--line);
}
.panel-kopf h2 {
  margin: 0;
  font-size: var(--step-0);
  font-weight: 500;
  color: var(--text-loud);
}
.panel-zu {
  margin-left: auto;
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border: 0; border-radius: 8px;
  background: none; color: var(--text-dim); cursor: pointer;
}
.panel-zu:hover { background: var(--bg-2); color: var(--text); }
.panel-koerper { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s-4) var(--s-5); }
.panel-fuss {
  padding: var(--s-3) var(--s-5) max(var(--s-4), env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
  display: flex;
  gap: var(--s-2);
}
.panel-fuss input {
  flex: 1;
  min-width: 0;
  padding: 8px var(--s-3);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg-0);
}
.panel-fuss button {
  flex: none;
  padding: 8px var(--s-3);
  border: 0; border-radius: 10px;
  background: var(--accent); color: var(--on-accent);
  cursor: pointer;
}

.fakt {
  padding: var(--s-3) 0;
  border-bottom: 1px solid var(--line);
  animation: rise var(--dauer-rein) var(--kurve-rein) both;
}
.fakt-text { overflow-wrap: anywhere; }
.fakt-text[contenteditable="true"] {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 6px;
}
.fakt-zeile {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s-2);
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
}
.fakt-kat {
  padding: 1px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
}
.fakt-konflikt {
  margin-top: 6px;
  padding: 6px var(--s-3);
  border-radius: 8px;
  border: 1px solid rgba(242, 114, 107, 0.45);
  background: rgba(242, 114, 107, 0.08);
  color: #ffd9d6;
  font-size: 11px;
}
.fakt-aktion {
  border: 0; background: none; padding: 2px 6px;
  color: var(--text-dim); cursor: pointer; font-size: 11px;
  border-radius: 6px;
}
.fakt-aktion:hover { background: var(--bg-2); color: var(--text); }
.fakt-aktion.is-loeschen:hover { color: var(--danger); }
.panel-leer { color: var(--text-dim); text-align: center; padding: var(--s-6) 0; }

/* --- Plan eines Auftrags (Phase 4) --------------------------------------- */

.plan {
  margin-top: var(--s-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.02);
  overflow: hidden;
}
.plan-kopf {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding: 8px var(--s-3);
  font-size: 11px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--line);
}
.plan-abbrechen {
  margin-left: auto;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: none;
  color: var(--text-dim);
  font-size: 11px;
  padding: 2px 10px;
  cursor: pointer;
}
.plan-abbrechen:hover { color: var(--danger); border-color: rgba(242,114,107,0.5); }

.schritt {
  display: flex;
  gap: var(--s-3);
  padding: 8px var(--s-3);
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  font-size: var(--step--1);
}
.schritt:first-of-type { border-top: 0; }
.schritt-marke {
  flex: none;
  width: 16px; height: 16px;
  margin-top: 3px;
  border-radius: 50%;
  border: 1.5px solid var(--text-dim);
  display: grid;
  place-items: center;
  font-size: 9px;
  color: var(--bg-0);
}
.schritt.is-running .schritt-marke {
  border-color: var(--accent);
  animation: puls 2.4s ease-in-out infinite;
}
.schritt.is-done .schritt-marke { background: var(--ok); border-color: var(--ok); }
.schritt.is-failed .schritt-marke { background: var(--danger); border-color: var(--danger); }
.schritt.is-skipped { opacity: 0.5; }
.schritt-koerper { min-width: 0; flex: 1; }
.schritt-agent {
  display: inline-block;
  margin-left: 6px;
  padding: 0 7px;
  border: 1px solid var(--accent-line);
  border-radius: 999px;
  font-size: 10px;
  color: var(--accent);
}
.schritt-note { margin-top: 3px; font-size: 11px; color: var(--text-dim); }
.schritt.is-failed .schritt-note { color: var(--ab); }
.plan-fuss {
  padding: 6px var(--s-3);
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--text-dim);
}
.plan-fuss.is-abbruch { color: var(--ab); }

/* `box-shadow` malt in jedem Bild neu; `transform` und `opacity` laufen
   auf dem Compositor. Bei einer Endlosanimation ist das der Unterschied
   zwischen "kostet nichts" und "malt die Zone sechzigmal je Sekunde". */
@keyframes puls {
  0%, 100% { opacity: 1;   transform: scale(1); }
  50%      { opacity: .55; transform: scale(1.12); }
}

/* --- Sprache (Phase 9) ---------------------------------------------------- */

.btn-mic {
  flex: none;
  display: grid;
  place-items: center;
  width: 38px; height: 38px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: color var(--dauer-tupf) var(--kurve-rein), border-color var(--dauer-tupf) var(--kurve-rein),
              background var(--dauer-tupf) var(--kurve-rein), transform var(--dauer-tupf) var(--kurve-rein);
}
.btn-mic:hover { color: var(--text-loud); border-color: var(--accent-line); }
.btn-mic.is-hoert {
  color: var(--on-accent);
  background: var(--danger);
  border-color: var(--danger);
  animation: puls 1.1s ease-in-out infinite;
}
.btn-mic[disabled] { opacity: 0.35; cursor: not-allowed; }
.btn-mic.is-spricht { color: var(--accent); border-color: var(--accent-line); }

.sprache {
  flex: none;
  padding: 3px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
}
.sprache:hover { color: var(--text-loud); border-color: var(--accent-line); }

/* --- Ansichten (Phase 7) -------------------------------------------------- */

/* `wrap` seit FIX-06 Abschnitt 6: mit dem sechsten Tab passte die Reihe
   bei 360 px nicht mehr in die Zeile und schob die Seite um 44 px zur
   Seite. Gemessen: scrollWidth 404 bei innerWidth 360, Taeter #tab-welt. */
.tabs { display: flex; gap: 2px; flex-wrap: wrap; min-width: 0; }
.tab {
  padding: 4px 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  transition: color var(--dauer-tupf) var(--kurve-rein), background var(--dauer-tupf) var(--kurve-rein);
}
.tab:hover { color: var(--text-loud); }
/* Deckend, nicht halbtransparent — und das ist kein Geschmack, sondern
   Messbarkeit. Diese Flaeche liegt auf dem Glas der Kopfleiste, also
   Transparenz auf Transparenz. Der Kontrastpruefer von `web-selfcheck`
   bricht seine Suche nach dem Untergrund bei der zweiten getoenten Schicht
   ab und rechnet gegen WEISS: gemeldet 1,69:1, tatsaechlich gemalt 7,68:1.
   `--akzent-glut-fest` ist dieselbe Farbe, vorkomponiert. Optisch
   unveraendert, aber jetzt misst jeder dasselbe wie das Auge sieht. */
.tab[aria-selected="true"] { background: var(--akzent-glut-fest); color: var(--akzent); }

.view { display: none; overflow-y: auto; padding: var(--s-5); }
/* Der Wechsel bekommt eine Einblende - vorher schaltete er hart um.
   Dieselbe Bewegung wie eine Zone, damit die Sprache eine bleibt. */
.view.is-active { display: block;
                  animation: zone-rein var(--dauer-rein) var(--kurve-rein) both; }
/* Keine eigene Dauer fuer das COMMAND CENTER: eine laengere Einblende der
   ganzen Ansicht wuerde die Staffelung der acht Zonen ueberdecken, die sie
   zeigen soll. Die Zonen bringen ihren Takt selbst mit. */

/* --- COMMAND CENTER (FIX-06 Abschnitt 6) --------------------------------- */

/* Zwoelf Spalten brauchen Platz. Der Rest der App bleibt bei 900 px - ein
   Dashboard in einer 900-px-Spalte ist kein Dashboard, sondern eine Liste.
   Die Klasse haengt an `.app` und wird in `zeigeAnsicht()` gesetzt. */
.app.is-weit { max-width: 1500px; }

/* DoD 1: kein Scrollen bei 1440x900. Deshalb `overflow: hidden` statt
   `auto` - was nicht passt, faellt auf, statt sich wegzuscrollen. */
/* Ganze Zonen laufen weiter ein als einzelne Elemente: 12 px gegen 8.
   Der Wert geht als Custom Property an `@keyframes zone-rein` in
   static/system.css, damit dort nur EINE Regel steht. */
#view-cc { padding: var(--s-4); overflow: hidden; --zone-weg: 12px; }

.cc { border: 1px solid var(--kante); border-radius: 12px; overflow: hidden;
      grid-auto-rows: min-content; }
/* Ein Polster fuer alle Zonen statt drei verschiedene. 16 px kosten
   Hoehe - dass DoD 1 (kein Scrollen bei 1440x900) weiter haelt, misst
   `test_dod_1_kein_scrollen_bei_1440x900`. */
.cc > .zone { padding: var(--s-4); min-width: 0; display: flex;
              flex-direction: column; gap: 11px; }

.z3  { grid-column: span 3; }
.z4  { grid-column: span 4; }
.z5  { grid-column: span 5; }
.z6  { grid-column: span 6; }
.z12 { grid-column: span 12; }

.zone-kopf {
  display: flex; align-items: baseline; gap: var(--s-3);
  font-size: var(--etikett); letter-spacing: .11em; text-transform: uppercase;
  color: var(--text-leise);
}
.zone-kopf .zahl-rechts { margin-left: auto; font-variant-numeric: tabular-nums; }
/* Der Strich aus 6.3: die Zone bleibt stehen, der Inhalt ist ehrlich leer.
   Er steht in derselben Groesse wie eine Kennzahl - "hier waere eine Zahl,
   es gibt nur keine" liest sich anders als ein kleiner grauer Strich. */
.zone-leer { margin: 0; color: var(--text-leise); font-size: 14px;
             line-height: 1.6; max-width: 340px; }
.zone-leer::before { content: "—"; display: block; color: var(--text-leise);
                     font-size: 34px; font-weight: 600; line-height: 1;
                     letter-spacing: -0.03em; margin-bottom: 8px; }
/* Zone 8 ist breit und flach. Dort steht der Strich NEBEN dem Satz statt
   darueber - mit 48 px uebereinander wurde der Satz unten abgeschnitten,
   und `#view-cc` scrollt laut DoD 1 nicht, klippt also. */
.cc > .zone.z12 .zone-leer { display: flex; align-items: baseline; gap: 14px;
                             max-width: none; }
.cc > .zone.z12 .zone-leer::before { margin-bottom: 0; }

/* Zone 1 --------------------------------------------------------------- */
/* `.cc > .zone` sind zwei Klassen und schlagen eine einzelne - ohne den
   zusammengesetzten Selektor bleibt die Kopfzeile eine Spalte. Gemessen:
   Marke und Anbieter standen untereinander statt nebeneinander. */
.cc > .zone.cc-kopf { flex-direction: row; align-items: center; gap: var(--s-4); }
.cc-marke { font-size: var(--step-0); letter-spacing: .14em; color: var(--text-laut);
            font-weight: 500; }
.cc-marke b { color: var(--akzent); font-weight: 500; }
/* Nicht `--kenngroesse`: das ist die Groesse fuer EINE Heldenzahl. Als Uhr
   in der Kopfzeile war sie 64 px hoch und hat die ganze Zeile erschlagen. */
.cc-uhr { margin-left: auto; font-family: var(--mono);
          font-variant-numeric: tabular-nums; font-size: var(--step-1);
          line-height: 1; color: var(--text-laut); letter-spacing: .04em; }
.cc-uhr small { font-size: var(--etikett); color: var(--text-leise);
                margin-left: 8px; letter-spacing: .11em; }
.cc-anbieter { font-size: var(--etikett); color: var(--text-leise);
               letter-spacing: .11em; }

/* Zone 2 --------------------------------------------------------------- */
.cc-globus { position: relative; min-height: 215px; padding: 0; }
.cc-globus .zone-kopf { position: absolute; inset: 9px 13px auto; z-index: 2;
                        pointer-events: none; }
.cc-globus-platz { flex: 1; min-height: 0; position: relative; }
/* Das Canvas kommt aus der Weltansicht herueber. Dort galt
   `.globus-wurzel #globus{position:absolute;inset:0}` - hier greift die
   Regel nicht mehr, also braucht es eine eigene. */
/* `inset` reicht hier NICHT. Ein <canvas> ist ein ersetztes Element: steht
   `width: auto`, nimmt CSS die intrinsische Groesse (300x150) und ignoriert
   eine der beiden Kanten - gemessen, canvasW war 300px trotz left und
   right. Deshalb Breite und Hoehe ausdruecklich. */
.cc-globus-platz canvas { position: absolute; top: 22px; left: 10px;
                          width: calc(100% - 20px); height: calc(100% - 30px);
                          display: block; cursor: grab; }
.cc-globus-hinweis { position: absolute; inset: 22px 13px 9px; margin: 0;
                     display: flex; flex-direction: column; align-items: center;
                     justify-content: center; text-align: center;
                     font-size: var(--step--1); color: var(--text-leise); }
.cc-globus-hinweis button {
  display: block; margin: 8px auto 0; padding: 5px 12px; border-radius: 8px;
  border: 1px solid var(--akzent-linie); background: var(--akzent-glut-fest);
  color: var(--akzent); cursor: pointer; font-size: var(--step--1);
}

/* Zone 3 --------------------------------------------------------------- */
.cc-auftrag { display: flex; flex-direction: column; gap: 3px; }
.cc-auftrag + .cc-auftrag { margin-top: 7px; }
.cc-auftrag-ziel { font-size: var(--step--1); color: var(--text-laut);
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-auftrag-zeile { display: flex; gap: var(--s-2); font-size: var(--etikett);
                    color: var(--text-leise); font-variant-numeric: tabular-nums; }
.cc-balken { height: 3px; background: var(--kante); overflow: hidden; }
/* `scaleX` statt `width`: `width` loest ein Layout aus, `transform` nicht -
   und diese Ansicht darf laut DoD 1 nicht scrollen, da will man kein
   Nachrechnen der Nachbarzonen bei jedem Fortschritt.
   Hier stand `var(--dauer-normal)`, und das Token gibt es in keiner Datei.
   Damit war die ganze Deklaration ungueltig und der Balken sprang hart -
   ausgerechnet an der Stelle, die Fortschritt zeigen soll. Gefunden beim
   Abgleich mit Noahs Bewegtbild-Vorlage, festgehalten in
   `test_kein_undefiniertes_custom_property`. */
.cc-balken i { display: block; height: 100%; width: 100%;
               background: var(--akzent);
               transform-origin: left center; transform: scaleX(0);
               transition: transform var(--dauer-zahl) var(--kurve-rein); }

/* Zone 4 --------------------------------------------------------------- */
.cc-strom { flex: 1; min-height: 0; overflow-y: auto; font-family: var(--mono);
            font-size: 11.5px; line-height: 1.45; display: flex;
            flex-direction: column; justify-content: flex-end; }
/* Zwei Spalten statt Fliesstext: die Zeitstempel fluchten, und der Blick
   findet die Ereignisart, ohne jede Zeile von vorn zu lesen.
   KEIN `animation-delay`: der Takt kommt aus dem echten SSE-Strom, nicht
   aus einer Staffelung. Eine gestaffelte Einblendung wuerde eine Ordnung
   behaupten, die die Ereignisse nicht haben. */
@keyframes strom-rein { from { opacity: 0; transform: translateY(6px); }
                        to   { opacity: 1; transform: none; } }
/* DREI Spalten, nicht zwei: die Zeile hat Zeit, Art und Text. Mit zwei
   Spalten rutschte der Text in eine zweite Rasterzeile und der Strom las
   sich doppelt so hoch wie er ist. */
.cc-strom div { display: grid; grid-template-columns: 68px 92px 1fr; gap: 8px;
                overflow: hidden; color: var(--text);
                animation: strom-rein var(--dauer-rein) var(--kurve-rein) both; }
.cc-strom div > :last-child { overflow: hidden; text-overflow: ellipsis;
                              white-space: nowrap; }
.cc-strom div:last-child { color: var(--text-laut); }
.cc-strom .t  { color: var(--text-leise); font-variant-numeric: tabular-nums; }
.cc-strom .n  { color: var(--text-leise); }

/* Zone 5 --------------------------------------------------------------- */
.cc-kennzahlen { display: grid; grid-template-columns: repeat(4, 1fr);
                 gap: 1px; background: var(--kante); }
.cc-kennzahl { background: var(--ebene-1); padding: 7px 13px 9px; min-width: 0; }
/* Etikett oben, Zahl rechtsbuendig darunter - so stehen vier Zahlen
   untereinander auf derselben Kante, statt links an verschieden langen
   Woertern zu haengen. `tabular-nums` haelt sie auch beim Hochzaehlen
   ruhig. */
.cc-kennzahl .name { display: block; font-size: var(--etikett);
                     letter-spacing: .11em; text-transform: uppercase;
                     color: var(--text-leise); }
.cc-kennzahl .wert { display: block; font-size: 44px; font-weight: 600;
                     line-height: 1.05; letter-spacing: -0.03em;
                     text-align: right; font-variant-numeric: tabular-nums;
                     color: var(--text-laut); margin-top: 4px; }
/* Ein Strich ist keine Zahl. Er steht in derselben Groesse, aber leiser. */
.cc-kennzahl .wert.ist-leer { color: var(--text-leise); }
.cc-kennzahl .fussnote { display: block; font-size: 11.5px; line-height: 1.3;
                         color: var(--text-leise); margin-top: 9px;
                         text-align: right; }
.z-kennzahlen { padding: 0; gap: 0; }

/* Zone 6 --------------------------------------------------------------- */
.cc-tabelle { width: 100%; border-collapse: collapse; font-size: var(--step--1); }
.cc-tabelle td { padding: 2px 0; border-bottom: 1px solid var(--kante);
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-tabelle tr:last-child td { border-bottom: 0; }
.cc-tabelle .t { color: var(--text-leise); font-family: var(--mono);
                 width: 1%; padding-right: 12px;
                 font-variant-numeric: tabular-nums; }
.cc-tabelle .ms { text-align: right; font-variant-numeric: tabular-nums;
                  color: var(--text-leise); width: 1%; padding-left: 12px; }
/* Zahl und Einheit trennen: die Einheit ist kleiner und leiser, damit die
   Zahl die Spalte fuehrt. */
.cc-tabelle .ms span { font-size: .8em; color: var(--text-leise); }
.cc-tabelle .ok  { color: var(--auf); width: 1%; text-align: center; }
.cc-tabelle .weg { color: var(--ab); width: 1%; text-align: center; }

/* Zone 7 --------------------------------------------------------------- */
.cc-diagramm { flex: 1; min-height: 64px; position: relative; }
.cc-diagramm svg { width: 100%; height: 100%; display: block; }
/* Der Verlauf deckt sich einmal von links nach rechts auf - eine Blende in
   der Zonenfarbe, die zur Seite faehrt. Nur `transform`, also kein Neumalen.
   Einmalig, nicht endlos: `both` friert sie am Ende ein, und bei
   `prefers-reduced-motion` schrumpft die Dauer auf 0,01 ms, dann ist sie
   sofort weg statt hektisch. */
@keyframes aufdecken { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.cc-diagramm::after { content: ""; position: absolute; inset: 0;
                      background: var(--ebene-1); transform-origin: right center;
                      animation: aufdecken var(--dauer-zahl) var(--kurve-rein) both;
                      pointer-events: none; }

/* Zone 8 --------------------------------------------------------------- */
.cc-meldungen { display: grid; grid-template-columns: repeat(3, 1fr);
                gap: var(--s-3); }
.cc-meldung { display: flex; gap: var(--s-3); min-width: 0; }
.cc-meldung img { width: 62px; height: 46px; object-fit: cover; border-radius: 6px;
                  flex: none; background: var(--ebene-2); }
.cc-meldung-text { min-width: 0; }
.cc-meldung h4 { margin: 0; font-size: var(--step--1); font-weight: 500;
                 color: var(--text-laut); display: -webkit-box;
                 -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                 overflow: hidden; }
.cc-meldung p { margin: 2px 0 0; font-size: var(--etikett); color: var(--text-leise); }

/* DoD 6: bei 360 px stapeln sich die Zonen, nichts scrollt seitlich. */
@media (max-width: 900px) {
  #view-cc { overflow-y: auto; }
  /* Bei 360 px quetschte die Kopfzeile die Marke auf drei Zeilen und den
     Anbieter auf vier. Gestapelt liest sich das. */
  .cc > .zone.cc-kopf { flex-direction: column; align-items: flex-start; gap: 2px; }
  .cc-uhr { margin-left: 0; }
  .cc > .zone { grid-column: span 12 !important; }
  .cc-kennzahlen { grid-template-columns: repeat(2, 1fr); }
  .cc-meldungen { grid-template-columns: 1fr; }
  .cc-globus { min-height: 220px; }
}

/* FIX-05 B-5: der Globus fuellt seinen BEHAELTER, nicht das Fenster. Kein
   Innenabstand, kein Scrollbalken - er zeichnet bis an die Kante, und
   `position:relative` macht ihn zum Bezugssystem fuer alles, was
   static/globus.js absolut darin platziert. */
#view-welt { padding: 0; overflow: hidden; position: relative; }
/* 2,0 MB brauchen sichtbar Zeit. Bis dahin steht hier, was los ist. */
.globus-laedt {
  position: absolute; inset: 0; z-index: 9;
  display: grid; place-items: center;
  padding: var(--s-5); text-align: center;
  color: var(--text-dim); font-size: var(--step--1);
}
.thread.is-active { display: flex; }

.karte {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-1);
  padding: var(--s-4);
  margin-bottom: var(--s-3);
  animation: rise var(--dauer-rein) var(--kurve-rein) both;
}
.karte h3 {
  margin: 0 0 var(--s-2);
  font-size: var(--step-0);
  font-weight: 500;
  color: var(--text-loud);
}
.karte-zeile {
  display: flex;
  gap: var(--s-3);
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--text-dim);
}
.zustand {
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
}
.zustand.is-done { color: var(--ok); border-color: rgba(95,207,142,0.4); }
.zustand.is-failed, .zustand.is-aborted_budget { color: var(--danger); border-color: rgba(242,114,107,0.4); }
.zustand.is-running, .zustand.is-pending { color: var(--accent); border-color: var(--accent-line); }

/* --- Herkunft und Zustellung (FIX-09) ------------------------------------ */
.herkunft {
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--text-dim);
  margin: 0 0 4px;
}
.msg.is-zeitplan > .bubble { border-left: 2px solid var(--accent-line); }
.tab .badge {
  display: inline-block;
  min-width: 18px;
  margin-left: 6px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 11px;
  line-height: 18px;
  text-align: center;
}

/* --- Zeitpläne (FIX-08) --------------------------------------------------
   Nur vorhandene Tokens, keine neue Dauer, keine neue Farbe: die Guards in
   tests/test_designsystem.py lesen diesen Block mit. */
.zeitplan-titel {
  margin: 0 0 var(--s-2);
  font-size: var(--step--1);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.zeitplan-hinweis { margin: 0 0 var(--s-3); font-size: var(--step--1); color: var(--text-dim); }
.zeitplan-neu > summary {
  cursor: pointer;
  font-size: var(--step--1);
  color: var(--accent);
  margin-bottom: var(--s-2);
}
.zeitplan-form { display: flex; flex-wrap: wrap; gap: var(--s-2); margin: var(--s-2) 0 var(--s-3); }
.zeitplan-form input {
  flex: 1 1 160px;
  min-width: 0;
  padding: 8px var(--s-3);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg-0);
}
.zeitplan-form input.is-breit { flex-basis: 100%; }
.zeitplan-form button {
  flex: none;
  padding: 8px var(--s-3);
  border: 0; border-radius: 10px;
  background: var(--accent); color: var(--on-accent);
  cursor: pointer;
}
/* Die Meldungen des Blocks stehen IM Block. `#hint` liegt im Composer und
   ist ausserhalb des Chats versteckt - dort kam bis zur ersten Pruefrunde
   jede Antwort des Servers unsichtbar an. */
.zeitplan-meldung {
  margin: 0 0 var(--s-3);
  font-size: var(--step--1);
  color: var(--text);
  overflow-wrap: anywhere;
}
.zeitplan-meldung.is-fehler { color: var(--danger); }
.zeitplan-deckel { margin: 0 0 var(--s-3); font-size: var(--step--1); color: var(--danger); }
.zeitplan { border-top: 1px solid var(--line); padding: var(--s-3) 0; }
.zeitplan-kopf { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); min-width: 0; }
.zeitplan-kopf strong { font-weight: 500; color: var(--text-loud); overflow-wrap: anywhere; min-width: 0; }
.zeitplan-regel { font-size: 11px; color: var(--text-dim); }
.zeitplan-ziel { margin: var(--s-2) 0; font-size: var(--step--1); white-space: pre-wrap; overflow-wrap: anywhere; }
/* "Aus" dimmt den Text, nicht die Knoepfe - die muessen lesbar bleiben. */
.zeitplan.is-aus .zeitplan-kopf strong,
.zeitplan.is-aus .zeitplan-ziel { color: var(--text-dim); }
.zeitplan-grund { color: var(--danger); overflow-wrap: anywhere; }
.zustand.is-verpasst, .zustand.is-uebersprungen { color: var(--danger); border-color: rgba(242,114,107,0.4); }
.zeitplan-aktionen { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: var(--s-2); }
.zeitplan-knopf {
  min-height: 28px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: none;
  color: var(--text);
  font-size: var(--step--1);
  cursor: pointer;
}
.zeitplan-knopf:hover { background: var(--bg-2); }
.zeitplan-knopf.is-loeschen { color: var(--danger); }
.zeitplan-knopf:disabled { opacity: 0.5; cursor: not-allowed; }

.tabelle { width: 100%; border-collapse: collapse; font-size: var(--step--1); }
.tabelle th, .tabelle td {
  text-align: left;
  padding: 6px var(--s-2);
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.tabelle th { color: var(--text-dim); font-weight: 500; font-size: 11px; }
.tabelle td.zahl, .tabelle th.zahl { text-align: right; font-variant-numeric: tabular-nums; }
.tabelle-wrap { overflow-x: auto; }

.kpi { display: flex; flex-wrap: wrap; gap: var(--s-3); margin-bottom: var(--s-4); }
.kpi > div {
  flex: 1 1 140px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: var(--s-3) var(--s-4);
  background: var(--bg-1);
}
.kpi dt { font-size: 11px; color: var(--text-dim); margin: 0; }
.kpi dd {
  margin: 4px 0 0;
  font-size: var(--step-1);
  color: var(--text-loud);
  font-variant-numeric: tabular-nums;
}

.balken { height: 4px; border-radius: 2px; background: var(--accent); margin-top: 4px; }

/* --- Unteraufträge (Phase 6) --------------------------------------------- */

.unter {
  margin: 0 var(--s-3) var(--s-3);
  border-left: 2px solid var(--accent-line);
  padding-left: var(--s-3);
}
.unter > summary {
  list-style: none;
  cursor: pointer;
  font-size: 11px;
  color: var(--text-dim);
  padding: 4px 0;
}
.unter > summary::-webkit-details-marker { display: none; }
.unter > summary::before {
  content: "▸";
  display: inline-block;
  margin-right: 6px;
  transition: transform var(--dauer-tupf) var(--kurve-rein);
}
.unter[open] > summary::before { transform: rotate(90deg); }
.unter > summary:hover { color: var(--text); }
.unter-ziel { font-size: var(--step--1); padding: 4px 0 2px; }
.unter-agent { color: var(--accent); font-size: 11px; }
.unter-ergebnis {
  font-size: 11px;
  color: var(--text-dim);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 160px;
  overflow-y: auto;
  padding-bottom: var(--s-2);
}

/* --- Rückfrage vor einer Aktion mit Außenwirkung (Phase 5) ---------------- */

.frage {
  margin: var(--s-2) var(--s-3) var(--s-3);
  border: 1px solid var(--accent-line);
  border-radius: 12px;
  background: var(--accent-soft);
  overflow: hidden;
}
.frage-kopf {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding: 8px var(--s-3);
  font-size: 11px;
  color: var(--accent);
  border-bottom: 1px solid var(--accent-line);
}
.frage-stufe {
  margin-left: auto;
  padding: 1px 8px;
  border: 1px solid var(--accent-line);
  border-radius: 999px;
  font-size: 10px;
}
.frage pre {
  margin: 0;
  padding: var(--s-3);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: var(--step--1);
  color: var(--text);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 320px;
  overflow-y: auto;
}
.frage-knoepfe {
  display: flex;
  gap: var(--s-2);
  padding: 0 var(--s-3) var(--s-3);
}
.frage-knoepfe button {
  padding: 7px var(--s-4);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 500;
}
.frage-ja { background: var(--accent); color: var(--on-accent); }
.frage-nein {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--line) !important;
}
.frage-nein:hover { color: var(--danger); border-color: rgba(242,114,107,0.5) !important; }
.frage-hinweis { padding: 0 var(--s-3) var(--s-3); font-size: 11px; color: var(--text-dim); }

/* --- Werkzeugaufrufe, aufklappbar (Phase 2, DoD 6) ------------------------ */

.tools {
  margin-top: var(--s-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.02);
  overflow: hidden;
}
.tools > summary {
  padding: 6px var(--s-3);
  font-size: 11px;
  color: var(--text-dim);
  cursor: pointer;
  list-style: none;
  user-select: none;
  transition: color var(--dauer-tupf) var(--kurve-rein), background var(--dauer-tupf) var(--kurve-rein);
}
.tools > summary::-webkit-details-marker { display: none; }
.tools > summary::before {
  content: "▸";
  display: inline-block;
  margin-right: 6px;
  transition: transform var(--dauer-tupf) var(--kurve-rein);
}
.tools[open] > summary::before { transform: rotate(90deg); }
.tools > summary:hover { color: var(--text); background: var(--bg-2); }

.tool {
  padding: var(--s-3);
  border-top: 1px solid var(--line);
  font-size: var(--step--1);
}
.tool-kopf {
  display: flex;
  align-items: baseline;
  gap: var(--s-2);
  flex-wrap: wrap;
}
.tool-name {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--accent);
}
.tool-name.is-bad { color: var(--danger); }
.tool-dauer { font-size: 11px; color: var(--text-dim); margin-left: auto; }
.tool pre {
  margin: var(--s-2) 0 0;
  padding: var(--s-2) var(--s-3);
  border-radius: 8px;
  background: var(--bg-0);
  color: var(--text-dim);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 260px;
  overflow-y: auto;
}
.tool-bild {
  margin: 10px 0 0;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(0,0,0,.25);
}
.tool-bild img {
  display: block;
  width: 100%;
  height: auto;
  /* Ein Satellitenbild ist Bildinformation, keine Illustration - nichts
     zuschneiden, nichts weichzeichnen. */
  image-rendering: auto;
}
.tool-bild figcaption {
  padding: 6px 10px;
  font-size: 12px;
  /* Stand frueher als `var(--dim, #9aa)` da. `--dim` ist in keiner Datei
     definiert — die Farbe kam immer aus dem Ersatzwert. Eine Variable, die
     es nicht gibt, ist eine Falle: wer sie eines Tages anlegt, aendert
     stillschweigend diese zwei Zeilen. */
  color: var(--text-leise);
}
.tool-bild-fehler { padding: 10px; font-size: 13px; color: var(--text-leise); }
.tool-quellen {
  margin: var(--s-2) 0 0;
  padding-left: 1.1em;
  font-size: 11px;
}
.tool-quellen a { color: var(--accent); overflow-wrap: anywhere; }

.empty {
  margin: auto;
  max-width: 46ch;
  text-align: center;
  color: var(--text-dim);
  animation: rise var(--dauer-rein) var(--kurve-rein) both;
}
.empty h2 {
  margin: 0 0 var(--s-2);
  font-size: var(--step-1);
  font-weight: 500;
  color: var(--text-loud);
  letter-spacing: -0.01em;
}
.empty p { margin: 0; }

.typing { display: inline-flex; gap: 5px; align-items: center; height: 1.55em; }
.typing i {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-dim);
  animation: pulse 2.4s ease-in-out infinite;
}
.typing i:nth-child(2) { animation-delay: 0.3s; }
.typing i:nth-child(3) { animation-delay: 0.6s; }

/* --- Eingabe -------------------------------------------------------------- */

.composer-wrap {
  padding: 0 var(--s-5) max(var(--s-5), env(safe-area-inset-bottom, 0px));
}
.composer-wrap[hidden] { display: none; }

.composer {
  display: flex;
  align-items: flex-end;
  gap: var(--s-3);
  padding: var(--s-2) var(--s-2) var(--s-2) var(--s-4);
  border-radius: 16px;
  transition: border-color var(--dauer-tupf) var(--kurve-rein);
}
.composer:focus-within { border-color: var(--accent-line); }

.composer textarea {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  resize: none;
  background: transparent;
  padding: 10px 0;
  min-height: 1.5em;
  max-height: 200px;
  line-height: 1.5;
}
.composer textarea::placeholder { color: var(--text-dim); }
/* Das outline:none oben schlägt die globale :focus-visible-Regel (höhere
   Spezifität). Ohne diesen Ersatz wäre das Feld per Tastatur unsichtbar. */
.composer textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 8px;
}

.btn-send {
  flex: none;
  display: grid;
  place-items: center;
  width: 38px; height: 38px;
  border: 0;
  border-radius: 11px;
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
  transition: background var(--dauer-tupf) var(--kurve-rein), opacity var(--dauer-tupf) var(--kurve-rein);
}
/* Kein Versatz beim Hover. Die Vorlage sagt woertlich: nur Flaeche und
   Textfarbe, kein Verschieben, kein Skalieren. Das war der einzige
   Hover-Versatz der ganzen App - die uebrigen elf aendern schon Farbe,
   Rahmen oder Flaeche. `--akzent-satt` ist laut system.css ausdruecklich
   die Flaechenvariante des Akzents. */
.btn-send:hover:not(:disabled) { background: var(--akzent-satt); }
.btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

.hint {
  margin: var(--s-2) var(--s-1) 0;
  font-size: 11px;
  color: var(--text-dim);
  min-height: 1.4em;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
@keyframes pulse {
  0%, 100% { opacity: 0.25; transform: translateY(0); }
  50%      { opacity: 1;    transform: translateY(-3px); }
}

@media (max-width: 600px) {
  .thread, .composer-wrap { padding-left: var(--s-4); padding-right: var(--s-4); }
  .topbar { padding-left: var(--s-4); padding-right: var(--s-4); }
  .msg { max-width: 94%; }
}

<script>
(function () {
  'use strict';

  // Wird beim Ausliefern vom Backend eingesetzt. Das ist der JARVIS-Token,
  // nicht der Modell-Key — der verlässt das Backend nie (0.4.1).
  var TOKEN = '__JARVIS_TOKEN__';
  // FIX-09: wie der Assistent heisst (ASSISTENT_NAME). Wird wie der Token
  // beim Ausliefern eingesetzt; der Server laesst nur Buchstaben, Ziffern,
  // Leerzeichen, Punkt und Bindestrich durch.
  var NAME = '__ASSISTENT_NAME__';

  // Zustand lebt in Variablen, nicht in localStorage: in manchen Umgebungen
  // ist die API nicht verfügbar und die Seite stürbe an der ersten Zeile.
  var busy = false;

  var el = {
    thread:    document.getElementById('thread'),
    form:      document.getElementById('composer'),
    input:     document.getElementById('input'),
    send:      document.getElementById('btn-send'),
    hint:      document.getElementById('hint'),
    chip:      document.getElementById('model-chip'),
    phase:     document.getElementById('brand-phase'),
    mic:       document.getElementById('btn-mic'),
    sprache:   document.getElementById('btn-sprache'),
    healthDot: document.getElementById('health-dot'),
    healthTxt: document.getElementById('health-text'),
    memBtn:    document.getElementById('btn-memory'),
    memPanel:  document.getElementById('memory-panel'),
    memZu:     document.getElementById('memory-zu'),
    memListe:  document.getElementById('memory-liste'),
    memForm:   document.getElementById('memory-form'),
    memNeu:    document.getElementById('memory-neu')
  };

  function api(path, options) {
    var opts = options || {};
    opts.headers = { 'X-Jarvis-Token': TOKEN };
    if (opts.body !== undefined) {
      opts.headers['content-type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    return fetch(path, opts).then(function (res) {
      return res.text().then(function (raw) {
        var data = null;
        try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
        if (!res.ok) {
          var detail = data && data.detail;
          if (Array.isArray(detail)) {
            // pydantic-Liste: Feld und Satz, nie das Feld input - das kann die
            // ganze Eingabe sein (10.000 Zeichen, erste Pruefrunde FIX-08).
            detail = detail.map(function (d) {
              var feld = (d && d.loc || []).slice(1).join('.');
              return (feld ? feld + ': ' : '') + ((d && d.msg) || 'ungültig');
            }).join('; ');
          } else if (detail && typeof detail !== 'string') {
            detail = JSON.stringify(detail);
          }
          // Kein JSON: nur Klartext zeigen, nie eine fremde Fehlerseite.
          if (!detail) detail = (raw && !/^\s*</.test(raw)) ? raw.slice(0, 300) : ('HTTP ' + res.status);
          var err = new Error(detail);
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  // --- Ereignisstrom (Phase 7, DoD 1) ---------------------------------------
  //
  // Kein EventSource: das kann keine Header setzen, der JARVIS-Token muesste
  // dann in die URL - und landet damit in jedem Zugriffslog. Der Server
  // liefert an /api/events einen text/event-stream; hier wird der mit fetch
  // und einem Reader gelesen, der Token bleibt im Header.
  //
  // Der Strom ersetzt das Polling: es gibt keinen Timer mehr, der nachfragt.
  //
  /* Verknuepfungspruefung 31.08.2026, Fund 1 - WIEDERVERBINDUNG.
     WAS war falsch: diese Funktion hatte keinerlei Wiederholung. Der
     `.catch` meldete den Abriss einmal und war fertig; endete der Strom
     sauber (`stueck.done`), rief sie `beiAbbruch(null)` und war ebenfalls
     fertig. Beide Aufrufer geben danach auf - der Chat schliesst, das
     Command Center setzt `ccStrom = null`. Einen Ersatz durch Polling gibt
     es bewusst nicht: der einzige Timer im ganzen Frontend ist die Uhr in
     Zone 1.
     WARUM ist das falsch: nach jedem WLAN-Aussetzer, jedem Ruhezustand des
     Laptops und jedem Server-Neustart stand das Command Center still und
     zeigte weiter Zahlen, die nach live aussahen. Wiederbelebt wurde es nur
     durch einen Wechsel in eine andere Ansicht und zurueck.
     WIE es jetzt laeuft: nach einem Abriss wird mit wachsender Pause neu
     verbunden (1 s, 2 s, 4 s, 8 s, 16 s, danach 30 s als Deckel), hoechstens
     STROM_VERSUCHE mal hintereinander. Erst wenn auch der letzte Versuch
     scheitert, faellt `beiAbbruch` - der Aufrufer bekommt sein "endgueltig
     weg" also weiterhin, nur spaeter. Steht die Verbindung wieder, fangen
     Zaehler und Pause von vorn an, und `beiWiederverbindung` laeuft: die
     waehrend der Luecke gesendeten Ereignisse sind ersatzlos weg, der
     Aufrufer muss den Stand einmal nachziehen.
     Das ist KEIN Polling: solange die Verbindung steht, laeuft hier kein
     Timer und geht keine Anfrage hinaus. Der Timer existiert nur waehrend
     einer Stoerung. */
  var STROM_PAUSE_START = 1000;   // erste Wartezeit in ms
  var STROM_PAUSE_MAX = 30000;    // Deckel fuer die Wartezeit
  var STROM_VERSUCHE = 6;         // so oft hintereinander, dann ist Schluss

  function ereignisStrom(beiEreignis, beiAbbruch, beiWiederverbindung) {
    var steuerung = null;
    var gewollt = true;           // will der Aufrufer den Strom noch?
    var pause = STROM_PAUSE_START;
    var uebrig = STROM_VERSUCHE;
    var timer = null;
    var verbindungen = 0;

    function nochmal(err) {
      if (!gewollt) return;
      if (uebrig <= 0) { if (beiAbbruch) beiAbbruch(err); return; }
      uebrig -= 1;
      timer = setTimeout(function () { timer = null; verbinde(); }, pause);
      pause = Math.min(pause * 2, STROM_PAUSE_MAX);
    }

    function verbinde() {
      if (!gewollt) return;
      steuerung = new AbortController();
      fetch('/api/events', {
        headers: { 'X-Jarvis-Token': TOKEN },
        signal: steuerung.signal
      }).then(function (res) {
        if (!res.ok || !res.body) throw new Error('Ereignisstrom nicht verfuegbar (HTTP ' + res.status + ')');
        var leser = res.body.getReader();
        var dekoder = new TextDecoder();
        var puffer = '';
        var steht = false;

        /* Zurueckgesetzt wird erst, wenn wirklich etwas ANKOMMT - nicht
           schon beim 200er. Ein Server, der die Verbindung annimmt und
           sofort wieder schliesst, wuerde sonst die Pause bei jedem Versuch
           auf 1 s zuruecksetzen; aus der wachsenden Pause waere eine
           Anfrage pro Sekunde geworden, also genau das Polling, das der
           Strom ersetzt hat. Der Server schickt sein `hello` sofort, eine
           gesunde Verbindung landet hier also im ersten Stueck. */
        function verbindungSteht() {
          if (steht) return;
          steht = true;
          verbindungen += 1;
          uebrig = STROM_VERSUCHE;
          pause = STROM_PAUSE_START;
          if (verbindungen > 1 && beiWiederverbindung) beiWiederverbindung();
        }

        function weiter() {
          return leser.read().then(function (stueck) {
            // Der Server beendet den Strom von sich aus nie (api/events.py:
            // `while True`). Ein sauberes Ende heisst also: die Verbindung
            // ist weg. Deshalb hier dasselbe Vorgehen wie bei einem Fehler.
            if (stueck.done) { nochmal(null); return; }
            verbindungSteht();
            puffer += dekoder.decode(stueck.value, { stream: true });

            // Ein Ereignis endet bei der Leerzeile. Alles davor gehoert zusammen.
            var grenze;
            while ((grenze = puffer.indexOf('\n\n')) !== -1) {
              var roh = puffer.slice(0, grenze);
              puffer = puffer.slice(grenze + 2);
              var typ = null, daten = null;
              roh.split('\n').forEach(function (zeile) {
                if (zeile.indexOf('event: ') === 0) typ = zeile.slice(7).trim();
                else if (zeile.indexOf('data: ') === 0) {
                  try { daten = JSON.parse(zeile.slice(6)); } catch (e) { daten = null; }
                }
                // ": herzschlag" faellt hier durch - genau richtig.
              });
              if (typ && daten) beiEreignis(typ, daten);
            }
            return weiter();
          });
        }
        return weiter();
      }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        nochmal(err);
      });
    }

    verbinde();

    return {
      schliessen: function () {
        if (!gewollt) return;
        gewollt = false;
        if (timer) { clearTimeout(timer); timer = null; }
        if (steuerung) steuerung.abort();
      }
    };
  }

  function toolNode(call) {
    var box = document.createElement('div');
    box.className = 'tool';

    var kopf = document.createElement('div');
    kopf.className = 'tool-kopf';

  function zeigeBild(box, pfad, attribution) {
    var figur = document.createElement('figure');
    figur.className = 'tool-bild';

    var bild = document.createElement('img');
    bild.alt = 'Satellitenaufnahme';
    bild.loading = 'lazy';
    figur.appendChild(bild);

    // Attribution ist Pflicht, nicht Deko: Copernicus-Daten duerfen ohne
    // sie nicht angezeigt werden (core/satellite/contracts.py).
    if (attribution) {
      var bildunterschrift = document.createElement('figcaption');
      bildunterschrift.textContent = attribution;
      figur.appendChild(bildunterschrift);
    }
    box.appendChild(figur);

    fetch(pfad, { headers: { 'X-Jarvis-Token': TOKEN } })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.blob();
      })
      .then(function (blob) {
        var url = URL.createObjectURL(blob);
        bild.src = url;
        // Aufraeumen, sobald das Bild steht - eine Blob-URL haelt sonst
        // die Bytes bis zum Neuladen der Seite im Speicher.
        bild.onload = function () { URL.revokeObjectURL(url); };
      })
      .catch(function (fehler) {
        figur.removeChild(bild);
        var hinweis = document.createElement('p');
        hinweis.className = 'tool-bild-fehler';
        hinweis.textContent = 'Bild konnte nicht geladen werden: ' + fehler.message;
        figur.insertBefore(hinweis, figur.firstChild);
      });
  }

    var name = document.createElement('span');
    name.className = 'tool-name' + (call.ok ? '' : ' is-bad');
    name.textContent = call.name + '(' + argumentText(call.arguments) + ')';

    var dauer = document.createElement('span');
    dauer.className = 'tool-dauer';
    dauer.textContent = (call.ok ? '' : 'fehlgeschlagen · ') + (call.duration_ms || 0) + ' ms';

    kopf.appendChild(name);
    kopf.appendChild(dauer);
    box.appendChild(kopf);

    var ausgabe = call.display || call.error || '';
    if (ausgabe) {
      var pre = document.createElement('pre');
      pre.textContent = ausgabe;
      box.appendChild(pre);
    }

    // Satellitenbild (Phase 8). Bis hierher hatte diese Datei null <img>.
    //
    // Geholt wird per fetch() mit dem Token-Header, nicht ueber ein nacktes
    // <img src>: ein img-Tag schickt keine eigenen Header, der Token muesste
    // sonst in die Adresse — und stuende damit im Verlauf, im Referrer und
    // in jedem Log. Aus den Bytes wird eine Blob-URL.
    var vorschau = call.data && call.data.preview_url;
    if (vorschau) {
      // Nicht den Pfad aus dem Ergebnis fetchen, sondern die ID daraus
      // ziehen, gegen die Form pruefen und die Adresse selbst bauen. Der
      // Unterschied ist klein und wichtig: `preview_url` kommt aus einem
      // Werkzeugergebnis, also mittelbar aus einem Modell.
      var id = String(vorschau).split('/').pop();
      if (/^[0-9a-f]{32}$/.test(id)) {
        zeigeBild(box, '/api/bild/' + id, call.data.attribution || '');
      }
    }

    if (call.sources && call.sources.length) {
      var liste = document.createElement('ul');
      liste.className = 'tool-quellen';
      call.sources.forEach(function (url) {
        var li = document.createElement('li');
        // Nur http(s) wird verlinkt — eine URL aus dem Netz ist nichts,
        // dem man ein href blind anvertraut.
        if (/^https?:\/\//i.test(url)) {
          var a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = url;
          li.appendChild(a);
        } else {
          li.textContent = url;
        }
        liste.appendChild(li);
      });
      box.appendChild(liste);
    }
    return box;
  }

  function argumentText(args) {
    if (!args) return '';
    try {
      return Object.keys(args).map(function (k) {
        return k + '=' + JSON.stringify(args[k]);
      }).join(', ');
    } catch (e) { return ''; }
  }

  /* --- Zeitstempel: UTC kommt herein, Ortszeit geht heraus ----------------

     Verknuepfungspruefung 31.08.2026, Fund 8.
     WAS war falsch: alle `created_at` aus der Datenbank sind UTC mit `Z`
     (core/db.py). Vier Stellen im Frontend schnitten daraus Text heraus,
     statt sie in eine Date zu geben: `created_at.slice(11, 19)` (Werkzeuge
     im Command Center und in der Werkzeugansicht),
     `created_at.replace('T', ' ').replace('Z', '')` (Auftragskarten) und
     `created_at.slice(0, 10)` (Gedaechtnis).
     WARUM ist das falsch: direkt daneben laufen die Uhr in Zone 1 und der
     Ereignisstrom in Zone 4 ueber `new Date().getHours()`, also in
     ORTSZEIT. In Europe/Berlin standen damit zwei Stunden zwischen der Uhr
     und der Werkzeugtabelle, ohne eine Beschriftung, die das erklaert - wer
     die Kostentabelle zur Fehlersuche benutzt, sucht in der falschen
     Stunde. Das Wort "UTC" kam im ganzen Frontend kein einziges Mal vor.
     static/globus.js machte es an seinen Meldungen laengst richtig
     (`new Date(...)` plus toLocale*); die App war mit sich selbst uneinig.

     Kein Format-Rateraten: ist der Wert leer oder unlesbar, steht der
     Rohwert bzw. ein Strich da. Eine erfundene Zeit waere schlimmer als
     gar keine. */
  function alsDatum(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    return isNaN(d.getTime()) ? null : d;
  }

  function zeitText(iso) {
    var d = alsDatum(iso);
    return d ? d.toLocaleTimeString('de-DE') : (iso ? String(iso) : '—');
  }

  function datumText(iso) {
    var d = alsDatum(iso);
    return d ? d.toLocaleDateString('de-DE',
      { day: '2-digit', month: '2-digit', year: 'numeric' })
      : (iso ? String(iso) : '—');
  }

  function datumZeitText(iso) {
    var d = alsDatum(iso);
    return d ? (datumText(iso) + ' ' + zeitText(iso))
             : (iso ? String(iso) : '—');
  }

  function toolsNode(calls) {
    var details = document.createElement('details');
    details.className = 'tools';
    var summary = document.createElement('summary');
    var fehler = calls.filter(function (c) { return !c.ok; }).length;
    summary.textContent = calls.length + (calls.length === 1 ? ' Werkzeug' : ' Werkzeuge')
      + ': ' + calls.map(function (c) { return c.name; }).join(', ')
      + (fehler ? ' · ' + fehler + ' fehlgeschlagen' : '');
    details.appendChild(summary);
    calls.forEach(function (c) { details.appendChild(toolNode(c)); });
    return details;
  }

  function messageNode(role, content, toolCalls, herkunft) {
    var wrap = document.createElement('div');
    wrap.className = 'msg msg-' + role;
    // FIX-09: was ein Zeitplan angestossen hat, sieht nicht aus wie getippt.
    if (herkunft && herkunft.art === 'zeitplan') {
      wrap.classList.add('is-zeitplan');
      var marke = document.createElement('div');
      marke.className = 'herkunft';
      marke.textContent = (role === 'user' ? 'Zeitplan „' : 'Ergebnis von „')
        + (herkunft.zeitplan_name || 'Zeitplan') + '“'
        + (role === 'user' ? ' hat das angestoßen' : '');
      wrap.appendChild(marke);
    }
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    // textContent, niemals innerHTML: der Inhalt kommt aus einem Modell.
    bubble.textContent = content;
    wrap.appendChild(bubble);
    if (toolCalls && toolCalls.length) wrap.appendChild(toolsNode(toolCalls));
    return wrap;
  }

  function showEmpty() {
    el.thread.textContent = '';
    var box = document.createElement('div');
    box.className = 'empty';
    var h = document.createElement('h2');
    h.textContent = 'Womit fangen wir an?';
    var p = document.createElement('p');
    p.textContent = 'Der Verlauf liegt lokal in SQLite und ist nach einem Neustart noch da.';
    box.appendChild(h); box.appendChild(p);
    el.thread.appendChild(box);
  }

  function scrollDown() {
    requestAnimationFrame(function () { el.thread.scrollTop = el.thread.scrollHeight; });
  }

  function appendError(text) {
    var wrap = document.createElement('div');
    wrap.className = 'msg msg-error';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    el.thread.appendChild(wrap);
    scrollDown();
  }

  function thinkingNode() {
    var wrap = document.createElement('div');
    wrap.className = 'msg msg-assistant';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    var dots = document.createElement('span');
    dots.className = 'typing';
    dots.setAttribute('aria-label', NAME + ' denkt nach');
    for (var i = 0; i < 3; i++) dots.appendChild(document.createElement('i'));
    bubble.appendChild(dots);
    wrap.appendChild(bubble);
    return wrap;
  }

  /* --- Der Reaktor: was JARVIS gerade tut ---------------------------------

     Acht Zustaende, EINE Rangfolge - und die steht hier, nicht im CSS. CSS
     kennt keine Rangfolge, nur Spezifitaet, und die waere die falsche
     Sprache dafuer.

     Die Reihenfolge ist nicht beliebig: was den NUTZER braucht, schlaegt
     jeden Betriebszustand. Eine offene Rueckfrage ist wichtiger als "denkt
     nach", ein Fehlschlag wichtiger als "hoert zu".

     Vorher konnten zwei Dinge gleichzeitig pulsieren - der laufende Schritt
     und das Mikrofon, mit zwei verschiedenen Perioden nebeneinander. Ein
     Symbol, das zwei Sachen gleichzeitig sagt, sagt keine. */
  var reaktorFehl = false;      // letzter Auftrag ging schief
  var reaktorFertig = false;    // letzter Auftrag ist gerade fertig geworden
  var reaktorWerkzeug = false;  // gerade laeuft ein Werkzeug
  var reaktorWartet = false;    // eine Rueckfrage steht offen

  function reaktorZustand() {
    var mark = document.querySelector('.brand-mark');
    if (!mark) return;
    var z = reaktorWartet ? 'wartet'
          : reaktorFehl ? 'fehl'
          : (erkennung ? 'hoert'
          : (voice.sprichtGerade() ? 'spricht'
          : (reaktorWerkzeug ? 'werkzeug'
          : (busy ? 'denkt'
          : (reaktorFertig ? 'fertig' : 'ruhe')))));
    if (mark.dataset.zustand === z) return;   // sonst startet jede
    mark.dataset.zustand = z;                 // Animation bei jedem Ereignis neu
    mark.setAttribute('aria-label', REAKTOR_TEXT[z] || NAME);
  }

  var REAKTOR_TEXT = {
    ruhe:     NAME + ' ist bereit',
    wartet:   NAME + ' wartet auf deine Bestätigung',
    denkt:    NAME + ' denkt nach',
    werkzeug: NAME + ' benutzt ein Werkzeug',
    hoert:    NAME + ' hört zu',
    spricht:  NAME + ' spricht',
    fehl:     'Der letzte Auftrag ist fehlgeschlagen',
    fertig:   'Der Auftrag ist fertig'
  };

  function setBusy(value) {
    busy = value;
    el.send.disabled = value;
    el.input.disabled = value;
    el.thread.setAttribute('aria-busy', value ? 'true' : 'false');
    if (value) { reaktorFehl = false; reaktorFertig = false; }
    reaktorZustand();
  }

  // --- Seit du weg warst (FIX-09) -----------------------------------------
  //
  // Ergebnisse von Zeitplaenen landen im Chat. Wer nicht hinsieht, bekommt
  // eine Zahl am Chat-Tab: wie viele Antworten von Zeitplaenen seit dem
  // letzten Blick dazugekommen sind. Gemerkt wird die letzte gesehene
  // Nachricht im Browser (localStorage) - ein Komfort, keine Wahrheit; ohne
  // Speicher zaehlt die Seite einfach ab dem Neuladen.

  function gelesenBis() {
    try { return parseInt(localStorage.getItem('jarvis.gelesenBis') || '0', 10) || 0; }
    catch (e) { return 0; }
  }

  function merkeGelesen(id) {
    try { localStorage.setItem('jarvis.gelesenBis', String(id)); } catch (e) { /* egal */ }
  }

  function zeigeUngelesen(anzahl) {
    var tab = document.getElementById('tab-chat');
    var alt = tab.querySelector('.badge');
    if (alt) alt.remove();
    if (!anzahl) { tab.removeAttribute('title'); return; }
    var b = document.createElement('span');
    b.className = 'badge';
    b.textContent = String(anzahl);
    b.setAttribute('aria-label', anzahl + ' neue Ergebnisse von Zeitplänen');
    tab.appendChild(b);
    tab.title = anzahl + ' neue Ergebnisse von Zeitplänen seit deinem letzten Blick';
  }

  function loadHistory() {
    return api('/api/messages').then(function (messages) {
      if (!messages || !messages.length) { showEmpty(); zeigeUngelesen(0); return; }
      el.thread.textContent = '';
      var bis = gelesenBis(), neu = 0, letzte = 0;
      messages.forEach(function (m) {
        el.thread.appendChild(messageNode(m.role, m.content, m.tool_calls, m.herkunft));
        if (m.herkunft && m.role === 'assistant' && m.id > bis) neu += 1;
        if (m.id > letzte) letzte = m.id;
      });
      scrollDown();
      if (aktiveAnsicht === 'chat') { merkeGelesen(letzte); zeigeUngelesen(0); }
      else zeigeUngelesen(neu);
    });
  }

  // Ein Strom fuer die Zustellung: sobald ein Zeitplan-Auftrag fertig ist,
  // holt der Chat den Verlauf neu (wenn er offen ist) oder zaehlt hoch.
  var zustellStrom = null;
  function zustellungStarten() {
    if (zustellStrom) return;
    zustellStrom = ereignisStrom(function (typ, daten) {
      if (typ !== 'task' || !daten.final || !daten.herkunft) return;
      if (aktiveAnsicht === 'chat') loadHistory().catch(function () {});
      else {
        var tab = document.getElementById('tab-chat');
        var alt = tab.querySelector('.badge');
        zeigeUngelesen((alt ? parseInt(alt.textContent, 10) || 0 : 0) + 1);
      }
    }, function () { zustellStrom = null; }, function () {
      if (aktiveAnsicht === 'chat') loadHistory().catch(function () {});
    });
  }

  function loadHealth() {
    return api('/api/health').then(function (h) {
      el.chip.textContent = h.model;
      el.phase.textContent = 'Phase ' + h.phase;
      el.healthDot.className = 'dot ' + (h.status === 'ok' ? 'is-ok' : 'is-bad');
      /* Verknuepfungspruefung 31.08.2026, Fund 5.
         WAS war falsch: `GET /api/health` faengt Datenbankfehler ab und
         setzt `database = f"fehler: {exc}"` - der Kommentar in
         api/routes.py sagt ausdruecklich "die Meldung soll die Ursache
         zeigen". Gelesen wurde das Feld nirgends: `grep -c database
         index.html weltlage.html` lieferte 0 und 0.
         WARUM ist das falsch: bei einem Datenbankschaden setzt dieselbe
         Route `totals = {}`, also `spend.calls = 0`. Der Punkt wurde rot
         (status "degraded"), und der Text daneben fiel durch die Kette
         hindurch bis zu `spendText(h.spend)` - und das gab "noch kein
         Modellaufruf" zurueck. Der Nutzer bekam also eine positive
         Behauptung ueber den Betriebszustand vorgesetzt und suchte die
         Ursache beim Anbieter oder beim Schluessel, waehrend der Server
         "fehler: no such table: messages" in derselben Antwort schon
         mitgeliefert hatte.
         Der Zweig steht VOR provider_error, weil eine kaputte Datenbank
         auch die Zahlen daneben wertlos macht. */
      if (h.database && h.database !== 'ok') {
        el.healthTxt.textContent = 'Datenbank: ' + h.database;
      } else if (h.provider_error) {
        el.healthTxt.textContent = h.provider_error;
      } else if (h.provider === 'fake') {
        el.healthTxt.textContent = 'Fake-Anbieter — kein echtes Modell, keine Kosten';
      } else {
        el.healthTxt.textContent = spendText(h.spend);
      }
    }).catch(function (err) {
      el.healthDot.className = 'dot is-bad';
      el.healthTxt.textContent = err.status === 401
        ? 'Token abgelehnt — Seite neu laden'
        : 'Backend nicht erreichbar';
    });
  }

  function spendText(spend) {
    if (!spend || !spend.calls) return 'noch kein Modellaufruf';
    var s = spend.calls + ' Aufrufe · ' + (spend.in_tokens + spend.out_tokens) + ' Token';
    return spend.prices_configured
      ? s + ' · ' + spend.cost_eur.toFixed(4) + ' €'
      : s + ' · Preise nicht in .env eingetragen';
  }

  // --- Plan eines Auftrags (Phase 4) --------------------------------------

  var MARKE = { done: '✓', failed: '✕', skipped: '–', running: '', pending: '' };

  function schrittNode(schritt) {
    var box = document.createElement('div');
    box.className = 'schritt is-' + schritt.status;

    var marke = document.createElement('span');
    marke.className = 'schritt-marke';
    marke.textContent = MARKE[schritt.status] || '';
    box.appendChild(marke);

    var koerper = document.createElement('div');
    koerper.className = 'schritt-koerper';

    var titel = document.createElement('div');
    // Der Runner haengt bei einem Retry den Grund an die Beschreibung — für
    // die Liste reicht die erste Zeile.
    titel.textContent = schritt.description.split('\n')[0];
    if (schritt.agent) {
      var agent = document.createElement('span');
      agent.className = 'schritt-agent';
      agent.textContent = schritt.agent;
      titel.appendChild(agent);
    }
    koerper.appendChild(titel);

    var hinweise = [];
    if (schritt.attempts > 1) hinweise.push(schritt.attempts + ' Versuche');
    if (schritt.status === 'failed' && schritt.note) hinweise.push(schritt.note);
    if (hinweise.length) {
      var note = document.createElement('div');
      note.className = 'schritt-note';
      note.textContent = hinweise.join(' · ');
      koerper.appendChild(note);
    }

    box.appendChild(koerper);
    return box;
  }

  function unterauftraegeNode(ids) {
    var details = document.createElement('details');
    details.className = 'unter';
    var summary = document.createElement('summary');
    summary.textContent = ids.length
      + (ids.length === 1 ? ' Unterauftrag' : ' Unteraufträge');
    details.appendChild(summary);

    var geladen = false;
    details.addEventListener('toggle', function () {
      if (!details.open || geladen) return;
      geladen = true;
      ids.forEach(function (id) {
        api('/api/tasks/' + id).then(function (kind) {
          var box = document.createElement('div');

          var ziel = document.createElement('div');
          ziel.className = 'unter-ziel';
          ziel.textContent = kind.goal;
          var agent = kind.steps[0] && kind.steps[0].agent;
          if (agent) {
            var marke = document.createElement('span');
            marke.className = 'unter-agent';
            marke.textContent = ' [' + agent + ']';
            ziel.appendChild(marke);
          }
          box.appendChild(ziel);

          if (kind.result) {
            var erg = document.createElement('div');
            erg.className = 'unter-ergebnis';
            erg.textContent = kind.result;
            box.appendChild(erg);
          }
          // Ein Unterauftrag kann selbst delegiert haben — dann geht es
          // rekursiv weiter, bis max_depth.
          if (kind.children && kind.children.length) {
            box.appendChild(unterauftraegeNode(kind.children));
          }
          details.appendChild(box);
        }).catch(function () { /* Kind noch nicht geschrieben — egal */ });
      });
    });
    return details;
  }

  function frageNode(daten) {
    var frage = daten.confirmation;
    // Der einzige Zustand, der den Nutzer BRAUCHT - deshalb ganz oben in
    // der Rangfolge.
    reaktorWartet = true;
    reaktorZustand();
    var box = document.createElement('div');
    box.className = 'frage';

    var kopf = document.createElement('div');
    kopf.className = 'frage-kopf';
    kopf.textContent = NAME + ' möchte ' + frage.tool + ' ausführen';
    var stufe = document.createElement('span');
    stufe.className = 'frage-stufe';
    stufe.textContent = frage.permission;
    kopf.appendChild(stufe);
    box.appendChild(kopf);

    // Exakt das, was passieren würde — textContent, der Inhalt kommt aus
    // einem Modell.
    var pre = document.createElement('pre');
    pre.textContent = frage.preview;
    box.appendChild(pre);

    var knoepfe = document.createElement('div');
    knoepfe.className = 'frage-knoepfe';

    function antworte(erlauben) {
      knoepfe.textContent = '';
      var warte = document.createElement('span');
      warte.className = 'frage-hinweis';
      warte.textContent = erlauben ? 'wird ausgeführt…' : 'abgelehnt';
      knoepfe.appendChild(warte);
      reaktorWartet = false;
      reaktorZustand();
      api('/api/tasks/' + daten.id + '/confirm', {
        method: 'POST', body: { approve: erlauben }
      }).catch(function (err) { meldung(err.message); });
    }

    var ja = document.createElement('button');
    ja.type = 'button';
    ja.className = 'frage-ja';
    ja.textContent = 'Ausführen';
    ja.addEventListener('click', function () { antworte(true); });

    var nein = document.createElement('button');
    nein.type = 'button';
    nein.className = 'frage-nein';
    nein.textContent = 'Nicht ausführen';
    nein.addEventListener('click', function () { antworte(false); });

    knoepfe.appendChild(ja);
    knoepfe.appendChild(nein);
    box.appendChild(knoepfe);

    var hinweis = document.createElement('p');
    hinweis.className = 'frage-hinweis';
    hinweis.textContent = 'Ohne Antwort passiert nichts. Nach '
      + Math.round((frage.timeout_s || 600) / 60) + ' Minuten wird der Auftrag abgebrochen.';
    box.appendChild(hinweis);

    return box;
  }

  function planNode(daten, onAbbruch) {
    var box = document.createElement('div');
    box.className = 'plan';

    var kopf = document.createElement('div');
    kopf.className = 'plan-kopf';
    var laeuft = daten.status === 'running' || daten.status === 'pending';
    var fertig = daten.steps.filter(function (s) { return s.status === 'done'; }).length;
    kopf.textContent = laeuft
      ? 'Plan läuft — ' + fertig + '/' + daten.steps.length + ' Schritten'
      : 'Plan · ' + daten.status + ' · ' + fertig + '/' + daten.steps.length;

    if (laeuft && onAbbruch) {
      var stop = document.createElement('button');
      stop.type = 'button';
      stop.className = 'plan-abbrechen';
      stop.textContent = 'abbrechen';
      stop.addEventListener('click', onAbbruch);
      kopf.appendChild(stop);
    }
    box.appendChild(kopf);

    daten.steps.forEach(function (schritt) { box.appendChild(schrittNode(schritt)); });

    if (daten.confirmation) box.appendChild(frageNode(daten));
    if (daten.children && daten.children.length) {
      box.appendChild(unterauftraegeNode(daten.children));
    }

    var fuss = document.createElement('div');
    fuss.className = 'plan-fuss';
    var teile = [];
    if (daten.spent_tokens) teile.push(daten.spent_tokens + ' Token');
    if (daten.spent_tool_calls) teile.push(daten.spent_tool_calls + ' Werkzeugaufrufe');
    if (daten.spent_cost_eur) teile.push(daten.spent_cost_eur.toFixed(4) + ' €');
    if (daten.abort_reason) {
      fuss.className += ' is-abbruch';
      teile.unshift('Abgebrochen: ' + daten.abort_reason);
    }
    fuss.textContent = teile.join(' · ');
    if (teile.length) box.appendChild(fuss);

    return box;
  }

  var ENDZUSTAENDE = ['done', 'failed', 'aborted_budget', 'cancelled'];

  function send(text) {
    setBusy(true);
    el.hint.textContent = '';

    if (el.thread.querySelector('.empty')) el.thread.textContent = '';
    el.thread.appendChild(messageNode('user', text));

    var wartend = thinkingNode();
    el.thread.appendChild(wartend);
    scrollDown();

    var started = Date.now();
    var planBox = null;

    var warSprache = sprachModus;
    sprachModus = false;

    api('/api/tasks', { method: 'POST', body: { goal: text, voice: warSprache } })
      .then(function (start) {
        return neuerPlan(start.task_id, wartend, started);
      })
      .catch(function (err) {
        wartend.remove();
        appendError(err.message);
        setBusy(false);
        el.input.focus();
      });

    function neuerPlan(taskId, platzhalter, begonnen) {
      // Kein Timer. Der Server schiebt; geholt wird nur, wenn ein Ereignis
      // sagt, dass es etwas zu holen gibt.
      var abgebrochen = false;
      var fertig = false;
      var laeuft = false;      // eine Abfrage gleichzeitig, sonst ueberholen sie sich
      var nachholen = false;
      var strom = null;

      function abbrechen() {
        abgebrochen = true;
        api('/api/tasks/' + taskId + '/cancel', { method: 'POST' })
          .catch(function (err) { meldung(err.message); });
      }

      function zeichne() {
        if (fertig) return Promise.resolve();
        if (laeuft) { nachholen = true; return Promise.resolve(); }
        laeuft = true;
        return api('/api/tasks/' + taskId).then(function (daten) {
          laeuft = false;
          var neuerKasten = planNode(daten, abgebrochen ? null : abbrechen);
          if (planBox) { planBox.replaceWith(neuerKasten); }
          else { platzhalter.before(neuerKasten); }
          planBox = neuerKasten;

          if (ENDZUSTAENDE.indexOf(daten.status) !== -1) return abschluss(daten);
          if (nachholen) { nachholen = false; return zeichne(); }
        }).catch(function (err) {
          laeuft = false;
          appendError(err.message);
          /* Verknuepfungspruefung 31.08.2026, Fund 2.
             WAS war falsch: hier fehlte `setBusy(false)`. `beenden()` setzt
             `fertig = true` und schliesst den Strom - damit sind die drei
             anderen Stellen mit `setBusy(false)` unerreichbar: die eine
             liegt im catch des POST, die zwei anderen in `abschluss` und im
             Strom-Rueckruf, und beide steigen mit `if (fertig) return`
             sofort aus.
             WARUM ist das falsch: `setBusy(true)` hat `el.input.disabled`
             und `el.send.disabled` gesetzt. Ein einziger Aussetzer bei
             GET /api/tasks/{id} sperrte Eingabefeld und Senden-Knopf damit
             dauerhaft - der Nutzer sah eine Fehlerblase und konnte danach
             nichts mehr tippen, nur ein Neuladen der Seite half. */
          setBusy(false);
          beenden();
          el.input.focus();
        });
      }

      function abschluss(daten) {
        if (fertig) return;
        beenden();
        reaktorWartet = false;
        reaktorWerkzeug = false;
        reaktorFehl = (daten.status !== 'done');
        reaktorFertig = !reaktorFehl;
        reaktorZustand();
        var antwort = messageNode('assistant', daten.result || 'Kein Ergebnis.');
        if (planBox) planBox.after(antwort); else el.thread.appendChild(antwort);
        scrollDown();

        el.hint.textContent = 'Fertig in ' + ((Date.now() - begonnen) / 1000).toFixed(1)
          + ' s · Vorgang ' + taskId + ' · ' + daten.status;
        // Nur vorlesen, was gesprochen gefragt wurde.
        if (warSprache && daten.result) lieseVor(daten.result);
        if (el.memPanel.classList.contains('is-open')) ladeGedaechtnis();
        setBusy(false);
        el.input.focus();
        return loadHealth();
      }

      function beenden() {
        fertig = true;
        if (strom) { strom.schliessen(); strom = null; }
        /* Verknuepfungspruefung 31.08.2026, Fund 4.
           WAS war falsch: `platzhalter.remove()` stand genau einmal, in
           `abschluss`. Der Strom-Abbruchpfad und der zeichne-Fehlerpfad
           entfernten den Knoten nicht, und `abschluss` war danach durch
           `if (fertig) return` gesperrt.
           WARUM ist das falsch: der Knoten kommt aus `thinkingNode()` und
           traegt eine dauerlaufende Punkte-Animation mit
           aria-label="JARVIS denkt nach". Unter der Fehlermeldung
           "Ereignisstrom abgerissen" pulsierten die Punkte also weiter, und
           der Screenreader sagte weiter "JARVIS denkt nach" - die
           Oberflaeche behauptete zu arbeiten, waehrend sie eine Zeile
           darueber zugab, dass sie nichts mehr hoert.
           Jetzt raeumt jeder Abbruchweg auf, denn `abschluss` ruft
           `beenden()` ohnehin als erstes. `remove()` auf einem schon
