<!-- FIX-06 Abschnitt 5: die Palette steht EINMAL, hier und in
     weltlage.html eingebunden, und static/globus.js erbt sie ueber
     :root. Vor dem eigenen <style>, damit seiteneigene Abweichungen
     bei gleicher Spezifitaet gewinnen. -->
<link rel="stylesheet" href="/static/system.css">
<style>
/* ---------------------------------------------------------------------------
   JARVIS — Phase 1, Walking Skeleton.

   Ein linearer Verlauf, kein Konversations-Browser: das Schema aus
   docs/phases/PHASE-01.md kennt genau eine Tabelle `messages`.

   Akzent ist ein warmes Bernstein — bewusst nicht das übliche Indigo. Genau
   eine Akzentfarbe, sonst Graustufen (0.3).
--------------------------------------------------------------------------- */

/* Die Palette stand frueher hier. Seit FIX-06 Abschnitt 5 liegt sie in
   `static/system.css` — einmal, fuer beide Seiten und fuer den Globus. Die
   englischen Namen (`--bg-0`, `--accent`, `--line`, `--ease` …) gibt es dort
   weiter, aber nur noch als Zeiger auf die deutschen. So bleibt jede Regel
   in dieser Datei gueltig, ohne dass die Werte an zwei Orten stehen. */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  font-size: var(--step-0);
  line-height: 1.55;
  color: var(--text);
  background-color: var(--bg-0);
  /* Struktur hinter dem Glas. Ohne das ist backdrop-filter sinnlos. */
  background-image:
    /* Hier standen zwei Farben, die keiner Palette angehoerten: ein
       vierter Bernstein dicht neben --akzent, und der zweite Akzent, den
       der Kopf von static/system.css fuer abgeschafft erklaert. Jetzt
       zweimal derselbe Akzent, unten schwaecher.
       Die alten Werte stehen ABSICHTLICH nicht hier: der Waechter
       durchsucht auch Kommentare, und ein Kommentar, der ihn rot macht,
       ist genau die Falle, die er verhindern soll. Sie stehen in
       test_nur_die_eine_akzentfarbe_und_die_zwei_signalfarben. */
    radial-gradient(900px 620px at 12% -8%,  rgba(240, 180, 92, 0.10), transparent 62%),
    radial-gradient(760px 560px at 92% 108%, rgba(240, 180, 92, 0.06), transparent 60%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea { font: inherit; color: inherit; }

/* `:focus-visible`, `.glass` und der Reduced-Motion-Block stehen seit
   FIX-06 Abschnitt 5 in `static/system.css`. */

/* --- Gerüst --------------------------------------------------------------- */

.app {
  display: grid;
  /* Die Spalte muss ausdrücklich begrenzt werden: eine implizite Grid-Spalte
     ist auto = max-content und wächst mit dem breitesten Kind. */
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100dvh;
  max-width: 900px;
  margin: 0 auto;
}

.topbar {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-4) var(--s-5);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.brand-mark {
  width: 30px; height: 30px;
  flex: none;
  display: grid; place-items: center;
  border-radius: 9px;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
}
.brand-name {
  margin: 0;
  font-size: var(--step-0);
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--text-loud);
}
.brand-phase { font-size: 11px; letter-spacing: 0.06em; color: var(--text-dim); }

.status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--s-2);
  min-width: 0;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex: none; }
.dot.is-ok  { background: var(--ok); }
.dot.is-bad { background: var(--danger); }
.status-text {
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.model-chip {
  flex: none;
  padding: 3px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
}

.thread {
  /* display kommt aus .thread.is-active - sonst bleibt der Chat sichtbar,
     wenn eine andere Ansicht aktiv ist. */
  display: none;
  overflow-y: auto;
  padding: var(--s-5) var(--s-5) var(--s-6);
  flex-direction: column;
  gap: var(--s-4);
  scroll-behavior: smooth;
}

.msg { max-width: min(70ch, 88%); animation: rise 320ms var(--ease) both; }
.msg-user { align-self: flex-end; }
.msg-assistant, .msg-error { align-self: flex-start; }

.bubble {
  padding: var(--s-3) var(--s-4);
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-1);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.msg-user .bubble {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  border-bottom-right-radius: 5px;
}
.msg-assistant .bubble { border-bottom-left-radius: 5px; }
.msg-error .bubble { border-color: rgba(242, 114, 107, 0.45); color: #ffd9d6; }

/* --- Gedächtnis-Ansicht (Phase 3) ---------------------------------------- */

.kopf-btn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  transition: color 200ms var(--ease), border-color 200ms var(--ease),
              background 200ms var(--ease);
}
.kopf-btn:hover { color: var(--text-loud); border-color: var(--accent-line); }
.kopf-btn[aria-pressed="true"] {
  color: var(--accent);
  border-color: var(--accent-line);
  background: var(--accent-soft);
}

.panel {
  position: fixed;
  inset: 0 0 0 auto;
  z-index: 30;
  width: min(460px, 92vw);
  display: flex;
  flex-direction: column;
  border-width: 0 0 0 1px;
  border-radius: 0;
  transform: translateX(102%);
  transition: transform 300ms var(--ease);
}
.panel.is-open { transform: none; }
.panel-kopf {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-4) var(--s-5);
  border-bottom: 1px solid var(--line);
}
.panel-kopf h2 {
  margin: 0;
  font-size: var(--step-0);
  font-weight: 500;
  color: var(--text-loud);
}
.panel-zu {
  margin-left: auto;
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border: 0; border-radius: 8px;
  background: none; color: var(--text-dim); cursor: pointer;
}
.panel-zu:hover { background: var(--bg-2); color: var(--text); }
.panel-koerper { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s-4) var(--s-5); }
.panel-fuss {
  padding: var(--s-3) var(--s-5) max(var(--s-4), env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
  display: flex;
  gap: var(--s-2);
}
.panel-fuss input {
  flex: 1;
  min-width: 0;
  padding: 8px var(--s-3);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg-0);
}
.panel-fuss button {
  flex: none;
  padding: 8px var(--s-3);
  border: 0; border-radius: 10px;
  background: var(--accent); color: var(--on-accent);
  cursor: pointer;
}

.fakt {
  padding: var(--s-3) 0;
  border-bottom: 1px solid var(--line);
  animation: rise 300ms var(--ease) both;
}
.fakt-text { overflow-wrap: anywhere; }
.fakt-text[contenteditable="true"] {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 6px;
}
.fakt-zeile {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s-2);
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
}
.fakt-kat {
  padding: 1px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
}
.fakt-konflikt {
  margin-top: 6px;
  padding: 6px var(--s-3);
  border-radius: 8px;
  border: 1px solid rgba(242, 114, 107, 0.45);
  background: rgba(242, 114, 107, 0.08);
  color: #ffd9d6;
  font-size: 11px;
}
.fakt-aktion {
  border: 0; background: none; padding: 2px 6px;
  color: var(--text-dim); cursor: pointer; font-size: 11px;
  border-radius: 6px;
}
.fakt-aktion:hover { background: var(--bg-2); color: var(--text); }
.fakt-aktion.is-loeschen:hover { color: var(--danger); }
.panel-leer { color: var(--text-dim); text-align: center; padding: var(--s-6) 0; }

/* --- Plan eines Auftrags (Phase 4) --------------------------------------- */

.plan {
  margin-top: var(--s-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.02);
  overflow: hidden;
}
.plan-kopf {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding: 8px var(--s-3);
  font-size: 11px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--line);
}
.plan-abbrechen {
  margin-left: auto;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: none;
  color: var(--text-dim);
  font-size: 11px;
  padding: 2px 10px;
  cursor: pointer;
}
.plan-abbrechen:hover { color: var(--danger); border-color: rgba(242,114,107,0.5); }

.schritt {
  display: flex;
  gap: var(--s-3);
  padding: 8px var(--s-3);
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  font-size: var(--step--1);
}
.schritt:first-of-type { border-top: 0; }
.schritt-marke {
  flex: none;
  width: 16px; height: 16px;
  margin-top: 3px;
  border-radius: 50%;
  border: 1.5px solid var(--text-dim);
  display: grid;
  place-items: center;
  font-size: 9px;
  color: var(--bg-0);
}
.schritt.is-running .schritt-marke {
  border-color: var(--accent);
  animation: puls 1.4s ease-in-out infinite;
}
.schritt.is-done .schritt-marke { background: var(--ok); border-color: var(--ok); }
.schritt.is-failed .schritt-marke { background: var(--danger); border-color: var(--danger); }
.schritt.is-skipped { opacity: 0.5; }
.schritt-koerper { min-width: 0; flex: 1; }
.schritt-agent {
  display: inline-block;
  margin-left: 6px;
  padding: 0 7px;
  border: 1px solid var(--accent-line);
  border-radius: 999px;
  font-size: 10px;
  color: var(--accent);
}
.schritt-note { margin-top: 3px; font-size: 11px; color: var(--text-dim); }
.schritt.is-failed .schritt-note { color: var(--ab); }
.plan-fuss {
  padding: 6px var(--s-3);
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--text-dim);
}
.plan-fuss.is-abbruch { color: var(--ab); }

@keyframes puls {
  0%, 100% { box-shadow: 0 0 0 0 rgba(240, 180, 92, 0.4); }
  50%      { box-shadow: 0 0 0 5px rgba(240, 180, 92, 0); }
}

/* --- Sprache (Phase 9) ---------------------------------------------------- */

.btn-mic {
  flex: none;
  display: grid;
  place-items: center;
  width: 38px; height: 38px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: color 200ms var(--ease), border-color 200ms var(--ease),
              background 200ms var(--ease), transform 200ms var(--ease);
}
.btn-mic:hover { color: var(--text-loud); border-color: var(--accent-line); }
.btn-mic.is-hoert {
  color: var(--on-accent);
  background: var(--danger);
  border-color: var(--danger);
  animation: puls 1.2s ease-in-out infinite;
}
.btn-mic[disabled] { opacity: 0.35; cursor: not-allowed; }
.btn-mic.is-spricht { color: var(--accent); border-color: var(--accent-line); }

.sprache {
  flex: none;
  padding: 3px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
}
.sprache:hover { color: var(--text-loud); border-color: var(--accent-line); }

/* --- Ansichten (Phase 7) -------------------------------------------------- */

/* `wrap` seit FIX-06 Abschnitt 6: mit dem sechsten Tab passte die Reihe
   bei 360 px nicht mehr in die Zeile und schob die Seite um 44 px zur
   Seite. Gemessen: scrollWidth 404 bei innerWidth 360, Taeter #tab-welt. */
.tabs { display: flex; gap: 2px; flex-wrap: wrap; min-width: 0; }
.tab {
  padding: 4px 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  transition: color 200ms var(--ease), background 200ms var(--ease);
}
.tab:hover { color: var(--text-loud); }
/* Deckend, nicht halbtransparent — und das ist kein Geschmack, sondern
   Messbarkeit. Diese Flaeche liegt auf dem Glas der Kopfleiste, also
   Transparenz auf Transparenz. Der Kontrastpruefer von `web-selfcheck`
   bricht seine Suche nach dem Untergrund bei der zweiten getoenten Schicht
   ab und rechnet gegen WEISS: gemeldet 1,69:1, tatsaechlich gemalt 7,68:1.
   `--akzent-glut-fest` ist dieselbe Farbe, vorkomponiert. Optisch
   unveraendert, aber jetzt misst jeder dasselbe wie das Auge sieht. */
.tab[aria-selected="true"] { background: var(--akzent-glut-fest); color: var(--akzent); }

.view { display: none; overflow-y: auto; padding: var(--s-5); }
.view.is-active { display: block; }

/* --- COMMAND CENTER (FIX-06 Abschnitt 6) --------------------------------- */

/* Zwoelf Spalten brauchen Platz. Der Rest der App bleibt bei 900 px - ein
   Dashboard in einer 900-px-Spalte ist kein Dashboard, sondern eine Liste.
   Die Klasse haengt an `.app` und wird in `zeigeAnsicht()` gesetzt. */
.app.is-weit { max-width: 1500px; }

/* DoD 1: kein Scrollen bei 1440x900. Deshalb `overflow: hidden` statt
   `auto` - was nicht passt, faellt auf, statt sich wegzuscrollen. */
#view-cc { padding: var(--s-4); overflow: hidden; }

.cc { border: 1px solid var(--kante); border-radius: 12px; overflow: hidden;
      grid-auto-rows: min-content; }
.cc > .zone { padding: 9px 13px; min-width: 0; display: flex;
              flex-direction: column; gap: 5px; }

.z3  { grid-column: span 3; }
.z4  { grid-column: span 4; }
.z5  { grid-column: span 5; }
.z6  { grid-column: span 6; }
.z12 { grid-column: span 12; }

.zone-kopf {
  display: flex; align-items: baseline; gap: var(--s-3);
  font-size: var(--etikett); letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-leise);
}
.zone-kopf .zahl-rechts { margin-left: auto; font-variant-numeric: tabular-nums; }
.zone-leer { margin: 0; color: var(--text-leise); font-size: var(--step--1); }
/* Der Strich aus 6.3: die Zone bleibt stehen, der Inhalt ist ehrlich leer. */
.zone-leer::before { content: "—"; display: block; color: var(--kante);
                     font-size: 20px; line-height: 1.1; }

/* Zone 1 --------------------------------------------------------------- */
/* `.cc > .zone` sind zwei Klassen und schlagen eine einzelne - ohne den
   zusammengesetzten Selektor bleibt die Kopfzeile eine Spalte. Gemessen:
   Marke und Anbieter standen untereinander statt nebeneinander. */
.cc > .zone.cc-kopf { flex-direction: row; align-items: center; gap: var(--s-4); }
.cc-marke { font-size: var(--step-0); letter-spacing: .14em; color: var(--text-laut);
            font-weight: 500; }
.cc-marke b { color: var(--akzent); font-weight: 500; }
/* Nicht `--kenngroesse`: das ist die Groesse fuer EINE Heldenzahl. Als Uhr
   in der Kopfzeile war sie 64 px hoch und hat die ganze Zeile erschlagen. */
.cc-uhr { margin-left: auto; font-family: var(--mono);
          font-variant-numeric: tabular-nums; font-size: var(--step-1);
          line-height: 1; color: var(--text-laut); letter-spacing: .04em; }
.cc-uhr small { font-size: var(--etikett); color: var(--text-leise);
                margin-left: 8px; letter-spacing: .06em; }
.cc-anbieter { font-size: var(--etikett); color: var(--text-leise);
               letter-spacing: .06em; }

/* Zone 2 --------------------------------------------------------------- */
.cc-globus { position: relative; min-height: 215px; padding: 0; }
.cc-globus .zone-kopf { position: absolute; inset: 9px 13px auto; z-index: 2;
                        pointer-events: none; }
.cc-globus-platz { flex: 1; min-height: 0; position: relative; }
/* Das Canvas kommt aus der Weltansicht herueber. Dort galt
   `.globus-wurzel #globus{position:absolute;inset:0}` - hier greift die
   Regel nicht mehr, also braucht es eine eigene. */
/* `inset` reicht hier NICHT. Ein <canvas> ist ein ersetztes Element: steht
   `width: auto`, nimmt CSS die intrinsische Groesse (300x150) und ignoriert
   eine der beiden Kanten - gemessen, canvasW war 300px trotz left und
   right. Deshalb Breite und Hoehe ausdruecklich. */
.cc-globus-platz canvas { position: absolute; top: 22px; left: 10px;
                          width: calc(100% - 20px); height: calc(100% - 30px);
                          display: block; cursor: grab; }
.cc-globus-hinweis { position: absolute; inset: 22px 13px 9px; margin: 0;
                     display: flex; flex-direction: column; align-items: center;
                     justify-content: center; text-align: center;
                     font-size: var(--step--1); color: var(--text-leise); }
.cc-globus-hinweis button {
  display: block; margin: 8px auto 0; padding: 5px 12px; border-radius: 8px;
  border: 1px solid var(--akzent-linie); background: var(--akzent-glut-fest);
  color: var(--akzent); cursor: pointer; font-size: var(--step--1);
}

/* Zone 3 --------------------------------------------------------------- */
.cc-auftrag { display: flex; flex-direction: column; gap: 3px; }
.cc-auftrag + .cc-auftrag { margin-top: 7px; }
.cc-auftrag-ziel { font-size: var(--step--1); color: var(--text-laut);
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-auftrag-zeile { display: flex; gap: var(--s-2); font-size: var(--etikett);
                    color: var(--text-leise); font-variant-numeric: tabular-nums; }
.cc-balken { height: 3px; background: var(--kante); overflow: hidden; }
/* `scaleX` statt `width`: `width` loest ein Layout aus, `transform` nicht -
   und diese Ansicht darf laut DoD 1 nicht scrollen, da will man kein
   Nachrechnen der Nachbarzonen bei jedem Fortschritt.
   Hier stand `var(--dauer-normal)`, und das Token gibt es in keiner Datei.
   Damit war die ganze Deklaration ungueltig und der Balken sprang hart -
   ausgerechnet an der Stelle, die Fortschritt zeigen soll. Gefunden beim
   Abgleich mit Noahs Bewegtbild-Vorlage, festgehalten in
   `test_kein_undefiniertes_custom_property`. */
.cc-balken i { display: block; height: 100%; width: 100%;
               background: var(--akzent);
               transform-origin: left center; transform: scaleX(0);
               transition: transform var(--dauer-zahl) var(--kurve-rein); }

/* Zone 4 --------------------------------------------------------------- */
.cc-strom { flex: 1; min-height: 0; overflow-y: auto; font-family: var(--mono);
            font-size: 11px; line-height: 1.6; display: flex;
            flex-direction: column; justify-content: flex-end; }
.cc-strom div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                color: var(--text); }
.cc-strom .t  { color: var(--text-leise); }
.cc-strom .n  { color: var(--akzent); }

/* Zone 5 --------------------------------------------------------------- */
.cc-kennzahlen { display: grid; grid-template-columns: repeat(4, 1fr);
                 gap: 1px; background: var(--kante); }
.cc-kennzahl { background: var(--ebene-1); padding: 7px 13px 9px; min-width: 0; }
/* Vier Kennzahlen nebeneinander, nicht eine grosse: eine Stufe unter
   `--kenngroesse`, sonst frisst Zone 5 ein Drittel der Hoehe. */
.cc-kennzahl .wert { font-size: clamp(1.5rem, 1.1rem + 1.2vw, 2.1rem);
                     line-height: 1.15;
                     font-variant-numeric: tabular-nums; color: var(--text-laut);
                     display: block; }
.cc-kennzahl .name { font-size: var(--etikett); letter-spacing: .08em;
                     text-transform: uppercase; color: var(--text-leise); }
.cc-kennzahl .fussnote { font-size: var(--etikett); color: var(--text-leise);
                         display: block; margin-top: 1px; }
.z-kennzahlen { padding: 0; gap: 0; }

/* Zone 6 --------------------------------------------------------------- */
.cc-tabelle { width: 100%; border-collapse: collapse; font-size: var(--step--1); }
.cc-tabelle td { padding: 2px 0; border-bottom: 1px solid var(--kante);
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-tabelle tr:last-child td { border-bottom: 0; }
.cc-tabelle .t { color: var(--text-leise); font-family: var(--mono); width: 1%; }
.cc-tabelle .ms { text-align: right; font-variant-numeric: tabular-nums;
                  color: var(--text-leise); width: 1%; }
.cc-tabelle .ok  { color: var(--akzent); width: 1%; text-align: center; }
.cc-tabelle .weg { color: var(--ab); width: 1%; text-align: center; }

/* Zone 7 --------------------------------------------------------------- */
.cc-diagramm { flex: 1; min-height: 64px; }
.cc-diagramm svg { width: 100%; height: 100%; display: block; }

/* Zone 8 --------------------------------------------------------------- */
.cc-meldungen { display: grid; grid-template-columns: repeat(3, 1fr);
                gap: var(--s-3); }
.cc-meldung { display: flex; gap: var(--s-3); min-width: 0; }
.cc-meldung img { width: 62px; height: 46px; object-fit: cover; border-radius: 6px;
                  flex: none; background: var(--ebene-2); }
.cc-meldung-text { min-width: 0; }
.cc-meldung h4 { margin: 0; font-size: var(--step--1); font-weight: 500;
                 color: var(--text-laut); display: -webkit-box;
                 -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                 overflow: hidden; }
.cc-meldung p { margin: 2px 0 0; font-size: var(--etikett); color: var(--text-leise); }

/* DoD 6: bei 360 px stapeln sich die Zonen, nichts scrollt seitlich. */
@media (max-width: 900px) {
  #view-cc { overflow-y: auto; }
  /* Bei 360 px quetschte die Kopfzeile die Marke auf drei Zeilen und den
     Anbieter auf vier. Gestapelt liest sich das. */
  .cc > .zone.cc-kopf { flex-direction: column; align-items: flex-start; gap: 2px; }
  .cc-uhr { margin-left: 0; }
  .cc > .zone { grid-column: span 12 !important; }
  .cc-kennzahlen { grid-template-columns: repeat(2, 1fr); }
  .cc-meldungen { grid-template-columns: 1fr; }
  .cc-globus { min-height: 220px; }
}

/* FIX-05 B-5: der Globus fuellt seinen BEHAELTER, nicht das Fenster. Kein
   Innenabstand, kein Scrollbalken - er zeichnet bis an die Kante, und
   `position:relative` macht ihn zum Bezugssystem fuer alles, was
   static/globus.js absolut darin platziert. */
#view-welt { padding: 0; overflow: hidden; position: relative; }
/* 2,0 MB brauchen sichtbar Zeit. Bis dahin steht hier, was los ist. */
.globus-laedt {
  position: absolute; inset: 0; z-index: 9;
  display: grid; place-items: center;
  padding: var(--s-5); text-align: center;
  color: var(--text-dim); font-size: var(--step--1);
}
.thread.is-active { display: flex; }

.karte {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-1);
  padding: var(--s-4);
  margin-bottom: var(--s-3);
  animation: rise 300ms var(--ease) both;
}
.karte h3 {
  margin: 0 0 var(--s-2);
  font-size: var(--step-0);
  font-weight: 500;
  color: var(--text-loud);
}
.karte-zeile {
  display: flex;
  gap: var(--s-3);
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--text-dim);
}
.zustand {
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
}
.zustand.is-done { color: var(--ok); border-color: rgba(95,207,142,0.4); }
.zustand.is-failed, .zustand.is-aborted_budget { color: var(--danger); border-color: rgba(242,114,107,0.4); }
.zustand.is-running, .zustand.is-pending { color: var(--accent); border-color: var(--accent-line); }

.tabelle { width: 100%; border-collapse: collapse; font-size: var(--step--1); }
.tabelle th, .tabelle td {
  text-align: left;
  padding: 6px var(--s-2);
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.tabelle th { color: var(--text-dim); font-weight: 500; font-size: 11px; }
.tabelle td.zahl, .tabelle th.zahl { text-align: right; font-variant-numeric: tabular-nums; }
.tabelle-wrap { overflow-x: auto; }

.kpi { display: flex; flex-wrap: wrap; gap: var(--s-3); margin-bottom: var(--s-4); }
.kpi > div {
  flex: 1 1 140px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: var(--s-3) var(--s-4);
  background: var(--bg-1);
}
.kpi dt { font-size: 11px; color: var(--text-dim); margin: 0; }
.kpi dd {
  margin: 4px 0 0;
  font-size: var(--step-1);
  color: var(--text-loud);
  font-variant-numeric: tabular-nums;
}

.balken { height: 4px; border-radius: 2px; background: var(--accent); margin-top: 4px; }

/* --- Unteraufträge (Phase 6) --------------------------------------------- */

.unter {
  margin: 0 var(--s-3) var(--s-3);
  border-left: 2px solid var(--accent-line);
  padding-left: var(--s-3);
}
.unter > summary {
  list-style: none;
  cursor: pointer;
  font-size: 11px;
  color: var(--text-dim);
  padding: 4px 0;
}
.unter > summary::-webkit-details-marker { display: none; }
.unter > summary::before {
  content: "▸";
  display: inline-block;
  margin-right: 6px;
  transition: transform 200ms var(--ease);
}
.unter[open] > summary::before { transform: rotate(90deg); }
.unter > summary:hover { color: var(--text); }
.unter-ziel { font-size: var(--step--1); padding: 4px 0 2px; }
.unter-agent { color: var(--accent); font-size: 11px; }
.unter-ergebnis {
  font-size: 11px;
  color: var(--text-dim);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 160px;
  overflow-y: auto;
  padding-bottom: var(--s-2);
}

/* --- Rückfrage vor einer Aktion mit Außenwirkung (Phase 5) ---------------- */

.frage {
  margin: var(--s-2) var(--s-3) var(--s-3);
  border: 1px solid var(--accent-line);
  border-radius: 12px;
  background: var(--accent-soft);
  overflow: hidden;
}
.frage-kopf {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding: 8px var(--s-3);
  font-size: 11px;
  color: var(--accent);
  border-bottom: 1px solid var(--accent-line);
}
.frage-stufe {
  margin-left: auto;
  padding: 1px 8px;
  border: 1px solid var(--accent-line);
  border-radius: 999px;
  font-size: 10px;
}
.frage pre {
  margin: 0;
  padding: var(--s-3);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: var(--step--1);
  color: var(--text);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 320px;
  overflow-y: auto;
}
.frage-knoepfe {
  display: flex;
  gap: var(--s-2);
  padding: 0 var(--s-3) var(--s-3);
}
.frage-knoepfe button {
  padding: 7px var(--s-4);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 500;
}
.frage-ja { background: var(--accent); color: var(--on-accent); }
.frage-nein {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--line) !important;
}
.frage-nein:hover { color: var(--danger); border-color: rgba(242,114,107,0.5) !important; }
.frage-hinweis { padding: 0 var(--s-3) var(--s-3); font-size: 11px; color: var(--text-dim); }

/* --- Werkzeugaufrufe, aufklappbar (Phase 2, DoD 6) ------------------------ */

.tools {
  margin-top: var(--s-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.02);
  overflow: hidden;
}
.tools > summary {
  padding: 6px var(--s-3);
  font-size: 11px;
  color: var(--text-dim);
  cursor: pointer;
  list-style: none;
  user-select: none;
  transition: color 200ms var(--ease), background 200ms var(--ease);
}
.tools > summary::-webkit-details-marker { display: none; }
.tools > summary::before {
  content: "▸";
  display: inline-block;
  margin-right: 6px;
  transition: transform 200ms var(--ease);
}
.tools[open] > summary::before { transform: rotate(90deg); }
.tools > summary:hover { color: var(--text); background: var(--bg-2); }

.tool {
  padding: var(--s-3);
  border-top: 1px solid var(--line);
  font-size: var(--step--1);
}
.tool-kopf {
  display: flex;
  align-items: baseline;
  gap: var(--s-2);
  flex-wrap: wrap;
}
.tool-name {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--accent);
}
.tool-name.is-bad { color: var(--danger); }
.tool-dauer { font-size: 11px; color: var(--text-dim); margin-left: auto; }
.tool pre {
  margin: var(--s-2) 0 0;
  padding: var(--s-2) var(--s-3);
  border-radius: 8px;
  background: var(--bg-0);
  color: var(--text-dim);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 260px;
  overflow-y: auto;
}
.tool-bild {
  margin: 10px 0 0;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(0,0,0,.25);
}
.tool-bild img {
  display: block;
  width: 100%;
  height: auto;
  /* Ein Satellitenbild ist Bildinformation, keine Illustration - nichts
     zuschneiden, nichts weichzeichnen. */
  image-rendering: auto;
}
.tool-bild figcaption {
  padding: 6px 10px;
  font-size: 12px;
  /* Stand frueher als `var(--dim, #9aa)` da. `--dim` ist in keiner Datei
     definiert — die Farbe kam immer aus dem Ersatzwert. Eine Variable, die
     es nicht gibt, ist eine Falle: wer sie eines Tages anlegt, aendert
     stillschweigend diese zwei Zeilen. */
  color: var(--text-leise);
}
.tool-bild-fehler { padding: 10px; font-size: 13px; color: var(--text-leise); }
.tool-quellen {
  margin: var(--s-2) 0 0;
  padding-left: 1.1em;
  font-size: 11px;
}
.tool-quellen a { color: var(--accent); overflow-wrap: anywhere; }

.empty {
  margin: auto;
  max-width: 46ch;
  text-align: center;
  color: var(--text-dim);
  animation: rise 380ms var(--ease) both;
}
.empty h2 {
  margin: 0 0 var(--s-2);
  font-size: var(--step-1);
  font-weight: 500;
  color: var(--text-loud);
  letter-spacing: -0.01em;
}
.empty p { margin: 0; }

.typing { display: inline-flex; gap: 5px; align-items: center; height: 1.55em; }
.typing i {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-dim);
  animation: pulse 1.25s ease-in-out infinite;
}
.typing i:nth-child(2) { animation-delay: 0.16s; }
.typing i:nth-child(3) { animation-delay: 0.32s; }

/* --- Eingabe -------------------------------------------------------------- */

.composer-wrap {
  padding: 0 var(--s-5) max(var(--s-5), env(safe-area-inset-bottom, 0px));
}
.composer-wrap[hidden] { display: none; }

.composer {
  display: flex;
  align-items: flex-end;
  gap: var(--s-3);
  padding: var(--s-2) var(--s-2) var(--s-2) var(--s-4);
  border-radius: 16px;
  transition: border-color 200ms var(--ease);
}
.composer:focus-within { border-color: var(--accent-line); }

.composer textarea {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  resize: none;
  background: transparent;
  padding: 10px 0;
  min-height: 1.5em;
  max-height: 200px;
  line-height: 1.5;
}
.composer textarea::placeholder { color: var(--text-dim); }
/* Das outline:none oben schlägt die globale :focus-visible-Regel (höhere
   Spezifität). Ohne diesen Ersatz wäre das Feld per Tastatur unsichtbar. */
.composer textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 8px;
}

.btn-send {
  flex: none;
  display: grid;
  place-items: center;
  width: 38px; height: 38px;
  border: 0;
  border-radius: 11px;
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
  transition: transform 200ms var(--ease), opacity 200ms var(--ease);
}
.btn-send:hover:not(:disabled) { transform: translateY(-1px); }
.btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

.hint {
  margin: var(--s-2) var(--s-1) 0;
  font-size: 11px;
  color: var(--text-dim);
  min-height: 1.4em;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
@keyframes pulse {
  0%, 100% { opacity: 0.25; transform: translateY(0); }
  50%      { opacity: 1;    transform: translateY(-3px); }
}

@media (max-width: 600px) {
  .thread, .composer-wrap { padding-left: var(--s-4); padding-right: var(--s-4); }
  .topbar { padding-left: var(--s-4); padding-right: var(--s-4); }
  .msg { max-width: 94%; }
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar glass">

<script>
(function () {
  'use strict';

  // Wird beim Ausliefern vom Backend eingesetzt. Das ist der JARVIS-Token,
  // nicht der Modell-Key — der verlässt das Backend nie (0.4.1).
  var TOKEN = '__JARVIS_TOKEN__';

  // Zustand lebt in Variablen, nicht in localStorage: in manchen Umgebungen
  // ist die API nicht verfügbar und die Seite stürbe an der ersten Zeile.
  var busy = false;

  var el = {
    thread:    document.getElementById('thread'),
    form:      document.getElementById('composer'),
    input:     document.getElementById('input'),
    send:      document.getElementById('btn-send'),
    hint:      document.getElementById('hint'),
    chip:      document.getElementById('model-chip'),
    phase:     document.getElementById('brand-phase'),
    mic:       document.getElementById('btn-mic'),
    sprache:   document.getElementById('btn-sprache'),
    healthDot: document.getElementById('health-dot'),
    healthTxt: document.getElementById('health-text'),
    memBtn:    document.getElementById('btn-memory'),
    memPanel:  document.getElementById('memory-panel'),
    memZu:     document.getElementById('memory-zu'),
    memListe:  document.getElementById('memory-liste'),
    memForm:   document.getElementById('memory-form'),
    memNeu:    document.getElementById('memory-neu')
  };

  function api(path, options) {
    var opts = options || {};
    opts.headers = { 'X-Jarvis-Token': TOKEN };
    if (opts.body !== undefined) {
      opts.headers['content-type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    return fetch(path, opts).then(function (res) {
      return res.text().then(function (raw) {
        var data = null;
        try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
        if (!res.ok) {
          var detail = (data && data.detail) || raw || ('HTTP ' + res.status);
          if (typeof detail !== 'string') detail = JSON.stringify(detail);
          var err = new Error(detail);
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  // --- Ereignisstrom (Phase 7, DoD 1) ---------------------------------------
  //
  // Kein EventSource: das kann keine Header setzen, der JARVIS-Token muesste
  // dann in die URL - und landet damit in jedem Zugriffslog. Der Server
  // liefert an /api/events einen text/event-stream; hier wird der mit fetch
  // und einem Reader gelesen, der Token bleibt im Header.
  //
  // Der Strom ersetzt das Polling: es gibt keinen Timer mehr, der nachfragt.
  function ereignisStrom(beiEreignis, beiAbbruch) {
    var steuerung = new AbortController();
    var offen = true;

    fetch('/api/events', {
      headers: { 'X-Jarvis-Token': TOKEN },
      signal: steuerung.signal
    }).then(function (res) {
      if (!res.ok || !res.body) throw new Error('Ereignisstrom nicht verfuegbar (HTTP ' + res.status + ')');
      var leser = res.body.getReader();
      var dekoder = new TextDecoder();
      var puffer = '';

      function weiter() {
        return leser.read().then(function (stueck) {
          if (stueck.done) { offen = false; if (beiAbbruch) beiAbbruch(null); return; }
          puffer += dekoder.decode(stueck.value, { stream: true });

          // Ein Ereignis endet bei der Leerzeile. Alles davor gehoert zusammen.
          var grenze;
          while ((grenze = puffer.indexOf('\n\n')) !== -1) {
            var roh = puffer.slice(0, grenze);
            puffer = puffer.slice(grenze + 2);
            var typ = null, daten = null;
            roh.split('\n').forEach(function (zeile) {
              if (zeile.indexOf('event: ') === 0) typ = zeile.slice(7).trim();
              else if (zeile.indexOf('data: ') === 0) {
                try { daten = JSON.parse(zeile.slice(6)); } catch (e) { daten = null; }
              }
              // ": herzschlag" faellt hier durch - genau richtig.
            });
            if (typ && daten) beiEreignis(typ, daten);
          }
          return weiter();
        });
      }
      return weiter();
    }).catch(function (err) {
      offen = false;
      if (err && err.name === 'AbortError') return;
      if (beiAbbruch) beiAbbruch(err);
    });

    return {
      schliessen: function () { if (offen) { offen = false; steuerung.abort(); } }
    };
  }

  function toolNode(call) {
    var box = document.createElement('div');
    box.className = 'tool';

    var kopf = document.createElement('div');
    kopf.className = 'tool-kopf';

  function zeigeBild(box, pfad, attribution) {
    var figur = document.createElement('figure');
    figur.className = 'tool-bild';

    var bild = document.createElement('img');
    bild.alt = 'Satellitenaufnahme';
    bild.loading = 'lazy';
    figur.appendChild(bild);

    // Attribution ist Pflicht, nicht Deko: Copernicus-Daten duerfen ohne
    // sie nicht angezeigt werden (core/satellite/contracts.py).
    if (attribution) {
      var bildunterschrift = document.createElement('figcaption');
      bildunterschrift.textContent = attribution;
      figur.appendChild(bildunterschrift);
    }
    box.appendChild(figur);

    fetch(pfad, { headers: { 'X-Jarvis-Token': TOKEN } })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.blob();
      })
      .then(function (blob) {
        var url = URL.createObjectURL(blob);
        bild.src = url;
        // Aufraeumen, sobald das Bild steht - eine Blob-URL haelt sonst
        // die Bytes bis zum Neuladen der Seite im Speicher.
        bild.onload = function () { URL.revokeObjectURL(url); };
      })
      .catch(function (fehler) {
        figur.removeChild(bild);
        var hinweis = document.createElement('p');
        hinweis.className = 'tool-bild-fehler';
        hinweis.textContent = 'Bild konnte nicht geladen werden: ' + fehler.message;
        figur.insertBefore(hinweis, figur.firstChild);
      });
  }

    var name = document.createElement('span');
    name.className = 'tool-name' + (call.ok ? '' : ' is-bad');
    name.textContent = call.name + '(' + argumentText(call.arguments) + ')';

    var dauer = document.createElement('span');
    dauer.className = 'tool-dauer';
    dauer.textContent = (call.ok ? '' : 'fehlgeschlagen · ') + (call.duration_ms || 0) + ' ms';

    kopf.appendChild(name);
    kopf.appendChild(dauer);
    box.appendChild(kopf);

    var ausgabe = call.display || call.error || '';
    if (ausgabe) {
      var pre = document.createElement('pre');
      pre.textContent = ausgabe;
      box.appendChild(pre);
    }

    // Satellitenbild (Phase 8). Bis hierher hatte diese Datei null <img>.
    //
    // Geholt wird per fetch() mit dem Token-Header, nicht ueber ein nacktes
    // <img src>: ein img-Tag schickt keine eigenen Header, der Token muesste
    // sonst in die Adresse — und stuende damit im Verlauf, im Referrer und
    // in jedem Log. Aus den Bytes wird eine Blob-URL.
    var vorschau = call.data && call.data.preview_url;
    if (vorschau) {
      // Nicht den Pfad aus dem Ergebnis fetchen, sondern die ID daraus
      // ziehen, gegen die Form pruefen und die Adresse selbst bauen. Der
      // Unterschied ist klein und wichtig: `preview_url` kommt aus einem
      // Werkzeugergebnis, also mittelbar aus einem Modell.
      var id = String(vorschau).split('/').pop();
      if (/^[0-9a-f]{32}$/.test(id)) {
        zeigeBild(box, '/api/bild/' + id, call.data.attribution || '');
      }
    }

    if (call.sources && call.sources.length) {
      var liste = document.createElement('ul');
      liste.className = 'tool-quellen';
      call.sources.forEach(function (url) {
        var li = document.createElement('li');
        // Nur http(s) wird verlinkt — eine URL aus dem Netz ist nichts,
        // dem man ein href blind anvertraut.
        if (/^https?:\/\//i.test(url)) {
          var a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = url;
          li.appendChild(a);
        } else {
          li.textContent = url;
        }
        liste.appendChild(li);
      });
      box.appendChild(liste);
    }
    return box;
  }

  function argumentText(args) {
    if (!args) return '';
    try {
      return Object.keys(args).map(function (k) {
        return k + '=' + JSON.stringify(args[k]);
      }).join(', ');
    } catch (e) { return ''; }
  }

  function toolsNode(calls) {
    var details = document.createElement('details');
    details.className = 'tools';
    var summary = document.createElement('summary');
    var fehler = calls.filter(function (c) { return !c.ok; }).length;
    summary.textContent = calls.length + (calls.length === 1 ? ' Werkzeug' : ' Werkzeuge')
      + ': ' + calls.map(function (c) { return c.name; }).join(', ')
      + (fehler ? ' · ' + fehler + ' fehlgeschlagen' : '');
    details.appendChild(summary);
    calls.forEach(function (c) { details.appendChild(toolNode(c)); });
    return details;
  }

  function messageNode(role, content, toolCalls) {
    var wrap = document.createElement('div');
    wrap.className = 'msg msg-' + role;
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    // textContent, niemals innerHTML: der Inhalt kommt aus einem Modell.
    bubble.textContent = content;
    wrap.appendChild(bubble);
    if (toolCalls && toolCalls.length) wrap.appendChild(toolsNode(toolCalls));
    return wrap;
  }

  function showEmpty() {
    el.thread.textContent = '';
    var box = document.createElement('div');
    box.className = 'empty';
    var h = document.createElement('h2');
    h.textContent = 'Womit fangen wir an?';
    var p = document.createElement('p');
    p.textContent = 'Der Verlauf liegt lokal in SQLite und ist nach einem Neustart noch da.';
    box.appendChild(h); box.appendChild(p);
    el.thread.appendChild(box);
  }

  function scrollDown() {
    requestAnimationFrame(function () { el.thread.scrollTop = el.thread.scrollHeight; });
  }

  function appendError(text) {
    var wrap = document.createElement('div');
    wrap.className = 'msg msg-error';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    el.thread.appendChild(wrap);
    scrollDown();
  }

  function thinkingNode() {
    var wrap = document.createElement('div');
    wrap.className = 'msg msg-assistant';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    var dots = document.createElement('span');
    dots.className = 'typing';
    dots.setAttribute('aria-label', 'JARVIS denkt nach');
    for (var i = 0; i < 3; i++) dots.appendChild(document.createElement('i'));
    bubble.appendChild(dots);
    wrap.appendChild(bubble);
    return wrap;
  }

  function setBusy(value) {
    busy = value;
    el.send.disabled = value;
    el.input.disabled = value;
    el.thread.setAttribute('aria-busy', value ? 'true' : 'false');
  }

  function loadHistory() {
    return api('/api/messages').then(function (messages) {
      if (!messages || !messages.length) { showEmpty(); return; }
      el.thread.textContent = '';
      messages.forEach(function (m) {
        el.thread.appendChild(messageNode(m.role, m.content, m.tool_calls));
      });
      scrollDown();
    });
  }

  function loadHealth() {
    return api('/api/health').then(function (h) {
      el.chip.textContent = h.model;
      el.phase.textContent = 'Phase ' + h.phase;
      el.healthDot.className = 'dot ' + (h.status === 'ok' ? 'is-ok' : 'is-bad');
      if (h.provider_error) {
        el.healthTxt.textContent = h.provider_error;
      } else if (h.provider === 'fake') {
        el.healthTxt.textContent = 'Fake-Anbieter — kein echtes Modell, keine Kosten';
      } else {
        el.healthTxt.textContent = spendText(h.spend);
      }
    }).catch(function (err) {
      el.healthDot.className = 'dot is-bad';
      el.healthTxt.textContent = err.status === 401
        ? 'Token abgelehnt — Seite neu laden'
        : 'Backend nicht erreichbar';
    });
  }

  function spendText(spend) {
    if (!spend || !spend.calls) return 'noch kein Modellaufruf';
    var s = spend.calls + ' Aufrufe · ' + (spend.in_tokens + spend.out_tokens) + ' Token';
    return spend.prices_configured
      ? s + ' · ' + spend.cost_eur.toFixed(4) + ' €'
      : s + ' · Preise nicht in .env eingetragen';
  }

  // --- Plan eines Auftrags (Phase 4) --------------------------------------

  var MARKE = { done: '✓', failed: '✕', skipped: '–', running: '', pending: '' };

  function schrittNode(schritt) {
    var box = document.createElement('div');
    box.className = 'schritt is-' + schritt.status;

    var marke = document.createElement('span');
    marke.className = 'schritt-marke';
    marke.textContent = MARKE[schritt.status] || '';
    box.appendChild(marke);

    var koerper = document.createElement('div');
    koerper.className = 'schritt-koerper';

    var titel = document.createElement('div');
    // Der Runner haengt bei einem Retry den Grund an die Beschreibung — für
    // die Liste reicht die erste Zeile.
    titel.textContent = schritt.description.split('\n')[0];
    if (schritt.agent) {
      var agent = document.createElement('span');
      agent.className = 'schritt-agent';
      agent.textContent = schritt.agent;
      titel.appendChild(agent);
    }
    koerper.appendChild(titel);

    var hinweise = [];
    if (schritt.attempts > 1) hinweise.push(schritt.attempts + ' Versuche');
    if (schritt.status === 'failed' && schritt.note) hinweise.push(schritt.note);
    if (hinweise.length) {
      var note = document.createElement('div');
      note.className = 'schritt-note';
      note.textContent = hinweise.join(' · ');
      koerper.appendChild(note);
    }

    box.appendChild(koerper);
    return box;
  }

  function unterauftraegeNode(ids) {
    var details = document.createElement('details');
    details.className = 'unter';
    var summary = document.createElement('summary');
    summary.textContent = ids.length
      + (ids.length === 1 ? ' Unterauftrag' : ' Unteraufträge');
    details.appendChild(summary);

    var geladen = false;
    details.addEventListener('toggle', function () {
      if (!details.open || geladen) return;
      geladen = true;
      ids.forEach(function (id) {
        api('/api/tasks/' + id).then(function (kind) {
          var box = document.createElement('div');

          var ziel = document.createElement('div');
          ziel.className = 'unter-ziel';
          ziel.textContent = kind.goal;
          var agent = kind.steps[0] && kind.steps[0].agent;
          if (agent) {
            var marke = document.createElement('span');
            marke.className = 'unter-agent';
            marke.textContent = ' [' + agent + ']';
            ziel.appendChild(marke);
          }
          box.appendChild(ziel);

          if (kind.result) {
            var erg = document.createElement('div');
            erg.className = 'unter-ergebnis';
            erg.textContent = kind.result;
            box.appendChild(erg);
          }
          // Ein Unterauftrag kann selbst delegiert haben — dann geht es
          // rekursiv weiter, bis max_depth.
          if (kind.children && kind.children.length) {
            box.appendChild(unterauftraegeNode(kind.children));
          }
          details.appendChild(box);
        }).catch(function () { /* Kind noch nicht geschrieben — egal */ });
      });
    });
    return details;
  }

  function frageNode(daten) {
    var frage = daten.confirmation;
    var box = document.createElement('div');
    box.className = 'frage';

    var kopf = document.createElement('div');
    kopf.className = 'frage-kopf';
    kopf.textContent = 'JARVIS möchte ' + frage.tool + ' ausführen';
    var stufe = document.createElement('span');
    stufe.className = 'frage-stufe';
    stufe.textContent = frage.permission;
    kopf.appendChild(stufe);
    box.appendChild(kopf);

    // Exakt das, was passieren würde — textContent, der Inhalt kommt aus
    // einem Modell.
    var pre = document.createElement('pre');
    pre.textContent = frage.preview;
    box.appendChild(pre);

    var knoepfe = document.createElement('div');
    knoepfe.className = 'frage-knoepfe';

    function antworte(erlauben) {
      knoepfe.textContent = '';
      var warte = document.createElement('span');
      warte.className = 'frage-hinweis';
      warte.textContent = erlauben ? 'wird ausgeführt…' : 'abgelehnt';
      knoepfe.appendChild(warte);
      api('/api/tasks/' + daten.id + '/confirm', {
        method: 'POST', body: { approve: erlauben }
      }).catch(function (err) { meldung(err.message); });
    }

    var ja = document.createElement('button');
    ja.type = 'button';
    ja.className = 'frage-ja';
    ja.textContent = 'Ausführen';
    ja.addEventListener('click', function () { antworte(true); });

    var nein = document.createElement('button');
    nein.type = 'button';
    nein.className = 'frage-nein';
    nein.textContent = 'Nicht ausführen';
    nein.addEventListener('click', function () { antworte(false); });

    knoepfe.appendChild(ja);
    knoepfe.appendChild(nein);
    box.appendChild(knoepfe);

    var hinweis = document.createElement('p');
    hinweis.className = 'frage-hinweis';
    hinweis.textContent = 'Ohne Antwort passiert nichts. Nach '
      + Math.round((frage.timeout_s || 600) / 60) + ' Minuten wird der Auftrag abgebrochen.';
    box.appendChild(hinweis);

    return box;
  }

  function planNode(daten, onAbbruch) {
    var box = document.createElement('div');
    box.className = 'plan';

    var kopf = document.createElement('div');
    kopf.className = 'plan-kopf';
    var laeuft = daten.status === 'running' || daten.status === 'pending';
    var fertig = daten.steps.filter(function (s) { return s.status === 'done'; }).length;
    kopf.textContent = laeuft
      ? 'Plan läuft — ' + fertig + '/' + daten.steps.length + ' Schritten'
      : 'Plan · ' + daten.status + ' · ' + fertig + '/' + daten.steps.length;

    if (laeuft && onAbbruch) {
      var stop = document.createElement('button');
      stop.type = 'button';
      stop.className = 'plan-abbrechen';
      stop.textContent = 'abbrechen';
      stop.addEventListener('click', onAbbruch);
      kopf.appendChild(stop);
    }
    box.appendChild(kopf);

    daten.steps.forEach(function (schritt) { box.appendChild(schrittNode(schritt)); });

    if (daten.confirmation) box.appendChild(frageNode(daten));
    if (daten.children && daten.children.length) {
      box.appendChild(unterauftraegeNode(daten.children));
    }

    var fuss = document.createElement('div');
    fuss.className = 'plan-fuss';
    var teile = [];
    if (daten.spent_tokens) teile.push(daten.spent_tokens + ' Token');
    if (daten.spent_tool_calls) teile.push(daten.spent_tool_calls + ' Werkzeugaufrufe');
    if (daten.spent_cost_eur) teile.push(daten.spent_cost_eur.toFixed(4) + ' €');
    if (daten.abort_reason) {
      fuss.className += ' is-abbruch';
      teile.unshift('Abgebrochen: ' + daten.abort_reason);
    }
    fuss.textContent = teile.join(' · ');
    if (teile.length) box.appendChild(fuss);

    return box;
  }

  var ENDZUSTAENDE = ['done', 'failed', 'aborted_budget', 'cancelled'];

  function send(text) {
    setBusy(true);
    el.hint.textContent = '';

    if (el.thread.querySelector('.empty')) el.thread.textContent = '';
    el.thread.appendChild(messageNode('user', text));

    var wartend = thinkingNode();
    el.thread.appendChild(wartend);
    scrollDown();

    var started = Date.now();
    var planBox = null;

    var warSprache = sprachModus;
    sprachModus = false;

    api('/api/tasks', { method: 'POST', body: { goal: text, voice: warSprache } })
      .then(function (start) {
        return neuerPlan(start.task_id, wartend, started);
      })
      .catch(function (err) {
        wartend.remove();
        appendError(err.message);
        setBusy(false);
        el.input.focus();
      });

    function neuerPlan(taskId, platzhalter, begonnen) {
      // Kein Timer. Der Server schiebt; geholt wird nur, wenn ein Ereignis
      // sagt, dass es etwas zu holen gibt.
      var abgebrochen = false;
      var fertig = false;
      var laeuft = false;      // eine Abfrage gleichzeitig, sonst ueberholen sie sich
      var nachholen = false;
      var strom = null;

      function abbrechen() {
        abgebrochen = true;
        api('/api/tasks/' + taskId + '/cancel', { method: 'POST' })
          .catch(function (err) { meldung(err.message); });
      }

      function zeichne() {
        if (fertig) return Promise.resolve();
        if (laeuft) { nachholen = true; return Promise.resolve(); }
        laeuft = true;
        return api('/api/tasks/' + taskId).then(function (daten) {
          laeuft = false;
          var neuerKasten = planNode(daten, abgebrochen ? null : abbrechen);
          if (planBox) { planBox.replaceWith(neuerKasten); }
          else { platzhalter.before(neuerKasten); }
          planBox = neuerKasten;

          if (ENDZUSTAENDE.indexOf(daten.status) !== -1) return abschluss(daten);
          if (nachholen) { nachholen = false; return zeichne(); }
        }).catch(function (err) {
          laeuft = false;
          appendError(err.message);
          beenden();
        });
      }

      function abschluss(daten) {
        if (fertig) return;
        beenden();
        platzhalter.remove();
        var antwort = messageNode('assistant', daten.result || 'Kein Ergebnis.');
        if (planBox) planBox.after(antwort); else el.thread.appendChild(antwort);
        scrollDown();

        el.hint.textContent = 'Fertig in ' + ((Date.now() - begonnen) / 1000).toFixed(1)
          + ' s · Vorgang ' + taskId + ' · ' + daten.status;
        // Nur vorlesen, was gesprochen gefragt wurde.
        if (warSprache && daten.result) lieseVor(daten.result);
        if (el.memPanel.classList.contains('is-open')) ladeGedaechtnis();
        setBusy(false);
        el.input.focus();
        return loadHealth();
      }

      function beenden() {
        fertig = true;
        if (strom) { strom.schliessen(); strom = null; }
      }

      strom = ereignisStrom(function (typ, daten) {
        if (fertig) return;
        var gehoertUns = (typ === 'task' && daten.id === taskId)
          || (typ === 'step' && daten.task_id === taskId);
        if (!gehoertUns) return;
        zeichne();
      }, function (err) {
        // Der Strom ist weg. Lieber einmal ehrlich melden als still
        // wieder anfangen zu pollen.
        if (fertig) return;
        beenden();
        appendError(err ? ('Ereignisstrom abgerissen: ' + err.message)
                        : 'Ereignisstrom abgerissen.');
        setBusy(false);
      });

      // Einmal sofort zeichnen: der Auftrag kann schon laufen, bevor der
      // Strom steht. Das ist kein Polling, das passiert genau einmal.
      return zeichne();
    }
  }

  el.form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = el.input.value.trim();
    if (!text || busy) return;
    el.input.value = '';
    autogrow();
    send(text);
  });

  el.input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      el.form.requestSubmit();
    }
  });

  function autogrow() {
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, 200) + 'px';
  }
  el.input.addEventListener('input', autogrow);

  // --- Gedächtnis (Phase 3) ---------------------------------------------

  var fakten = [];

  function faktNode(fakt) {
    var box = document.createElement('div');
    box.className = 'fakt';

    var text = document.createElement('div');
    text.className = 'fakt-text';
    text.textContent = fakt.text;
    box.appendChild(text);

    if (fakt.conflicts_with) {
      var partner = fakten.filter(function (f) { return f.id === fakt.conflicts_with; })[0];
      var warnung = document.createElement('div');
      warnung.className = 'fakt-konflikt';
      warnung.textContent = 'Widerspricht möglicherweise #' + fakt.conflicts_with
        + (partner ? ': ' + partner.text : '')
        + ' — beide stehen noch da. Was gilt, entscheidest du.';
      box.appendChild(warnung);
    }

    var zeile = document.createElement('div');
    zeile.className = 'fakt-zeile';

    var kat = document.createElement('span');
    kat.className = 'fakt-kat';
    kat.textContent = fakt.category;
    zeile.appendChild(kat);

    var wann = document.createElement('span');
    wann.textContent = fakt.created_at.slice(0, 10);
    zeile.appendChild(wann);

    var luecke = document.createElement('span');
    luecke.style.marginLeft = 'auto';
    zeile.appendChild(luecke);

    var bearbeiten = document.createElement('button');
    bearbeiten.type = 'button';
    bearbeiten.className = 'fakt-aktion';
    bearbeiten.textContent = 'bearbeiten';
    bearbeiten.addEventListener('click', function () {
      if (text.isContentEditable) { text.blur(); return; }
      text.contentEditable = 'true';
      text.focus();
      bearbeiten.textContent = 'speichern';
    });
    text.addEventListener('blur', function () {
      if (!text.isContentEditable) return;
      text.contentEditable = 'false';
      bearbeiten.textContent = 'bearbeiten';
      var neu = text.textContent.trim();
      if (!neu || neu === fakt.text) { text.textContent = fakt.text; return; }
      api('/api/memory/' + fakt.id, { method: 'PATCH', body: { text: neu } })
        .then(ladeGedaechtnis)
        .catch(function (err) { text.textContent = fakt.text; meldung(err.message); });
    });
    text.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); text.blur(); }
      if (e.key === 'Escape') { text.textContent = fakt.text; text.blur(); }
    });
    zeile.appendChild(bearbeiten);

    if (fakt.conflicts_with) {
      var loesen = document.createElement('button');
      loesen.type = 'button';
      loesen.className = 'fakt-aktion';
      loesen.textContent = 'Widerspruch erledigt';
      loesen.addEventListener('click', function () {
        api('/api/memory/' + fakt.id, { method: 'PATCH', body: { resolve_conflict: true } })
          .then(ladeGedaechtnis).catch(function (err) { meldung(err.message); });
      });
      zeile.appendChild(loesen);
    }

    var loeschen = document.createElement('button');
    loeschen.type = 'button';
    loeschen.className = 'fakt-aktion is-loeschen';
    loeschen.textContent = 'löschen';
    loeschen.addEventListener('click', function () {
      if (!window.confirm('Diesen Eintrag löschen?\n\n' + fakt.text)) return;
      api('/api/memory/' + fakt.id, { method: 'DELETE' })
        .then(ladeGedaechtnis).catch(function (err) { meldung(err.message); });
    });
    zeile.appendChild(loeschen);

    box.appendChild(zeile);
    return box;
  }

  function meldung(text) { el.hint.textContent = text; }

  function ladeGedaechtnis() {
    return api('/api/memory').then(function (liste) {
      fakten = liste || [];
      el.memListe.textContent = '';
      if (!fakten.length) {
        var leer = document.createElement('p');
        leer.className = 'panel-leer';
        leer.textContent = 'Noch nichts gemerkt. JARVIS merkt sich nur, worum du '
          + 'ihn bittest — nicht den ganzen Chat.';
        el.memListe.appendChild(leer);
        return;

  // --- Sprache (Phase 9) --------------------------------------------------
  //
  // VoiceProvider ist eine Abstraktion mit genau einer Implementierung: der
  // Web Speech API des Browsers. Sie kostet nichts, braucht keinen Key und
  // läuft in Chrome. Ein besserer Anbieter kommt später dahinter — dann
  // ändert sich diese Datei und nichts sonst.
  //
  // Push-to-Talk, kein Wake Word. Dauerhorchen ist ein eigenes, deutlich
  // größeres Problem (Falschauslösungen, Mikrofonrechte, Energieverbrauch)
  // und in dieser Phase ausdrücklich verboten.

  function BrowserVoice() {
    var Erkennung = window.SpeechRecognition || window.webkitSpeechRecognition;
    var synth = window.speechSynthesis || null;
    var laeuft = null;

    return {
      sttVerfuegbar: !!Erkennung,
      ttsVerfuegbar: !!synth,

      hoere: function (sprache, beiErgebnis, beiFehler) {
        if (!Erkennung) { beiFehler('Dieser Browser kann keine Spracherkennung.'); return null; }
        var r = new Erkennung();
        r.lang = sprache;
        // Kein Streaming-STT in dieser Phase: ein Ergebnis, wenn losgelassen wird.
        r.interimResults = false;
        r.continuous = false;
        r.maxAlternatives = 1;
        r.onresult = function (e) {
          var text = '';
          for (var i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
          beiErgebnis(text.trim());
        };
        r.onerror = function (e) {
          beiFehler(e.error === 'not-allowed'
            ? 'Kein Zugriff aufs Mikrofon — im Browser erlauben.'
            : 'Spracherkennung fehlgeschlagen: ' + e.error);
        };
        try { r.start(); } catch (err) { beiFehler(String(err)); return null; }
        return r;
      },

      sprich: function (text, sprache, beiEnde) {
        if (!synth) { if (beiEnde) beiEnde(); return; }
        this.stopp();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = sprache;
        u.onend = function () { laeuft = null; if (beiEnde) beiEnde(); };
        u.onerror = function () { laeuft = null; if (beiEnde) beiEnde(); };
        laeuft = u;
        synth.speak(u);
      },

      stopp: function () {
        if (synth && (synth.speaking || synth.pending)) synth.cancel();
        laeuft = null;
      },

      sprichtGerade: function () { return !!(synth && synth.speaking); }
    };
  }

  var voice = BrowserVoice();
  var SPRACHEN = { DE: 'de-DE', EN: 'en-US' };
  var sprachModus = false;     // war die letzte Eingabe gesprochen?
  var sprache = 'DE';
  var erkennung = null;

  function sprachcodeAktiv() { return SPRACHEN[sprache]; }

  el.sprache.addEventListener('click', function () {
    sprache = sprache === 'DE' ? 'EN' : 'DE';
    el.sprache.textContent = sprache;
    el.sprache.title = 'Erkennung und Ausgabe: ' + sprachcodeAktiv();
  });

  function hoerenStarten() {
    if (busy || erkennung) return;
    // Unterbrechbarkeit: läuft gerade eine Ausgabe, stoppt sie hier.
    voice.stopp();
    el.mic.classList.remove('is-spricht');

    if (!voice.sttVerfuegbar) {
      meldung('Dieser Browser kann keine Spracherkennung. Chrome kann es.');
      return;
    }
    el.mic.classList.add('is-hoert');
    meldung('Ich höre… loslassen zum Senden.');
    erkennung = voice.hoere(sprachcodeAktiv(), function (text) {
      hoerenBeenden();
      if (!text) { meldung('Nichts verstanden.'); return; }
      sprachModus = true;
      el.input.value = '';
      send(text);
    }, function (fehler) {
      hoerenBeenden();
      meldung(fehler);
    });
  }

  function hoerenBeenden() {
    el.mic.classList.remove('is-hoert');
    if (erkennung) { try { erkennung.stop(); } catch (e) { /* schon aus */ } }
    erkennung = null;
  }

  el.mic.addEventListener('mousedown', hoerenStarten);
  el.mic.addEventListener('touchstart', function (e) { e.preventDefault(); hoerenStarten(); });
  ['mouseup', 'mouseleave', 'touchend'].forEach(function (ereignis) {
    el.mic.addEventListener(ereignis, function () {
      if (erkennung) hoerenBeenden();
    });
  });
  // Tastatur: Leertaste oder Enter auf dem Knopf hält ebenfalls.
  el.mic.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); hoerenStarten(); }
  });
  el.mic.addEventListener('keyup', function (e) {
    if (e.key === ' ' || e.key === 'Enter') hoerenBeenden();
  });

  function lieseVor(text) {
    if (!voice.ttsVerfuegbar || !text) return;
    el.mic.classList.add('is-spricht');
    el.mic.setAttribute('aria-label', 'Vorlesen abbrechen');
    voice.sprich(text, sprachcodeAktiv(), function () {

  if (!voice.sttVerfuegbar) {

  }

  // --- Weltansicht (FIX-05 Schritt B) --------------------------------------

  /* Der Globus wohnt in `static/globus.js` - derselben Datei, die auch
     `/weltlage` benutzt. Zwei Kopien waeren zwei Orte fuer jeden Fehler.

     Der ganze Anti-Lag-Trick steckt in zwei Zeilen: der Import passiert
     ERST beim ersten Klick auf "Welt", und beim Verlassen der Ansicht
     wird die Zeichenschleife abgeschaltet (siehe zeigeAnsicht). Wer den
     Tab nie oeffnet, laedt nie 2,0 MB. */
  var globusModul = null;
  var globusLaedt = false;
  /* Ist die Weltansicht GERADE die aktive? Nicht dasselbe wie "der Globus
     ist fertig geladen" - und genau daran hing ein Fehler:

     Wer auf "Welt" klickt und noch waehrend der 2,0 MB zurueck auf "Chat"
     geht, hatte den Renderloop danach dauerhaft im Chat laufen. Die
     Pause-Zeile in zeigeAnsicht() prueft `globusModul`, und das wurde
     frueher erst gesetzt, wenn `starte()` durch war - also nach dem Import
     UND den beiden Geometrie-Abrufen. Bis dahin lief die Schleife schon.
     Gemessen bei 250 kB/s: 114 Schleifendurchlaeufe in 2 Sekunden, waehrend
     der Chat zu sehen war, und die Leertaste blieb beim Globus haengen.
     Deshalb jetzt: `globusModul` sofort nach dem Import, und dieses Flag
     als Wahrheit darueber, was der Nutzer sehen will. */
  var globusGewollt = false;

  // Gibt ein Promise zurueck: das COMMAND CENTER wartet darauf, bevor es
  // das Canvas in Zone 2 haengt.
  function ladeGlobus() {
    globusGewollt = true;
    if (globusModul) { globusModul.weiter(); return Promise.resolve(); }
    if (globusLaedt) return Promise.resolve(); // zweimal klicken laedt nicht zweimal
    globusLaedt = true;

    var ziel = document.getElementById('view-welt');
    var hinweis = document.createElement('div');
    hinweis.className = 'globus-laedt';
    hinweis.textContent = 'Globus wird geladen — 2 MB Three.js, das dauert einen Moment.';
    ziel.appendChild(hinweis);

    // Dynamischer Import aus einem klassischen <script>: erlaubt, und die
    // Import-Map im <head> gilt auch dafuer ('three' loest auf).
    return import('/static/globus.js').then(function (modul) {
      globusModul = modul;                   // ab hier ist pausiere() erreichbar
      var fertig = modul.starte(ziel, TOKEN);
      // `starte()` hat die Schleife im selben Zug schon angeworfen; erst
      // danach laedt es die Grenzen. Wer inzwischen weggeklickt hat, soll
      // sie nicht laufen sehen - und zwar sofort, nicht in zehn Sekunden.
      if (!globusGewollt) modul.pausiere();
      return fertig;
    }).then(function () {
      hinweis.remove();
      if (globusGewollt) globusModul.weiter(); else globusModul.pausiere();
    }).catch(function (err) {
      hinweis.textContent = 'Globus nicht geladen: ' + err.message;
    }).then(function () {
      globusLaedt = false;
    });
  }

  // --- Ansichten (Phase 7) ------------------------------------------------

  var ANSICHTEN = {
    cc:     { tab: 'tab-cc',     el: 'view-cc',     laden: ladeCommandCenter },
    chat:   { tab: 'tab-chat',   el: 'thread',      laden: null },
    tasks:  { tab: 'tab-tasks',  el: 'view-tasks',  laden: ladeTasks },
    tools:  { tab: 'tab-tools',  el: 'view-tools',  laden: ladeWerkzeuge },
    kosten: { tab: 'tab-kosten', el: 'view-kosten', laden: ladeKosten },
    welt:   { tab: 'tab-welt',   el: 'view-welt',   laden: ladeGlobus }
  };
  // FIX-06 Abschnitt 6: das COMMAND CENTER ist die Startansicht. Der Chat
  // bleibt ein eigener Tab.
  var aktiveAnsicht = 'cc';
  // Die Ansicht braucht Platz. Nur sie - der Chat bleibt bei 900 px.
  var WEITE_ANSICHTEN = { cc: true };

  function zeigeAnsicht(name) {
    var vorher = aktiveAnsicht;
    aktiveAnsicht = name;
    Object.keys(ANSICHTEN).forEach(function (k) {
      var a = ANSICHTEN[k];
      document.getElementById(a.tab).setAttribute('aria-selected', k === name ? 'true' : 'false');
      document.getElementById(a.el).classList.toggle('is-active', k === name);
    });
    // Die Eingabe gehört zum Chat, nicht zum Dashboard.
    document.querySelector('.composer-wrap').hidden = name !== 'chat';
    document.querySelector('.app').classList.toggle('is-weit', !!WEITE_ANSICHTEN[name]);
    // Uhr, SSE-Verbindung und das umgehaengte Canvas gehoeren zur Ansicht.
    // Bleiben sie stehen, laeuft ein Timer im Chat weiter und der Globus
    // zeichnet in einen unsichtbaren Behaelter.
    if (vorher === 'cc' && name !== 'cc') ccVerlassen();
    // FIX-05 B-4: Klassen umschalten haelt keinen Renderloop an. Ohne die
    // naechsten Zeilen zeichnet der Globus weiter, waehrend du chattest -
    // und genau das ist das Ruckeln, um das es geht.
    // Das Flag wird IMMER gesetzt, auch wenn das Modul noch laedt: sonst
    // faengt der Globus nach dem Laden im Chat an zu zeichnen.
    if (vorher === 'welt' && name !== 'welt') {
      globusGewollt = false;
      if (globusModul) globusModul.pausiere();
    }
    if (ANSICHTEN[name].laden) ANSICHTEN[name].laden();
  }

  Object.keys(ANSICHTEN).forEach(function (k) {
    document.getElementById(ANSICHTEN[k].tab)
      .addEventListener('click', function () { zeigeAnsicht(k); });

  function karte(titel) {

  // --- Aufträge ---

  function ladeTasks() {
    var ziel = document.getElementById('view-tasks');
    return api('/api/tasks').then(function (liste) {
      ziel.textContent = '';
      var oberste = (liste || []).filter(function (t) { return !t.parent_task_id; });

      oberste.forEach(function (t) { ziel.appendChild(taskKarte(t)); });
    }).catch(function (err) { ziel.textContent = ''; ziel.appendChild(leer(err.message)); });

  function taskKarte(t) {
    var box = karte(t.goal);

    zeile.className = 'karte-zeile';
    zeile.appendChild(zustandNode(t.status));
    [t.created_at.replace('T', ' ').replace('Z', ''),

     (t.spent_cost_eur || 0).toFixed(4) + ' €'].forEach(function (text) {

    var details = document.createElement('details');

    summary.textContent = 'Schritte, Prompt und Antwort';
    details.appendChild(summary);

    var geladen = false;
    details.addEventListener('toggle', function () {
      if (!details.open || geladen) return;
      geladen = true;
      api('/api/tasks/' + t.id).then(function (voll) {
        details.appendChild(planNode(voll, null));
        voll.steps.forEach(function (schritt) {
          var d = document.createElement('details');

  // --- COMMAND CENTER (FIX-06 Abschnitt 6) --------------------------------

  var ccUhr = null;         // der eine erlaubte Timer

  var ccEl = {};            // Griffe auf die Zonen, damit nur Inhalte tauschen
