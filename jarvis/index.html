           entfernten Knoten ist ein No-op, doppeltes Aufraeumen schadet
           also nicht. */
        platzhalter.remove();
      }

      strom = ereignisStrom(function (typ, daten) {
        if (fertig) return;
        // `tool` kommt, WAEHREND das Werkzeug laeuft. Der Zustand haelt bis
        // zum naechsten Modellzug - laenger waere gelogen.
        if (typ === 'tool') { reaktorWerkzeug = true; reaktorZustand(); }
        if (typ === 'step') { reaktorWerkzeug = false; reaktorZustand(); }
        var gehoertUns = (typ === 'task' && daten.id === taskId)
          || (typ === 'step' && daten.task_id === taskId);
        if (!gehoertUns) return;
        zeichne();
      }, function (err) {
        // Der Strom ist weg - und zwar endgueltig, `ereignisStrom` hat
        // vorher mehrfach neu verbunden (Fund 1). Lieber einmal ehrlich
        // melden als still wieder anfangen zu pollen.
        if (fertig) return;
        beenden();
        appendError(err ? ('Ereignisstrom abgerissen: ' + err.message)
                        : 'Ereignisstrom abgerissen.');
        setBusy(false);
      }, function () {
        // Wiederverbunden. Was waehrend der Luecke passiert ist, hat der
        // Strom nicht nachgeliefert - einmal den echten Stand holen.
        if (fertig) return;
        zeichne();
      });

      // Einmal sofort zeichnen: der Auftrag kann schon laufen, bevor der
      // Strom steht. Das ist kein Polling, das passiert genau einmal.
      return zeichne();
    }
  }

  el.form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = el.input.value.trim();
    if (!text || busy) return;
    el.input.value = '';
    autogrow();
    send(text);
  });

  el.input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      el.form.requestSubmit();
    }
  });

  function autogrow() {
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, 200) + 'px';
  }
  el.input.addEventListener('input', autogrow);

  // --- Gedächtnis (Phase 3) ---------------------------------------------

  var fakten = [];

  function faktNode(fakt) {
    var box = document.createElement('div');
    box.className = 'fakt';

    var text = document.createElement('div');
    text.className = 'fakt-text';
    text.textContent = fakt.text;
    box.appendChild(text);

    if (fakt.conflicts_with) {
      var partner = fakten.filter(function (f) { return f.id === fakt.conflicts_with; })[0];
      var warnung = document.createElement('div');
      warnung.className = 'fakt-konflikt';
      warnung.textContent = 'Widerspricht möglicherweise #' + fakt.conflicts_with
        + (partner ? ': ' + partner.text : '')
        + ' — beide stehen noch da. Was gilt, entscheidest du.';
      box.appendChild(warnung);
    }

    var zeile = document.createElement('div');
    zeile.className = 'fakt-zeile';

    var kat = document.createElement('span');
    kat.className = 'fakt-kat';
    kat.textContent = fakt.category;
    zeile.appendChild(kat);

    var wann = document.createElement('span');
    wann.textContent = datumText(fakt.created_at);
    zeile.appendChild(wann);

    var luecke = document.createElement('span');
    luecke.style.marginLeft = 'auto';
    zeile.appendChild(luecke);

    var bearbeiten = document.createElement('button');
    bearbeiten.type = 'button';
    bearbeiten.className = 'fakt-aktion';
    bearbeiten.textContent = 'bearbeiten';
    bearbeiten.addEventListener('click', function () {
      if (text.isContentEditable) { text.blur(); return; }
      text.contentEditable = 'true';
      text.focus();
      bearbeiten.textContent = 'speichern';
    });
    text.addEventListener('blur', function () {
      if (!text.isContentEditable) return;
      text.contentEditable = 'false';
      bearbeiten.textContent = 'bearbeiten';
      var neu = text.textContent.trim();
      if (!neu || neu === fakt.text) { text.textContent = fakt.text; return; }
      api('/api/memory/' + fakt.id, { method: 'PATCH', body: { text: neu } })
        .then(ladeGedaechtnis)
        .catch(function (err) { text.textContent = fakt.text; meldung(err.message); });
    });
    text.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); text.blur(); }
      if (e.key === 'Escape') { text.textContent = fakt.text; text.blur(); }
    });
    zeile.appendChild(bearbeiten);

    if (fakt.conflicts_with) {
      var loesen = document.createElement('button');
      loesen.type = 'button';
      loesen.className = 'fakt-aktion';
      loesen.textContent = 'Widerspruch erledigt';
      loesen.addEventListener('click', function () {
        api('/api/memory/' + fakt.id, { method: 'PATCH', body: { resolve_conflict: true } })
          .then(ladeGedaechtnis).catch(function (err) { meldung(err.message); });
      });
      zeile.appendChild(loesen);
    }

    var loeschen = document.createElement('button');
    loeschen.type = 'button';
    loeschen.className = 'fakt-aktion is-loeschen';
    loeschen.textContent = 'löschen';
    loeschen.addEventListener('click', function () {
      if (!window.confirm('Diesen Eintrag löschen?\n\n' + fakt.text)) return;
      api('/api/memory/' + fakt.id, { method: 'DELETE' })
        .then(ladeGedaechtnis).catch(function (err) { meldung(err.message); });
    });
    zeile.appendChild(loeschen);

    box.appendChild(zeile);
    return box;
  }

  function meldung(text) { el.hint.textContent = text; }

  function ladeGedaechtnis() {
    return api('/api/memory').then(function (liste) {
      fakten = liste || [];
      el.memListe.textContent = '';
      if (!fakten.length) {
        var leer = document.createElement('p');
        leer.className = 'panel-leer';
        leer.textContent = 'Noch nichts gemerkt. JARVIS merkt sich nur, worum du '
          + 'ihn bittest — nicht den ganzen Chat.';
        el.memListe.appendChild(leer);
        return;
      }
      fakten.forEach(function (f, i) {
        var node = faktNode(f);
        node.style.animationDelay = Math.min(i, 8) * 40 + 'ms';
        el.memListe.appendChild(node);
      });
    }).catch(function (err) { meldung('Gedächtnis: ' + err.message); });
  }

  function memoryOffen(offen) {
    el.memPanel.classList.toggle('is-open', offen);
    el.memPanel.setAttribute('aria-hidden', offen ? 'false' : 'true');
    el.memBtn.setAttribute('aria-pressed', offen ? 'true' : 'false');
    if (offen) ladeGedaechtnis();
  }

  el.memBtn.addEventListener('click', function () {
    memoryOffen(!el.memPanel.classList.contains('is-open'));
  });
  el.memZu.addEventListener('click', function () { memoryOffen(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') memoryOffen(false);
  });

  el.memForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = el.memNeu.value.trim();
    if (!text) return;
    el.memNeu.value = '';
    api('/api/memory', { method: 'POST', body: { text: text } })
      .then(function (d) {
        if (d && d.conflict) {
          meldung('Achtung: widerspricht möglicherweise "' + d.conflict.text + '"');
        }
        return ladeGedaechtnis();
      })
      .catch(function (err) { meldung(err.message); });
  });

  // --- Sprache (Phase 9) --------------------------------------------------
  //
  // VoiceProvider ist eine Abstraktion mit genau einer Implementierung: der
  // Web Speech API des Browsers. Sie kostet nichts, braucht keinen Key und
  // läuft in Chrome. Ein besserer Anbieter kommt später dahinter — dann
  // ändert sich diese Datei und nichts sonst.
  //
  // Push-to-Talk, kein Wake Word. Dauerhorchen ist ein eigenes, deutlich
  // größeres Problem (Falschauslösungen, Mikrofonrechte, Energieverbrauch)
  // und in dieser Phase ausdrücklich verboten.

  function BrowserVoice() {
    var Erkennung = window.SpeechRecognition || window.webkitSpeechRecognition;
    var synth = window.speechSynthesis || null;
    var laeuft = null;

    return {
      sttVerfuegbar: !!Erkennung,
      ttsVerfuegbar: !!synth,

      hoere: function (sprache, beiErgebnis, beiFehler) {
        if (!Erkennung) { beiFehler('Dieser Browser kann keine Spracherkennung.'); return null; }
        var r = new Erkennung();
        r.lang = sprache;
        // Kein Streaming-STT in dieser Phase: ein Ergebnis, wenn losgelassen wird.
        r.interimResults = false;
        r.continuous = false;
        r.maxAlternatives = 1;
        r.onresult = function (e) {
          var text = '';
          for (var i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
          beiErgebnis(text.trim());
        };
        r.onerror = function (e) {
          beiFehler(e.error === 'not-allowed'
            ? 'Kein Zugriff aufs Mikrofon — im Browser erlauben.'
            : 'Spracherkennung fehlgeschlagen: ' + e.error);
        };
        try { r.start(); } catch (err) { beiFehler(String(err)); return null; }
        return r;
      },

      sprich: function (text, sprache, beiEnde) {
        if (!synth) { if (beiEnde) beiEnde(); return; }
        this.stopp();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = sprache;
        u.onend = function () { laeuft = null; if (beiEnde) beiEnde(); };
        u.onerror = function () { laeuft = null; if (beiEnde) beiEnde(); };
        laeuft = u;
        synth.speak(u);
      },

      stopp: function () {
        if (synth && (synth.speaking || synth.pending)) synth.cancel();
        laeuft = null;
      },

      sprichtGerade: function () { return !!(synth && synth.speaking); }
    };
  }

  var voice = BrowserVoice();
  var SPRACHEN = { DE: 'de-DE', EN: 'en-US' };
  var sprachModus = false;     // war die letzte Eingabe gesprochen?
  var sprache = 'DE';
  var erkennung = null;

  function sprachcodeAktiv() { return SPRACHEN[sprache]; }

  el.sprache.addEventListener('click', function () {
    sprache = sprache === 'DE' ? 'EN' : 'DE';
    el.sprache.textContent = sprache;
    el.sprache.title = 'Erkennung und Ausgabe: ' + sprachcodeAktiv();
  });

  function hoerenStarten() {
    if (busy || erkennung) return;
    // Unterbrechbarkeit: läuft gerade eine Ausgabe, stoppt sie hier.
    voice.stopp();
    el.mic.classList.remove('is-spricht');

    if (!voice.sttVerfuegbar) {
      meldung('Dieser Browser kann keine Spracherkennung. Chrome kann es.');
      return;
    }
    el.mic.classList.add('is-hoert');
    meldung('Ich höre… loslassen zum Senden.');
    // `erkennung` wird erst unten gesetzt; der Reaktor braucht den Zustand
    // aber jetzt, sonst haengt er ein ganzes Sprachfenster hinterher.
    setTimeout(reaktorZustand, 0);
    erkennung = voice.hoere(sprachcodeAktiv(), function (text) {
      hoerenBeenden();
      if (!text) { meldung('Nichts verstanden.'); return; }
      sprachModus = true;
      el.input.value = '';
      send(text);
    }, function (fehler) {
      hoerenBeenden();
      meldung(fehler);
    });
  }

  function hoerenBeenden() {
    el.mic.classList.remove('is-hoert');
    if (erkennung) { try { erkennung.stop(); } catch (e) { /* schon aus */ } }
    erkennung = null;
    reaktorZustand();
  }

  el.mic.addEventListener('mousedown', hoerenStarten);
  el.mic.addEventListener('touchstart', function (e) { e.preventDefault(); hoerenStarten(); });
  ['mouseup', 'mouseleave', 'touchend'].forEach(function (ereignis) {
    el.mic.addEventListener(ereignis, function () {
      if (erkennung) hoerenBeenden();
    });
  });
  // Tastatur: Leertaste oder Enter auf dem Knopf hält ebenfalls.
  el.mic.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); hoerenStarten(); }
  });
  el.mic.addEventListener('keyup', function (e) {
    if (e.key === ' ' || e.key === 'Enter') hoerenBeenden();
  });

  /* `speechSynthesis` meldet nicht, wann es fertig ist - es gibt nur
     `speaking`. Also wird nachgesehen, solange gesprochen wird, und danach
     nicht mehr. Ein Timer, der immer laeuft, waere genau das Polling, das
     dieses Projekt sich verboten hat. */
  function reaktorBeobachteSprache() {
    reaktorZustand();
    if (voice.sprichtGerade()) setTimeout(reaktorBeobachteSprache, 250);
  }

  function lieseVor(text) {
    if (!voice.ttsVerfuegbar || !text) return;
    el.mic.classList.add('is-spricht');
    el.mic.setAttribute('aria-label', 'Vorlesen abbrechen');
    reaktorBeobachteSprache();
    voice.sprich(text, sprachcodeAktiv(), function () {
      el.mic.classList.remove('is-spricht');
      el.mic.setAttribute('aria-label', 'Zum Sprechen gedrückt halten');
      reaktorZustand();
    });
  }

  if (!voice.sttVerfuegbar) {
    el.mic.disabled = true;
    el.mic.title = 'Dieser Browser kann keine Spracherkennung (Chrome kann es).';
  }

  // --- Weltansicht (FIX-05 Schritt B) --------------------------------------

  /* Der Globus wohnt in `static/globus.js` - derselben Datei, die auch
     `/weltlage` benutzt. Zwei Kopien waeren zwei Orte fuer jeden Fehler.

     Der ganze Anti-Lag-Trick steckt in zwei Zeilen: der Import passiert
     ERST beim ersten Klick auf "Welt", und beim Verlassen der Ansicht
     wird die Zeichenschleife abgeschaltet (siehe zeigeAnsicht). Wer den
     Tab nie oeffnet, laedt nie 2,0 MB. */
  var globusModul = null;
  var globusLaedt = false;
  /* Ist die Weltansicht GERADE die aktive? Nicht dasselbe wie "der Globus
     ist fertig geladen" - und genau daran hing ein Fehler:

     Wer auf "Welt" klickt und noch waehrend der 2,0 MB zurueck auf "Chat"
     geht, hatte den Renderloop danach dauerhaft im Chat laufen. Die
     Pause-Zeile in zeigeAnsicht() prueft `globusModul`, und das wurde
     frueher erst gesetzt, wenn `starte()` durch war - also nach dem Import
     UND den beiden Geometrie-Abrufen. Bis dahin lief die Schleife schon.
     Gemessen bei 250 kB/s: 114 Schleifendurchlaeufe in 2 Sekunden, waehrend
     der Chat zu sehen war, und die Leertaste blieb beim Globus haengen.
     Deshalb jetzt: `globusModul` sofort nach dem Import, und dieses Flag
     als Wahrheit darueber, was der Nutzer sehen will. */
  var globusGewollt = false;

  // Gibt ein Promise zurueck: das COMMAND CENTER wartet darauf, bevor es
  // das Canvas in Zone 2 haengt.
  function ladeGlobus() {
    globusGewollt = true;
    if (globusModul) { globusModul.weiter(); return Promise.resolve(); }
    if (globusLaedt) return Promise.resolve(); // zweimal klicken laedt nicht zweimal
    globusLaedt = true;

    var ziel = document.getElementById('view-welt');
    var hinweis = document.createElement('div');
    hinweis.className = 'globus-laedt';
    hinweis.textContent = 'Globus wird geladen — 2 MB Three.js, das dauert einen Moment.';
    ziel.appendChild(hinweis);

    // Dynamischer Import aus einem klassischen <script>: erlaubt, und die
    // Import-Map im <head> gilt auch dafuer ('three' loest auf).
    return import('/static/globus.js').then(function (modul) {
      globusModul = modul;                   // ab hier ist pausiere() erreichbar
      // Kein `hoeren` - in index.html gehoert die Leertaste dem Chat,
      // und waehrend des Ladens ist die Weltansicht ueberhaupt nicht im
      // Bild. Erst `weiter()` beim Tabwechsel gibt sie dem Globus.
      var fertig = modul.starte(ziel, TOKEN, { hoeren: false });
      // `starte()` hat die Schleife im selben Zug schon angeworfen; erst
      // danach laedt es die Grenzen. Wer inzwischen weggeklickt hat, soll
      // sie nicht laufen sehen - und zwar sofort, nicht in zehn Sekunden.
      if (!globusGewollt) modul.pausiere();
      return fertig;
    }).then(function () {
      hinweis.remove();
      if (globusGewollt) globusModul.weiter(); else globusModul.pausiere();
    }).catch(function (err) {
      hinweis.textContent = 'Globus nicht geladen: ' + err.message;
    }).then(function () {
      globusLaedt = false;
    });
  }

  // --- Ansichten (Phase 7) ------------------------------------------------

  var ANSICHTEN = {
    cc:     { tab: 'tab-cc',     el: 'view-cc',     laden: ladeCommandCenter },
    chat:   { tab: 'tab-chat',   el: 'thread',      laden: null },
    tasks:  { tab: 'tab-tasks',  el: 'view-tasks',  laden: ladeTasks },
    tools:  { tab: 'tab-tools',  el: 'view-tools',  laden: ladeWerkzeuge },
    kosten: { tab: 'tab-kosten', el: 'view-kosten', laden: ladeKosten },
    welt:   { tab: 'tab-welt',   el: 'view-welt',   laden: ladeGlobus }
  };
  // FIX-06 Abschnitt 6: das COMMAND CENTER ist die Startansicht. Der Chat
  // bleibt ein eigener Tab.
  var aktiveAnsicht = 'cc';
  // Die Ansicht braucht Platz. Nur sie - der Chat bleibt bei 900 px.
  var WEITE_ANSICHTEN = { cc: true };

  function zeigeAnsicht(name) {
    var vorher = aktiveAnsicht;
    aktiveAnsicht = name;
    Object.keys(ANSICHTEN).forEach(function (k) {
      var a = ANSICHTEN[k];
      document.getElementById(a.tab).setAttribute('aria-selected', k === name ? 'true' : 'false');
      document.getElementById(a.el).classList.toggle('is-active', k === name);
    });
    // Die Eingabe gehört zum Chat, nicht zum Dashboard.
    document.querySelector('.composer-wrap').hidden = name !== 'chat';
    document.querySelector('.app').classList.toggle('is-weit', !!WEITE_ANSICHTEN[name]);
    // Uhr, SSE-Verbindung und das umgehaengte Canvas gehoeren zur Ansicht.
    // Bleiben sie stehen, laeuft ein Timer im Chat weiter und der Globus
    // zeichnet in einen unsichtbaren Behaelter.
    if (vorher === 'cc' && name !== 'cc') ccVerlassen();
    if (vorher === 'tasks' && name !== 'tasks') tasksVerlassen();
    // FIX-05 B-4: Klassen umschalten haelt keinen Renderloop an. Ohne die
    // naechsten Zeilen zeichnet der Globus weiter, waehrend du chattest -
    // und genau das ist das Ruckeln, um das es geht.
    // Das Flag wird IMMER gesetzt, auch wenn das Modul noch laedt: sonst
    // faengt der Globus nach dem Laden im Chat an zu zeichnen.
    if (vorher === 'welt' && name !== 'welt') {
      globusGewollt = false;
      if (globusModul) globusModul.pausiere();
    }
    if (ANSICHTEN[name].laden) ANSICHTEN[name].laden();
    // FIX-09: wer den Chat ansieht, hat die Ergebnisse gesehen.
    if (name === 'chat' && vorher !== 'chat') loadHistory().catch(function () {});
  }

  Object.keys(ANSICHTEN).forEach(function (k) {
    document.getElementById(ANSICHTEN[k].tab)
      .addEventListener('click', function () { zeigeAnsicht(k); });
  });

  function karte(titel) {
    var box = document.createElement('div');
    box.className = 'karte';
    if (titel) {
      var h = document.createElement('h3');
      h.textContent = titel;
      box.appendChild(h);
    }
    return box;
  }

  function zustandNode(status) {
    var s = document.createElement('span');
    s.className = 'zustand is-' + status;
    s.textContent = status;
    return s;
  }

  function tabelle(spalten, zeilen) {
    var wrap = document.createElement('div');
    wrap.className = 'tabelle-wrap';
    var t = document.createElement('table');
    t.className = 'tabelle';
    var kopf = document.createElement('tr');
    spalten.forEach(function (sp) {
      var th = document.createElement('th');
      if (sp.zahl) th.className = 'zahl';
      th.textContent = sp.titel;
      kopf.appendChild(th);
    });
    t.appendChild(kopf);
    zeilen.forEach(function (zeile) {
      var tr = document.createElement('tr');
      spalten.forEach(function (sp) {
        var td = document.createElement('td');
        if (sp.zahl) td.className = 'zahl';
        td.textContent = sp.wert(zeile);
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    wrap.appendChild(t);
    return wrap;
  }

  function leer(text) {
    var p = document.createElement('p');
    p.className = 'panel-leer';
    p.textContent = text;
    return p;
  }

  // --- Aufträge ---

  // Der Strom der Auftraege-Ansicht: wenn ein Auftrag fertig wird (auch
  // einer, den ein Zeitplan gestartet hat), frischen Liste und Zeitplaene
  // von selbst auf. Vorher blieb "laeuft" stehen, bis man den Tab wechselte
  // (zweite Pruefrunde FIX-08). Wie beim COMMAND CENTER: offen, solange die
  // Ansicht offen ist, sonst geschlossen - kein Polling.
  var tasksStrom = null;
  var zeitplanCtx = null;

  function tasksVerlassen() {
    if (tasksStrom) { tasksStrom.schliessen(); tasksStrom = null; }
    zeitplanCtx = null;
  }

  function ladeTasks() {
    var ziel = document.getElementById('view-tasks');
    ziel.textContent = '';
    ziel.appendChild(zeitplanBlock());
    var liste = document.createElement('div');
    liste.className = 'auftraege';
    ziel.appendChild(liste);
    if (!tasksStrom) {
      tasksStrom = ereignisStrom(function (typ, daten) {
        if (typ !== 'task' || !daten.final) return;
        ladeAuftraege();
        if (zeitplanCtx) ladeZeitplaene(zeitplanCtx);
      }, function () {
        tasksStrom = null;          // abgerissen - beim naechsten Oeffnen neu
      }, function () {
        ladeAuftraege();
        if (zeitplanCtx) ladeZeitplaene(zeitplanCtx);
      });
    }
    return ladeAuftraege(liste);
  }

  function ladeAuftraege(liste) {
    liste = liste || document.querySelector('#view-tasks .auftraege');
    if (!liste) return Promise.resolve();
    return api('/api/tasks').then(function (alle) {
      liste.textContent = '';
      var oberste = (alle || []).filter(function (t) { return !t.parent_task_id; });
      if (!oberste.length) { liste.appendChild(leer('Noch kein Auftrag gelaufen.')); return; }
      oberste.forEach(function (t) { liste.appendChild(taskKarte(t)); });
    }).catch(function (err) { liste.textContent = ''; liste.appendChild(leer(err.message)); });
  }

  // --- Zeitpläne (FIX-08) -------------------------------------------------
  //
  // JARVIS wiederholt eigene Aufträge von selbst. Die Regeln (höchstens
  // LOCAL, ein Deckel über 24 h für alle Pläne zusammen, verpasste Läufe
  // werden nicht nachgeholt) stehen in core/zeitplan.py. Hier wird nur
  // angezeigt, angelegt und geschaltet — alles über textContent.
  //
  // Der Block wird EINMAL gebaut; danach tauscht nur die Liste. Sonst
  // verliert der Nutzer bei jedem Klick Fokus, Scrollposition und das halb
  // ausgefüllte Formular (erste Prüfrunde, Fund 6).

  function zeitplanBlock() {
    var box = karte();
    box.classList.add('zeitplaene');

    var titel = document.createElement('div');
    titel.className = 'zeitplan-titel';
    titel.textContent = 'Zeitpläne';
    box.appendChild(titel);

    var hinweis = document.createElement('p');
    hinweis.className = 'zeitplan-hinweis';
    hinweis.textContent = NAME + ' wiederholt einen Auftrag von selbst. Höchstens lokal '
      + '(keine Mail, kein Termin — niemand ist da, um zu bestätigen), ein Tagesdeckel '
      + 'für alle Pläne zusammen, verpasste Läufe werden nicht nachgeholt.';
    box.appendChild(hinweis);

    var status = document.createElement('p');
    status.className = 'zeitplan-meldung';
    status.setAttribute('role', 'status');
    status.setAttribute('aria-live', 'polite');
    status.hidden = true;
    function sag(text, fehler) {
      status.textContent = text || '';
      status.hidden = !text;
      status.classList.toggle('is-fehler', !!fehler);
    }

    var falte = document.createElement('details');
    falte.className = 'zeitplan-neu';
    var zu = document.createElement('summary');
    zu.textContent = 'Neuen Zeitplan anlegen';
    falte.appendChild(zu);

    var form = document.createElement('form');
    form.className = 'zeitplan-form';
    var felder = {};
    [['name', 'Name des Zeitplans', 'Name, z. B. Morgenlage', 80],
     ['regel', 'Regel', 'taeglich 07:00 · alle 6 stunden · einmal 2026-09-06 18:00', 40],
     ['ziel', 'Auftrag', 'Was JARVIS jedes Mal tun soll', 10000]].forEach(function (f) {
      var input = document.createElement('input');
      input.name = f[0];
      input.setAttribute('aria-label', f[1]);
      input.placeholder = f[2];
      input.maxLength = f[3];
      input.required = true;
      input.autocomplete = 'off';
      if (f[0] === 'ziel') input.className = 'is-breit';
      felder[f[0]] = input;
      form.appendChild(input);
    });
    var knopf = document.createElement('button');
    knopf.type = 'submit';
    knopf.textContent = 'Zeitplan anlegen';
    form.appendChild(knopf);
    // FIX-09: eine Vorlage, die nur aus Bausteinen besteht, die wirklich
    // eingerichtet sind - der Server weiss, was fehlt.
    var vorlage = document.createElement('button');
    vorlage.type = 'button';
    vorlage.className = 'zeitplan-knopf';
    vorlage.textContent = 'Vorlage: Morgenlage';
    vorlage.addEventListener('click', function () {
      vorlage.disabled = true;
      api('/api/zeitplaene/vorlagen').then(function (liste) {
        var v = (liste || [])[0];
        if (!v) { sag('Keine Vorlage verfügbar.', true); return; }
        felder.name.value = v.name;
        felder.regel.value = v.regel;
        felder.ziel.value = v.ziel;
        falte.open = true;
        sag('Vorlage eingesetzt. ' + (v.hinweis || '') + ' Prüfen, dann „Zeitplan anlegen“.');
        felder.ziel.focus();
      }).catch(function (err) { sag(err.message, true); })
        .then(function () { vorlage.disabled = false; });
    });
    form.appendChild(vorlage);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (knopf.disabled) return;
      var body = {
        name: felder.name.value.trim(),
        regel: felder.regel.value.trim(),
        ziel: felder.ziel.value.trim()
      };
      if (!body.name || !body.regel || !body.ziel) { sag('Name, Regel und Auftrag brauchen alle drei einen Inhalt.', true); return; }
      knopf.disabled = true;
      api('/api/zeitplaene', { method: 'POST', body: body })
        .then(function (p) {
          form.reset();
          sag('Zeitplan „' + p.name + '“ angelegt, ' + p.regel + '.');
          return ladeZeitplaene(ctx);
        })
        .catch(function (err) { sag(err.message, true); })
        .then(function () { knopf.disabled = false; });
    });
    falte.appendChild(form);
    box.appendChild(falte);
    box.appendChild(status);

    var liste = document.createElement('div');
    liste.className = 'zeitplan-liste';
    box.appendChild(liste);

    var ctx = { liste: liste, sag: sag, falte: falte, deckel: null, gesperrt: null, erstesMal: true };
    zeitplanCtx = ctx;
    ladeZeitplaene(ctx);
    return box;
  }

  function ladeZeitplaene(ctx) {
    var liste = ctx.liste;
    return api('/api/zeitplaene').then(function (d) {
      liste.textContent = '';
      ctx.deckel = d.deckel || null;
      ctx.gesperrt = d.gesperrt || null;
      var v = d.verbrauch || {};
      var zeile = document.createElement('div');
      zeile.className = 'karte-zeile';
      ['Letzte 24 h: ' + v.laeufe + ' von ' + v.max_laeufe + ' Läufen, '
         + ccZahl(v.token) + ' von ' + ccZahl(v.max_token) + ' Token',
       'höchstens lokal',
       d.schleife ? 'läuft von selbst' : 'nur von Hand (Schleife aus)'
      ].forEach(function (text) {
        var s = document.createElement('span');
        s.textContent = text;
        zeile.appendChild(s);
      });
      liste.appendChild(zeile);
      if (d.deckel) {
        var warn = document.createElement('p');
        warn.className = 'zeitplan-deckel';
        warn.textContent = d.deckel;
        liste.appendChild(warn);
      } else if (d.laeuft_gerade && d.laeuft_gerade.length) {
        // Kein Deckel, aber ein Lauf: Zeitplaene laufen nacheinander.
        var lauf = document.createElement('p');
        lauf.className = 'zeitplan-hinweis';
        lauf.textContent = 'Ein Zeitplan läuft gerade (Auftrag ' + d.laeuft_gerade[0].task_id
          + ', bis zu ' + ccZahl(d.laeuft_gerade[0].reserviert) + ' Token). '
          + 'Bis er fertig ist, startet kein zweiter.';
        liste.appendChild(lauf);
      }
      var plaene = d.zeitplaene || [];
      // Beim ersten Laden: ohne Pläne ist das Formular offen, sonst zu.
      if (ctx.erstesMal) { ctx.falte.open = !plaene.length; ctx.erstesMal = false; }
      if (!plaene.length) { liste.appendChild(leer('Noch kein Zeitplan.')); return; }
      plaene.forEach(function (p) { liste.appendChild(zeitplanNode(p, ctx)); });
    }).catch(function (err) { liste.textContent = ''; liste.appendChild(leer(err.message)); });
  }

  function zustandPille(text, klasse) {
    var s = document.createElement('span');
    s.className = 'zustand' + (klasse ? ' is-' + klasse : '');
    s.textContent = text;
    return s;
  }

  function zeitplanNode(p, ctx) {
    var box = document.createElement('div');
    box.className = 'zeitplan' + (p.aktiv ? '' : ' is-aus');

    var kopf = document.createElement('div');
    kopf.className = 'zeitplan-kopf';
    var name = document.createElement('strong');
    name.textContent = p.name;
    kopf.appendChild(name);
    kopf.appendChild(zustandPille(p.aktiv ? 'aktiv' : 'aus', ''));
    if ((p.regel || '').indexOf('einmal ') === 0) kopf.appendChild(zustandPille('einmalig', ''));
    var regel = document.createElement('span');
    regel.className = 'zeitplan-regel';
    regel.textContent = p.regel;
    kopf.appendChild(regel);
    box.appendChild(kopf);

    var ziel = document.createElement('p');
    ziel.className = 'zeitplan-ziel';
    ziel.textContent = p.ziel;
    box.appendChild(ziel);

    var zeile = document.createElement('div');
    zeile.className = 'karte-zeile';
    var infos = [];
    infos.push(p.aktiv && p.naechster_lauf
      ? 'nächster Lauf ' + datumZeitText(p.naechster_lauf) : 'kein nächster Lauf');
    if (p.letzter_lauf) infos.push('zuletzt ' + datumZeitText(p.letzter_lauf));
    if (p.verpasst) infos.push(p.verpasst + '× verpasst, nicht nachgeholt');
    infos.forEach(function (text) {
      var s = document.createElement('span');
      s.textContent = text;
      zeile.appendChild(s);
    });
    // Der letzte Ausgang: kurze Zustände als Pille wie auf den
    // Auftragskarten, ein Grund ("uebersprungen: …") sichtbar in Rot —
    // das ist das eine, was der Nutzer laut Regel 2 sehen soll.
    var st = p.letzter_status || '';
    if (st === 'laeuft') {
      zeile.appendChild(zustandPille('läuft', 'running'));
    } else if (/^[a-z_]+$/.test(st)) {
      zeile.appendChild(zustandPille(st, st));
    } else if (st.indexOf('verpasst') === 0) {
      zeile.appendChild(zustandPille('verpasst', 'verpasst'));
    } else if (st.indexOf('pausiert') === 0) {
      // FIX-09: die Bremse. Der Grund steht dabei, der Weg zurück ist "An".
      zeile.appendChild(zustandPille('pausiert', 'uebersprungen'));
      var warum = document.createElement('span');
      warum.className = 'zeitplan-grund';
      warum.textContent = st;
      zeile.appendChild(warum);
    } else if (st) {
      var ist = st.indexOf('uebersprungen: ') === 0;
      zeile.appendChild(zustandPille(ist ? 'übersprungen' : 'fehlgeschlagen', 'uebersprungen'));
      var grund = document.createElement('span');
      grund.className = 'zeitplan-grund';
      grund.textContent = ist ? st.slice('uebersprungen: '.length) : st;
      zeile.appendChild(grund);
    }
    box.appendChild(zeile);

    var aktionen = document.createElement('div');
    aktionen.className = 'zeitplan-aktionen';
    [['schalten', p.aktiv ? 'Aus' : 'An', function () {
        return api('/api/zeitplaene/' + p.id + '/schalten',
                   { method: 'POST', body: { aktiv: !p.aktiv } });
      }],
     ['jetzt', 'Jetzt', function () {
        return api('/api/zeitplaene/' + p.id + '/jetzt', { method: 'POST' });
      }],
     ['loeschen', 'Löschen', function () {
        if (!window.confirm('Diesen Zeitplan löschen?\n\n' + p.name)) return null;
        return api('/api/zeitplaene/' + p.id, { method: 'DELETE' });
      }]
    ].forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'zeitplan-knopf' + (a[0] === 'loeschen' ? ' is-loeschen' : '');
      b.textContent = a[1];
      b.setAttribute('data-plan', p.id);
      b.setAttribute('data-aktion', a[0]);
      if (a[0] === 'jetzt' && (ctx.deckel || ctx.gesperrt)) {
        b.disabled = true;
        b.title = ctx.deckel || ctx.gesperrt;
      }
      b.addEventListener('click', function () {
        if (b.disabled) return;
        var lauf = a[2]();
        if (!lauf) return;                    // Rückfrage verneint
        b.disabled = true;                    // kein Doppelklick
        lauf.then(function (d) {
          if (d && d.task_id) ctx.sag('Zeitplan „' + p.name + '“ läuft jetzt (Auftrag ' + d.task_id + ').');
          else if (d && d.geloescht) ctx.sag('Zeitplan „' + p.name + '“ gelöscht.');
          else ctx.sag('');
          return ladeZeitplaene(ctx);
        }).then(function () {
          // Fokus bleibt, wo er war - der Knopf wurde neu gebaut.
          var wieder = ctx.liste.querySelector('[data-plan="' + p.id + '"][data-aktion="' + a[0] + '"]');
          if (wieder) wieder.focus();
          if (a[0] === 'jetzt') return ladeAuftraege();
        }).catch(function (err) {
          ctx.sag(err.message, true);
          b.disabled = false;
        });
      });
      aktionen.appendChild(b);
    });
    box.appendChild(aktionen);
    return box;
  }

  function taskKarte(t) {
    var box = karte(t.goal);

    var zeile = document.createElement('div');
    zeile.className = 'karte-zeile';
    zeile.appendChild(zustandNode(t.status));
    [datumZeitText(t.created_at),
     t.spent_tokens + ' Token',
     t.spent_tool_calls + ' Werkzeuge',
     (t.spent_cost_eur || 0).toFixed(4) + ' €'].forEach(function (text) {
      var s = document.createElement('span');
      s.textContent = text;
      zeile.appendChild(s);
    });
    box.appendChild(zeile);

    var details = document.createElement('details');
    details.className = 'unter';
    var summary = document.createElement('summary');
    summary.textContent = 'Schritte, Prompt und Antwort';
    details.appendChild(summary);

    var geladen = false;
    details.addEventListener('toggle', function () {
      if (!details.open || geladen) return;
      geladen = true;
      api('/api/tasks/' + t.id).then(function (voll) {
        details.appendChild(planNode(voll, null));
        voll.steps.forEach(function (schritt) {
          var d = document.createElement('details');
          d.className = 'tools';
          var sm = document.createElement('summary');
          sm.textContent = 'Schritt ' + (schritt.index + 1) + ': '
            + schritt.description.split('\n')[0];
          d.appendChild(sm);

          ['Prompt', 'Antwort'].forEach(function (was) {
            var abschnitt = document.createElement('div');
            abschnitt.className = 'tool';
            var kopf = document.createElement('div');
            kopf.className = 'tool-kopf';
            var name = document.createElement('span');
            name.className = 'tool-name';
            name.textContent = was;
            kopf.appendChild(name);
            abschnitt.appendChild(kopf);
            var pre = document.createElement('pre');
            pre.textContent = was === 'Prompt'
              ? (schritt.prompt || '(nicht aufgezeichnet)')
              : ((schritt.result && schritt.result.display) || '(kein Ergebnis)');
            abschnitt.appendChild(pre);
            d.appendChild(abschnitt);
          });

          var aufrufe = (schritt.result && schritt.result.data
                         && schritt.result.data.tool_calls) || [];
          aufrufe.forEach(function (a) {
            d.appendChild(toolNode({
              name: a.name, arguments: a.arguments,
              ok: a.result ? a.result.ok : false,
              display: a.result ? a.result.display : '',
              error: a.result ? a.result.error : null,
              sources: a.result ? a.result.sources : [],
              duration_ms: a.result ? a.result.duration_ms : 0
            }));
          });
          details.appendChild(d);
        });
      }).catch(function (err) { details.appendChild(leer(err.message)); });
    });
    box.appendChild(details);
    return box;
  }

  // --- COMMAND CENTER (FIX-06 Abschnitt 6) --------------------------------
  //
  // Acht Zonen, jede mit einer echten Quelle. Zone 7 haengt an einem
  // Endpunkt, den es vorher nicht gab (`GET /api/stats/verlauf`).
  //
  // Aktualisiert wird ueber den SSE-Strom, der seit Phase 7 da ist - kein
  // `setInterval` auf einen Endpunkt. Die einzige Ausnahme ist die Uhr in
  // Zone 1: einmal pro Sekunde, lokal, ohne Netz.

  var ccStrom = null;       // die SSE-Verbindung, solange die Ansicht offen ist
  var ccUhr = null;         // der eine erlaubte Timer
  var ccGebaut = false;
  var ccEl = {};            // Griffe auf die Zonen, damit nur Inhalte tauschen
  var ccGlobusDrin = false; // liegt das Canvas gerade in Zone 2?
  var ccHolt = false;       // eine Sammelabfrage gleichzeitig

  function ccZone(klassen, titel, rechts) {
    var z = document.createElement('section');
    z.className = 'zone ' + klassen;
    if (titel !== null) {
      var k = document.createElement('div');
      k.className = 'zone-kopf';
      var t = document.createElement('span');
      t.textContent = titel;
      k.appendChild(t);
      if (rechts !== undefined) {
        var r = document.createElement('span');
        r.className = 'zahl-rechts';
        r.textContent = rechts;
        k.appendChild(r);
        z.rechts = r;
      }
      z.appendChild(k);
    }
    var koerper = document.createElement('div');
    koerper.className = 'zone-koerper';
    koerper.style.minHeight = '0';
    koerper.style.flex = '1';
    z.appendChild(koerper);
    z.koerper = koerper;
    return z;
  }

  // 6.3: der leere Zustand ist der Normalfall, nicht der Fehlerfall. Strich
  // plus ein Satz, der sagt, was passieren muss. Keine Nullen als Daten.
  function ccLeer(satz) {
    var p = document.createElement('p');
    p.className = 'zone-leer';
    p.textContent = satz;
    return p;
  }

  function ccSetze(zone, knoten) {
    zone.koerper.textContent = '';
    zone.koerper.appendChild(knoten);
  }

  function ccZahl(n) {
    return (n || 0).toLocaleString('de-DE');
  }

  /* Eine Kennzahl zaehlt EINMAL hoch, beim ersten Erscheinen - danach nie
     wieder. Ein Wert, der bei jeder Aktualisierung neu hochzaehlt, ist kein
     Effekt mehr, sondern Zappeln: der Strom liefert Ereignisse im
     Sekundentakt.

     `--dauer-zahl` ist 600 ms; die Kurve ist easeOutQuart, also schnell
     los und weich aus. Bei `prefers-reduced-motion` steht der Wert sofort
     da - der globale Block in system.css greift nur bei CSS-Animationen,
     eine Schleife in JavaScript muss selbst nachsehen. */
  function ccZaehle(el, ziel) {
    if (el.dataset.gezaehlt) { el.textContent = ccZahl(ziel); return; }
    el.dataset.gezaehlt = '1';
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      el.textContent = ccZahl(ziel);
      return;
    }
    var t0 = performance.now();
    (function schritt(t) {
      var p = Math.min((t - t0) / 600, 1);
      el.textContent = ccZahl(Math.round(ziel * (1 - Math.pow(1 - p, 4))));
      if (p < 1) requestAnimationFrame(schritt);
    })(t0);
  }

  function baueCommandCenter() {
    var ziel = document.getElementById('view-cc');
    ziel.textContent = '';
    var raster = document.createElement('div');
    raster.className = 'zonen cc';

    // Zone 1 - Kopf, Uhr, Anbieter/Modell. Quelle: GET /api/health + lokale Uhr
    var z1 = document.createElement('section');
    z1.className = 'zone z12 cc-kopf zone-rein';
    var marke = document.createElement('span');
    marke.className = 'cc-marke';
    // Kein innerHTML - auch nicht fuer zwei Schraegstriche. Die Regel gilt
    // ohne Ausnahme (tests/test_api.py::test_seite_setzt_niemals_innerhtml),
    // und eine Ausnahme "nur diesmal" ist genau die, die spaeter jemand
    // kopiert und mit einer Modellantwort fuellt.
    marke.appendChild(document.createTextNode(NAME + ' '));
    var strich = document.createElement('b');
    strich.textContent = '//';
    marke.appendChild(strich);
    marke.appendChild(document.createTextNode(' COMMAND CENTER'));
    var anbieter = document.createElement('span');
    anbieter.className = 'cc-anbieter';
    anbieter.textContent = 'verbinde…';
    var uhr = document.createElement('span');
    uhr.className = 'cc-uhr';
    z1.appendChild(marke);
    z1.appendChild(anbieter);
    z1.appendChild(uhr);
    ccEl.anbieter = anbieter;
    ccEl.uhr = uhr;
    raster.appendChild(z1);

    // Zone 2 - Mini-Globus. Dieselbe Szene wie die Weltansicht, dasselbe
    // Canvas: es wird umgehaengt, nicht kopiert. Ein zweiter WebGL-Kontext
    // ist im Auftrag ausdruecklich verboten, und Browser verwerfen den
    // aelteren ohne Vorwarnung.
    var z2 = ccZone('z3 cc-globus zone-rein', 'GLOBUS');
    z2.koerper.className = 'cc-globus-platz';
    ccEl.globus = z2;
    raster.appendChild(z2);

    // Zone 3 - laufende Auftraege. Quelle: GET /api/tasks (+ Detail je Auftrag)
    ccEl.auftraege = ccZone('z4 zone-rein', 'AUFTRÄGE', '');
    raster.appendChild(ccEl.auftraege);

    // Zone 4 - Ereignisstrom. Quelle: SSE aus api/events.py
    ccEl.strom = ccZone('z5 zone-rein', 'EREIGNISSE');
    ccEl.strom.koerper.className = 'cc-strom';
    ccSetze(ccEl.strom, ccLeer('Der Strom ist offen. Hier steht, was passiert, sobald etwas passiert.'));
    raster.appendChild(ccEl.strom);

    // Zone 5 - vier Kennzahlen. Quelle: GET /api/stats
    var z5 = document.createElement('section');
    z5.className = 'zone z12 z-kennzahlen zone-rein';
    var kz = document.createElement('div');
    kz.className = 'cc-kennzahlen';
    ccEl.kennzahl = {};
    [['calls', 'Modellaufrufe'], ['tokens', 'Token'], ['kosten', 'Kosten'],
     ['tools', 'Werkzeugaufrufe']].forEach(function (paar) {
      var k = document.createElement('div');
      k.className = 'cc-kennzahl';
      var w = document.createElement('span');
      w.className = 'wert';
      w.textContent = '—';
      var n = document.createElement('span');
      n.className = 'name';
      n.textContent = paar[1];
      var f = document.createElement('span');
      f.className = 'fussnote';
      k.appendChild(n); k.appendChild(w); k.appendChild(f);
      kz.appendChild(k);
      ccEl.kennzahl[paar[0]] = { wert: w, fussnote: f };
    });
    z5.appendChild(kz);
    raster.appendChild(z5);

    // Zone 6 - Werkzeuge zuletzt. Quelle: GET /api/tool-calls
    ccEl.werkzeuge = ccZone('z6 zone-rein', 'WERKZEUGE ZULETZT');
    raster.appendChild(ccEl.werkzeuge);

    // Zone 7 - Token-Verlauf. Quelle: GET /api/stats/verlauf
    ccEl.verlauf = ccZone('z6 zone-rein', 'TOKEN-VERLAUF · RELATIV, KEINE ABSOLUTWERTE', '');
    ccEl.verlauf.koerper.className = 'cc-diagramm';
    raster.appendChild(ccEl.verlauf);

    // Zone 8 - Meldungen weltweit. Quelle: GET /api/weltlage/WELT
    ccEl.meldungen = ccZone('z12 zone-rein', 'MELDUNGEN WELTWEIT');
    raster.appendChild(ccEl.meldungen);

    ziel.appendChild(raster);
    ccGebaut = true;
  }

  // --- Zone 1: die Uhr. Der einzige Timer in dieser Ansicht. ---------------

  function ccUhrTick() {
    if (!ccEl.uhr) return;
    var d = new Date();
    function zwei(n) { return n < 10 ? '0' + n : String(n); }
    ccEl.uhr.textContent = zwei(d.getHours()) + ':' + zwei(d.getMinutes())
      + ':' + zwei(d.getSeconds());
    var s = document.createElement('small');
    s.textContent = d.toLocaleDateString('de-DE',
      { weekday: 'short', day: '2-digit', month: '2-digit' });
    ccEl.uhr.appendChild(s);
  }

  // --- Zone 3 ---------------------------------------------------------------

  function ccZeichneAuftraege(liste) {
    var laufend = (liste || []).filter(function (t) {
      return !t.parent_task_id && (t.status === 'running' || t.status === 'pending');
    });
    ccEl.auftraege.rechts.textContent = laufend.length
      ? laufend.length + ' laufend' : '';
    if (!laufend.length) {
      ccSetze(ccEl.auftraege, ccLeer('Kein Auftrag läuft. Stell im Chat eine Frage.'));
      return;
    }
    ccEl.auftraege.koerper.textContent = '';
    laufend.slice(0, 4).forEach(function (t) {
      var box = document.createElement('div');
      box.className = 'cc-auftrag';
      var ziel = document.createElement('div');
      ziel.className = 'cc-auftrag-ziel';
      ziel.textContent = t.goal;
      var zeile = document.createElement('div');
      zeile.className = 'cc-auftrag-zeile';
      var schritte = document.createElement('span');
      schritte.textContent = '…';
      var kosten = document.createElement('span');
      kosten.textContent = ccZahl(t.spent_tokens) + ' Token';
      zeile.appendChild(schritte);
      zeile.appendChild(kosten);
      var balken = document.createElement('div');
      balken.className = 'cc-balken';
      var fuell = document.createElement('i');
      fuell.style.transform = 'scaleX(0)';
      balken.appendChild(fuell);
      box.appendChild(ziel); box.appendChild(zeile); box.appendChild(balken);
      ccEl.auftraege.koerper.appendChild(box);

      // `GET /api/tasks` liefert keine Schritte (in FIX-06 Abschnitt 5
      // nachgemessen und dort vermerkt). Fuer n/m muss das Detail her -
      // aber nur fuer die wenigen laufenden, und nur auf ein Ereignis hin.
      api('/api/tasks/' + t.id).then(function (d) {
        var alle = d.steps || [];
        var fertig = alle.filter(function (x) { return x.status === 'done'; }).length;
        if (!alle.length) { schritte.textContent = 'Plan wird gebaut'; return; }
        schritte.textContent = 'Schritt ' + Math.min(fertig + 1, alle.length)
          + '/' + alle.length;
        fuell.style.transform = 'scaleX(' + (fertig / alle.length).toFixed(4) + ')';
      }).catch(function () { schritte.textContent = ''; });
    });
  }

  // --- Zone 4 ---------------------------------------------------------------

  var CC_STROM_MAX = 40;

  function ccStromZeile(typ, daten) {
    if (!ccEl.strom) return;
    if (ccEl.strom.koerper.querySelector('.zone-leer')) {
      ccEl.strom.koerper.textContent = '';
    }
    var d = new Date();
    function zwei(n) { return n < 10 ? '0' + n : String(n); }
    var zeile = document.createElement('div');
    var t = document.createElement('span');
    t.className = 't';
    t.textContent = zwei(d.getHours()) + ':' + zwei(d.getMinutes())
      + ':' + zwei(d.getSeconds()) + ' ';
    var n = document.createElement('span');
    n.className = 'n';
    n.textContent = typ + ' ';
    var rest = document.createElement('span');
    // textContent, nie innerHTML: `goal` und `name` kommen mittelbar aus
    // einem Modell.
    rest.textContent = ccStromText(typ, daten);
    zeile.appendChild(t);
    zeile.appendChild(n);
    zeile.appendChild(rest);
    ccEl.strom.koerper.appendChild(zeile);
    while (ccEl.strom.koerper.children.length > CC_STROM_MAX) {
      ccEl.strom.koerper.removeChild(ccEl.strom.koerper.firstChild);
    }
    ccEl.strom.koerper.scrollTop = ccEl.strom.koerper.scrollHeight;
  }

  function ccStromText(typ, d) {
    if (typ === 'task') return (d.status || '') + ' · ' + (d.goal || d.id || '');
    if (typ === 'step') return '#' + (d.index + 1) + ' ' + (d.status || '')
      + ' · ' + (d.description || '');
    if (typ === 'tool') return (d.name || '') + ' · ' + (d.ok ? 'ok' : 'fehlgeschlagen')
      + ' · ' + (d.duration_ms == null ? '—' : d.duration_ms + ' ms');
    if (typ === 'confirmation') return 'Rückfrage: ' + (d.tool || '');
    if (typ === 'hello') return (d.listeners || 1) + ' Zuhörer';
    /* Verknuepfungspruefung 31.08.2026, Fund 3.
       WAS war falsch: die Aufrufstelle im Strom-Rueckruf baut
       `{ status: 'abgerissen: ' + err.message }` und uebergibt es mit dem
       Typ 'strom' - hier fiel das auf `return ''` durch. Dasselbe galt fuer
       'dropped', das der Server bei vollem Puffer wirklich sendet
       (api/events.py, EventBus._verdraengen).
       WARUM ist das falsch: im Ereignisprotokoll stand nach einem Abriss
       nur "HH:MM:SS strom" ohne jede Erklaerung, ein Ereignisverlust als
       nacktes "dropped". Der Grund, warum das Dashboard gerade eingefroren
       ist, wurde formuliert und dann verworfen. */
    if (typ === 'strom') return d.status || '';
    if (typ === 'dropped') return 'Ereignisse verworfen — Puffer war voll';
    return '';
  }

  // --- Zone 5 ---------------------------------------------------------------

  function ccZeichneKennzahlen(st) {
    var g = st.total || {};
    var token = (g.in_tokens || 0) + (g.out_tokens || 0);
    var werkzeuge = (st.per_tool || []).reduce(function (a, r) { return a + (r.calls || 0); }, 0);

    // 6.3: bei einer frischen Datenbank steht hier ein Strich, keine Null.
    // Eine Null sieht aus wie eine Messung; sie ist hier aber nur die
    // Abwesenheit einer. Sobald ein Aufruf gelaufen ist, stehen die echten
    // Zahlen da - auch wenn eine davon dann wirklich 0 ist.
    var gabEs = (g.calls || 0) > 0;
    if (gabEs) ccZaehle(ccEl.kennzahl.calls.wert, g.calls);
    else ccEl.kennzahl.calls.wert.textContent = '—';
    ccEl.kennzahl.calls.wert.classList.toggle('ist-leer', !gabEs);
    ccEl.kennzahl.tokens.wert.classList.toggle('ist-leer', !gabEs);
    ccEl.kennzahl.tools.wert.classList.toggle('ist-leer', !werkzeuge);
    // Die Kosten bekommen KEIN `ist-leer`: `0,0000 €` ist eine Messung,
    // kein fehlender Wert. Genau das ist DoD 5 aus Abschnitt 6.
    // Weggenommen wird die Klasse hier trotzdem: `ccKennzahlenFehler`
    // (Fund 6) setzt sie auf allen vier Kacheln, und was ein Fehlerpfad
    // setzt, muss der Erfolgspfad wieder abraeumen - sonst bliebe die
    // Kachel nach einem einzigen Aussetzer fuer immer grau.
    ccEl.kennzahl.kosten.wert.classList.remove('ist-leer');
    ccEl.kennzahl.calls.fussnote.textContent = !gabEs
      ? 'Noch kein Modellaufruf gelaufen.'
      : ((g.fehler || 0) ? (g.fehler + ' fehlgeschlagen') : '');
    if (gabEs) ccZaehle(ccEl.kennzahl.tokens.wert, token);
    else ccEl.kennzahl.tokens.wert.textContent = '—';
    ccEl.kennzahl.tokens.fussnote.textContent = gabEs
      ? (ccZahl(g.in_tokens) + ' rein · ' + ccZahl(g.out_tokens) + ' raus')
      : 'Zählt mit, sobald ein Modell antwortet.';
    if (werkzeuge) ccZaehle(ccEl.kennzahl.tools.wert, werkzeuge);
    else ccEl.kennzahl.tools.wert.textContent = '—';
    ccEl.kennzahl.tools.fussnote.textContent = werkzeuge
      ? (st.per_tool.length + ' verschiedene') : 'Noch kein Werkzeug gelaufen.';

    // 6.2: die einzige echte Geldzahl im System. Steht sie auf 0, dann steht
    // sie auf 0 - mit dem Satz daneben, warum. Nichts wird geschaetzt.
    var eur = g.cost_eur || 0;
    ccEl.kennzahl.kosten.wert.textContent =
      eur.toFixed(4).replace('.', ',') + ' €';
    ccEl.kennzahl.kosten.fussnote.textContent = eur === 0
      ? 'Preise nicht in .env eingetragen' : 'aus llm_calls, nicht geschätzt';
  }

  /* Verknuepfungspruefung 31.08.2026, Fund 6.
     WAS war falsch: `ccHole()` startet fuenf Abrufe nebeneinander. Vier
     davon meldeten einen Fehler sichtbar; der fuenfte,
     `api('/api/stats').then(ccZeichneKennzahlen).catch(function () {})`,
     hatte einen leeren Handler.
     WARUM ist das falsch: fiel /api/stats aus, behielten die vier Kacheln,
     was zuletzt drin stand - beim ersten Laden der Aufbauzustand (Wert "—",
     Fussnote leer), nach einem frueheren Erfolg die alten Zahlen ohne jede
     Kennzeichnung. Genau darueber unterscheidet ccZeichneKennzahlen
     peinlich genau zwischen "—" und "0" (6.3 und DoD 5), und der leere
     Fehlerfall machte diese Unterscheidung wieder zunichte: ein Fehler sah
     aus wie "noch nichts gemessen". Daneben standen im selben Raster drei
     Zonen mit sichtbarer Fehlermeldung - der Nutzer schloss daraus, die
     Kennzahlen stimmten.
     Zone 5 ist kein ccZone-Koerper, sondern vier Kacheln; deshalb hier
     Strich plus echte Meldung in der Fussnote statt `ccLeer`. */
  function ccKennzahlenFehler(err) {
    var text = (err && err.message) ? err.message : 'Kennzahlen nicht abrufbar';
    Object.keys(ccEl.kennzahl).forEach(function (k) {
      var kachel = ccEl.kennzahl[k];
      kachel.wert.textContent = '—';
      kachel.wert.classList.add('ist-leer');
      kachel.fussnote.textContent = text;
    });
  }

  // --- Zone 6 ---------------------------------------------------------------

  function ccZeichneWerkzeuge(liste) {
    if (!liste || !liste.length) {
      ccSetze(ccEl.werkzeuge, ccLeer('Noch kein Werkzeug gelaufen.'));
      return;
    }
    var t = document.createElement('table');
    t.className = 'cc-tabelle';
    liste.slice(0, 6).forEach(function (r) {
      var tr = document.createElement('tr');
      // Die 45-ms-Kette aus static/system.css traegt die Staffelung, ohne
      // dass hier eine einzige Zeile CSS dazukommt.
      tr.className = 'zone-rein';
      [['t', zeitText(r.created_at)],
       ['', r.name],
       [r.ok ? 'ok' : 'weg', r.ok ? '✓' : '✕'],
       ['ms', null]].forEach(function (paar) {
        var td = document.createElement('td');
        if (paar[0]) td.className = paar[0];
        if (paar[1] === null) {
          // Zahl und Einheit getrennt: die Einheit ist kleiner und leiser.
          // `== null` und nicht `|| 0`: eine Dauer, die nicht gemessen wurde,
          // ist kein Nullwert.
          if (r.duration_ms == null) {
            td.textContent = '—';
          } else {
            td.appendChild(document.createTextNode(String(r.duration_ms)));
            var e = document.createElement('span');
            e.textContent = ' ms';
            td.appendChild(e);
          }
        } else {
          td.textContent = paar[1];
        }
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    ccSetze(ccEl.werkzeuge, t);
  }

  // --- Zone 7: Flaechendiagramm, von Hand als SVG ---------------------------

  function ccZeichneVerlauf(d) {
    var punkte = d.stunden || [];
    ccEl.verlauf.rechts.textContent = d.fenster_h ? (d.fenster_h + ' h') : '';

    // Eine Flaeche auf der Nulllinie sieht aus wie eine Messung, ist aber
    // keine Aussage. 6.3 verbietet Nullen, die wie Daten aussehen.
    if (!d.summe || !d.summe.tokens) {
      ccSetze(ccEl.verlauf, ccLeer('In den letzten ' + (d.fenster_h || 24)
        + ' Stunden lief kein Modellaufruf.'));
      return;
    }

    var B = 100, H = 30, hoch = d.hoechstwert || 1;
    var schritt = punkte.length > 1 ? B / (punkte.length - 1) : B;
    var weg = [];
    punkte.forEach(function (p, i) {
      var x = (i * schritt).toFixed(2);
      var y = (H - (p.tokens / hoch) * (H - 1)).toFixed(2);
      weg.push((i ? 'L' : 'M') + x + ' ' + y);
    });

    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + B + ' ' + H);
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Token je Stunde, Höchstwert '
      + d.hoechstwert + ' in ' + d.fenster_h + ' Stunden');

    // Ein echter Verlauf statt einer Volltonflaeche: oben am Kurvenzug
    // kraeftig, zur Grundlinie hin auf null. Die Farbe kommt aus dem
    // Akzent-Token, nicht als zweite Kopie des Hexwerts - `getComputedStyle`
    // liest sie zur Laufzeit.
    var akzent = getComputedStyle(document.documentElement)
      .getPropertyValue('--akzent').trim() || '#f0b45c';
    var defs = document.createElementNS(svg.namespaceURI, 'defs');
    var lauf = document.createElementNS(svg.namespaceURI, 'linearGradient');
    lauf.setAttribute('id', 'cc-verlauf');
    lauf.setAttribute('x1', '0'); lauf.setAttribute('y1', '0');
    lauf.setAttribute('x2', '0'); lauf.setAttribute('y2', '1');
    [[0, '0.34'], [1, '0']].forEach(function (paar) {
      var stop = document.createElementNS(svg.namespaceURI, 'stop');
      stop.setAttribute('offset', String(paar[0]));
      stop.setAttribute('stop-color', akzent);
      stop.setAttribute('stop-opacity', paar[1]);
      lauf.appendChild(stop);
    });
    defs.appendChild(lauf);
    svg.appendChild(defs);

    var flaeche = document.createElementNS(svg.namespaceURI, 'path');
    flaeche.setAttribute('d', weg.join(' ') + ' L' + B + ' ' + H + ' L0 ' + H + ' Z');
    flaeche.setAttribute('fill', 'url(#cc-verlauf)');
    var linie = document.createElementNS(svg.namespaceURI, 'path');
    linie.setAttribute('d', weg.join(' '));
    linie.setAttribute('fill', 'none');
    linie.setAttribute('stroke', 'var(--akzent)');
    linie.setAttribute('stroke-width', '1.6');
    linie.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.appendChild(flaeche);
    svg.appendChild(linie);
    ccSetze(ccEl.verlauf, svg);
  }

  // --- Zone 8 ---------------------------------------------------------------

  function ccZeichneMeldungen(d) {
    var m = (d && d.meldungen) || [];
    if (!m.length) {
      // Kein stiller POST: der kostet einen Modellaufruf und Geld.
      ccSetze(ccEl.meldungen, ccLeer(
        'Keine Weltmeldungen im Zwischenspeicher. Sie entstehen, wenn du in '
        + 'der Weltansicht ein Land auswählst — das kostet einen Modellaufruf.'));
      return;
    }
    var gitter = document.createElement('div');
    gitter.className = 'cc-meldungen';
    m.slice(0, 3).forEach(function (x) {
      var karte = document.createElement('article');
      karte.className = 'cc-meldung';
      if (x.bild_url) {
        var bild = document.createElement('img');
        bild.src = x.bild_url;
        bild.loading = 'lazy';
        bild.alt = x.bild_beschreibung || '';
        karte.appendChild(bild);
      }
      var text = document.createElement('div');
      text.className = 'cc-meldung-text';
      var h = document.createElement('h4');
      h.textContent = x.schlagzeile;
      var p = document.createElement('p');
      // Herkunft ist Pflicht, nicht Deko.
      p.textContent = x.medium + (x.bild_herkunft ? ' · Bild: ' + x.bild_herkunft : '');
      text.appendChild(h); text.appendChild(p);
      karte.appendChild(text);
      gitter.appendChild(karte);
    });
    ccSetze(ccEl.meldungen, gitter);
  }

  // --- Zone 2: das Canvas umhaengen, nicht ein zweites bauen ---------------

  function ccGlobusAnbieten() {
    var platz = ccEl.globus.koerper;
    platz.textContent = '';
    if (globusModul && globusModul.miniAn && globusModul.miniAn(platz)) {
      ccGlobusDrin = true;
      ccGlobusKlickBinden(platz);
      return;
    }
    // Three.js sind 2,0 MB. Die Startansicht laedt die nicht ungefragt -
    // das war der ganze Punkt von FIX-05 B-2.
    var hinweis = document.createElement('p');
    hinweis.className = 'cc-globus-hinweis';
    hinweis.textContent = 'Der Globus wird erst geladen, wenn du ihn brauchst — 2,0 MB.';
    var knopf = document.createElement('button');
    knopf.type = 'button';
    knopf.textContent = 'Globus laden';
    knopf.addEventListener('click', function () {
      hinweis.textContent = 'lädt…';
      knopf.remove();
      ladeGlobus().then(function () {
        if (aktiveAnsicht === 'cc') ccGlobusAnbieten();
      });
    });
    hinweis.appendChild(knopf);
    platz.appendChild(hinweis);
  }

  /* Verknuepfungspruefung 31.08.2026, Fund 7.
     WAS war falsch: `miniAn(platz)` haengt das Canvas samt aller
     Zeiger-Handler in Zone 2 - aber NUR das Canvas. Der Handler
     `zeigerFertig` in static/globus.js ruft bei einem Klick `waehle()`, das
     ueber `ladeLand()` bei ausbleibendem Cache-Treffer
     `POST /api/weltlage/<ISO>` absetzt. Diese Route legt einen echten Task
     an und ruft `fuehre_task_aus` - also Budget, Audit und ein bezahlter
     Modellaufruf. Die Ausgabe dieses Aufrufs (Kopfzeile #land, Landtafel,
     Kartenspalte #karten, Statuszeile #gesagt) bleibt aber in #view-welt,
     und das traegt auf der Startansicht display:none.
     WARUM ist das falsch: gemessen nach einem Klick auf die kleine Kugel
     stand in #land "France" und in #karten der Ergebnistext - beide 0 x 0
     Pixel gross, POST /api/weltlage/FRA war gelaufen. Der Nutzer sah ausser
     der Ringmarkierung nichts. Wer nichts sieht, klickt noch einmal - und
     zahlt noch einmal. STATUS.md verbietet fuer Zone 8 ausdruecklich genau
     das ("Ein automatischer POST waere ein Modellaufruf und Geld, ausgeloest
     vom blossen Oeffnen der Startansicht"); Zone 2 daneben brauchte dafuer
     einen einzigen Klick.
     WIE es jetzt laeuft: ein Klick auf den Mini-Globus fuehrt in die
     Weltansicht. Der teure Pfad laeuft damit nur noch dort, wo seine
     Ausgabe auch zu sehen ist.
     Warum die BLASENPHASE am Elternteil und nicht die Erfassungsphase: der
     Globus-Handler haengt am Canvas selbst und muss VORHER laufen. Er
     rechnet den Klickpunkt ueber die Groesse und Lage des Canvas in einen
     Punkt auf der Kugel um - wuerde hier zuerst umgeschaltet, haette
     `miniAus()` das Canvas mitten im Klick verschoben und der Strahl haette
     das falsche Land getroffen.
     Die 5 Pixel sind keine neue Zahl: es ist ZIEH_SCHWELLE aus
     static/globus.js. Wer dreht, waehlt nichts aus und will auch nicht
     weggeschaltet werden. */
  function ccGlobusKlickBinden(platz) {
    if (platz.dataset.klickGebunden) return;   // Zone 2 wird mehrfach gebaut
    platz.dataset.klickGebunden = '1';
    var startX = 0, startY = 0, hatStart = false;
    platz.addEventListener('pointerdown', function (ev) {
      startX = ev.clientX; startY = ev.clientY; hatStart = true;
    });
    platz.addEventListener('pointerup', function (ev) {
      if (!hatStart) return;
      hatStart = false;
      var weg = Math.sqrt(Math.pow(ev.clientX - startX, 2)
                        + Math.pow(ev.clientY - startY, 2));
      if (weg > 5) return;
      if (aktiveAnsicht !== 'cc') return;
      zeigeAnsicht('welt');
    });
  }

  function ccGlobusZurueck() {
    if (!ccGlobusDrin) return;
    ccGlobusDrin = false;
    if (globusModul && globusModul.miniAus) globusModul.miniAus();
  }

  // --- Sammelabruf. Ausgeloest beim Oeffnen und von Ereignissen. -----------

  function ccHole() {
    if (ccHolt) return Promise.resolve();
    ccHolt = true;
    return Promise.all([
      api('/api/tasks').then(ccZeichneAuftraege).catch(function (e) {
        ccSetze(ccEl.auftraege, ccLeer(e.message)); }),
      api('/api/stats').then(ccZeichneKennzahlen).catch(ccKennzahlenFehler),
      api('/api/tool-calls?limit=20').then(ccZeichneWerkzeuge).catch(function (e) {
        ccSetze(ccEl.werkzeuge, ccLeer(e.message)); }),
      api('/api/stats/verlauf?stunden=24').then(ccZeichneVerlauf).catch(function (e) {
        ccSetze(ccEl.verlauf, ccLeer(e.message)); }),
      api('/api/health').then(function (h) {
        ccEl.anbieter.textContent = (h.provider || '?') + ' · ' + (h.model || '?')
          + (h.api_key_configured ? '' : ' · kein Schlüssel');
      }).catch(function () { ccEl.anbieter.textContent = 'Anbieter unbekannt'; })
    ]).then(function () { ccHolt = false; })
      .catch(function () { ccHolt = false; });
  }

  function ladeCommandCenter() {
    if (!ccGebaut) baueCommandCenter();

    ccUhrTick();
    if (!ccUhr) ccUhr = setInterval(ccUhrTick, 1000);

    ccGlobusAnbieten();

    // Zone 8 einmal beim Oeffnen - Weltmeldungen aendern sich nicht im
    // Sekundentakt und haengen an keinem Ereignis.
    api('/api/weltlage/WELT').then(ccZeichneMeldungen).catch(function (e) {
      ccSetze(ccEl.meldungen, ccLeer(e.message));
    });

    // 6.4: kein Polling. Der Strom sagt, wann es etwas zu holen gibt.
    if (!ccStrom) {
      ccStrom = ereignisStrom(function (typ, daten) {
        ccStromZeile(typ, daten);
        if (typ === 'hello') return;
        ccHole();
      }, function (err) {
        /* Verknuepfungspruefung 31.08.2026, Fund 1: `beiAbbruch` faellt
           erst, wenn auch der letzte Wiederverbindungsversuch gescheitert
           ist. Endet der Strom sauber, ist `err` null - und dann stand hier
           frueher wegen `if (err)` nicht einmal eine Zeile im Protokoll.
           Ein Dashboard, das ohne ein Wort einfriert, ist schlimmer als
           eines, das sagt, dass es eingefroren ist. */
        ccStromZeile('strom', {
          status: err ? ('abgerissen: ' + err.message)
                      : 'abgerissen — Verbindung weg, Anzeige eingefroren'
        });
        ccStrom = null;
      }, function () {
        // Wiederverbunden: die Ereignisse aus der Luecke sind weg, also
        // einmal den echten Stand aller Zonen nachziehen.
        ccStromZeile('strom', { status: 'wieder verbunden' });
        ccHole();
      });
    }
    return ccHole();
  }

  function ccVerlassen() {
    if (ccUhr) { clearInterval(ccUhr); ccUhr = null; }
    if (ccStrom) { ccStrom.schliessen(); ccStrom = null; }
    ccGlobusZurueck();
  }

  // --- Werkzeuge ---

  function ladeWerkzeuge() {
    var ziel = document.getElementById('view-tools');
    return api('/api/tool-calls?limit=200').then(function (liste) {
      ziel.textContent = '';
      if (!liste || !liste.length) { ziel.appendChild(leer('Noch kein Werkzeug gelaufen.')); return; }
      ziel.appendChild(tabelle([
        { titel: 'Zeit', wert: function (r) { return zeitText(r.created_at); } },
        { titel: 'Werkzeug', wert: function (r) { return r.name; } },
        { titel: 'Argumente', wert: function (r) { return argumentText(r.arguments).slice(0, 70); } },
        { titel: 'ok', wert: function (r) { return r.ok ? '✓' : '✕'; } },
        { titel: 'ms', zahl: true, wert: function (r) { return r.duration_ms; } }
      ], liste));
    }).catch(function (err) { ziel.textContent = ''; ziel.appendChild(leer(err.message)); });
  }

  // --- Kosten ---

  function ladeKosten() {
    var ziel = document.getElementById('view-kosten');
    return api('/api/stats').then(function (st) {
      ziel.textContent = '';

      var kpi = document.createElement('dl');
      kpi.className = 'kpi';
      [['Modellaufrufe', st.total.calls],
       ['Token gesamt', (st.total.in_tokens || 0) + (st.total.out_tokens || 0)],
       ['Kosten gesamt', (st.total.cost_eur || 0).toFixed(4) + ' €'],
       ['Fehlerrate', (st.total.fehlerrate * 100).toFixed(1) + ' %']
      ].forEach(function (paar) {
        var d = document.createElement('div');
        var dt = document.createElement('dt'); dt.textContent = paar[0];
        var dd = document.createElement('dd'); dd.textContent = paar[1];
        d.appendChild(dt); d.appendChild(dd); kpi.appendChild(d);
      });
      ziel.appendChild(kpi);

      var proTag = karte('Kosten pro Tag');
      if (st.per_day.length) {
        var max = Math.max.apply(null, st.per_day.map(function (r) { return r.cost_eur || 0; })) || 1;
        proTag.appendChild(tabelle([
          { titel: 'Tag', wert: function (r) { return r.tag; } },
          { titel: 'Aufrufe', zahl: true, wert: function (r) { return r.calls; } },
          { titel: 'Token', zahl: true, wert: function (r) { return (r.in_tokens || 0) + (r.out_tokens || 0); } },
          { titel: 'Fehler', zahl: true, wert: function (r) { return r.fehler || 0; } },
          { titel: '€', zahl: true, wert: function (r) { return (r.cost_eur || 0).toFixed(4); } }
        ], st.per_day));
        st.per_day.slice(0, 1).forEach(function (r) {
          var b = document.createElement('div');
          b.className = 'balken';
          b.style.width = Math.round(((r.cost_eur || 0) / max) * 100) + '%';
          proTag.appendChild(b);
        });
      } else { proTag.appendChild(leer('Noch keine Modellaufrufe.')); }
      ziel.appendChild(proTag);

      var proModell = karte('Verbrauch pro Modell');
      proModell.appendChild(tabelle([
        { titel: 'Modell', wert: function (r) { return r.model; } },
        { titel: 'Aufrufe', zahl: true, wert: function (r) { return r.calls; } },
        { titel: 'rein', zahl: true, wert: function (r) { return r.in_tokens; } },
        { titel: 'raus', zahl: true, wert: function (r) { return r.out_tokens; } },
        { titel: '€', zahl: true, wert: function (r) { return (r.cost_eur || 0).toFixed(4); } }
      ], st.per_model));
      ziel.appendChild(proModell);

      var proWerkzeug = karte('Werkzeuge');
      proWerkzeug.appendChild(tabelle([
        { titel: 'Werkzeug', wert: function (r) { return r.name; } },
        { titel: 'Aufrufe', zahl: true, wert: function (r) { return r.calls; } },
        { titel: 'Fehler', zahl: true, wert: function (r) { return r.fehler || 0; } },
        { titel: 'Ø ms', zahl: true, wert: function (r) { return r.ms || 0; } }
      ], st.per_tool));
      ziel.appendChild(proWerkzeug);

      var aufträge = karte('Aufträge');
      aufträge.appendChild(tabelle([
        { titel: 'gesamt', zahl: true, wert: function (r) { return r.gesamt || 0; } },
        { titel: 'done', zahl: true, wert: function (r) { return r.done || 0; } },
        { titel: 'failed', zahl: true, wert: function (r) { return r.failed || 0; } },
        { titel: 'Budget', zahl: true, wert: function (r) { return r.aborted_budget || 0; } },
        { titel: 'abgebrochen', zahl: true, wert: function (r) { return r.cancelled || 0; } }
      ], [st.tasks]));
      ziel.appendChild(aufträge);
    }).catch(function (err) { ziel.textContent = ''; ziel.appendChild(leer(err.message)); });
  }

  el.hint.textContent = 'Enter senden · Umschalt+Enter neue Zeile';
  showEmpty();
  zeigeAnsicht('cc');
  reaktorZustand();
  loadHealth();
  loadHistory().catch(function (err) { appendError(err.message); });
  zustellungStarten();
})();
</script>
</body>
</html>
