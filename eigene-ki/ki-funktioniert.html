<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0c'/%3E%3Cpath d='M10 22V10l12 12V10' fill='none' stroke='%23f2b35b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0a0c; --side:#121216; --panel:#1a1a20; --hover:#22222a;
  --text:#e8e8ec; --head:#f4f4f7; --dim:#8b8b95;
  --accent:#f2b35b; --accent-soft:rgba(242,179,91,.13);
  --line:rgba(255,255,255,.08);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r:10px; --r-lg:16px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:15px; line-height:1.6; overflow:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(60% 50% at 78% 8%, rgba(242,179,91,.055), transparent 70%),
    radial-gradient(50% 45% at 12% 92%, rgba(120,130,180,.045), transparent 70%);
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
svg{display:block}

/* ---------- Layout ---------- */
.app{position:relative;z-index:1;display:flex;height:100%}

/* ---------- Sidebar ---------- */
.side{
  width:260px; flex:0 0 260px; background:var(--side);
  border-right:1px solid var(--line); display:flex; flex-direction:column;
}
.side-top{padding:var(--s3);border-bottom:1px solid var(--line)}
.newchat{
  display:flex;align-items:center;gap:var(--s2);width:100%;
  padding:var(--s2) var(--s3);border:1px solid var(--line);border-radius:var(--r);
  color:var(--head);transition:background .15s ease-out,border-color .15s ease-out;
}
.newchat:hover{background:var(--hover);border-color:rgba(255,255,255,.14)}
.chats{flex:1;overflow-y:auto;padding:var(--s2)}
.chat-item{
  display:flex;align-items:center;gap:var(--s2);width:100%;
  padding:var(--s2) var(--s3);border-radius:var(--r);text-align:left;
  color:var(--dim);transition:background .15s ease-out,color .15s ease-out;
}
.chat-item:hover{background:var(--hover);color:var(--text)}
.chat-item[aria-current="true"]{background:var(--accent-soft);color:var(--head)}
.chat-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.chat-del{opacity:0;flex:0 0 auto;padding:2px;border-radius:4px;color:var(--dim)}
.chat-item:hover .chat-del,.chat-del:focus-visible{opacity:1}
.chat-del:hover{color:#ff8b8b}
.side-bottom{padding:var(--s3);border-top:1px solid var(--line);display:flex;gap:var(--s2)}
.side-bottom button{
  flex:1;padding:var(--s2);border-radius:var(--r);color:var(--dim);font-size:13px;
  transition:background .15s ease-out,color .15s ease-out;
}
.side-bottom button:hover{background:var(--hover);color:var(--text)}

/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s5);border-bottom:1px solid var(--line);
}
.brand{font-size:15px;font-weight:600;color:var(--head);letter-spacing:.01em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.dot.off{background:#6b6b75}
.spacer{flex:1}
select#model{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:6px var(--s3);font-size:13px;color:var(--text);cursor:pointer;max-width:220px;
}
.icon-btn{padding:var(--s2);border-radius:var(--r);color:var(--dim);transition:background .15s ease-out,color .15s ease-out}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.burger{display:none}

/* ---------- Log ---------- */
.log{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:var(--s6) var(--s5) 150px;
  scroll-behavior:smooth;
}
.col{max-width:760px;margin:0 auto}
.msg{margin-bottom:var(--s8);animation:rise .38s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.who{
  display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);
  font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);
}
.msg.ai .who{color:var(--accent)}
.body{max-width:70ch;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg.me .body{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:var(--s3) var(--s4);
}
.cursor{
  display:inline-block;width:8px;height:1.05em;vertical-align:text-bottom;
  background:var(--accent);margin-left:2px;animation:blink 1.05s steps(2,start) infinite;
}
@keyframes blink{50%{opacity:0}}
.meta{margin-top:var(--s2);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.meta .warn{color:#e8a87c}
.meta .err{color:#ff8b8b}
.loading{color:var(--dim);font-size:14px}

/* ---------- Composer (das einzige Glas) ---------- */
.composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:var(--s4) var(--s5) var(--s5);pointer-events:none}
.composer{
  max-width:760px;margin:0 auto;pointer-events:auto;
  display:flex;align-items:flex-end;gap:var(--s2);
  padding:var(--s2) var(--s2) var(--s2) var(--s4);
  background:rgba(255,255,255,.04);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  backdrop-filter:blur(20px) saturate(150%);
  border:1px solid rgba(255,255,255,.09);
  border-radius:var(--r-lg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 8px 32px rgba(0,0,0,.35);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .composer{background:rgba(22,22,28,.92)}
}
#input{
  flex:1;background:none;border:0;resize:none;outline:none;
  padding:var(--s2) 0;max-height:200px;overflow-y:auto;line-height:1.5;
}
#input::placeholder{color:var(--dim)}
#input:disabled{opacity:.5}
.send{
  flex:0 0 auto;width:36px;height:36px;border-radius:var(--r);
  display:grid;place-items:center;background:var(--accent);color:#0a0a0c;
  transition:opacity .15s ease-out,transform .15s ease-out;
}
.send:hover{opacity:.88}
.send:disabled{opacity:.3;cursor:not-allowed}
.send.stop{background:#3a3a44;color:var(--head)}
.tobottom{
  position:absolute;left:50%;bottom:112px;transform:translateX(-50%);
  display:none;align-items:center;gap:6px;padding:6px var(--s3);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  font-size:13px;color:var(--text);z-index:5;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
}
.tobottom.show{display:flex}

/* ---------- Gate / Startcheck ---------- */
.gate{
  position:absolute;inset:0;z-index:10;display:none;
  place-items:center;padding:var(--s5);background:var(--bg);
}
.gate.show{display:grid}
.gate-card{max-width:560px;width:100%}
.gate h2{font-size:19px;color:var(--head);margin-bottom:var(--s3);font-weight:600}
.gate p{color:var(--dim);margin-bottom:var(--s4);max-width:60ch}
.cmd{
  display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s2) var(--s3);font-family:var(--mono);font-size:13px;
}
.cmd code{flex:1;overflow-x:auto;white-space:nowrap;color:var(--text)}
.cmd button{flex:0 0 auto;color:var(--dim);font-size:12px;padding:2px 6px;border-radius:4px}
.cmd button:hover{color:var(--accent)}
.btn{
  display:inline-flex;align-items:center;gap:var(--s2);margin-top:var(--s3);
  padding:var(--s2) var(--s4);border-radius:var(--r);
  background:var(--accent);color:#0a0a0c;font-weight:600;font-size:14px;
  transition:opacity .15s ease-out;
}
.btn:hover{opacity:.88}
.hint{
  position:absolute;left:50%;top:var(--s3);transform:translateX(-50%);z-index:20;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s2) var(--s4);font-size:13px;color:var(--dim);
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}

/* ---------- Schmal ---------- */
@media (max-width:800px){
  .side{
    position:absolute;z-index:30;top:0;bottom:0;left:0;
    transform:translateX(-100%);transition:transform .25s var(--ease);
  }
  .side.open{transform:none}
  .burger{display:grid;place-items:center}
  .log{padding-left:var(--s4);padding-right:var(--s4)}
  .composer-wrap{padding-left:var(--s3);padding-right:var(--s3)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .log{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="side-top">
      <button class="newchat" id="newchat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Neuer Chat
      </button>
    </div>
    <div class="chats" id="chats"></div>
    <div class="side-bottom">
      <button id="btn-settings">Einstellungen</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="icon-btn burger" id="burger" aria-label="Chats anzeigen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="dot off" id="dot"></span>
      <span class="brand" id="brand">Nox</span>
      <span class="spacer"></span>
      <select id="model" aria-label="Modell wählen"></select>
    </header>

    <div class="log" id="log" role="log" aria-live="polite"><div class="col" id="col"></div></div>

    <button class="tobottom" id="tobottom">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
      Nach unten
    </button>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Nachricht…" aria-label="Nachricht"></textarea>
        <button class="send" id="send" aria-label="Senden">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <div class="gate" id="gate"><div class="gate-card" id="gate-card"></div></div>
  </main>
</div>

<script>
"use strict";

/* ============ Konstanten ============ */
var OLLAMA = "http://127.0.0.1:11434";   // nicht localhost: das kann auf IPv6 auflösen
var KEY = "nox.v1";
var DEFAULT_NAME = "Nox";
var DEFAULT_PROMPT = "Du bist {Name}, eine KI, die lokal auf meinem Rechner läuft. Antworte auf Deutsch, locker, per du, kurz und direkt. Bei Code: vollständig und lauffähig.";
var SCROLL_TOL = 80;

/* ============ Zustand ============ */
var S = {
  chats: [],
  activeId: null,
  models: [],
  model: null,
  settings: { name: DEFAULT_NAME, systemPrompt: DEFAULT_PROMPT },
  stream: null,
  storageOk: true
};

var $ = function (id) { return document.getElementById(id); };
var el = {
  log: $("log"), col: $("col"), input: $("input"), send: $("send"),
  model: $("model"), chats: $("chats"), gate: $("gate"), gateCard: $("gate-card"),
  dot: $("dot"), brand: $("brand"), toBottom: $("tobottom"), side: $("side")
};

/* ============ Speicher (immer try/catch) ============ */
function save() {
  if (!S.storageOk) return;
  try {
    localStorage.setItem(KEY, JSON.stringify({
      chats: S.chats, activeId: S.activeId, model: S.model, settings: S.settings
    }));
  } catch (e) { S.storageOk = false; toast("Speichern geht nicht — Chats bleiben nur bis zum Neuladen."); }
}
function load() {
  var raw = null;
  try { raw = localStorage.getItem(KEY); }
  catch (e) { S.storageOk = false; toast("Kein Zugriff auf den Speicher — läuft nur im Arbeitsspeicher."); return; }
  if (!raw) return;
  try {
    var d = JSON.parse(raw);
    if (d && Array.isArray(d.chats)) S.chats = d.chats;
    if (d && d.activeId) S.activeId = d.activeId;
    if (d && d.model) S.model = d.model;
    if (d && d.settings) {
      if (typeof d.settings.name === "string" && d.settings.name) S.settings.name = d.settings.name;
      if (typeof d.settings.systemPrompt === "string") S.settings.systemPrompt = d.settings.systemPrompt;
    }
  } catch (e) { /* kaputter Eintrag: frisch anfangen, nicht crashen */ }
}
function toast(msg) {
  var t = document.createElement("div");
  t.className = "hint"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 5000);
}

/* ============ Helfer ============ */
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function uid() { return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function activeChat() {
  for (var i = 0; i < S.chats.length; i++) if (S.chats[i].id === S.activeId) return S.chats[i];
  return null;
}

/* ============ Startcheck ============ */
function gate(html) { el.gateCard.innerHTML = html; el.gate.classList.add("show"); }
function ungate() { el.gate.classList.remove("show"); }

function cmdRow(cmd) {
  return '<div class="cmd"><code>' + esc(cmd) + '</code><button type="button" data-cmd="' + esc(cmd) + '">Kopieren</button></div>';
}

function gateFile() {
  gate(
    '<h2>Bitte über einen lokalen Server öffnen</h2>' +
    '<p>Die Seite läuft gerade über <code>file://</code>. Der Browser schickt dann <code>null</code> als Origin, und Ollama lehnt das mit 403 ab. Starte im Ordner dieser Datei einen kleinen Server:</p>' +
    cmdRow("python3 -m http.server 8000 --bind 127.0.0.1") +
    cmdRow("py -m http.server 8000 --bind 127.0.0.1") +
    '<p style="margin-top:16px">Danach öffnen:</p>' +
    cmdRow("http://127.0.0.1:8000/ki.html")
  );
}
function gateOffline(detail) {
  gate(
    '<h2>Ollama läuft nicht</h2>' +
    '<p>Unter <code>' + esc(OLLAMA) + '</code> antwortet nichts.' + (detail ? " (" + esc(detail) + ")" : "") + ' Starte Ollama und versuch es nochmal.</p>' +
    cmdRow("ollama serve") +
    '<button class="btn" id="retry" type="button">Nochmal versuchen</button>'
  );
  $("retry").addEventListener("click", checkOllama);
}
function gateNoModels() {
  gate(
    '<h2>Kein Modell installiert</h2>' +
    '<p>Ollama läuft, hat aber kein Modell. Lade eins, dann neu laden:</p>' +
    cmdRow("ollama pull qwen3:4b") +
    cmdRow("ollama pull llama3.2:3b") +
    '<button class="btn" id="retry" type="button">Nochmal versuchen</button>'
  );
  $("retry").addEventListener("click", checkOllama);
}

function checkOllama() {
  ungate();
  fetch(OLLAMA + "/api/tags", { method: "GET" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (d) {
      var models = (d && Array.isArray(d.models)) ? d.models : [];
      if (!models.length) { setOnline(false); gateNoModels(); return; }
      S.models = models;
      fillModels();
      setOnline(true);
      ungate();
      setInputEnabled(true);
    })
    .catch(function (e) { setOnline(false); gateOffline(e && e.message); setInputEnabled(false); });
}

function setOnline(on) { el.dot.className = on ? "dot" : "dot off"; }

function fillModels() {
  el.model.innerHTML = "";
  var found = false;
  for (var i = 0; i < S.models.length; i++) {
    var m = S.models[i];
    var o = document.createElement("option");
    o.value = m.name;
    var ps = m.details && m.details.parameter_size;
    o.textContent = ps ? (m.name + " · " + ps) : m.name;
    el.model.appendChild(o);
    if (m.name === S.model) found = true;
  }
  if (!found) S.model = S.models[0].name;
  el.model.value = S.model;
  save();
}

function setInputEnabled(on) {
  el.input.disabled = !on;
  el.send.disabled = !on;
  el.input.placeholder = on ? "Nachricht…" : "Kein Modell verfügbar";
}

/* ============ Rendern ============ */
function renderSidebar() {
  el.chats.innerHTML = "";
  for (var i = 0; i < S.chats.length; i++) {
    var c = S.chats[i];
    var b = document.createElement("button");
    b.className = "chat-item";
    b.type = "button";
    b.setAttribute("aria-current", c.id === S.activeId ? "true" : "false");
    b.dataset.id = c.id;
    var sp = document.createElement("span");
    sp.textContent = c.title || "Neuer Chat";
    b.appendChild(sp);
    var d = document.createElement("span");
    d.className = "chat-del";
    d.dataset.del = c.id;
    d.setAttribute("role", "button");
    d.setAttribute("aria-label", "Chat löschen");
    d.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
    b.appendChild(d);
    el.chats.appendChild(b);
  }
}

function renderChat() {
  el.col.innerHTML = "";
  var c = activeChat();
  if (!c) return;
  for (var i = 0; i < c.messages.length; i++) addMsgEl(c.messages[i]);
  scrollToBottom(true);
}

function addMsgEl(m) {
  var wrap = document.createElement("div");
  wrap.className = "msg " + (m.role === "user" ? "me" : "ai");

  var who = document.createElement("div");
  who.className = "who";
  who.textContent = m.role === "user" ? "Du" : S.settings.name;
  wrap.appendChild(who);

  var body = document.createElement("div");
  body.className = "body";
  body.textContent = m.content || "";
  wrap.appendChild(body);

  var meta = document.createElement("div");
  meta.className = "meta";
  wrap.appendChild(meta);
  setMeta(meta, m);

  el.col.appendChild(wrap);
  return { wrap: wrap, body: body, meta: meta };
}

function setMeta(meta, m) {
  if (m.role !== "assistant") { meta.textContent = ""; return; }
  var bits = [];
  if (m.error) { meta.innerHTML = '<span class="err">Fehler: ' + esc(m.error) + "</span>"; return; }
  if (m.model) bits.push(esc(m.model));
  if (m.tps) bits.push(esc(m.tps) + " Tok/s");
  var html = bits.join(" · ");
  if (m.aborted) html += (html ? " · " : "") + '<span class="warn">abgebrochen</span>';
  meta.innerHTML = html;
}

/* ============ Scrollen ============ */
var stick = true;
function nearBottom() {
  return el.log.scrollHeight - el.log.scrollTop - el.log.clientHeight < SCROLL_TOL;
}
el.log.addEventListener("scroll", function () {
  stick = nearBottom();
  el.toBottom.classList.toggle("show", !stick);
});
function scrollToBottom(force) {
  if (!force && !stick) return;
  el.log.scrollTop = el.log.scrollHeight;
  el.toBottom.classList.remove("show");
}
el.toBottom.addEventListener("click", function () { stick = true; scrollToBottom(true); });

/* ============ Senden / Streaming ============ */
function buildMessages(chat) {
  var out = [];
  var sys = S.settings.systemPrompt.replace(/\{Name\}/g, S.settings.name);
  if (sys.trim()) out.push({ role: "system", content: sys });
  for (var i = 0; i < chat.messages.length; i++) {
    var m = chat.messages[i];
    if (m.error) continue;                       // kaputte Antworten nicht weiterreichen
    if (!m.content) continue;
    out.push({ role: m.role, content: m.content });  // nie thinking mitschicken
  }
  return out;
}

function send() {
  if (S.stream) { stop(); return; }
  var text = el.input.value.trim();
  if (!text || !S.model) return;

  var c = activeChat();
  if (!c) { c = newChat(); }

  c.messages.push({ role: "user", content: text });
  if (!c.title) c.title = text.length > 40 ? text.slice(0, 40).trim() + "…" : text;
  addMsgEl(c.messages[c.messages.length - 1]);
  renderSidebar();

  el.input.value = "";
  autoGrow();
  stick = true;
  scrollToBottom(true);

  var msg = { role: "assistant", content: "", thinking: "", model: S.model };
  c.messages.push(msg);
  var nodes = addMsgEl(msg);
  nodes.wrap.setAttribute("aria-busy", "true");
  nodes.meta.innerHTML = '<span class="loading">Modell lädt…</span>';

  stream(c, msg, nodes);
  el.input.focus();
}

function stream(chat, msg, nodes) {
  var ctrl = new AbortController();
  S.stream = { ctrl: ctrl, msg: msg, nodes: nodes, chat: chat };
  setSending(true);

  var first = true;
  var dirty = false;
  var painting = false;

  function paint() {
    painting = false;
    if (!dirty) return;
    dirty = false;
    nodes.body.textContent = msg.content;
    var cur = document.createElement("span");
    cur.className = "cursor";
    nodes.body.appendChild(cur);
    scrollToBottom(false);
  }
  function schedule() {
    dirty = true;
    if (painting) return;
    painting = true;
    requestAnimationFrame(paint);
  }

  fetch(OLLAMA + "/api/chat", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ model: S.model, messages: buildMessages(chat), stream: true }),
    signal: ctrl.signal
  })
  .then(function (res) {
    if (!res.ok) {
      return res.text().then(function (t) {
        var m = "HTTP " + res.status;
        try { var j = JSON.parse(t); if (j && j.error) m = j.error; } catch (e) {}
        throw new Error(m);
      });
    }
    var reader = res.body.getReader();
    var dec = new TextDecoder();
    var buf = "";

    function onLine(line) {
      line = line.trim();
      if (!line) return;
      var o;
      try { o = JSON.parse(line); } catch (e) { return; }   // halbe Zeile o.ä. überspringen
      if (o.error) throw new Error(o.error);                // Fehler mitten im Stream
      if (o.message) {
        if (o.message.thinking) { msg.thinking += o.message.thinking; }
        if (o.message.content) {
          if (first) { first = false; nodes.meta.textContent = ""; }
          msg.content += o.message.content;
          schedule();
        }
      }
      if (o.done) {
        msg.done_reason = o.done_reason || "";
        if (o.eval_count && o.eval_duration) {
          msg.tps = Math.round(o.eval_count / o.eval_duration * 1e9);
        }
        if (o.model) msg.model = o.model;
      }
    }

    function pump() {
      return reader.read().then(function (r) {
        if (r.done) {
          buf += dec.decode();                 // Rest flushen
          var rest = buf.trim();
          buf = "";
          if (rest) { var parts = rest.split("\n"); for (var i = 0; i < parts.length; i++) onLine(parts[i]); }
          return;
        }
        buf += dec.decode(r.value, { stream: true });
        var lines = buf.split("\n");
        buf = lines.pop();                      // unvollständige letzte Zeile aufheben
        for (var i = 0; i < lines.length; i++) onLine(lines[i]);
        return pump();
      });
    }
    return pump();
  })
  .then(function () { finish(null); })
  .catch(function (e) {
    if (e && e.name === "AbortError") { finish("abort"); return; }
    finish(e && e.message ? e.message : "Unbekannter Fehler");
  });

  function finish(err) {
    S.stream = null;
    setSending(false);
    nodes.wrap.removeAttribute("aria-busy");
    if (err === "abort") msg.aborted = true;
    else if (err) msg.error = err;
    nodes.body.textContent = msg.content;      // final, ohne Cursor
    setMeta(nodes.meta, msg);
    save();                                     // erst jetzt speichern, nicht pro Token
    scrollToBottom(false);
    el.input.focus();
  }
}

function stop() {
  if (S.stream) { try { S.stream.ctrl.abort(); } catch (e) {} }
}

function setSending(on) {
  el.send.classList.toggle("stop", on);
  el.send.setAttribute("aria-label", on ? "Stoppen" : "Senden");
  el.send.innerHTML = on
    ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>'
    : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
  el.input.disabled = false;
  el.send.disabled = false;
}

/* ============ Chats ============ */
function newChat() {
  var c = { id: uid(), title: "", messages: [] };
  S.chats.unshift(c);
  S.activeId = c.id;
  renderSidebar(); renderChat(); save();
  return c;
}
function openChat(id) {
  if (S.stream) stop();
  S.activeId = id;
  renderSidebar(); renderChat(); save();
  el.side.classList.remove("open");
}
function delChat(id) {
  S.chats = S.chats.filter(function (c) { return c.id !== id; });
  if (S.activeId === id) S.activeId = S.chats.length ? S.chats[0].id : null;
  renderSidebar(); renderChat(); save();
}

/* ============ Eingabe ============ */
function autoGrow() {
  el.input.style.height = "auto";
  el.input.style.height = Math.min(el.input.scrollHeight, 200) + "px";
}
el.input.addEventListener("input", autoGrow);
el.input.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
el.send.addEventListener("click", send);
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && S.stream) { e.preventDefault(); stop(); }
});
el.model.addEventListener("change", function () { S.model = el.model.value; save(); });
$("newchat").addEventListener("click", function () { newChat(); el.input.focus(); });
$("burger").addEventListener("click", function () { el.side.classList.toggle("open"); });
el.chats.addEventListener("click", function (e) {
  var d = e.target.closest("[data-del]");
  if (d) { e.stopPropagation(); delChat(d.dataset.del); return; }
  var it = e.target.closest(".chat-item");
  if (it) openChat(it.dataset.id);
});
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-cmd]");
  if (!b) return;
  copy(b.dataset.cmd, b);
});
function copy(text, btn) {
  var old = btn ? btn.textContent : "";
  function ok() { if (btn) { btn.textContent = "Kopiert"; setTimeout(function () { btn.textContent = old; }, 1400); } }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok).catch(function () { selectFallback(btn); });
  } else { selectFallback(btn); }
}
function selectFallback(btn) {
  // Fallback: den Text im Block markieren, damit man ihn selbst kopieren kann
  if (!btn) return;
  var node = btn.parentNode.querySelector("code");
  if (!node) return;
  var r = document.createRange(); r.selectNodeContents(node);
  var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
}

/* ============ Start ============ */
function boot() {
  load();
  el.brand.textContent = S.settings.name;
  document.title = S.settings.name;
  if (!S.chats.length) newChat(); else { if (!activeChat()) S.activeId = S.chats[0].id; renderSidebar(); renderChat(); }
  setSending(false);
  setInputEnabled(false);
  if (location.protocol === "file:") { gateFile(); return; }
  checkOllama();
}
boot();
