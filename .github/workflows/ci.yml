name: CI

# Die Qualitätsvorgabe verlangt ausdrücklich, dass die Replay-Suite in CI
# läuft. Sie ist das einzige Testverfahren, das die Warnlogik real absichert —
# ohne sie liesse sie sich nur beim Autofahren debuggen.
#
# Kein Netz nötig: Der Datensatz ist im Repo, die Tests laufen offline. Die
# Datenpipeline selbst wird hier NICHT ausgeführt, weil sie die Overpass-API
# belasten würde. Sie ist eine Aufgabe für die Hand, nicht für jeden Push.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pipeline:
    name: Datenpipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blitzerwarner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blitzerwarner/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit-Tests (Normalisierung, Dedupe, Gitter)
        run: npm test

      - name: Datensatz prüfen
        # Integrität und Abdeckung des mitgelieferten Datensatzes. Schlägt an,
        # wenn eine Kamera in der falschen Gitterzelle liegt — der Fehler, der
        # zur Laufzeit dazu führt, dass sie nie gefunden wird.
        run: npm run verify-dataset

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blitzerwarner/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blitzerwarner/app/package-lock.json

      - run: npm ci

      - name: Tests (Geometrie, Warnlogik, Tacho, Audio, Watchdog, Routen)
        run: npm test

      - name: Replay-Suite
        # Der Phase-3-DoD: fünf Referenz-Tracks, jeder mit einer erwarteten
        # Warnungszahl. Ein Abweichen bricht den Build.
        run: npm run replay:all

      - name: Fixtures sind reproduzierbar
        # Die Tracks werden gerechnet, nicht von Hand geschrieben. Wenn der
        # Generator etwas anderes erzeugt als im Repo liegt, stimmt eine
        # Annahme nicht mehr — das darf nicht unbemerkt bleiben.
        run: |
          npx tsx src/replay/make-fixtures.ts
          git diff --exit-code -- fixtures/

  jarvis:
    name: JARVIS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: jarvis/requirements.txt

      - run: pip install -r requirements.txt

      - name: Tests
        # Die Suite sperrt echte Netzwerkverbindungen. Sie braucht also weder
        # einen API-Key noch Netz - und kann in CI nichts kosten.
        run: pytest -q

      - name: Rauchtest
        # Faehrt die App gegen eine temporaere Datenbank hoch und geht den
        # ganzen Weg einmal durch. Fake-Anbieter, kein echter Modellaufruf.
        run: python -m scripts.smoke

      - name: Migration ist idempotent
        # Zweimal migrieren darf nichts kaputtmachen. Faellt hier auf, bevor
        # es jemandem die eigene Datenbank zerlegt.
        run: |
          python -m scripts.migrate --dry-run
          python -m scripts.migrate --dry-run

      - name: Backup und Restore
        # Ein Restore, der nie eingespielt wurde, ist kein Backup (DoD 4).
        # Der Rauchtest laeuft gegen eine temporaere Datenbank - hier braucht
        # es deshalb eine echte Datei.
        run: |
          python - <<'PY'
          from core import db
          from core.config import get_settings

          pfad = get_settings().db_path
          conn = db.connect(pfad)
          db.init_db(conn)
          conn.close()
          db.add_message(pfad, "user", "CI-Zeile")
          print("Datenbank angelegt:", pfad)
          PY
          python -m scripts.backup sichern data/ci-backup.db
          python -m scripts.backup pruefen data/ci-backup.db
          python -m scripts.backup einspielen data/ci-backup.db --force
