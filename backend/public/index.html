<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexus AI — Deine KI-Produktivitätszentrale</title>
<meta name="theme-color" content="#5B5FEF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="All-in-One KI-Produktivität: Chat mit GPT, Claude & Gemini, Aufgaben, Notizen, Kalender, Übersetzer und mehr.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>✨</text></svg>">
<style>
/* ===== Design-Tokens (siehe docs/DESIGN_SYSTEM.md) ===== */
:root {
  --primary:#5B5FEF; --primary-strong:#4448d0; --accent:#00C2A8;
  --danger:#E5484D; --warning:#F5A623;
  --bg:#F7F7FA; --card:#FFFFFF; --text:#17171C; --text-2:#66666F;
  --border:#E7E7EE; --bubble-me:#5B5FEF; --bubble-ai:#ECECF4;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --shadow:0 1px 3px rgba(20,20,40,.07);
  --ease:cubic-bezier(.16,1,.3,1);
}
:root[data-theme="dark"] {
  --primary:#8B8DF5; --primary-strong:#a3a5ff;
  --bg:#101014; --card:#1A1A21; --text:#F2F2F7; --text-2:#9C9CA8;
  --border:#2A2A33; --bubble-me:#5B5FEF; --bubble-ai:#26262f;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --primary:#8B8DF5; --primary-strong:#a3a5ff;
    --bg:#101014; --card:#1A1A21; --text:#F2F2F7; --text-2:#9C9CA8;
    --border:#2A2A33; --bubble-me:#5B5FEF; --bubble-ai:#26262f;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
* { box-sizing:border-box; margin:0; }
html, body { height:100%; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
button { font:inherit; cursor:pointer; border:none; }
input, textarea, select { font:inherit; color:var(--text); }

/* ===== Layout: Sidebar (Desktop) / Bottom-Nav (Mobil) ===== */
#app { display:none; height:100dvh; }
#app.ready { display:flex; }
nav.side {
  width:230px; flex-shrink:0; padding:20px 12px; border-right:1px solid var(--border);
  display:flex; flex-direction:column; gap:4px; background:var(--card);
}
nav.side .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:19px; padding:8px 12px 20px; }
.navbtn {
  display:flex; align-items:center; gap:12px; width:100%; padding:11px 14px;
  background:none; color:var(--text-2); border-radius:var(--r-m); font-size:15px; font-weight:500;
  transition:background .18s var(--ease), color .18s var(--ease);
}
.navbtn:hover { background:var(--bg); }
.navbtn.active { background:var(--primary); color:#fff; }
:root[data-theme="dark"] .navbtn.active { color:#101014; }
main { flex:1; display:flex; flex-direction:column; min-width:0; }
header.top {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 20px; border-bottom:1px solid var(--border); background:var(--card);
}
header.top h1 { font-size:17px; font-weight:650; }
.content { flex:1; overflow-y:auto; padding:20px; }
nav.bottom { display:none; }
@media (max-width: 760px) {
  nav.side { display:none; }
  nav.bottom {
    display:flex; border-top:1px solid var(--border); background:var(--card);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.bottom .navbtn { flex-direction:column; gap:3px; font-size:11px; padding:9px 2px; border-radius:0; justify-content:center; }
  nav.bottom .navbtn.active { background:none; color:var(--primary); }
  #app.ready { flex-direction:column; }
  .content { padding:14px; }
}

/* ===== Komponenten ===== */
.btn {
  background:var(--primary); color:#fff; padding:12px 20px; border-radius:var(--r-m);
  font-weight:600; font-size:15px; transition:transform .18s var(--ease), background .18s;
}
:root[data-theme="dark"] .btn { color:#101014; }
.btn:hover { background:var(--primary-strong); }
.btn:active { transform:scale(.97); }
.btn[disabled] { opacity:.5; cursor:default; }
.btn.ghost { background:transparent; color:var(--primary); border:1.5px solid var(--border); }
.btn.small { padding:7px 13px; font-size:13px; border-radius:10px; }
.field {
  width:100%; padding:13px 15px; border-radius:var(--r-m); border:1.5px solid transparent;
  background:var(--card); box-shadow:var(--shadow); outline:none;
  transition:border-color .18s var(--ease);
}
.auth .field { background:var(--bg); box-shadow:none; }
.field:focus { border-color:var(--primary); }
textarea.field { resize:vertical; min-height:90px; }
.card {
  background:var(--card); border-radius:var(--r-m); padding:16px; box-shadow:var(--shadow);
  animation:rise .3s var(--ease);
}
@keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
.muted { color:var(--text-2); font-size:13.5px; }
.error { color:var(--danger); font-size:14px; min-height:18px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
dialog {
  border:none; border-radius:var(--r-l); background:var(--card); color:var(--text);
  padding:24px; width:min(480px, calc(100vw - 32px)); box-shadow:0 20px 60px rgba(0,0,0,.25);
}
dialog::backdrop { background:rgba(10,10,20,.45); backdrop-filter:blur(3px); }
.row { display:flex; gap:10px; align-items:center; }
.spin {
  width:20px; height:20px; border-radius:50%; border:2.5px solid var(--border);
  border-top-color:var(--primary); animation:spin .7s linear infinite; display:inline-block;
}
@keyframes spin { to { transform:rotate(360deg); } }
.chip {
  padding:8px 14px; border-radius:999px; border:1.5px solid var(--border); background:var(--card);
  color:var(--text); font-size:13.5px; font-weight:500; transition:border-color .18s, color .18s;
}
.chip:hover { border-color:var(--primary); color:var(--primary); }

/* ===== Login ===== */
#login {
  min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.auth {
  width:100%; max-width:400px; background:var(--card); padding:36px 30px;
  border-radius:var(--r-l); box-shadow:0 12px 44px rgba(30,30,70,.12);
  display:flex; flex-direction:column; gap:12px; animation:rise .5s var(--ease);
}
.auth h1 { text-align:center; font-size:26px; }
.auth .logo { text-align:center; font-size:44px; }

/* ===== Chat ===== */
#view-chat { display:flex; flex-direction:column; height:100%; }
.msgs { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:min(640px,86%); padding:11px 16px; white-space:pre-wrap; word-break:break-word;
  line-height:1.5; animation:rise .25s var(--ease); font-size:15px; }
.msg.me { align-self:flex-end; background:var(--bubble-me); color:#fff;
  border-radius:var(--r-l) var(--r-l) var(--r-s) var(--r-l); }
.msg.ai { align-self:flex-start; background:var(--bubble-ai);
  border-radius:var(--r-l) var(--r-l) var(--r-l) var(--r-s); }
.composer { display:flex; gap:10px; padding:14px 20px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); background:var(--card); }
.composer textarea { flex:1; min-height:46px; max-height:150px; resize:none; }
.send {
  width:46px; height:46px; border-radius:50%; background:var(--primary); color:#fff;
  font-size:19px; flex-shrink:0; display:grid; place-items:center; transition:transform .18s var(--ease);
}
.send:active { transform:scale(.9); }
.empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--text-2); }
.empty .big { font-size:44px; }

/* ===== Aufgaben / Listen ===== */
.task { display:flex; align-items:center; gap:12px; padding:13px 16px; }
.task input[type=checkbox] { width:20px; height:20px; accent-color:var(--primary); }
.task.done .t { text-decoration:line-through; color:var(--text-2); }
.task .t { flex:1; }
.task .del { background:none; color:var(--text-2); font-size:17px; }
.task .del:hover { color:var(--danger); }
.fab {
  position:fixed; right:22px; bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--primary); color:#fff; border-radius:18px; padding:15px 22px; font-weight:600;
  box-shadow:0 8px 24px rgba(91,95,239,.4); font-size:15px; transition:transform .2s var(--ease);
  z-index:5;
}
@media (min-width: 761px) { .fab { bottom:26px; } }
.fab:hover { transform:translateY(-2px); }
.result-box { white-space:pre-wrap; font-size:14.5px; line-height:1.6; max-height:55vh; overflow-y:auto; }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <form class="auth" id="authForm">
    <div class="logo">✨</div>
    <h1>Nexus AI</h1>
    <p class="muted" style="text-align:center" id="authSub">Deine KI-Produktivitätszentrale</p>
    <input class="field" id="aName" placeholder="Name" autocomplete="name" style="display:none">
    <input class="field" id="aEmail" type="email" placeholder="E-Mail" autocomplete="email" required>
    <input class="field" id="aPass" type="password" placeholder="Passwort" autocomplete="current-password" required>
    <input class="field" id="aTotp" placeholder="2FA-Code (6-stellig)" inputmode="numeric" maxlength="6" style="display:none">
    <div class="error" id="aError"></div>
    <button class="btn" id="aSubmit" type="submit">Anmelden</button>
    <button class="btn ghost" id="aToggle" type="button">Neues Konto erstellen</button>
  </form>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <nav class="side">
    <div class="brand">✨ Nexus AI</div>
    <button class="navbtn" data-view="chat">💬 Chat</button>
    <button class="navbtn" data-view="tools">🪄 Werkzeuge</button>
    <button class="navbtn" data-view="tasks">✅ Aufgaben</button>
    <button class="navbtn" data-view="notes">📝 Notizen</button>
    <button class="navbtn" data-view="calendar">📅 Kalender</button>
    <div style="flex:1"></div>
    <button class="navbtn" id="themeBtn">🌓 Design</button>
    <button class="navbtn" id="logoutBtn">🚪 Abmelden</button>
  </nav>

  <main>
    <header class="top">
      <h1 id="viewTitle">Chat</h1>
      <div class="row" id="chatTools">
        <select class="field" id="provider" style="width:auto;padding:8px 12px">
          <option value="anthropic">Claude</option>
          <option value="openai">GPT</option>
          <option value="gemini">Gemini</option>
        </select>
        <button class="btn small ghost" id="newChat">Neu</button>
      </div>
    </header>

    <div class="content" id="content">
      <!-- Chat -->
      <div id="view-chat">
        <div class="msgs" id="msgs">
          <div class="empty" id="chatEmpty"><div class="big">✨</div><div>Frag mich alles – GPT, Claude oder Gemini antwortet.</div></div>
        </div>
        <div class="composer">
          <textarea class="field" id="chatInput" placeholder="Nachricht an Nexus AI …" rows="1"></textarea>
          <button class="send" id="chatSend">↑</button>
        </div>
      </div>

      <!-- Werkzeuge -->
      <div id="view-tools" style="display:none">
        <div class="grid" id="toolsGrid"></div>
      </div>

      <!-- Aufgaben -->
      <div id="view-tasks" style="display:none">
        <div id="taskList" style="display:flex;flex-direction:column;gap:10px;max-width:680px"></div>
      </div>

      <!-- Notizen -->
      <div id="view-notes" style="display:none">
        <div class="grid" id="noteGrid"></div>
      </div>

      <!-- Kalender -->
      <div id="view-calendar" style="display:none">
        <div id="eventList" style="display:flex;flex-direction:column;gap:10px;max-width:680px"></div>
      </div>
    </div>
  </main>

  <nav class="bottom">
    <button class="navbtn" data-view="chat">💬<span>Chat</span></button>
    <button class="navbtn" data-view="tools">🪄<span>Tools</span></button>
    <button class="navbtn" data-view="tasks">✅<span>Aufgaben</span></button>
    <button class="navbtn" data-view="notes">📝<span>Notizen</span></button>
    <button class="navbtn" data-view="calendar">📅<span>Kalender</span></button>
  </nav>
</div>

<button class="fab" id="fab" style="display:none">+ Neu</button>

<!-- Dialoge -->
<dialog id="dlg">
  <h2 id="dlgTitle" style="margin-bottom:14px;font-size:19px"></h2>
  <div id="dlgBody" style="display:flex;flex-direction:column;gap:12px"></div>
  <div class="row" style="justify-content:flex-end;margin-top:18px">
    <button class="btn ghost" id="dlgCancel">Abbrechen</button>
    <button class="btn" id="dlgOk">OK</button>
  </div>
</dialog>

<dialog id="resultDlg">
  <h2 id="resultTitle" style="margin-bottom:14px;font-size:19px"></h2>
  <div class="result-box" id="resultBox"></div>
  <div class="row" style="justify-content:flex-end;margin-top:18px">
    <button class="btn" id="resultClose">Schließen</button>
  </div>
</dialog>

<script>
"use strict";
/* ==================================================================
   Nexus AI — Single-File-Web-App (Website + installierbare App).
   Spricht mit dem Nexus-Backend (standardmäßig gleiche Origin;
   überschreibbar mit ?api=http://host:8080 oder localStorage.apiBase).
   ================================================================== */

const API = new URLSearchParams(location.search).get('api')
  || localStorage.getItem('apiBase') || '';
if (new URLSearchParams(location.search).get('api')) localStorage.setItem('apiBase', API);

const $ = (id) => document.getElementById(id);
const store = {
  get tokens() { try { return JSON.parse(localStorage.getItem('tokens')); } catch { return null; } },
  set tokens(v) { v ? localStorage.setItem('tokens', JSON.stringify(v)) : localStorage.removeItem('tokens'); },
};

/* ---------- API-Client mit Auto-Token-Refresh ---------- */
async function api(method, path, body, retried) {
  const res = await fetch(API + path, {
    method,
    headers: {
      'content-type': 'application/json',
      ...(store.tokens ? { authorization: 'Bearer ' + store.tokens.accessToken } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401 && !retried && store.tokens && !path.startsWith('/api/auth/')) {
    if (await refreshTokens()) return api(method, path, body, true);
    logout(); throw new Error('Sitzung abgelaufen');
  }
  if (res.status === 204) return {};
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error?.message || 'Fehler ' + res.status);
  return data;
}

async function refreshTokens() {
  try {
    const res = await fetch(API + '/api/auth/refresh', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ refreshToken: store.tokens.refreshToken }),
    });
    if (!res.ok) return false;
    store.tokens = (await res.json()).tokens;
    return true;
  } catch { return false; }
}

/* ---------- Theme ---------- */
function applyTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.dataset.theme = saved;
}
$('themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
};
applyTheme();

/* ---------- Auth ---------- */
let registerMode = false, totpMode = false;

$('aToggle').onclick = () => {
  registerMode = !registerMode;
  $('aName').style.display = registerMode ? '' : 'none';
  $('aSubmit').textContent = registerMode ? 'Konto erstellen' : 'Anmelden';
  $('aToggle').textContent = registerMode ? 'Ich habe bereits ein Konto' : 'Neues Konto erstellen';
};

$('authForm').onsubmit = async (e) => {
  e.preventDefault();
  $('aError').textContent = '';
  $('aSubmit').disabled = true;
  try {
    if (registerMode) {
      const r = await api('POST', '/api/auth/register', {
        email: $('aEmail').value.trim(), password: $('aPass').value,
        displayName: $('aName').value.trim() || $('aEmail').value.split('@')[0],
      });
      store.tokens = r.tokens;
    } else {
      const r = await api('POST', '/api/auth/login', {
        email: $('aEmail').value.trim(), password: $('aPass').value,
        ...(totpMode ? { totpCode: $('aTotp').value.trim() } : {}),
      });
      if (r.requiresTotp) {
        totpMode = true;
        $('aTotp').style.display = '';
        $('authSub').textContent = 'Zwei-Faktor-Code eingeben';
        return;
      }
      store.tokens = r.tokens;
    }
    enterApp();
  } catch (err) {
    $('aError').textContent = err.message;
  } finally {
    $('aSubmit').disabled = false;
  }
};

function logout() {
  if (store.tokens) api('POST', '/api/auth/logout', { refreshToken: store.tokens.refreshToken }).catch(() => {});
  store.tokens = null;
  $('app').classList.remove('ready');
  $('login').style.display = 'flex';
  $('fab').style.display = 'none';
}
$('logoutBtn').onclick = logout;

function enterApp() {
  $('login').style.display = 'none';
  $('app').classList.add('ready');
  show('chat');
}

/* ---------- Navigation ---------- */
const VIEWS = {
  chat: 'Chat', tools: 'KI-Werkzeuge', tasks: 'Aufgaben', notes: 'Notizen', calendar: 'Kalender',
};
let currentView = 'chat';

function show(view) {
  currentView = view;
  for (const v of Object.keys(VIEWS)) $('view-' + v).style.display = v === view ? '' : 'none';
  $('view-chat').style.display = view === 'chat' ? 'flex' : 'none';
  $('viewTitle').textContent = VIEWS[view];
  $('chatTools').style.display = view === 'chat' ? '' : 'none';
  document.querySelectorAll('.navbtn[data-view]').forEach((b) =>
    b.classList.toggle('active', b.dataset.view === view));
  $('fab').style.display = ['tasks', 'notes', 'calendar'].includes(view) ? '' : 'none';
  $('fab').textContent = { tasks: '+ Aufgabe', notes: '+ Notiz', calendar: '+ Termin' }[view] || '+ Neu';
  if (view === 'tasks') loadTasks();
  if (view === 'notes') loadNotes();
  if (view === 'calendar') loadEvents();
}
document.querySelectorAll('.navbtn[data-view]').forEach((b) => b.onclick = () => show(b.dataset.view));

/* ---------- Dialog-Helfer ---------- */
function dialog(title, fields) {
  return new Promise((resolve) => {
    $('dlgTitle').textContent = title;
    const body = $('dlgBody');
    body.innerHTML = '';
    const inputs = fields.map((f) => {
      const el = document.createElement(f.multiline ? 'textarea' : 'input');
      el.className = 'field';
      el.placeholder = f.label;
      if (f.type) el.type = f.type;
      if (f.value) el.value = f.value;
      body.appendChild(el);
      return el;
    });
    const close = (val) => { $('dlg').close(); resolve(val); };
    $('dlgOk').onclick = () => close(inputs.map((i) => i.value));
    $('dlgCancel').onclick = () => close(null);
    $('dlg').showModal();
    inputs[0]?.focus();
  });
}

function showResult(title, text) {
  $('resultTitle').textContent = title;
  $('resultBox').textContent = text;
  $('resultDlg').showModal();
}
$('resultClose').onclick = () => $('resultDlg').close();

/* ---------- Chat (SSE-Streaming) ---------- */
let conversationId = null, streaming = false;

function addMsg(role, text) {
  $('chatEmpty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + (role === 'user' ? 'me' : 'ai');
  el.textContent = text;
  $('msgs').appendChild(el);
  $('msgs').scrollTop = $('msgs').scrollHeight;
  return el;
}

$('newChat').onclick = () => {
  conversationId = null;
  $('msgs').innerHTML = '<div class="empty" id="chatEmpty"><div class="big">✨</div><div>Neue Unterhaltung gestartet.</div></div>';
};

async function sendChat() {
  const text = $('chatInput').value.trim();
  if (!text || streaming) return;
  $('chatInput').value = '';
  streaming = true;
  addMsg('user', text);
  const aiEl = addMsg('ai', '…');
  try {
    if (!conversationId) {
      const r = await api('POST', '/api/ai/conversations', { provider: $('provider').value });
      conversationId = r.conversation.id;
    }
    const res = await fetch(API + '/api/ai/conversations/' + conversationId + '/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + store.tokens.accessToken },
      body: JSON.stringify({ content: text }),
    });
    if (!res.ok || !res.body) throw new Error('Stream fehlgeschlagen (' + res.status + ')');
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', out = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const event = buf.slice(0, idx); buf = buf.slice(idx + 2);
        for (const line of event.split('\n')) {
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          const parsed = JSON.parse(data);
          if (parsed.error) throw new Error(parsed.error);
          out += parsed.delta || '';
          aiEl.textContent = out;
          $('msgs').scrollTop = $('msgs').scrollHeight;
        }
      }
    }
    if (!out) aiEl.textContent = '(keine Antwort)';
  } catch (err) {
    aiEl.textContent = '⚠️ ' + err.message;
  } finally {
    streaming = false;
  }
}
$('chatSend').onclick = sendChat;
$('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});

/* ---------- Werkzeuge ---------- */
const TOOLS = [
  { icon: '🌐', name: 'Webseite zusammenfassen', run: async () => {
      const v = await dialog('Webseite zusammenfassen', [{ label: 'URL' }]);
      if (!v?.[0]) return;
      return ['Zusammenfassung', (await api('POST', '/api/ai/summarize/url', { url: v[0] })).summary];
    } },
  { icon: '📺', name: 'YouTube analysieren', run: async () => {
      const v = await dialog('YouTube-Video analysieren', [{ label: 'Video-URL' }]);
      if (!v?.[0]) return;
      return ['Analyse', (await api('POST', '/api/ai/summarize/youtube', { url: v[0] })).summary];
    } },
  { icon: '📄', name: 'Text zusammenfassen', run: async () => {
      const v = await dialog('Text zusammenfassen', [{ label: 'Text einfügen', multiline: true }]);
      if (!v?.[0]) return;
      return ['Zusammenfassung', (await api('POST', '/api/ai/summarize/text', { text: v[0] })).summary];
    } },
  { icon: '🌍', name: 'Übersetzen (100+ Sprachen)', run: async () => {
      const v = await dialog('Übersetzen', [{ label: 'Text', multiline: true }, { label: 'Zielsprache (z. B. Englisch)' }]);
      if (!v?.[0] || !v?.[1]) return;
      return ['Übersetzung', (await api('POST', '/api/ai/translate', { text: v[0], targetLanguage: v[1] })).translation];
    } },
  { icon: '✍️', name: 'Dokument schreiben', run: async () => {
      const v = await dialog('Dokument schreiben', [{ label: 'Thema / Auftrag', multiline: true }, { label: 'Art (z. B. Bericht, E-Mail)' }]);
      if (!v?.[0]) return;
      return ['Dokument', (await api('POST', '/api/ai/documents/write', { topic: v[0], kind: v[1] || 'Dokument' })).document];
    } },
  { icon: '📊', name: 'Präsentation erstellen', run: async () => {
      const v = await dialog('Präsentation erstellen', [{ label: 'Thema' }]);
      if (!v?.[0]) return;
      const p = (await api('POST', '/api/ai/presentations', { topic: v[0] })).presentation;
      return [p.title, p.slides.map((s, i) => (i + 1) + '. ' + s.title + '\n' + s.bullets.map((b) => '   • ' + b).join('\n')).join('\n\n')];
    } },
  { icon: '🧠', name: 'Mindmap generieren', run: async () => {
      const v = await dialog('Mindmap generieren', [{ label: 'Thema' }]);
      if (!v?.[0]) return;
      const render = (n, d = 0) => '  '.repeat(d) + (d ? '• ' : '★ ') + n.label + '\n'
        + (n.children || []).map((c) => render(c, d + 1)).join('');
      return ['Mindmap', render((await api('POST', '/api/ai/mindmaps', { topic: v[0] })).mindmap)];
    } },
  { icon: '👨‍💻', name: 'Code-Assistent', run: async () => {
      const v = await dialog('KI-Code-Assistent', [{ label: 'Anweisung (z. B. "Erkläre / fixe …")' }, { label: 'Code (optional)', multiline: true }]);
      if (!v?.[0]) return;
      return ['Ergebnis', (await api('POST', '/api/ai/code', {
        action: 'generate', instruction: v[0], ...(v[1] ? { code: v[1] } : {}),
      })).result];
    } },
  { icon: '🎨', name: 'Bild generieren', run: async () => {
      const v = await dialog('Bild generieren', [{ label: 'Prompt' }]);
      if (!v?.[0]) return;
      let job = (await api('POST', '/api/ai/media/image', { prompt: v[0] })).job;
      for (let i = 0; i < 60 && !['done', 'failed'].includes(job.status); i++) {
        await new Promise((r) => setTimeout(r, 2000));
        job = (await api('GET', '/api/ai/jobs/' + job.id)).job;
      }
      if (job.status !== 'done') throw new Error(job.error || 'Generierung fehlgeschlagen');
      return ['Bild', job.output.url];
    } },
];

for (const t of TOOLS) {
  const card = document.createElement('button');
  card.className = 'card';
  card.style.cssText = 'text-align:left;display:flex;flex-direction:column;gap:10px;min-height:110px';
  card.innerHTML = '<span style="font-size:26px">' + t.icon + '</span><b>' + t.name + '</b>';
  card.onclick = async () => {
    try {
      card.disabled = true;
      const result = await t.run();
      if (result) showResult(result[0], result[1]);
    } catch (err) { showResult('Fehler', err.message); }
    finally { card.disabled = false; }
  };
  $('toolsGrid').appendChild(card);
}

/* ---------- Aufgaben ---------- */
async function loadTasks() {
  const { tasks } = await api('GET', '/api/tasks');
  const list = $('taskList');
  list.innerHTML = tasks.length ? '' : '<p class="muted">Alles erledigt 🎉</p>';
  for (const t of tasks) {
    const el = document.createElement('div');
    el.className = 'card task' + (t.status === 'done' ? ' done' : '');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = t.status === 'done';
    cb.onchange = async () => {
      await api('PATCH', '/api/tasks/' + t.id, { status: cb.checked ? 'done' : 'open' });
      loadTasks();
    };
    const title = document.createElement('span');
    title.className = 't'; title.textContent = t.title;
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '🗑';
    del.onclick = async () => { await api('DELETE', '/api/tasks/' + t.id); loadTasks(); };
    el.append(cb, title, del);
    list.appendChild(el);
  }
}

/* ---------- Notizen ---------- */
async function loadNotes() {
  const { notes } = await api('GET', '/api/notes');
  const grid = $('noteGrid');
  grid.innerHTML = notes.length ? '' : '<p class="muted">Noch keine Notizen</p>';
  for (const n of notes) {
    const el = document.createElement('button');
    el.className = 'card';
    el.style.cssText = 'text-align:left;display:flex;flex-direction:column;gap:8px;min-height:130px';
    const h = document.createElement('b'); h.textContent = n.title || 'Ohne Titel';
    const p = document.createElement('span'); p.className = 'muted';
    p.style.cssText = 'overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical';
    p.textContent = n.content;
    el.append(h, p);
    el.onclick = async () => {
      const v = await dialog('Notiz bearbeiten', [
        { label: 'Titel', value: n.title }, { label: 'Inhalt', value: n.content, multiline: true }]);
      if (!v) return;
      await api('PATCH', '/api/notes/' + n.id, { title: v[0], content: v[1] });
      loadNotes();
    };
    grid.appendChild(el);
  }
}

/* ---------- Kalender ---------- */
async function loadEvents() {
  const now = new Date();
  const { events } = await api('GET', '/api/calendar/events?from=' +
    encodeURIComponent(new Date(now - 864e5).toISOString()) + '&to=' +
    encodeURIComponent(new Date(+now + 60 * 864e5).toISOString()));
  const list = $('eventList');
  list.innerHTML = events.length ? '' : '<p class="muted">Keine anstehenden Termine</p>';
  const fmt = new Intl.DateTimeFormat('de', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  for (const e of events) {
    const el = document.createElement('div');
    el.className = 'card row';
    el.innerHTML = '<div style="width:4px;height:38px;border-radius:2px;background:var(--primary)"></div>';
    const info = document.createElement('div');
    info.style.flex = '1';
    info.innerHTML = '<b>' + e.title.replace(/</g, '&lt;') + '</b><br><span class="muted">'
      + fmt.format(new Date(e.starts_at)) + '</span>';
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '🗑'; del.style.background = 'none'; del.style.color = 'var(--text-2)';
    del.onclick = async () => { await api('DELETE', '/api/calendar/events/' + e.id); loadEvents(); };
    el.append(info, del);
    list.appendChild(el);
  }
}

/* ---------- FAB (Neu-Button) ---------- */
$('fab').onclick = async () => {
  if (currentView === 'tasks') {
    const v = await dialog('Neue Aufgabe', [{ label: 'Was ist zu tun?' }]);
    if (v?.[0]) { await api('POST', '/api/tasks', { title: v[0] }); loadTasks(); }
  } else if (currentView === 'notes') {
    const v = await dialog('Neue Notiz', [{ label: 'Titel' }, { label: 'Inhalt', multiline: true }]);
    if (v) { await api('POST', '/api/notes', { title: v[0], content: v[1] }); loadNotes(); }
  } else if (currentView === 'calendar') {
    const v = await dialog('Neuer Termin', [
      { label: 'Titel' }, { label: 'Beginn', type: 'datetime-local' }]);
    if (v?.[0] && v?.[1]) {
      const start = new Date(v[1]);
      await api('POST', '/api/calendar/events', {
        title: v[0],
        startsAt: start.toISOString(),
        endsAt: new Date(+start + 36e5).toISOString(),
      });
      loadEvents();
    }
  }
};

/* ---------- Start ---------- */
if (store.tokens) enterApp();
