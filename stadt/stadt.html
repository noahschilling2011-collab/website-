<script id="sim">
'use strict';
// =====================================================================================
// STADT — Simulation. Reine Daten und Regeln.
// Kein DOM, kein THREE, kein window, kein fetch, kein Math.random, keine Uhrzeit.
// Läuft unverändert im Browser und in Node (tools/simtest.mjs führt genau diesen Block aus).
// Die Darstellung liest den Zustand S und ändert ihn nur über die Funktionen in StadtSim.
// =====================================================================================
(function (G) {

const VERSION = 1;

// ─── Karte ───────────────────────────────────────────────────────────────────────────
const KARTE = 96, FELDER = KARTE * KARTE;
const VK = 12, VN = KARTE / VK;       // Viertel: 12×12 Felder → 8×8 Viertel (Indexlisten für Suchen)
const RASTER = 4;                     // Straßen liegen nur auf jeder 4. Linie → Blöcke mit 3×3 Feldern
const RAND = 2;                       // Straßen halten 2 Felder Abstand zum Kartenrand
const MITTE = 48;

const LEER = 0, STRASSE = 1, WOHNHAUS = 2, WERKSTATT = 3, LADEN = 4, PARK = 5, BAUSTELLE = 6;

// ─── Regeln und Zahlen (alle Stellschrauben an einem Ort) ────────────────────────────
const R = {
  // Zeit. ANNAHME: 1 Lebensjahr = 10 Spieltage. Ohne Raffung würde in zwei Spieljahren
  // niemand erwachsen und es gäbe keine Enkel (Phase-3-Gate). Siehe README.
  JAHR: 10, ERWACHSEN: 18, RENTE: 67, ALT: 80, MAXALTER: 105,

  // Geld in Talern pro Spieltag
  LOHN_WERKSTATT: 100, LOHN_LADEN: 90, LOHN_STADT: 95,
  STEUER: 0.10,                 // fester Anteil vom Lohn → Budget des Bauamts
  MIETE: [0, 12, 14, 16],       // pro Wohnung nach Hausstufe → Budget (die Stadt besitzt die Wohnhäuser)
  EINKAUF: 30,                  // pro Erwachsenem; Sparsame kaufen bis 40 % weniger
  EINKAUF_VERMOEGEN: 0.01,      // wer Erspartes hat, gibt täglich bis 1 % davon zusätzlich aus (Sparsame weniger)
  EINKAUF_EXTRA_MAX: 15,
  EINKAUF_KIND: 15,             // zahlt der Haushalt
  RENTE_BETRAG: 50,             // ab 67, aus dem Budget, nur solange das Budget reicht
  FIX_WERKSTATT: 40, FIX_LADEN: 30,
  UMLAND: 50000,                // so viel kauft das Umland pro Tag bei allen Werkstätten zusammen
  EXPORT_MAX: 140,              // Höchsterlös je Arbeitstag in einer Werkstatt
  KASSE_START: 300, POLSTER: 400,

  // Kapazitäten
  WOHNUNGEN: [0, 6, 14, 26],    // Wohnungen je Hausstufe
  WOHNGROESSE: [0, 5, 4, 3],    // so viele Personen passen bequem in eine Wohnung
  STELLEN_WERKSTATT: 8, STELLEN_LADEN: 6, STELLEN_STADT: 10,
  KUNDEN_PRO_KRAFT: 2.5,        // Kundschaft pro Tag je Stelle (Besitzer zählt mit): ein Laden bedient 2,5 × 7 = 17

  // Bauen: Kosten und Dauer in Spieltagen
  K_HAUS: 2400, K_AUF: [0, 0, 2800, 5000], K_PARK: 900, K_STRASSE: 50,
  K_LADEN: 1200, K_WERKSTATT: 1600, UEBERNAHME: 0.4,
  D_HAUS: 3, D_AUF: 3, D_PARK: 2, D_LADEN: 3, D_WERKSTATT: 4,
  REICH_LADEN: 12, REICH_PARK: 5,          // Reichweiten in Feldern (Manhattan)
  LADEN_WAHL: 40,                          // so viele Läden in Reichweite probiert man der Nähe nach durch
  MANGEL_GRUENDUNG: 10,                    // ab so vielen Leuten ohne Einkauf in Reichweite lohnt ein Laden

  // Stündliche Bedürfnisse
  KONTAKT_ZERFALL: 1.3, KONTAKT_ARBEIT: 0.7, KONTAKT_ZUHAUSE: 0.8,
  FREIZEIT_ARBEIT: 1.6, FREIZEIT_ERHOLUNG: 1.0, FREIZEIT_FREI: 2.0,
  FREIZEIT_PARK: 0.3, FREIZEIT_OHNE_LADEN: 0.4,
  ZUF_MAX_TAG: 5,                          // Zufriedenheit gleitet höchstens ±5 pro Tag

  // Gehirn
  SCHWELLE: 25, ZUFALL: 5,
  ZIEL_TAGE: 60, PLEITE_SPERRE: 180, MINUS_TAGE: 30,
  ELEND: 20, ELEND_TAGE: 7,                // Wegziehen: Zufriedenheit unter 20 seit 7 Tagen
  UNZUF: 40, UNZUF_TAGE: 14,               // Trennen: beide 14 Tage unzufrieden
  FREUNDE_MAX: 5, MEM: 8,

  BUCH_MAX: 500,
  START_BUDGET: 6000,
};

// Gedächtnis-Codes
const M = { EINGEZOGEN: 1, JOB: 2, JOB_WEG: 3, GEKUENDIGT: 4, FREUND: 5, PARTNER: 6, GETRENNT: 7,
  KIND: 8, GEGRUENDET: 9, PLEITE: 10, ZIEL_ERREICHT: 11, ZIEL_AUFGEGEBEN: 12, GESTORBEN: 13, NOAH: 14 };
// Bezug je Code: 'p' = Person, 'g' = Gebäude, 'z' = Ziel
const M_BEZUG = ['', 'g', 'g', 'g', 'g', 'p', 'p', 'p', 'p', 'g', 'g', 'z', 'z', 'p', ''];

// Ziele
const Z = { WOHNUNG: 1, JOB: 2, FAMILIE: 3, LADEN: 4, FREUNDE: 5, RUHE: 6 };
const ZIELNAMEN = ['', 'eigene_wohnung', 'besserer_job', 'familie', 'eigener_laden', 'freunde', 'ruhe'];

// Aktionen
const A = { WOHNUNG: 1, JOB: 2, WECHSEL: 3, KUENDIGEN: 4, FREI: 5, FREUNDE: 6, PARTNER: 7,
  ZUSAMMEN: 8, TRENNEN: 9, KIND: 10, GRUENDEN: 11, WEGZIEHEN: 12 };
const AKTIONSNAMEN = ['', 'wohnung_suchen', 'job_suchen', 'job_wechseln', 'kuendigen', 'freinehmen',
  'freunde_treffen', 'partner_suchen', 'zusammenziehen', 'trennen', 'kind_bekommen', 'laden_gruenden', 'wegziehen'];

// ─── Namen ───────────────────────────────────────────────────────────────────────────
const VORNAMEN_W = ['Mia', 'Emma', 'Hanna', 'Lea', 'Sofia', 'Lina', 'Marie', 'Clara', 'Ella', 'Ida', 'Lena', 'Anna',
  'Leonie', 'Paula', 'Frieda', 'Greta', 'Mila', 'Luisa', 'Nora', 'Johanna', 'Amelie', 'Charlotte', 'Emilia', 'Helene',
  'Martha', 'Rosa', 'Tilda', 'Jana', 'Sarah', 'Julia', 'Laura', 'Nina', 'Eva', 'Selin', 'Aylin', 'Zeynep', 'Maja',
  'Hilde', 'Ingrid', 'Ruth'];
const VORNAMEN_M = ['Leon', 'Paul', 'Ben', 'Finn', 'Elias', 'Jonas', 'Luis', 'Felix', 'Henry', 'Emil', 'Theo', 'Anton',
  'Jakob', 'Max', 'Moritz', 'David', 'Tim', 'Lukas', 'Jan', 'Tom', 'Erik', 'Karl', 'Oskar', 'Milan', 'Mats', 'Levi',
  'Ole', 'Hannes', 'Can', 'Deniz', 'Emre', 'Ali', 'Mehmet', 'Stefan', 'Peter', 'Klaus', 'Jürgen', 'Uwe', 'Bernd', 'Hans'];
const NACHNAMEN = ['Müller', 'Schmidt', 'Schneider', 'Fischer', 'Weber', 'Meyer', 'Wagner', 'Becker', 'Schulz',
  'Hoffmann', 'Koch', 'Richter', 'Klein', 'Wolf', 'Schröder', 'Neumann', 'Schwarz', 'Braun', 'Zimmermann', 'Krüger',
  'Hartmann', 'Lange', 'Werner', 'Krause', 'Lehmann', 'Köhler', 'Maier', 'Herrmann', 'König', 'Walter', 'Kaya',
  'Yılmaz', 'Demir', 'Şahin', 'Özdemir', 'Nowak', 'Kowalski', 'Berg', 'Brandt', 'Vogel', 'Frank', 'Busch', 'Jung',
  'Kraus', 'Haas', 'Roth', 'Beck', 'Lorenz', 'Sommer', 'Winter', 'Seidel', 'Fuchs', 'Arnold', 'Pohl', 'Kühn',
  'Engel', 'Horn', 'Graf', 'Ernst', 'Stein'];
const STRASSEN = ['Hauptstraße', 'Lindenstraße', 'Nordstraße', 'Bahnhofstraße', 'Gartenweg', 'Mühlenweg',
  'Schulstraße', 'Kirchgasse', 'Birkenweg', 'Ahornallee', 'Rosenstraße', 'Bergstraße', 'Wiesenweg', 'Feldstraße',
  'Brunnenstraße', 'Marktstraße', 'Eichenweg', 'Sonnenweg', 'Talstraße', 'Waldstraße', 'Kastanienallee',
  'Uferweg', 'Parkstraße', 'Schillerstraße', 'Goethestraße', 'Lessingstraße', 'Mozartweg', 'Tulpenweg',
  'Ulmenweg', 'Blumenstraße', 'Hafenstraße', 'Poststraße', 'Heckenweg', 'Heideweg', 'Lerchenweg', 'Finkenweg',
  'Amselweg', 'Drosselgasse', 'Querstraße', 'Ringstraße'];
const STRASSEN_VOR = ['', 'Neue ', 'Obere ', 'Untere ', 'Äußere ', 'Kleine '];

// ─── Speicherlayout: Struct-of-Arrays ────────────────────────────────────────────────
// Personen: eine typisierte Array pro Feld, Index = Personen-ID. [Name, Typ, Plätze pro Person]
const PF = [
  ['lebt', Uint8Array, 1], ['gen', Uint16Array, 1],
  ['vor', Uint16Array, 1], ['nach', Uint16Array, 1], ['weib', Uint8Array, 1],
  ['geb', Int32Array, 1],                                   // Geburtstag als Spieltag (kann negativ sein)
  ['fleiss', Uint8Array, 1], ['gesellig', Uint8Array, 1], ['ehrgeiz', Uint8Array, 1],
  ['spar', Uint8Array, 1], ['heimat', Uint8Array, 1],
  ['bGeld', Float32Array, 1], ['bWohnen', Float32Array, 1], ['bKontakt', Float32Array, 1], ['bFreizeit', Float32Array, 1],
  ['zuf', Float32Array, 1], ['zufZiel', Float32Array, 1],          // Zufriedenheit und ihr Zielwert (alle 6 h neu)
  ['geld', Int32Array, 1],
  ['wohnung', Int32Array, 1],                               // Gebäude, in dem die Person wohnt, -1 = keins
  ['hh', Int32Array, 1],                                    // Haushalt = ID des Mieters, -1 = keiner
  ['arbeit', Int32Array, 1], ['besitz', Int32Array, 1],     // Arbeitsstelle, eigener Betrieb
  ['partner', Int32Array, 1],
  ['elternA', Int32Array, 1], ['elternB', Int32Array, 1], ['elternAGen', Uint16Array, 1], ['elternBGen', Uint16Array, 1],
  ['kinder', Uint8Array, 1],
  ['freunde', Int32Array, 5],                               // feste Plätze, -1 = leer
  ['ziel', Uint8Array, 1], ['zielSeit', Int32Array, 1], ['zielWert', Int32Array, 1],
  ['memCode', Uint8Array, 8], ['memTag', Int32Array, 8], ['memRef', Int32Array, 8], ['memGen', Uint16Array, 8],
  ['memPos', Uint8Array, 1],                                // Ringpuffer: nächster Schreibplatz
  ['frei', Uint8Array, 1],                                  // hat sich heute freigenommen
  ['elend', Uint8Array, 1], ['unzuf', Uint8Array, 1],       // Tage in Folge unter 20 bzw. unter 40
  ['trauer', Uint8Array, 1], ['ohneLaden', Uint8Array, 1],
  ['stammladen', Int32Array, 1],                            // hier kauft die Person ein, solange er offen, nah und nicht voll ist
  ['sperreBis', Int32Array, 1],                             // keine Gründung bis zu diesem Tag (nach Pleite)
  // Wann zuletzt erlebt (Spieltag). Wird beim Erinnern gesetzt, damit die 30-Tage-Wirkungen nicht verfallen,
  // nur weil der 8er-Ringpuffer inzwischen von neueren Ereignissen überschrieben wurde.
  ['jobWegTag', Int32Array, 1], ['getrenntTag', Int32Array, 1], ['kindTag', Int32Array, 1], ['trauerTag', Int32Array, 1],
  ['suchPause', Uint8Array, 1],                             // Tage, bis eine erfolglose Wohnungssuche wiederholt wird
  ['jetzt', Uint8Array, 1],                                 // Entscheidung fällig (nach einem Ereignis)
  ['sucht', Uint8Array, 1],                                 // hat erfolglos eine Wohnung gesucht
  ['einzug', Int32Array, 1], ['sparSeit', Int32Array, 1],
];
// Gebäude: höchstens eins pro Feld, daher feste Größe FELDER.
const GF = [
  ['typ', Uint8Array], ['stufe', Uint8Array], ['auf', Uint8Array], ['x', Uint8Array], ['y', Uint8Array],
  ['besitzer', Int32Array], ['kasse', Int32Array], ['minus', Uint16Array], ['bauBis', Int32Array],
  ['lohn', Uint16Array], ['belegt', Uint16Array], ['leer', Uint8Array], ['seit', Int32Array],
  ['str', Int16Array], ['umsatz', Int32Array], ['parkNah', Uint8Array],
  ['laden', Int32Array],                                                   // Wohnhaus: nächster Laden in Reichweite (-1 = keiner)
  ['knapp', Uint8Array],                                                   // Wohnhaus: so viele gingen gestern beim Einkauf leer aus
  ['mangel', Uint16Array],                                                 // Wohnhaus: so viele gingen gestern in Ladenreichweite leer aus
  ['kapaz', Int32Array], ['bedient', Int32Array],                          // Laden: Kundschaft heute möglich / bedient
  ['offeneStellen', Int16Array],                                           // Betrieb: freie Stellen, solange er offen ist (live)
];

// ─── Zufall: mulberry32, Zustand liegt in S (speicherbar) ────────────────────────────
function zufall(S) {
  let t = (S.rs = (S.rs + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function zInt(S, n) { return (zufall(S) * n) | 0; }

// ─── Hilfen ──────────────────────────────────────────────────────────────────────────
const zelle = (x, y) => y * KARTE + x;
const viertel = (x, y) => ((y / VK) | 0) * VN + ((x / VK) | 0);
const klemme = (v, a, b) => (v < a ? a : v > b ? b : v);
function alterTage(S, p) { return S.tag - S.p.geb[p]; }
function erwachsen(S, p) { return S.tag - S.p.geb[p] >= R.ERWACHSEN * R.JAHR; }
function gebZelle(S, b) { return S.g.y[b] * KARTE + S.g.x[b]; }

function vorname(S, p) { const P = S.p; return (P.weib[p] ? VORNAMEN_W : VORNAMEN_M)[P.vor[p]]; }
function name(S, p) { return vorname(S, p) + ' ' + NACHNAMEN[S.p.nach[p]]; }
function strName(i) {
  if (i < 0) return 'Straße';
  return STRASSEN_VOR[Math.floor(i / STRASSEN.length) % STRASSEN_VOR.length] + STRASSEN[i % STRASSEN.length];
}
// Straßennamen im Satz: Dativ („an der Neuen Hauptstraße“, „am Oberen Birkenweg“) und Akkusativ
// („die Neue Hauptstraße“, „den Oberen Birkenweg“).
const beugen = (n) => n.replace(/^(Neue|Obere|Untere|Äußere|Kleine) /, (m, a) => a + 'n ');
function ortVon(i) {
  const n = strName(i);
  if (n.endsWith('weg')) return 'am ' + beugen(n);
  if (n.endsWith('gasse')) return 'in der ' + beugen(n);
  return 'an der ' + beugen(n);
}
function strAkk(i) {
  const n = strName(i);
  return n.endsWith('weg') ? 'den ' + beugen(n) : 'die ' + n;
}
function gebOrt(S, b) { return ortVon(S.g.str[b]); }

// Ringsuche über die Viertel-Listen: nie über das ganze Raster.
// kosten(id) → Zahl ≥ 0 oder -1 (passt nicht). Liefert die ID mit den kleinsten Kosten.
function suche(liste, x, y, kosten) {
  const vx = (x / VK) | 0, vy = (y / VK) | 0;
  let best = -1, bestK = Infinity, fund = -1;
  for (let r = 0; r < VN; r++) {
    if (fund >= 0 && r > fund + 1) break;       // ein Ring weiter prüfen, dann Schluss
    const y0 = Math.max(0, vy - r), y1 = Math.min(VN - 1, vy + r);
    const x0 = Math.max(0, vx - r), x1 = Math.min(VN - 1, vx + r);
    for (let yy = y0; yy <= y1; yy++) {
      const randZeile = yy === vy - r || yy === vy + r;
      for (let xx = x0; xx <= x1; xx++) {
        if (!randZeile && xx !== vx - r && xx !== vx + r) continue;
        const L = liste[yy * VN + xx];
        for (let i = 0; i < L.length; i++) {
          const k = kosten(L[i]);
          if (k >= 0 && k < bestK) { bestK = k; best = L[i]; }
        }
      }
    }
    if (best >= 0 && fund < 0) fund = r;
  }
  return best;
}

function listeRaus(L, v) { const i = L.indexOf(v); if (i >= 0) L.splice(i, 1); }

function buch(S, text) {
  S.buch.push({ tag: S.tag, text });
  if (S.buch.length > R.BUCH_MAX) S.buch.shift();
}

// ─── Personen anlegen und entfernen ──────────────────────────────────────────────────
function kapazitaet(S, min) {
  if (S.pKap >= min) return;
  let neu = Math.max(256, S.pKap);
  while (neu < min) neu *= 2;
  for (const [n, T, k] of PF) {
    const a = new T(neu * k);
    if (S.p[n]) a.set(S.p[n]);
    S.p[n] = a;
  }
  const hg = new Uint16Array(neu), hk = new Uint16Array(neu);
  if (S.hhGroesse) { hg.set(S.hhGroesse); hk.set(S.hhKinder); }
  S.hhGroesse = hg; S.hhKinder = hk;
  S.pKap = neu;
}

// Achtung: kann die Arrays in S.p ersetzen. Wer danach schreibt, holt S.p neu.
function neuePerson(S) {
  let id;
  if (S.frei.length) id = S.frei.pop();
  else { kapazitaet(S, S.pMax + 1); id = S.pMax++; }
  const P = S.p;
  for (const [n, , k] of PF) {
    if (n === 'gen') continue;
    const a = P[n];
    for (let j = id * k; j < id * k + k; j++) a[j] = 0;
  }
  P.gen[id] = (P.gen[id] + 1) & 0xffff;
  P.wohnung[id] = P.hh[id] = P.arbeit[id] = P.besitz[id] = P.partner[id] = P.elternA[id] = P.elternB[id] = -1;
  P.stammladen[id] = -1;
  P.jobWegTag[id] = P.getrenntTag[id] = P.kindTag[id] = P.trauerTag[id] = -9999;
  S.hhGroesse[id] = 0; S.hhKinder[id] = 0;
  for (let j = 0; j < 5; j++) P.freunde[id * 5 + j] = -1;
  for (let j = 0; j < R.MEM; j++) P.memRef[id * R.MEM + j] = -1;
  P.lebt[id] = 1;
  S.einwohner++;
  return id;
}

function zufallsCharakter(S, p) {
  const P = S.p;
  P.fleiss[p] = zInt(S, 101); P.gesellig[p] = zInt(S, 101); P.ehrgeiz[p] = zInt(S, 101);
  P.spar[p] = zInt(S, 101); P.heimat[p] = zInt(S, 101);
}
function zufallsName(S, p) {
  const P = S.p;
  P.weib[p] = zufall(S) < 0.5 ? 1 : 0;
  P.vor[p] = zInt(S, (P.weib[p] ? VORNAMEN_W : VORNAMEN_M).length);
  P.nach[p] = zInt(S, NACHNAMEN.length);
}
function bedarfStart(S, p) {
  const P = S.p;
  P.bKontakt[p] = 55; P.bFreizeit[p] = 70; P.bGeld[p] = 50; P.bWohnen[p] = 60; P.zuf[p] = 60; P.zufZiel[p] = 60;
}
function erwachsenZaehlen(S, p) {
  const P = S.p, st = S.stat;
  st.erwachsene++; st.erwEhrgeiz += P.ehrgeiz[p]; st.erwHeimat += P.heimat[p];
}

// Ein Ereignis ins Gedächtnis schreiben. Jedes Ereignis löst eine Entscheidung in der nächsten Stunde aus
// („direkt nach einem Ereignis“); wer es selbst ausgelöst hat, hat gerade entschieden (siehe stunde).
function erinnere(S, p, code, ref) {
  const P = S.p, k = P.memPos[p], i = p * R.MEM + k;
  P.memCode[i] = code; P.memTag[i] = S.tag; P.memRef[i] = ref;
  P.memGen[i] = M_BEZUG[code] === 'p' && ref >= 0 ? P.gen[ref] : 0;
  P.memPos[p] = (k + 1) % R.MEM;
  if (code === M.JOB_WEG) P.jobWegTag[p] = S.tag;
  else if (code === M.GETRENNT) P.getrenntTag[p] = S.tag;
  else if (code === M.KIND) P.kindTag[p] = S.tag;
  else if (code === M.GESTORBEN) P.trauerTag[p] = S.tag;
  P.jetzt[p] = 1;
}
const innerhalb = (S, tagWert, tage) => S.tag - tagWert <= tage;
function erinnertSeit(S, p, code, tage, ref) {
  const P = S.p, o = p * R.MEM, t = S.tag - tage;
  for (let i = o; i < o + R.MEM; i++) {
    if (P.memCode[i] === code && P.memTag[i] >= t && (ref === undefined || P.memRef[i] === ref)) return true;
  }
  return false;
}

// Person verlässt die Stadt (Tod oder Wegzug). Räumt alle Verweise auf, gibt den Platz frei.
function entferne(S, q) {
  const P = S.p;
  if (P.besitz[q] >= 0) {
    const b = P.besitz[q];
    const n = schliessen(S, b, false);
    buch(S, `${S.g.typ[b] === LADEN ? 'Der Laden' : 'Die Werkstatt'} von ${name(S, q)} ${gebOrt(S, b)} schließt, ${S.p.weib[q] ? 'sie' : 'er'} ist nicht mehr da.` +
      (n ? ` ${n} ${n === 1 ? 'Person verliert' : 'Leute verlieren'} die Arbeit.` : ''));
  }
  austreten(S, q);
  const w = P.wohnung[q], kopf = P.hh[q];
  if (w >= 0) listeRaus(S.bewohner[w], q);
  P.wohnung[q] = -1; P.hh[q] = -1;
  if (kopf === q && w >= 0) mieterWechsel(S, q, w);
  const pa = P.partner[q];
  if (pa >= 0) P.partner[pa] = -1;
  P.partner[q] = -1;

// ─── Das Gehirn: Entscheiden per Punktwertung ────────────────────────────────────────
function entscheide(S, p, h) {

  const alter = (tag - P.geb[p]) / R.JAHR;
  const F = P.fleiss[p] / 100, Gs = P.gesellig[p] / 100, E = P.ehrgeiz[p] / 100;
  const Sp = P.spar[p] / 100, H = P.heimat[p] / 100;
  // Gedächtnis wirkt: Job verloren in den letzten 30 Tagen → Geld zählt 1,5-fach
  const uGeld = (100 - P.bGeld[p]) * (innerhalb(S, P.jobWegTag[p], 30) ? 1.5 : 1);
  const uWohnen = 100 - P.bWohnen[p], uKontakt = 100 - P.bKontakt[p], uFrei = 100 - P.bFreizeit[p];
  const arb = P.arbeit[p], istBesitzer = P.besitz[p] >= 0, pa = P.partner[p];

  // Höchster Wert gewinnt; liegt keiner über der Schwelle, bleibt alles wie es ist.

  let best = R.SCHWELLE, bestA = 0, v;

  if ((P.wohnung[p] < 0 || P.bWohnen[p] < 40) && !P.suchPause[p] && !(P.sucht[p] && S.freieWohnungen <= 0)
      && (arb >= 0 || P.geld[p] >= 10 * R.MIETE[1] || alter >= R.RENTE)) {
    v = uWohnen * (P.wohnung[p] < 0 ? 1.3 : 0.4 + 0.8 * (1 - H)) + (zg === Z.WOHNUNG ? 25 : 0);
    if (v + ZF > best) { v += (zufall(S) * 2 - 1) * ZF; if (v > best) { best = v; bestA = A.WOHNUNG; } }
  }
  // job_suchen: 18–67, ohne Job
  if (erwerb && arb < 0 && !istBesitzer && S.freieStellen > 0) {
    v = uGeld * (0.5 + 0.9 * F) + 15 + (zg === Z.JOB ? 20 : 0);
    if (v + ZF > best) { v += (zufall(S) * 2 - 1) * ZF; if (v > best) { best = v; bestA = A.JOB; } }
  }
  // job_wechseln: eine besser bezahlte Stelle ist frei
  if (arb >= 0 && !istBesitzer && besterFreierLohn(S) > g.lohn[arb] + 3) {
    v = 45 * E + 0.3 * uGeld + (zg === Z.JOB ? 30 : 0) - 5;
    if (v + ZF > best) { v += (zufall(S) * 2 - 1) * ZF; if (v > best) { best = v; bestA = A.WECHSEL; } }
  }
  // kuendigen: Geld für 20 Tage
  if (arb >= 0 && !istBesitzer && P.geld[p] >= 20 * tageskosten(S, p)) {
    v = (1 - F) * (100 - P.zuf[p]) * 0.8 + (zg === Z.RUHE ? 15 : 0) - 15;
    if (v + ZF > best) { v += (zufall(S) * 2 - 1) * ZF; if (v > best) { best = v; bestA = A.KUENDIGEN; } }
  }

    if (v + ZF > best) { v += (zufall(S) * 2 - 1) * ZF; if (v > best) { best = v; bestA = A.FREI; } }
  }

  if (h >= 17) {

    if (v + ZF > best) { v += (zufall(S) * 2 - 1) * ZF; if (v > best) { best = v; bestA = A.FREUNDE; } }
  }
  // partner_suchen — Gedächtnis: getrennt in den letzten 30 Tagen → keine Partnersuche

    if (v + ZF > best) { v += (zufall(S) * 2 - 1) * ZF; if (v > best) { best = v; bestA = A.PARTNER; } }

      if (v + ZF > best) { v += (zufall(S) * 2 - 1) * ZF; if (v > best) { best = v; bestA = A.ZUSAMMEN; } }
    }
    // trennen: selten, per Zufall, nur wenn beide 14 Tage unzufrieden
    if (P.unzuf[p] >= R.UNZUF_TAGE && P.unzuf[pa] >= R.UNZUF_TAGE && zufall(S) < 0.03) {
      v = 60; if (v + ZF > best) { v += (zufall(S) * 2 - 1) * ZF; if (v > best) { best = v; bestA = A.TRENNEN; } }
    }

  // Ehrgeiz treibt, Sparsamkeit bremst; Gedächtnis: Pleite → 180 Tage Sperre (sperreBis wird beim Erinnern gesetzt).
  if (!istBesitzer && alter < 60 && P.sperreBis[p] <= tag && kannGruenden(S, p)) {

  }

  // Wenig Heimatliebe: geht gleich. Mittel: geht, wenn das Elend anhält. Ab etwa 60: bleibt.
  // Gedächtnis: jemand Nahes gestorben → Heimatliebe zählt stärker.

  }

  if (!bestA) return 0;
  let ok = false;
  switch (bestA) {
    case A.WOHNUNG: ok = aktWohnung(S, p); break;
    case A.JOB: ok = aktJob(S, p, 0); break;
    case A.WECHSEL: ok = aktJob(S, p, g.lohn[arb] + 3); break;
    case A.KUENDIGEN: ok = aktKuendigen(S, p); break;
    case A.FREI: P.frei[p] = 1; ok = true; break;
    case A.FREUNDE: ok = aktFreunde(S, p); break;
    case A.PARTNER: ok = aktPartner(S, p); break;
    case A.ZUSAMMEN: ok = aktZusammen(S, p); break;
    case A.TRENNEN: ok = aktTrennen(S, p); break;
    case A.KIND: ok = aktKind(S, p); break;
    case A.GRUENDEN: ok = aktGruenden(S, p); break;
    case A.WEGZIEHEN: ok = aktWegziehen(S, p); break;

// ─── Die Aktionen ────────────────────────────────────────────────────────────────────

  const ref = P.arbeit[p] >= 0 ? P.arbeit[p] : P.wohnung[p];
  const x = ref >= 0 ? g.x[ref] : MITTE, y = ref >= 0 ? g.y[ref] : MITTE;
  const groesse = kopf >= 0 ? S.hhGroesse[kopf] : 1;
  // Wer schon eine eigene Wohnung hat, zieht nur um, wenn die neue wirklich besser ist
  const mindest = kopf >= 0 ? wohnwert(S, P.wohnung[p], groesse) + 5 : -1;
  const b = freieWohnungNahe(S, x, y, kopf >= 0 ? P.wohnung[p] : -1, groesse, mindest);

    P.sucht[p] = 1; P.suchPause[p] = 5;
    if (kopf < 0) S.freieWohnungen = 0;

  }

  const arb = P.arbeit[p];
  const b = suche(S.vBetrieb, x, y, q => (g.offeneStellen[q] > 0 && g.lohn[q] > mindestLohn && q !== arb)
    ? Math.abs(g.x[q] - x) + Math.abs(g.y[q] - y) : -1);

  if (fs.length) {
    const f = fs[zInt(S, fs.length)];

    P.bKontakt[f] = Math.min(100, P.bKontakt[f] + 15);

    if (fs.length < 5 && zufall(S) < 0.2) {

function aktPartner(S, p) {

  let best = -1, bestW = -1;

    if (q < 0 || q === p || !P.lebt[q] || P.partner[q] >= 0 || !erwachsen(S, q)) return;

    if (innerhalb(S, P.getrenntTag[q], 30)) return;

        if (frei > 0) { fs += frei; S.freiLohn[g.lohn[b]] += frei; }
        if (t === LADEN) laeden++;
      }
    } else if (t === PARK) S.vParks[viertel(g.x[b], g.y[b])]++;
  }
  S.freieWohnungen = fw; S.freieStellen = fs; S.leerstand = leer; S.werkstattPlaetze = wp;
  let zs = 0, zn = 0, erwerb = 0, los = 0, suchende = 0;
  S.vZufSumme.fill(0); S.vZufN.fill(0);
  for (let p = 0; p < S.pMax; p++) {
    if (!P.lebt[p] || P.geb[p] > erw) continue;
    zs += P.zuf[p]; zn++;
    if (P.geb[p] > rente && P.besitz[p] < 0) { erwerb++; if (P.arbeit[p] < 0) los++; }
    if (P.wohnung[p] < 0 || P.sucht[p]) suchende++;
    const w = P.wohnung[p];
    if (w >= 0) {
      const v = viertel(g.x[w], g.y[w]);
      S.vZufSumme[v] += P.zuf[p]; S.vZufN[v]++;
    }
  }
  S.zufMittel = zn ? zs / zn : 0;
  S.erwachseneJetzt = zn;
  S.arbeitslose = los;
  S.arbeitslosenquote = erwerb ? los / erwerb : 0;
  S.wohnungSuchende = suchende;
}

// Zuzug: Attraktivität = freie Wohnungen × freie Stellen × mittlere Zufriedenheit, normiert.
function zuzug(S) {
  // Normierung: Als frei zählen nur Stellen, die nicht schon Arbeitslose der Stadt besetzen könnten.
  const fw = S.freieWohnungen, fs = Math.max(0, S.freieStellen - S.arbeitslose);
  const zf = klemme((S.zufMittel - 25) / 50, 0, 1);
  const basis = 2 + S.einwohner * 0.02;
  const attraktiv = (fw / (fw + 3)) * (fs / (fs + 3)) * zf;
  let n = Math.min(fw, Math.floor(attraktiv * basis + zufall(S)));
  // Wer kommen würde, aber keine Wohnung findet, zählt beim Bauamt als wohnungssuchend
  S.anfragen = Math.max(0, Math.round((fs / (fs + 3)) * zf * basis) - n);
  const neu = [];
  for (let i = 0; i < n; i++) {
    const b = freieWohnungNahe(S, MITTE, MITTE, -1, 1);
    if (b < 0) break;
    const p = neuePerson(S);
    const P = S.p;
    zufallsName(S, p); zufallsCharakter(S, p);
    P.geb[p] = S.tag - (18 + zInt(S, 28)) * R.JAHR - zInt(S, R.JAHR);
    P.geld[p] = 300 + zInt(S, 1201);
    bedarfStart(S, p);
    eigenerHaushalt(S, p, b);
    P.einzug[p] = S.tag; P.sparSeit[p] = S.tag;
    erinnere(S, p, M.EINGEZOGEN, b);
    zielWaehlen(S, p);
    P.jetzt[p] = 1;
    S.stat.zuzuege++; erwachsenZaehlen(S, p);
    neu.push(p);
  }
  // Zuzüge eines Tages stehen in einer Zeile, sonst würden sie das Stadtbuch (500 Zeilen) allein füllen.
  const grund = ` Es gibt ${fs} freie ${fs === 1 ? 'Stelle' : 'Stellen'} und ${fw} freie ${fw === 1 ? 'Wohnung' : 'Wohnungen'}, die Stimmung liegt bei ${Math.round(S.zufMittel)}.`;
  if (neu.length === 1) buch(S, `${name(S, neu[0])} zieht zu, ${gebOrt(S, S.p.wohnung[neu[0]])}.` + grund);
  else if (neu.length > 1) buch(S, `${neu.length} Leute ziehen zu, darunter ${name(S, neu[0])} und ${name(S, neu[1])}.` + grund);
}

// ─── Das Bauamt ──────────────────────────────────────────────────────────────────────
function vollesHaus(S) {
  const g = S.g;
  return suche(S.vHaus, MITTE, MITTE, b => {
    if (g.typ[b] !== WOHNHAUS || S.feld[gebZelle(S, b)] !== WOHNHAUS || g.auf[b] || g.stufe[b] >= 3) return -1;
    if (g.belegt[b] < R.WOHNUNGEN[g.stufe[b]]) return -1;
    return Math.abs(g.x[b] - MITTE) + Math.abs(g.y[b] - MITTE);
  });
}
function aufstocken(S, b, grund) {
  const g = S.g, ziel = g.stufe[b] + 1;
  S.budget -= R.K_AUF[ziel];
  g.auf[b] = ziel; g.bauBis[b] = S.tag + R.D_AUF; S.baustellen.push(b);
  const mehr = R.WOHNUNGEN[ziel] - R.WOHNUNGEN[g.stufe[b]];
  S.wohnungenImBau += mehr;
  S.stat.bauamt.aufstockungen++;
  buch(S, `Das Bauamt stockt das Wohnhaus ${gebOrt(S, b)} auf Stufe ${ziel} auf. ${grund}`);
  return mehr;
}
function bauamt(S) {
  const g = S.g, st = S.stat.bauamt;
  const suchende = S.wohnungSuchende + S.anfragen;
  let geplant = S.freieWohnungen + S.wohnungenImBau;
  const maxBauten = 1 + Math.floor(S.einwohner / 300);
  let bauten = 0;
  // 1. Mehr Wohnungssuchende als freie Wohnungen → Wohnhaus (4.: volles Haus lieber aufstocken)
  while (suchende > geplant && bauten < maxBauten) {
    const grund = `${suchende} Leute suchen eine Wohnung, frei ${S.freieWohnungen === 1 ? 'ist' : 'sind'} ${S.freieWohnungen}.`;
    const auf = vollesHaus(S);
    if (auf >= 0 && S.budget >= R.K_AUF[g.stufe[auf] + 1]) { geplant += aufstocken(S, auf, grund); bauten++; continue; }
    if (S.budget < R.K_HAUS) break;
    const c = bauplatzNahe(S, MITTE, MITTE);
    if (c < 0) break;
    S.budget -= R.K_HAUS;
    const b = neuesGebaeude(S, WOHNHAUS, c % KARTE, (c / KARTE) | 0, R.D_HAUS, -1);
    geplant += R.WOHNUNGEN[1]; bauten++; st.haeuser++;
    buch(S, `Das Bauamt baut ein Wohnhaus ${gebOrt(S, b)}. ${grund}`);
  }
  // 2. Kein freies Feld an einer Straße → Straße verlängern
  if (S.bauplaetze === 0 && S.budget >= RASTER * R.K_STRASSE) {
    const r = strasseVerlaengern(S);
    if (r) {
      S.budget -= r.neu * R.K_STRASSE; st.strassen++;
      buch(S, r.abzweig
        ? `Das Bauamt legt ${strAkk(r.str)} an, Richtung ${RICHTUNG(r.dx, r.dy)}. Es gab keinen freien Bauplatz mehr.`
        : `Das Bauamt verlängert ${strAkk(r.str)} nach ${RICHTUNG(r.dx, r.dy)}. Es gab keinen freien Bauplatz mehr.`);
    }
  }
  // 3. Zufriedenheit im Viertel unter 50 und Budget übrig → Park
  if (S.budget >= R.K_PARK + R.K_HAUS) {
    let schlecht = -1, schlechtZ = 50;
    for (let v = 0; v < VN * VN; v++) {
      if (S.vZufN[v] < 8) continue;
      const z = S.vZufSumme[v] / S.vZufN[v];
      if (z < schlechtZ && S.vParks[v] < 1 + S.vZufN[v] / 60) { schlechtZ = z; schlecht = v; }
    }
    if (schlecht >= 0) {
      const cx = (schlecht % VN) * VK + VK / 2, cy = ((schlecht / VN) | 0) * VK + VK / 2;
      const c = bauplatzNahe(S, cx, cy);
      if (c >= 0 && viertel(c % KARTE, (c / KARTE) | 0) === schlecht) {
        S.budget -= R.K_PARK;
        const b = neuesGebaeude(S, PARK, c % KARTE, (c / KARTE) | 0, R.D_PARK, -1);
        S.vParks[schlecht]++; st.parks++;
        buch(S, `Das Bauamt legt einen Park ${gebOrt(S, b)} an. Im Viertel lag die Zufriedenheit bei ${Math.round(schlechtZ)}.`);
      }
    }
  }
  // 4. Vorhandenes Wohnhaus voll und Budget übrig → aufstocken
  const auf = vollesHaus(S);
  if (auf >= 0 && S.budget >= 2 * R.K_AUF[g.stufe[auf] + 1]) aufstocken(S, auf, 'Es war voll, und im Budget war Geld übrig.');
  // 5. Notbremse: 14 Tage keine Gründung und über 20 % ohne Arbeit → Werkstatt der Stadt
  if (S.tag - S.letzteGruendung >= 14 && S.tag - S.letzteNotbremse >= 14 && S.arbeitslosenquote > 0.2
      && S.budget >= R.K_WERKSTATT) {
    const c = bauplatzNahe(S, MITTE, MITTE);
    if (c >= 0) {
      S.budget -= R.K_WERKSTATT;
      const b = neuesGebaeude(S, WERKSTATT, c % KARTE, (c / KARTE) | 0, R.D_WERKSTATT, -1);
      S.letzteNotbremse = S.tag; st.notwerkstaetten++;
      buch(S, `Notbremse: Die Stadt baut eine Werkstatt ${gebOrt(S, b)}. Seit ${S.tag - S.letzteGruendung} Tagen hat niemand gegründet, ${Math.round(S.arbeitslosenquote * 100)} % sind ohne Arbeit.`);
    }
  }
}

// ─── Start ───────────────────────────────────────────────────────────────────────────
function neueStadt(seed) {
  const S = {
    version: VERSION, seed: seed >>> 0, rs: seed >>> 0,
    tag: 0, stunde: 6, budget: R.START_BUDGET,
    feld: new Uint8Array(FELDER), feldGeb: new Int32Array(FELDER).fill(-1),
    feldStr: new Int16Array(FELDER).fill(-1), platz: new Uint8Array(FELDER),
    vHaus: [], vBetrieb: [], vPark: [], vPlatz: [], bauplaetze: 0, enden: [], kreuzungen: [], strNaechste: 0,
    g: {}, gAnzahl: 0, bewohner: [], belegschaft: [], baustellen: [], ladenWahl: [],
    p: {}, pKap: 0, pMax: 0, frei: [], einwohner: 0, hhGroesse: null, hhKinder: null,
    freieWohnungen: 0, wohnungenImBau: 0, freieStellen: 0, freiLohn: new Int32Array(128), leerstand: 0, leerTyp: new Int32Array(8),
    exportPreis: R.EXPORT_MAX, zufMittel: 60, erwachseneJetzt: 0, arbeitslose: 0, arbeitslosenquote: 0,
    wohnungSuchende: 0, anfragen: 0, unversorgtQuote: 0, werkstattPlaetze: 0, letzteGruendung: 0, letzteNotbremse: -999,
    vZufSumme: new Float64Array(VN * VN), vZufN: new Uint32Array(VN * VN), vParks: new Uint16Array(VN * VN),
    ladenDirty: true, parkDirty: true,
    buch: [], reihe: [],
    stat: {
      gruendungen: 0, uebernahmen: 0, pleiten: 0, pleitenLaden: 0, pleiteAlter: 0, geburten: 0, tode: 0, zuzuege: 0,
      wegzuege: 0, wegzuegePersonen: 0, hochzeiten: 0, trennungen: 0, paare: 0, freundschaften: 0,
      zieleErreicht: 0, zieleAufgegeben: 0, strassenFelder: 0,
      gruenderEhrgeiz: 0, wegzugHeimat: 0, erwachsene: 0, erwEhrgeiz: 0, erwHeimat: 0,
      bauamt: { haeuser: 0, aufstockungen: 0, parks: 0, strassen: 0, notwerkstaetten: 0 },
      gewaehlt: new Array(13).fill(0), ausgefuehrt: new Array(13).fill(0),
    },
  };
  for (let v = 0; v < VN * VN; v++) { S.vHaus.push([]); S.vBetrieb.push([]); S.vPark.push([]); S.vPlatz.push([]); }
  for (const [n, T] of GF) S.g[n] = new T(FELDER);
  kapazitaet(S, 256);
  // Eine Straße, zwei Wohnhäuser, eine Werkstatt der Stadt, ein Laden, zehn Erwachsene
  const str = S.strNaechste++;
  for (let x = 40; x <= 56; x++) strasseSetzen(S, x, MITTE, str);
  S.enden.push({ x: 40, y: MITTE, dx: -1, dy: 0, str }, { x: 56, y: MITTE, dx: 1, dy: 0, str });
  const h1 = neuesGebaeude(S, WOHNHAUS, 47, 47, 0, -1);
  const h2 = neuesGebaeude(S, WOHNHAUS, 49, 47, 0, -1);
  neuesGebaeude(S, WERKSTATT, 47, 49, 0, -1);
  neuesGebaeude(S, LADEN, 49, 49, 0, -1);
  for (let i = 0; i < 10; i++) {
    const p = neuePerson(S);
    const P = S.p;
    zufallsName(S, p); zufallsCharakter(S, p);
    P.geb[p] = -(20 + zInt(S, 21)) * R.JAHR - zInt(S, R.JAHR);
    P.geld[p] = 300 + zInt(S, 501);
    bedarfStart(S, p);
    eigenerHaushalt(S, p, i < 5 ? h1 : h2);
    erinnere(S, p, M.EINGEZOGEN, P.wohnung[p]);
    zielWaehlen(S, p);
    P.jetzt[p] = 1;
    erwachsenZaehlen(S, p);
  }
  ladenZuordnen(S); parksZuordnen(S); haushalteZaehlen(S); kennzahlenRechnen(S);
  buch(S, 'Zehn Leute kommen auf eine leere Wiese an der Hauptstraße. Es gibt zwei Wohnhäuser, eine Werkstatt der Stadt und einen Laden.');
  return S;
}

// Kennzahlen für Anzeige und Test (liest nur)
function kennzahlen(S) {
  const g = S.g;
  let haeuser = 0, werkstaetten = 0, laeden = 0, parks = 0, leer = 0, stadtBetriebe = 0;
  for (let b = 0; b < S.gAnzahl; b++) {
    const f = S.feld[gebZelle(S, b)];
    if (f === BAUSTELLE) continue;
    const t = g.typ[b];
    if (t === WOHNHAUS) haeuser++;
    else if (t === PARK) parks++;
    else {
      if (t === WERKSTATT) werkstaetten++; else laeden++;
      if (g.leer[b]) leer++; else if (g.besitzer[b] < 0) stadtBetriebe++;
    }
  }
  return {
    tag: S.tag, stunde: S.stunde, einwohner: S.einwohner, erwachsene: S.erwachseneJetzt,
    gebaeude: haeuser + werkstaetten + laeden + parks, haeuser, werkstaetten, laeden, parks,
    baustellen: S.baustellen.length, leerstand: leer, stadtBetriebe,
    freieWohnungen: S.freieWohnungen, freieStellen: S.freieStellen, arbeitslose: S.arbeitslose,
    arbeitslosenquote: S.arbeitslosenquote, zufriedenheit: S.zufMittel, budget: S.budget,
    exportPreis: S.exportPreis, unversorgt: S.unversorgtQuote, gruendungen: S.stat.gruendungen, pleiten: S.stat.pleiten,
  };
}

G.StadtSim = {
  VERSION, R, KARTE, VK, VN, RASTER, RAND, LEER, STRASSE, WOHNHAUS, WERKSTATT, LADEN, PARK, BAUSTELLE,
  M, Z, ZIELNAMEN, AKTIONSNAMEN,
  neueStadt, stunde, kennzahlen, name, strName,
};
})(globalThis);
