<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08080b">
<title>LETZTE LEGION — Character Database</title>
<style>
  :root{
    --ink:#eef0f4; --dim:#9296a6; --faint:#7e8194;
    --bg0:#07070a; --bg1:#0d0e13; --bg2:#14161d; --bg3:#1c1f28;
    --line:rgba(255,255,255,.09);
    --accent:#6f9fdf; --accent-dim:rgba(111,159,223,.16);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --pad:clamp(14px,2.4vw,28px);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--ink);
    font-family:var(--sans);overscroll-behavior:none}
  body{position:fixed;inset:0}

  #scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #scene.dragging{cursor:grabbing}

  /* Vignette + Scanline-Hauch: liegt ueber dem Canvas, nie ueber der UI */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:
      radial-gradient(120% 85% at 50% 42%,transparent 42%,rgba(0,0,0,.55) 100%),
      linear-gradient(rgba(255,255,255,.014) 50%,transparent 50%);
    background-size:100% 100%,100% 3px;mix-blend-mode:normal}

  #scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(90deg,rgba(4,4,7,.88) 0%,rgba(4,4,7,.62) 20%,
      rgba(4,4,7,.22) 34%,transparent 46%);opacity:1;transition:opacity .45s var(--ease)}
  #scrim.idle{opacity:0}
  @media (max-width:680px){
    #scrim{background:linear-gradient(0deg,rgba(4,4,7,.9) 0%,rgba(4,4,7,.66) 26%,
      rgba(4,4,7,.2) 42%,transparent 56%)}
  }
  #ui{position:fixed;inset:0;z-index:2;pointer-events:none;
    display:grid;grid-template-rows:auto 1fr auto;
    padding:calc(var(--pad) + env(safe-area-inset-top)) calc(var(--pad) + env(safe-area-inset-right))
            calc(var(--pad) + env(safe-area-inset-bottom)) calc(var(--pad) + env(safe-area-inset-left))}

  /* ---------- Kopf ---------- */
  #brand{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .brand-mark{font-size:clamp(15px,1.5vw,19px);font-weight:800;letter-spacing:.34em;
    line-height:1;text-shadow:0 2px 20px rgba(0,0,0,.8)}
  .brand-sub{margin-top:7px;font-family:var(--mono);font-size:10px;letter-spacing:.3em;
    color:var(--faint)}
  .brand-sub b{color:var(--accent);font-weight:600;transition:color .5s var(--ease)}
  #sysline{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--faint);
    text-align:right;line-height:1.9;white-space:nowrap}
  #sysline i{font-style:normal;color:var(--dim)}

  /* ---------- Dossier ---------- */
  #stage{position:relative;min-height:0}
  #dossier.idle{opacity:0!important;pointer-events:none}
  #dossier{position:absolute;left:0;top:50%;transform:translateY(-50%);
    transition:opacity .45s var(--ease);
    width:min(310px,30vw);pointer-events:auto;
    opacity:0;animation:fadeIn .7s var(--ease) .25s forwards}
  @keyframes fadeIn{to{opacity:1}}
  .dsr-head{display:flex;align-items:baseline;gap:10px}
  .dsr-idx{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--accent);
    transition:color .5s var(--ease)}
  .dsr-rule{flex:1;height:1px;background:linear-gradient(90deg,var(--accent),transparent);
    opacity:.5;transition:background .5s var(--ease)}
  #dsrName{font-size:clamp(26px,3.4vw,40px);font-weight:800;letter-spacing:-.015em;
    line-height:1.02;margin-top:8px;text-shadow:0 4px 26px rgba(0,0,0,.75)}
  #dsrRole{font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;color:var(--dim);
    margin-top:7px}
  #dsrText{margin-top:14px;font-size:12.5px;line-height:1.62;color:var(--dim);
    max-width:34ch;border-left:1px solid var(--line);padding-left:12px}

  #dsrStats{margin-top:18px;display:flex;flex-direction:column;gap:9px}
  .stat{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center}
  .stat-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--faint)}
  .stat-v{font-family:var(--mono);font-size:10.5px;color:var(--ink);justify-self:end;
    font-variant-numeric:tabular-nums}
  .stat-bar{grid-column:1/-1;height:3px;background:rgba(255,255,255,.07);
    border-radius:2px;overflow:hidden}
  .stat-bar i{display:block;height:100%;width:0;border-radius:2px;
    background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#fff));
    transition:width .82s var(--ease),background .5s var(--ease)}
  .stat.text .stat-v{color:var(--accent);transition:color .5s var(--ease)}

  /* ---------- Auswahl-Leiste ---------- */
  #railwrap{pointer-events:auto}
  #rail{display:flex;gap:8px;justify-content:center;overflow-x:auto;overflow-y:hidden;
    padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
  #rail::-webkit-scrollbar{display:none}
  .card{position:relative;flex:0 0 auto;width:clamp(96px,11vw,132px);
    padding:11px 12px 12px;border:1px solid var(--line);border-radius:10px;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
    backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
    cursor:pointer;scroll-snap-align:center;text-align:left;
    transition:transform .3s var(--ease),border-color .3s var(--ease),background .3s var(--ease);
    color:inherit;font:inherit}
  @supports not (backdrop-filter:blur(1px)){.card{background:rgba(20,22,29,.92)}}
  .card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .card-n{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--faint)}
  .card-name{margin-top:5px;font-size:12px;font-weight:700;letter-spacing:.07em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-type{margin-top:3px;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;
    color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-bar{margin-top:9px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;
    overflow:hidden}
  .card-bar i{display:block;height:100%;width:0;background:var(--c);
    transition:width .5s var(--ease)}
  .card[aria-selected="true"]{border-color:var(--c);
    background:linear-gradient(180deg,color-mix(in srgb,var(--c) 20%,transparent),rgba(255,255,255,.02))}
  .card[aria-selected="true"] .card-n,.card[aria-selected="true"] .card-type{color:var(--c)}
  .card[aria-selected="true"] .card-bar i{width:100%}

  #foot{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;
    font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--faint)}
  #foot kbd{font:inherit;border:1px solid var(--line);border-radius:4px;padding:2px 5px;
    color:var(--dim)}
  #foot span{white-space:nowrap}

  /* ---------- Ladezustand / Fallback ---------- */
  #boot{position:fixed;inset:0;z-index:5;display:grid;place-content:center;gap:12px;
    background:var(--bg0);text-align:center;transition:opacity .6s var(--ease)}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .b1{font-size:13px;font-weight:800;letter-spacing:.34em}
  #boot .b2{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--faint)}
  #boot .b3{width:180px;height:2px;background:rgba(255,255,255,.1);margin:4px auto 0;
    border-radius:2px;overflow:hidden}
  #boot .b3 i{display:block;height:100%;width:35%;background:var(--accent);
    animation:sweep 1.15s var(--ease) infinite}
  @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(400%)}}
  .fallback{position:fixed;inset:0;z-index:9;display:grid;place-content:center;
    padding:32px;background:var(--bg0);color:var(--ink);font-size:14px;line-height:1.7;
    text-align:center}
  .fallback code{font-family:var(--mono);color:var(--accent);font-size:13px}

  /* ---------- Tablet ---------- */
  @media (max-width:900px){
    #dossier{width:min(268px,42vw)}
    #dsrText{display:none}
  }
  /* ---------- Phone: Dossier wandert nach unten ueber die Leiste ---------- */
  @media (max-width:680px){
    #ui{grid-template-rows:auto 1fr auto}
    #dossier{position:static;transform:none;width:auto;align-self:end;
      margin-bottom:10px;display:grid;grid-template-columns:1fr auto;
      gap:0 14px;align-items:end}
    .dsr-head{grid-column:1/-1}
    #dsrName{font-size:clamp(22px,7vw,30px)}
    #dsrStats{margin-top:12px;grid-column:1/-1;
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 14px}
    #dsrText{display:none}
    #stage{display:flex;align-items:flex-end}
    #rail{justify-content:flex-start;padding-bottom:4px}
    .card{width:104px;padding:9px 10px 10px}
    #foot{gap:12px;font-size:8.5px;flex-wrap:nowrap}
    #foot span:nth-child(3),#foot span:nth-child(4){display:none}
    #sysline{display:none}
  }
  @media (max-width:380px){ .card{width:92px} }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important}
    #dossier{opacity:1}
  }
</style>
</head>

    <div>

  <div id="railwrap">
    <nav id="rail" role="tablist" aria-label="Figurenauswahl"></nav>
    <div id="foot">
      <span><kbd>1</kbd>–<kbd>6</kbd> FOKUS</span>
      <span><kbd>0</kbd> ÜBERSICHT</span>
      <span>ZIEHEN DREHT</span>
      <span>SCROLL ZOOMT</span>
    </div>
  </div>
</div>

<div id="boot">
  <div class="b1">LETZTE LEGION</div>
  <div class="b2">INITIALISIERE CHARACTER DATABASE</div>
  <div class="b3"><i></i></div>
</div>

function paint(g, hex) {
  const c = new THREE.Color(hex);
  const n = g.attributes.position.count;
  const col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }

  const g = new THREE.CylinderGeometry(rTo, rFrom, len, rs || 8, 1, false).toNonIndexed();
  _q.setFromUnitVectors(_up, _dir.normalize());
  _m4.compose(_mid, _q, _s.set(1, 1, 1));
  g.applyMatrix4(_m4);
  return paint(g, hex);
}
/* Gekruemmte Schale: Ruestungsplatte, Schild, Umhang */
function shell(r, h, thetaStart, thetaLen, hex, p, rot, s, seg) {
  return P(new THREE.CylinderGeometry(r, r, h, seg || 14, 1, true, thetaStart, thetaLen),
    hex, p, rot, s);
}
const sph  = (r, w, h) => new THREE.SphereGeometry(r, w || 10, h || 7);
const boxg = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const cyl  = (rt, rb, h, rs) => new THREE.CylinderGeometry(rt, rb, h, rs || 8);
const cone = (r, h, rs) => new THREE.ConeGeometry(r, h, rs || 7);
const ico  = (r, d) => new THREE.IcosahedronGeometry(r, d === undefined ? 1 : d);
const tor  = (r, t, rs, ts) => new THREE.TorusGeometry(r, t, rs || 6, ts || 12);
const halfDisc = (r, h, rs) =>
  new THREE.CylinderGeometry(r, r, h, rs || 10, 1, false, 0, Math.PI);

/* ---------- Sektions-Builder ----------
   Alle Koordinaten werden im Figurenraum geschrieben; beim Bauen wird die
   Sektion um ihren Ursprung zentriert, damit sie sich sauber drehen laesst. */
function figure() { return { sections: [], meta: {} }; }
function sect(fig, name, origin) {
  const s = { name, origin: origin || [0, 0, 0], parts: {} };
  fig.sections.push(s);
  return s;
}
function put(s, cls, geo) {
  if (!s.parts[cls]) s.parts[cls] = [];
  s.parts[cls].push(geo);
  return s;
}
/* Bequem: mehrere Teile derselben Klasse auf einmal */
function putAll(s, cls, arr) { for (let i = 0; i < arr.length; i++) put(s, cls, arr[i]); return s; }
const torArc = (r, t, arc, rs, ts) =>
  new THREE.TorusGeometry(r, t, rs || 5, ts || 12, arc);

  }

  /* ---- Kopf ---- */
  const h = sect(f, 'head', [0, 0.575, 0.004]);
  put(h, M.SKIN, P(sph(0.047, 10, 8), SKIN, [0, 0.617, 0.008]));
  put(h, M.SKIN, P(boxg(0.05, 0.03, 0.05), SKIN_D, [0, 0.598, 0.03], [6, 0, 0]));
  put(h, M.METAL, P(sph(0.055, 12, 8), IRON, [0, 0.633, 0.002], 0, [1, 0.94, 1.03]));
  put(h, M.METAL, P(tor(0.0545, 0.008, 6, 16), BRONZE, [0, 0.607, 0.002], [90, 0, 0]));

  put(sh, M.METAL, shell(SR - 0.007, 0.018, -0.63, 1.26, GOLD, [SX, 0.549, SZ], 0, 0, 16));
  put(sh, M.METAL, shell(SR - 0.007, 0.018, -0.63, 1.26, GOLD, [SX, 0.251, SZ], 0, 0, 16));
  for (let i = 0; i < 2; i++) {
    const t = i ? 0.62 : -0.62;
    put(sh, M.METAL, P(boxg(0.014, 0.302, 0.022), GOLD,

  const FLESH = '#8a9c78', FLESH_D = '#6d7f5e', ROT = '#5c6b4e',

  }
  put(b, M.CLOTH, P(sph(0.056, 8, 6), RAG, [0, 0.288, -0.004], 0, [1.05, 0.7, 0.9]));
  /* Ausgezehrter Rumpf, stark nach vorn geneigt */
  put(b, M.SKIN, tube(0.05, 0.064, [0, 0.30, -0.014], [0, 0.44, 0.062], FLESH, 9));
  /* Freiliegende Rippen */
  for (let i = 0; i < 4; i++)

  put(b, M.CLOTH, shell(0.072, 0.12, -1.5, 3.0, RAG, [0, 0.392, 0.018], [12, 0, 0], [1, 1, 0.88], 11));
  put(b, M.CLOTH, P(boxg(0.05, 0.09, 0.014), RAG2, [-0.06, 0.26, 0.052], [4, 0, 9]));
  put(b, M.CLOTH, P(boxg(0.04, 0.07, 0.013), RAG, [0.062, 0.272, 0.044], [2, 0, -7]));
  put(b, M.CLOTH, P(boxg(0.045, 0.06, 0.013), RAG2, [0.01, 0.25, -0.05], [-6, 0, 3]));
  put(b, M.SKIN, tube(0.02, 0.018, [0, 0.434, 0.058], [0, 0.472, 0.082], FLESH_D, 6));

  /* ---- Kopf ---- */
  const h = sect(f, 'head', [0, 0.452, 0.062]);
  put(h, M.SKIN, P(sph(0.042, 8, 6), FLESH_D, [0, 0.486, 0.094], [0, 0, 6], [0.9, 1.02, 1.14]));
  put(h, M.BONE, P(boxg(0.058, 0.014, 0.03), BONE, [0, 0.497, 0.116], [-12, 0, 0]));
  put(h, M.BONE, P(boxg(0.044, 0.022, 0.05), BONE, [0, 0.452, 0.112], [14, 0, 0]));
  for (let i = 0; i < 4; i++)
    put(h, M.BONE, P(cone(0.005, 0.014, 4), '#e6e8d6',

  for (let i = 0; i < 2; i++) {

    put(h, M.ORGANIC, P(sph(0.015, 7, 5), '#20241c', [sgn * 0.019, 0.486, 0.118]));
    put(h, M.GLOW, P(sph(0.0085, 6, 5), '#c8ff6a', [sgn * 0.019, 0.4865, 0.126]));
  }
  put(h, M.SKIN, P(boxg(0.03, 0.02, 0.02), ROT, [-0.03, 0.505, 0.058], [0, 0, 22]));

  /* ---- Arme ---- */
  const arms = [

    { n: 'armR', s: [0.084, 0.429, 0.032], e: [0.134, 0.3, 0.104], w: [0.132, 0.184, 0.178], bone: true }

  }
  f.meta = { h: 0.60, r: 0.17, base: 0 };
  return f;
}

  for (let i = 0; i < 3; i++)
    put(b, M.BONE, P(torArc(0.058 - i * 0.003, 0.0058, 2.1, 5, 11), BONE,
      [0, 0.30 + i * 0.028, 0.028 + i * 0.026], [58, 0, 0], [1, 1, 0.84]));
  /* Rueckenkamm entlang der Wirbelsaeule */
  const crestBase = [[0, 0.288, -0.046], [0, 0.312, -0.03], [0, 0.336, -0.012], [0, 0.358, 0.008], [0, 0.374, 0.03]];
  for (let i = 0; i < crestBase.length; i++)
    put(b, M.BONE, P(cone(0.013 - i * 0.0014, 0.036 - i * 0.004, 5), BONE, crestBase[i], [-118, 0, 0]));

  put(b, M.SKIN, P(sph(0.043, 8, 6), FLESH, [-0.082, 0.368, 0.084]));
  put(b, M.SKIN, P(sph(0.043, 8, 6), FLESH, [0.082, 0.366, 0.08]));
  /* Arme nach hinten gerissen */
  for (let i = 0; i < 2; i++) {
    const sgn = i ? 1 : -1;
    const s = [sgn * 0.082, 0.367, 0.082], e = [sgn * 0.116, 0.32, -0.018], w = [sgn * 0.108, 0.29, -0.126];
    put(b, M.SKIN, tube(0.026, 0.021, s, e, FLESH));
    put(b, M.SKIN, P(sph(0.022, 7, 5), FLESH_D, e));
    put(b, M.SKIN, tube(0.021, 0.016, e, w, SIN));
    put(b, M.SKIN, P(sph(0.019, 7, 5), FLESH_D, w));
    for (let k = 0; k < 3; k++)
      put(b, M.BONE, P(cone(0.005, 0.022, 4), BONE,
        [w[0] + sgn * (0.002 + k * 0.007), w[1] - 0.006, w[2] - 0.014 - k * 0.004], [64, 0, sgn * 10]));
  }
  put(b, M.CLOTH, P(boxg(0.04, 0.06, 0.012), RAG, [-0.052, 0.244, 0.03], [10, 0, 8]));
  put(b, M.CLOTH, P(boxg(0.034, 0.05, 0.012), RAG, [0.056, 0.25, 0.012], [8, 0, -6]));
  put(b, M.SKIN, tube(0.026, 0.023, [0, 0.372, 0.09], [0, 0.394, 0.128], FLESH_D, 7));

  /* ---- Kopf ---- */
  const h = sect(f, 'head', [0, 0.386, 0.116]);
  put(h, M.SKIN, P(sph(0.041, 10, 8), FLESH_D, [0, 0.402, 0.156], [10, 0, 0], [0.9, 0.92, 1.32]));
  put(h, M.BONE, P(boxg(0.046, 0.012, 0.026), BONE, [0, 0.416, 0.19], [-14, 0, 0]));
  put(h, M.BONE, P(boxg(0.036, 0.02, 0.056), BONE, [0, 0.374, 0.186], [20, 0, 0]));
  for (let i = 0; i < 5; i++)
    put(h, M.BONE, P(cone(0.0045, 0.016, 4), '#eef0e2',
      [-0.016 + i * 0.008, 0.39, 0.196 + (i % 2) * 0.004], [166, 0, 0]));
  for (let i = 0; i < 2; i++) {
    const sgn = i ? 1 : -1;
    put(h, M.ORGANIC, P(sph(0.013, 7, 5), '#1d2119', [sgn * 0.017, 0.408, 0.184]));
    put(h, M.GLOW, P(sph(0.008, 6, 5), '#d8ff7a', [sgn * 0.0175, 0.4085, 0.192]));
  }
  f.meta = { h: 0.56, r: 0.20, base: 0 };
  return f;
}

/* =====================================================================
   FIGUR 04 — BRUTE
   Schulterberg mit Knochenplatten, Kopf tief dazwischen, Arme bis zum Boden.
   Sektionen: body · head · armL · armR
   ===================================================================== */
function buildBrute() {
  const HIDE = '#7e8c6e', HIDE_D = '#5e6c50', FLESH = '#6b7a5c', GUT = '#8a9873',
        PLATE = '#454e3c', BONE = '#d2d6bd', IRON = '#474d55', SCAR = '#4a2f2b';
  const f = figure();
  const b = sect(f, 'body');

  for (let i = 0; i < 2; i++) {
    const sgn = i ? 1 : -1;
    const hip = [sgn * 0.135, 0.42, 0], knee = [sgn * 0.152, 0.245, 0.022], ankle = [sgn * 0.145, 0.085, 0.015];
    put(b, M.SKIN, tube(0.105, 0.088, hip, knee, HIDE));
    put(b, M.SKIN, P(sph(0.086, 8, 6), HIDE_D, knee));
    put(b, M.SKIN, tube(0.088, 0.072, knee, ankle, HIDE_D));
    put(b, M.SKIN, P(boxg(0.145, 0.078, 0.215), HIDE_D, [sgn * 0.145, 0.042, 0.05]));
    for (let k = 0; k < 3; k++)
      put(b, M.BONE, P(cone(0.019, 0.05, 5), BONE,
        [sgn * 0.145 + (k - 1) * 0.045, 0.03, 0.152], [96, 0, 0]));
  }
  put(b, M.SKIN, P(sph(0.165, 10, 7), HIDE_D, [0, 0.445, 0], 0, [1.2, 0.82, 1]));
  put(b, M.SKIN, tube(0.185, 0.25, [0, 0.46, 0], [0, 0.79, -0.012], HIDE, 12));
  put(b, M.SKIN, P(sph(0.205, 11, 8), GUT, [0, 0.535, 0.088], 0, [1.14, 0.86, 1]));
  put(b, M.SKIN, P(sph(0.205, 11, 8), HIDE, [0, 0.725, 0.056], 0, [1.22, 0.82, 0.92]));
  for (let i = 0; i < 3; i++)
    put(b, M.BONE, P(torArc(0.185 - i * 0.012, 0.016, 2.2, 5, 13), BONE,
      [0, 0.63 + i * 0.062, 0.088 - i * 0.012], [76, 0, 0], [1, 1, 0.8]));
  put(b, M.ORGANIC, P(sph(0.055, 8, 6), SCAR, [-0.1, 0.6, 0.175], 0, [1.3, 0.8, 0.5]));
  /* Schulterberg */
  for (let i = 0; i < 2; i++) {
    const sgn = i ? 1 : -1;
    put(b, M.SKIN, P(sph(0.158, 10, 8), HIDE, [sgn * 0.275, 0.815, -0.005]));
    put(b, M.BONE, P(cone(0.048, 0.125, 6), BONE, [sgn * 0.268, 0.935, -0.012], [0, 0, sgn * -22]));
    put(b, M.BONE, P(cone(0.036, 0.09, 6), BONE, [sgn * 0.345, 0.885, -0.03], [0, 0, sgn * -46]));
    put(b, M.BONE, P(cone(0.03, 0.072, 5), BONE, [sgn * 0.2, 0.925, -0.085], [-24, 0, sgn * -14]));
  }
  /* Rueckenstacheln */
  for (let i = 0; i < 4; i++)
    put(b, M.BONE, P(cone(0.04 - i * 0.006, 0.12 - i * 0.018, 6), BONE,
      [0, 0.855 - i * 0.09, -0.13 - i * 0.028], [-38 - i * 8, 0, 0]));
  /* Eisenketten */
  put(b, M.METAL, P(tor(0.13, 0.016, 6, 16), IRON, [0, 0.845, 0.045], [72, 0, 0], [1.15, 1, 1]));
  put(b, M.METAL, P(tor(0.115, 0.013, 6, 14), IRON, [0, 0.79, 0.09], [64, 0, 6], [1.1, 1, 1]));
  put(b, M.SKIN, P(cyl(0.088, 0.1, 0.07, 9), FLESH, [0, 0.845, 0.105], [16, 0, 0]));

  /* ---- Kopf ---- */
  const h = sect(f, 'head', [0, 0.85, 0.11]);
  put(h, M.SKIN, P(sph(0.098, 11, 8), FLESH, [0, 0.875, 0.182], 0, [1, 0.96, 1.1]));
  put(h, M.BONE, P(boxg(0.175, 0.05, 0.078), PLATE, [0, 0.914, 0.212], [-15, 0, 0]));
  put(h, M.BONE, P(boxg(0.142, 0.052, 0.088), BONE, [0, 0.834, 0.222], [11, 0, 0]));
  for (let i = 0; i < 5; i++)
    put(h, M.BONE, P(cone(0.011, 0.03, 4), '#e8ead6',
      [-0.05 + i * 0.025, 0.856, 0.234 + (i % 2) * 0.006], [170, 0, 0]));
  for (let i = 0; i < 2; i++) {
    const sgn = i ? 1 : -1;
    put(h, M.BONE, P(cone(0.024, 0.078, 6), BONE, [sgn * 0.056, 0.862, 0.252], [16, 0, sgn * -14]));
    put(h, M.BONE, P(cone(0.018, 0.052, 5), BONE, [sgn * 0.082, 0.918, 0.16], [-32, 0, sgn * -30]));
    put(h, M.ORGANIC, P(sph(0.021, 7, 5), '#1c1f18', [sgn * 0.037, 0.888, 0.238]));
    put(h, M.GLOW, P(sph(0.012, 6, 5), '#c8ff6a', [sgn * 0.037, 0.8885, 0.25]));
  }

  /* ---- Arme ---- */
  for (let i = 0; i < 2; i++) {
    const sgn = i ? 1 : -1;
    const s = [sgn * 0.30, 0.80, 0.005], e = [sgn * 0.40, 0.50, 0.072], w = [sgn * 0.425, 0.245, 0.115];
    const sec2 = sect(f, i ? 'armR' : 'armL', s);
    put(sec2, M.SKIN, tube(0.098, 0.082, s, e, HIDE));
    put(sec2, M.SKIN, P(sph(0.082, 8, 6), HIDE_D, e));
    put(sec2, M.SKIN, tube(0.082, 0.07, e, w, FLESH));
    put(sec2, M.BONE, P(cone(0.026, 0.062, 5), BONE, [sgn * 0.365, 0.63, 0.045], [0, 0, sgn * -68]));
    put(sec2, M.BONE, P(cone(0.022, 0.05, 5), BONE, [sgn * 0.415, 0.375, 0.09], [0, 0, sgn * -74]));
    put(sec2, M.SKIN, P(sph(0.105, 10, 8), HIDE_D, [sgn * 0.435, 0.175, 0.135]));
    for (let k = 0; k < 3; k++)
      put(sec2, M.BONE, P(cone(0.022, 0.052, 5), BONE,
        [sgn * 0.435 + (k - 1) * 0.05, 0.185, 0.222], [86, 0, 0]));
  }
  f.meta = { h: 1.16, r: 0.44, base: 0 };
  return f;
}

/* =====================================================================
   FIGUR 05 — SPEIER
   Aufgeblaehter Werfer-Boss: Kehlsack, Warzen, Schlund mit Zahnkranz.
   Sektionen: body · belly · head
   ===================================================================== */
function buildSpeier() {
  const BODY = '#9a9463', THROAT = '#c2ba86', WART = '#6f6a41', LIMB = '#847f55',
        BELLY = '#8a8452', MAW = '#2a1d1d', BONE = '#ddd9b4', PUS = '#b8a94e';
  const f = figure();
  const b = sect(f, 'body');

  for (let i = 0; i < 2; i++) {
    const sgn = i ? 1 : -1;
    const hip = [sgn * 0.30, 0.60, 0.02], knee = [sgn * 0.365, 0.32, 0.105], ankle = [sgn * 0.32, 0.115, 0.108];
    put(b, M.SKIN, tube(0.155, 0.125, hip, knee, LIMB));
    put(b, M.SKIN, P(sph(0.12, 8, 6), LIMB, knee));
    put(b, M.SKIN, tube(0.125, 0.1, knee, ankle, LIMB));
    put(b, M.SKIN, P(boxg(0.235, 0.09, 0.30), LIMB, [sgn * 0.32, 0.055, 0.165]));
    for (let k = 0; k < 3; k++)
      put(b, M.BONE, P(cone(0.026, 0.07, 5), BONE,
        [sgn * 0.32 + (k - 1) * 0.075, 0.042, 0.315], [92, 0, 0]));
    put(b, M.SKIN, P(sph(0.245, 10, 8), LIMB, [sgn * 0.345, 0.63, -0.01], 0, [1, 0.92, 1]));
  }
  /* Rueckenhoecker + Kamm */
  put(b, M.ORGANIC, P(ico(0.27, 1), WART, [0, 1.34, -0.44], [12, 20, 0]));
  put(b, M.ORGANIC, P(ico(0.2, 1), WART, [-0.3, 1.1, -0.46], [0, 32, 14]));
  put(b, M.ORGANIC, P(ico(0.16, 1), WART, [0.32, 1.06, -0.44], [8, -20, 10]));
  for (let i = 0; i < 4; i++)
    put(b, M.BONE, P(cone(0.075 - i * 0.012, 0.22 - i * 0.03, 6), BONE,
      [0, 1.62 - i * 0.2, -0.34 - i * 0.11], [-42 - i * 10, 0, 0]));
  /* Aermchen */
  for (let i = 0; i < 2; i++) {
    const sgn = i ? 1 : -1;
    const s = [sgn * 0.60, 1.32, 0.16], e = [sgn * 0.71, 1.06, 0.35], w = [sgn * 0.62, 0.86, 0.53];
    put(b, M.SKIN, tube(0.078, 0.062, s, e, LIMB));
    put(b, M.SKIN, P(sph(0.06, 7, 5), LIMB, e));
    put(b, M.SKIN, tube(0.062, 0.048, e, w, LIMB));
    put(b, M.SKIN, P(sph(0.055, 7, 5), WART, w));
    for (let k = 0; k < 3; k++)
      put(b, M.BONE, P(cone(0.014, 0.05, 4), BONE,
        [w[0] + sgn * 0.01, w[1] - 0.03, w[2] + 0.03 + k * 0.018], [128, 0, sgn * 16]));
  }

  /* ---- Wanst (pulsiert) ---- */
  const bl = sect(f, 'belly', [0, 0.95, 0.04]);
  /* Facettierte, asymmetrische Masse statt glatter Kugel */
  put(bl, M.ORGANIC, P(ico(0.72, 1), BODY, [0, 0.99, 0.0], [12, 24, 6], [1.16, 0.98, 1.04]));
  put(bl, M.ORGANIC, P(ico(0.6, 1), BELLY, [0.02, 0.76, 0.12], [4, -18, 0], [1.1, 0.68, 1.0]));
  put(bl, M.ORGANIC, P(ico(0.34, 1), BODY, [-0.42, 1.24, 0.2], [22, 10, 14]));
  put(bl, M.ORGANIC, P(ico(0.3, 1), BODY, [0.48, 1.02, -0.16], [0, 30, 8]));
  const warts = [[-0.56, 0.92, 0.4, 0.22], [0.6, 1.22, 0.26, 0.18], [0.24, 0.6, 0.6, 0.19],
                 [-0.34, 1.36, 0.34, 0.15], [-0.66, 1.12, -0.08, 0.17], [0.54, 0.74, 0.34, 0.14],
                 [0.1, 1.38, 0.5, 0.13], [-0.2, 0.6, 0.56, 0.12], [0.66, 1.34, -0.02, 0.11]];
  for (const w of warts)
    put(bl, M.ORGANIC, P(ico(w[3], 0), WART, [w[0], w[1], w[2]], [w[0] * 40, w[1] * 30, 0]));
  put(bl, M.ORGANIC, P(sph(0.09, 8, 6), PUS, [0.12, 1.12, 0.66], 0, [1, 1, 0.6]));
  put(bl, M.ORGANIC, P(sph(0.07, 8, 6), PUS, [-0.18, 0.86, 0.62], 0, [1, 1, 0.6]));
  put(bl, M.GLOW, P(sph(0.032, 6, 5), '#ff9a4a', [0.12, 1.12, 0.71]));
  put(bl, M.GLOW, P(sph(0.026, 6, 5), '#ff9a4a', [-0.18, 0.86, 0.665]));

  /* ---- Kopf mit Schlund ---- */
  const h = sect(f, 'head', [0, 1.58, 0.12]);
  put(h, M.ORGANIC, P(ico(0.42, 1), THROAT, [0, 1.44, 0.32], [8, 0, 0], [1.02, 0.86, 1.0]));
  put(h, M.ORGANIC, P(ico(0.3, 1), BODY, [0, 1.77, 0.26], [0, 22, 0]));
  put(h, M.ORGANIC, P(boxg(0.44, 0.1, 0.22), WART, [0, 1.88, 0.42], [-17, 0, 0]));
  put(h, M.ORGANIC, P(ico(0.13, 0), WART, [-0.26, 1.72, 0.34], [12, 0, 20]));
  put(h, M.ORGANIC, P(ico(0.11, 0), WART, [0.28, 1.68, 0.3], [0, 24, -14]));
  put(h, M.ORGANIC, P(tor(0.3, 0.06, 5, 12), WART, [0, 1.3, 0.36], [96, 0, 0], [1, 1, 0.7]));
  put(h, M.ORGANIC, P(cyl(0.15, 0.19, 0.2, 11), MAW, [0, 1.62, 0.52], [104, 0, 0]));
  put(h, M.ORGANIC, P(tor(0.185, 0.05, 6, 16), BODY, [0, 1.63, 0.55], [104, 0, 0]));
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * TAU;
    put(h, M.BONE, P(cone(0.026, 0.07, 5), BONE,
      [Math.sin(a) * 0.17, 1.63 + Math.cos(a) * 0.165, 0.585], [104 + Math.cos(a) * 22, 0, -Math.sin(a) * 26]));
  }
  put(h, M.SKIN, P(boxg(0.3, 0.09, 0.24), LIMB, [0, 1.45, 0.57], [-30, 0, 0]));
  for (let i = 0; i < 2; i++) {
    const sgn = i ? 1 : -1;
    put(h, M.BONE, P(cone(0.06, 0.2, 6), BONE, [sgn * 0.2, 1.93, 0.19], [-22, 0, sgn * -20]));
    put(h, M.ORGANIC, P(sph(0.062, 8, 6), '#241d10', [sgn * 0.115, 1.86, 0.47]));
    put(h, M.GLOW, P(sph(0.036, 7, 5), '#ff7a3c', [sgn * 0.115, 1.862, 0.508]));
  }
  f.meta = { h: 2.02, r: 0.80, base: 0 };
  return f;
}

/* =====================================================================
   FIGUR 06 — FLEISCHBERG
   Groesster Gegner: Fleischmasse, Rueckenkegel, Arme bis zum Boden.
   Sektionen: body · head · armL · armR
   ===================================================================== */
function buildFleisch() {
  const A = '#8b6a63', B = '#755652', C = '#9a7871', D = '#5f4744', E = '#42302f',
        BONE = '#cfc2ab', TUSK = '#e2d6bd', GORE = '#4a2724';
  const f = figure();
  const b = sect(f, 'body');

  /* Hinterlaeufe */
  for (let i = 0; i < 2; i++) {
    const sgn = i ? 1 : -1;
    const hau = [sgn * 0.55, 0.85, -0.55], knee = [sgn * 0.63, 0.5, -0.28], ankle = [sgn * 0.6, 0.22, -0.04];
    put(b, M.SKIN, P(sph(0.34, 10, 8), D, [sgn * 0.56, 0.8, -0.52], 0, [1, 0.92, 1]));
    put(b, M.SKIN, tube(0.24, 0.19, hau, knee, B));
    put(b, M.SKIN, P(sph(0.185, 8, 6), D, knee));
    put(b, M.SKIN, tube(0.19, 0.155, knee, ankle, B));
    put(b, M.SKIN, P(boxg(0.34, 0.15, 0.44), D, [sgn * 0.6, 0.095, 0.075]));
    for (let k = 0; k < 3; k++)
      put(b, M.BONE, P(cone(0.042, 0.11, 5), BONE,
        [sgn * 0.6 + (k - 1) * 0.105, 0.075, 0.29], [94, 0, 0]));
  }
  /* Fleischmasse */
  put(b, M.SKIN, P(ico(0.98, 1), A, [0, 1.34, -0.22], [-14, 8, 0], [1.22, 1.0, 1.04]));
  put(b, M.SKIN, P(ico(0.74, 1), C, [0, 0.92, 0.38], [6, 18, 0], [1.06, 0.86, 0.94]));
  put(b, M.SKIN, P(ico(0.72, 1), B, [0, 0.66, -0.5], [0, -14, 0], [1.15, 0.78, 1.0]));
  put(b, M.SKIN, P(ico(0.52, 1), B, [0, 0.52, 0.14], [0, 26, 0], [1.2, 0.62, 1.0]));
  /* Asymmetrische Wucherungen brechen die runde Silhouette */
  put(b, M.SKIN, P(ico(0.36, 1), D, [-0.72, 1.06, 0.12], [18, 0, 24]));
  put(b, M.SKIN, P(ico(0.3, 1), D, [0.78, 0.86, -0.06], [0, 30, -16]));
  put(b, M.SKIN, P(ico(0.26, 0), E, [0.3, 1.9, -0.62], [22, 14, 0]));
  put(b, M.SKIN, P(ico(0.22, 0), E, [-0.36, 1.82, -0.7], [10, -20, 12]));
  /* Freiliegender Brustkorb */
  for (let i = 0; i < 4; i++)
    put(b, M.BONE, P(torArc(0.44 - i * 0.03, 0.036, 1.5, 5, 12), BONE,
      [0, 0.84 + i * 0.15, 0.36 - i * 0.03], [76, 0, 0], [1, 1, 0.6]));
  put(b, M.ORGANIC, P(sph(0.17, 9, 7), GORE, [-0.34, 1.02, 0.6], 0, [1.2, 0.9, 0.5]));
  /* Schultermassen + Platten */
  for (let i = 0; i < 2; i++) {
    const sgn = i ? 1 : -1;
    put(b, M.SKIN, P(ico(0.45, 1), D, [sgn * 0.64, 1.62, -0.04], [0, sgn * 25, sgn * 10]));
    put(b, M.BONE, P(cone(0.1, 0.28, 6), BONE, [sgn * 0.66, 1.86, -0.1], [-14, 0, sgn * -26]));
    put(b, M.BONE, P(cone(0.075, 0.2, 6), BONE, [sgn * 0.86, 1.66, -0.18], [-10, 0, sgn * -58]));
  }
  /* Rueckenkegel */
  const spines = [[0, 2.42, -0.24, 0.24, 0.58, -18], [-0.34, 2.2, -0.5, 0.2, 0.46, -26],
                  [0.34, 2.16, -0.54, 0.2, 0.46, -26], [-0.18, 2.14, -0.86, 0.2, 0.46, -42],
                  [0.2, 1.82, -1.16, 0.17, 0.4, -58], [-0.08, 1.46, -1.36, 0.14, 0.32, -72],
                  [0.06, 1.12, -1.5, 0.11, 0.24, -84], [-0.5, 1.86, -0.86, 0.15, 0.34, -46],
                  [0.52, 1.8, -0.9, 0.15, 0.34, -46]];
  for (const s of spines)
    put(b, M.BONE, P(cone(s[3], s[4], 6), BONE, [s[0], s[1], s[2]], [s[5], 0, s[0] * 30]));
  put(b, M.SKIN, tube(0.34, 0.3, [0, 1.62, 0.28], [0, 1.5, 0.62], B, 10));

  /* ---- Kopf ---- */
  const h = sect(f, 'head', [0, 1.55, 0.55]);
  put(h, M.SKIN, P(sph(0.34, 11, 8), B, [0, 1.56, 0.9]));
  put(h, M.SKIN, P(boxg(0.5, 0.15, 0.26), D, [0, 1.74, 0.94], [-15, 0, 0]));
  put(h, M.SKIN, P(boxg(0.42, 0.16, 0.28), D, [0, 1.37, 0.98], [11, 0, 0]));
  for (let i = 0; i < 5; i++)
    put(h, M.BONE, P(cone(0.028, 0.08, 4), TUSK,
      [-0.115 + i * 0.058, 1.45, 0.99 + (i % 2) * 0.012], [168, 0, 0]));
  for (let i = 0; i < 2; i++) {
    const sgn = i ? 1 : -1;
    put(h, M.BONE, P(cone(0.052, 0.19, 6), TUSK, [sgn * 0.145, 1.5, 1.05], [17, 0, sgn * -11]));
    put(h, M.BONE, P(cone(0.036, 0.12, 5), TUSK, [sgn * 0.185, 1.62, 0.96], [150, 0, sgn * 14]));
    put(h, M.BONE, P(cone(0.062, 0.17, 6), BONE, [sgn * 0.225, 1.71, 0.7], [-32, 0, sgn * -28]));
    put(h, M.ORGANIC, P(sph(0.072, 8, 6), '#1d1416', [sgn * 0.125, 1.62, 1.08]));
    put(h, M.GLOW, P(sph(0.044, 7, 5), '#ff5a3c', [sgn * 0.125, 1.622, 1.125]));
  }

  /* ---- Arme ---- */
  for (let i = 0; i < 2; i++) {
    const sgn = i ? 1 : -1;
    const s = [sgn * 0.76, 1.5, 0.06], e = [sgn * 1.02, 0.94, 0.36], w = [sgn * 1.14, 0.44, 0.6];
    const sec2 = sect(f, i ? 'armR' : 'armL', s);
    put(sec2, M.SKIN, tube(0.235, 0.2, s, e, B));
    put(sec2, M.SKIN, P(sph(0.2, 9, 7), D, e));
    put(sec2, M.SKIN, tube(0.2, 0.17, e, w, B));
    put(sec2, M.BONE, P(cone(0.058, 0.16, 5), BONE, [sgn * 0.96, 1.14, 0.28], [0, 0, sgn * -62]));
    put(sec2, M.BONE, P(cone(0.048, 0.13, 5), BONE, [sgn * 1.11, 0.66, 0.5], [0, 0, sgn * -72]));
    put(sec2, M.SKIN, P(sph(0.27, 10, 8), D, [sgn * 1.18, 0.26, 0.68]));
    for (let k = 0; k < 3; k++)
      put(sec2, M.BONE, P(cone(0.05, 0.115, 5), BONE,
        [sgn * 1.18 + (k - 1) * 0.115, 0.28, 0.9], [88, 0, 0]));
  }
  f.meta = { h: 2.5, r: 1.08, base: 0 };
  return f;
}

/* ---------- Environment: winzige Studio-Box per PMREM, kein externes HDRI ---------- */
function buildEnvironment() {
  const envScene = new THREE.Scene();
  const room = new THREE.Mesh(
    new THREE.BoxGeometry(12, 8, 12),
    new THREE.MeshBasicMaterial({ color: '#12141b', side: THREE.BackSide }));
  envScene.add(room);
  const panel = (col, int, pos, rot, sz) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(sz[0], sz[1]),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(int) }));
    m.position.fromArray(pos); m.rotation.fromArray(rot.map(v => v * DEG));
    envScene.add(m); return m;
  };
  panel('#fff1de', 3.1, [0, 3.9, 0], [90, 0, 0], [6, 6]);        // Deckenlicht
  panel('#4f7ad0', 1.5, [-5.9, 1.4, 0], [0, 90, 0], [7, 5]);     // kaltes Seitenlicht
  panel('#c2601f', 0.9, [5.9, 1.2, -1], [0, -90, 0], [6, 4]);    // warmer Kontrapunkt
  panel('#0a0b10', 1.0, [0, -3.9, 0], [-90, 0, 0], [12, 12]);    // dunkler Boden
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const rt = pmrem.fromScene(envScene, 0.035);
  envScene.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  pmrem.dispose();
  return rt.texture;
}

function gradientTexture(stops, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, h);
  for (const s of stops) grd.addColorStop(s[0], s[1]);
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function radialTexture(inner, outer, stopIn) {
  const s = 256, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grd.addColorStop(0, inner);
  grd.addColorStop(stopIn, inner);
  grd.addColorStop(1, outer);
  g.fillStyle = grd; g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function frameSelection(instant) {
  if (mode === 'overview') {
    camWant.set(OVERVIEW.x, OVERVIEW.y, 0);

    pitchWant = CFG.cam.overviewPitch;

    const f = figures[selected];

       Dossier links frei steht und nie ueber der Figur klebt. */

    const shift = wide ? (f.h * CFG.cam.focusDistMul + CFG.cam.focusDistAdd) * 0.11 : 0;
    camWant.set(f.x - shift, f.h * (wide ? 0.46 : 0.52), 0);
    distWant = f.h * CFG.cam.focusDistMul + CFG.cam.focusDistAdd;
    pitchWant = CFG.cam.focusPitch;
    yawWant = 0.13;
    el.sysMode.textContent = 'FOCUS ' + pad2(selected + 1);
  }
  zoom = 1;
  if (instant) {
    camTarget.copy(camWant);
    dist = distWant; pitch = pitchWant; yaw = yawWant;
  }
}

/* =====================================================================
   Eingaben — Maus, Touch, Tastatur
   ===================================================================== */
const pointers = new Map();
let dragging = false, lastX = 0, lastY = 0, pinchDist = 0, moved = 0, downTime = 0;

function pointerDown(e) {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    dragging = true; moved = 0; downTime = performance.now();
    lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add('dragging');
  } else if (pointers.size === 2) {
    const p = [...pointers.values()];
    pinchDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  }
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
}
function pointerMove(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const p = [...pointers.values()];
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    if (pinchDist > 0) applyZoom(Math.pow(pinchDist / d, 0.9));
    pinchDist = d;
    return;
  }
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  const targets = mode === 'focus' ? [figures[selected]] : figures;
  for (const f of targets) f.spinVel += dx * 0.014;
  pitchWant = clamp(pitchWant + dy * 0.0022, CFG.cam.minPitch, CFG.cam.maxPitch);
}
function pointerUp(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;
  if (pointers.size === 0) {
    canvas.classList.remove('dragging');
    if (dragging && moved < 9 && performance.now() - downTime < 420) pickAt(e.clientX, e.clientY);
    dragging = false;
  }
}
canvas.addEventListener('pointerdown', pointerDown);
canvas.addEventListener('pointermove', pointerMove);
canvas.addEventListener('pointerup', pointerUp);
canvas.addEventListener('pointercancel', pointerUp);
canvas.addEventListener('lostpointercapture', pointerUp);

function applyZoom(mul) {
  zoom = clamp(zoom * mul, CFG.cam.zoomMin, CFG.cam.zoomMax);
}
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  applyZoom(Math.exp(e.deltaY * 0.0011));
}, { passive: false });

/* Klick/Tap auf eine Figur waehlt sie aus */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const pickRoots = figures.map(f => f.root);
function pickAt(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  ndc.set(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickRoots, true);
  if (!hits.length) return;
  let o = hits[0].object;
  while (o && pickRoots.indexOf(o) === -1) o = o.parent;
  const i = pickRoots.indexOf(o);
  if (i >= 0 && (mode === 'overview' || i !== selected)) select(i, true);
}

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === '0') { overview(); e.preventDefault(); }
  else if (k >= '1' && k <= '6') { select(+k - 1, true); e.preventDefault(); }
  else if (k === 'ArrowRight') { select(selected + 1, true); e.preventDefault(); }
  else if (k === 'ArrowLeft') { select(selected - 1, true); e.preventDefault(); }
  else if (k === '+' || k === '=') { applyZoom(0.88); e.preventDefault(); }
  else if (k === '-') { applyZoom(1.14); e.preventDefault(); }
});

   Animation je Figur
   ===================================================================== */
const clampAmp = () => (REDUCED ? 0.25 : 1);
function animateFigure(f, t, focused) {
  const A = clampAmp(), n = f.nodes, ph = f.phase;
  const set = (node, dx, dy, dz, rx, ry, rz) => {
    if (!node) return;
    const r = node.userData.rest;
    node.position.set(r.px + dx, r.py + dy, r.pz + dz);
    node.rotation.set(rx, ry, rz);
  };
  switch (f.def.key) {
    case 'legion': {
      const b = Math.sin(t * 1.5 + ph) * 0.006 * A;
      f.turn.position.y = b;
      f.turn.rotation.z = Math.sin(t * 0.7 + ph) * 0.006 * A;
      set(n.head, 0, 0, 0, Math.sin(t * 0.9 + ph) * 0.03 * A, Math.sin(t * 0.55 + ph) * 0.09 * A, 0);
      set(n.shield, 0, Math.sin(t * 1.1 + ph) * 0.004 * A, 0,
        Math.sin(t * 0.8 + ph) * 0.035 * A, 0, Math.sin(t * 0.6 + ph) * 0.03 * A);
      set(n.spear, 0, 0, 0, Math.sin(t * 0.85 + ph + 1) * 0.028 * A, 0,
        Math.sin(t * 0.65 + ph) * 0.035 * A);
      break;
    }
    case 'walker': {
      f.turn.position.y = Math.abs(Math.sin(t * 1.1 + ph)) * 0.014 * A;
      f.turn.rotation.z = Math.sin(t * 0.62 + ph) * 0.055 * A;
      f.turn.rotation.x = Math.sin(t * 0.44 + ph) * 0.022 * A;
      set(n.head, 0, 0, 0, Math.sin(t * 0.7 + ph) * 0.11 * A + 0.04,
        Math.sin(t * 0.41 + ph) * 0.19 * A, Math.sin(t * 0.53) * 0.06 * A);
      set(n.armL, 0, 0, 0, Math.sin(t * 0.9 + ph) * 0.1 * A, 0, Math.sin(t * 0.7) * 0.05 * A);
      set(n.armR, 0, 0, 0, Math.sin(t * 0.9 + ph + 2) * 0.1 * A, 0, Math.sin(t * 0.72 + 1) * 0.05 * A);
      break;
    }
    case 'runner': {
      const j = Math.sin(t * 3.4 + ph);
      f.turn.position.y = Math.abs(j) * 0.02 * A;
      f.turn.rotation.z = Math.sin(t * 2.6 + ph) * 0.045 * A;
      set(n.head, 0, 0, 0, j * 0.08 * A, Math.sin(t * 4.3 + ph) * 0.14 * A, 0);
      break;
    }
    case 'brute': {
      const br = Math.sin(t * 0.72 + ph);
      f.turn.position.y = br * 0.016 * A;
      f.turn.rotation.z = Math.sin(t * 0.4 + ph) * 0.018 * A;
      const s = 1 + br * 0.018 * A;
      if (n.body) n.body.scale.set(s, 1 + br * 0.01 * A, s);
      set(n.head, 0, br * 0.008 * A, 0, br * 0.05 * A + 0.03, Math.sin(t * 0.33 + ph) * 0.1 * A, 0);
      set(n.armL, 0, 0, 0, Math.sin(t * 0.6 + ph) * 0.05 * A, 0, Math.sin(t * 0.5) * 0.04 * A);
      set(n.armR, 0, 0, 0, Math.sin(t * 0.6 + ph + 2.4) * 0.05 * A, 0, Math.sin(t * 0.52 + 1) * 0.04 * A);
      break;
    }
    case 'speier': {
      const p = Math.sin(t * 0.55 + ph);
      f.turn.position.y = p * 0.02 * A;
      const s = 1 + p * 0.045 * A;
      if (n.belly) n.belly.scale.set(s, 1 + p * 0.03 * A, s);
      set(n.head, 0, p * 0.03 * A, 0, p * 0.05 * A, Math.sin(t * 0.31 + ph) * 0.12 * A, 0);
      break;
    }
    case 'fleisch': {
      const p = Math.sin(t * 0.34 + ph), q = Math.sin(t * 0.21 + ph * 0.5);
      f.turn.position.y = p * 0.024 * A;
      f.turn.rotation.z = q * 0.014 * A;
      const s = 1 + p * 0.022 * A;
      if (n.body) n.body.scale.set(s, 1 + p * 0.014 * A, s);
      set(n.head, 0, p * 0.02 * A, 0, p * 0.045 * A + 0.02, q * 0.11 * A, 0);
      set(n.armL, 0, 0, 0, Math.sin(t * 0.29 + ph) * 0.04 * A, 0, q * 0.03 * A);
      set(n.armR, 0, 0, 0, Math.sin(t * 0.29 + ph + 2.1) * 0.04 * A, 0, -q * 0.03 * A);
      break;
    }
  }
  /* Kontaktring + Bodenschein reagieren auf Auswahl */
  const on = focused ? 1 : 0;
  f.ring.material.opacity += ((focused ? 0.62 : 0.16) - f.ring.material.opacity) * 0.08;
  f.halo.material.opacity += ((focused ? 0.34 : 0.0) - f.halo.material.opacity) * 0.06;
  f.ring.scale.setScalar(1 + (focused ? Math.sin(t * 1.6) * 0.012 : 0));
  return on;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* =====================================================================
   Postprocessing — dezentes Bloom nur fuer die leuchtenden Augen
   ===================================================================== */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());
const renderPass = new RenderPass(scene, camera);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(1, 1),
  CFG.bloom.strength, CFG.bloom.radius, CFG.bloom.threshold);
const outputPass = new OutputPass();
composer.addPass(renderPass);
composer.addPass(bloomPass);
composer.addPass(outputPass);

let quality = 0;                                  // 0 HIGH · 1 MEDIUM · 2 LOW
let shadowBox = 11;
function setQuality(q) {
  if (q === quality) return;
  quality = q;
  bloomPass.enabled = q < 1;
  renderer.shadowMap.enabled = q < 2;
  scene.traverse(o => { if (o.isMesh && o.material) o.material.needsUpdate = true; });
  const dpr = Math.min(window.devicePixelRatio || 1, q < 2 ? CFG.dprMax : 1);
  renderer.setPixelRatio(dpr);
  composer.setPixelRatio(dpr);
  resize();
  el.sysQual.textContent = ['HIGH', 'MEDIUM', 'LOW'][q];
}

function resize() {
  const w = canvas.clientWidth || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  /* Auf schmalen Hochkant-Displays etwas mehr Blickfeld, sonst schneidet die Figur an */
  camera.fov = camera.aspect < 0.8 ? CFG.cam.fov + 14 : CFG.cam.fov;
  camera.updateProjectionMatrix();
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 220));
resize();

/* =====================================================================
   Loop
   ===================================================================== */
let running = true;
document.addEventListener('visibilitychange', () => {
  running = !document.hidden;
  if (running) last = performance.now() / 1000;
});
if (mqReduce.addEventListener)
  mqReduce.addEventListener('change', e => { REDUCED = e.matches; });

const spinParam = params.get('spin') !== '0';
const angleParam = params.has('angle') ? +params.get('angle') * DEG : null;
if (angleParam !== null) for (const f of figures) f.spin = angleParam;

let last = performance.now() / 1000, elapsed = 0;
let fpsAcc = 0, fpsFrames = 0, fpsTimer = 0, slowFor = 0;
const _lookAt = new THREE.Vector3();

function tick() {
  const now = performance.now() / 1000;
  let dt = now - last;
  last = now;
  if (!running) return;
  if (dt > 0.1) dt = 0.1;
  elapsed += dt;
  const t = elapsed;

  /* --- Figuren --- */
  for (let i = 0; i < figures.length; i++) {
    const f = figures[i];
    const focused = mode === 'focus' && i === selected;
    /* Drehteller: Drag-Impuls mit Reibung + sanfter Auto-Spin */
    f.spin += f.spinVel * dt;
    f.spinVel -= f.spinVel * Math.min(1, CFG.cam.spinFriction * dt);
    if (spinParam && !REDUCED && angleParam === null && !dragging)
      f.spin += (focused || mode === 'overview' ? CFG.autoSpin : CFG.autoSpin * 0.35) * dt;
    f.turn.rotation.y = f.spin;
    animateFigure(f, t, focused);
    /* Nicht gewaehlte Figuren abdunkeln */
    const front = (mode === 'overview' || focused);
    f.dimTarget = front ? CFG.dim.off : CFG.dim.on;
    const zWant = front ? 0 : CFG.backZ;
    f.root.position.z += (zWant - f.root.position.z) * Math.min(1, dt * 3.0);
    f.halo.position.z = f.root.position.z;
    f.ring.position.z = f.root.position.z;
    if (Math.abs(f.dimCur - f.dimTarget) > 0.002) {
      f.dimCur += (f.dimTarget - f.dimCur) * Math.min(1, dt * 4.2);
      for (const k in f.mats) {
        const m = f.mats[k];
        if (k === 'GLOW') m.color.setScalar(0.55 + 2.15 * f.dimCur);
        else m.color.setScalar(f.dimCur);
      }
    }
  }

  /* --- Kamera: gedaempft auf Ziel --- */
  const k = 1 - Math.exp(-CFG.cam.damp * dt);
  camTarget.lerp(camWant, k);
  dist += (distWant * zoom - dist) * k;
  pitch += (pitchWant - pitch) * k;
  yaw += (yawWant - yaw) * k;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  camera.position.set(
    camTarget.x + dist * cp * Math.sin(yaw),
    Math.max(0.12, camTarget.y + dist * sp),
    camTarget.z + dist * cp * Math.cos(yaw));
  _lookAt.copy(camTarget);
  camera.lookAt(_lookAt);

  /* --- Licht folgt der Auswahl --- */
  const fsel = figures[selected];
  const lx = mode === 'focus' ? fsel.x : OVERVIEW.x;
  /* Schattenkamera nur bei Moduswechsel neu spannen: eng im Fokus, weit in der Uebersicht */
  const wantBox = mode === 'focus' ? Math.max(2.2, fsel.r * 3.2 + fsel.h) : 11;
  if (Math.abs(shadowBox - wantBox) > 0.01) {
    shadowBox = wantBox;
    const sc = keyLight.shadow.camera;
    sc.left = -shadowBox; sc.right = shadowBox;
    sc.top = shadowBox * 0.7 + 1.2; sc.bottom = -shadowBox * 0.35;
    sc.updateProjectionMatrix();
  }
  keyLight.position.set(lx + 3.2, 6.2, 4.2);
  keyLight.target.position.set(lx, mode === 'focus' ? fsel.h * 0.4 : 0.7, 0);
  keyLight.target.updateMatrixWorld();
  rimLight.position.set(lx - 4.4, 3.0, -5.4);
  const acc = new THREE.Color(fsel.def.accent);
  accentA.color.lerp(acc, Math.min(1, dt * 2.4));
  const reach = Math.max(1.1, fsel.r * 2.0);
  accentA.position.set(lx - reach, fsel.h * 1.05 + 0.35, reach * 0.8);
  accentA.distance = 2.0 + fsel.h * 1.5;
  accentA.intensity = 1.5 + fsel.h * 0.5;
  accentB.position.set(lx + reach, fsel.h * 0.95, -reach * 0.9);
  accentB.distance = 1.9 + fsel.h * 1.3;
  accentB.intensity = 0.75 + Math.sin(t * 0.6) * 0.12 + fsel.h * 0.2;

  /* --- Staub --- */
  if (!REDUCED) {
    const p = dustGeo.attributes.position.array;
    for (let i = 0; i < dustN; i++) {
      p[i * 3 + 1] += dustVel[i] * dt;
      if (p[i * 3 + 1] > 5.4) p[i * 3 + 1] = -0.2;
    }
    dustGeo.attributes.position.needsUpdate = true;
  }
  sky.position.copy(camera.position);

  /* --- Rendern --- */
  if (bloomPass.enabled) composer.render();
  else renderer.render(scene, camera);

  /* --- Qualitaet nachregeln, ohne DOM-Sturm --- */
  fpsAcc += dt; fpsFrames++; fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    const fps = fpsFrames / fpsAcc;
    el.sysFps.textContent = Math.round(fps) + ' FPS';
    if (fps < 42) { slowFor += fpsTimer; if (slowFor > 2.0 && quality < 2) setQuality(quality + 1), slowFor = 0; }
    else slowFor = Math.max(0, slowFor - fpsTimer);
    fpsAcc = 0; fpsFrames = 0; fpsTimer = 0;
  }
  window.READY = true;
}
renderer.setAnimationLoop(tick);

/* =====================================================================
   Start
   ===================================================================== */
const focusParam = params.has('focus') ? +params.get('focus') - 1 : 0;
if (focusParam >= 0 && focusParam < ROSTER.length) { selected = focusParam; mode = 'focus'; }
else { mode = 'overview'; }
applyDossier(selected);
frameSelection(true);
if (mode === 'overview') overview();
tick();
renderer.render(scene, camera);
window.__LLFIG = { scene, renderer, camera, figures, select, overview,
  /* Direktrender ohne Bloom-Passes: zeigt die echten Szenen-Draw-Calls */
  measure: () => {
    renderer.info.reset();
    renderer.render(scene, camera);
    return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles,
             geos: renderer.info.memory.geometries, texs: renderer.info.memory.textures };
  } };
requestAnimationFrame(() => el.boot.classList.add('gone'));
setTimeout(() => { if (el.boot.parentNode) el.boot.parentNode.removeChild(el.boot); }, 900);

/* =====================================================================
   Aufraeumen
   ===================================================================== */
function destroy() {
  renderer.setAnimationLoop(null);
  for (const g of TRASH.geo) g.dispose();
  for (const m of TRASH.mat) m.dispose();
  for (const t of TRASH.tex) t.dispose();
  for (const k in BASE_MATS) BASE_MATS[k].dispose();
  scene.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const arr = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of arr) {
        for (const key in m) { const v = m[key]; if (v && v.isTexture) v.dispose(); }
        m.dispose();
      }
    }
  });
  composer.dispose();
  renderer.dispose();
}
addEventListener('pagehide', destroy, { once: true });
</script>
</body>
