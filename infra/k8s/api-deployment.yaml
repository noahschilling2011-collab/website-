apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-api
  namespace: nexus
  labels:
    app: nexus-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexus-api
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: nexus-api
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/nexus-api:latest # via CI ersetzt
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: nexus-api-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-api
  namespace: nexus
spec:
  selector:
    app: nexus-api
  ports:
    - port: 80
      targetPort: 8080
