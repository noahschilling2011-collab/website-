apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-api
  namespace: nexus
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # SSE/WebSockets
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.nexus.example.com]
      secretName: nexus-api-tls
  rules:
    - host: api.nexus.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-api
                port:
                  number: 80
