# Vorlage — echte Werte NIE einchecken. In Produktion: External Secrets
# Operator + AWS Secrets Manager (siehe docs/SCALING.md).
apiVersion: v1
kind: Secret
metadata:
  name: nexus-api-secrets
  namespace: nexus
type: Opaque
stringData:
  POSTGRES_URL: postgres://user:pass@rds-endpoint:5432/nexus
  REDIS_URL: redis://redis:6379
  JWT_SECRET: CHANGE_ME
  JWT_REFRESH_SECRET: CHANGE_ME
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
  REPLICATE_API_TOKEN: ""
