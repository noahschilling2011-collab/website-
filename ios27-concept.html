        muted=!muted;$('#cl-mute',view).textContent=muted?'🔇':'🔊';
        if(muted)audioStop();else audioStart();
      });
      // vertikaler Feed-Swipe + Doppeltipp-Like
      let down=false,sy=0,startOff=0,dragging=false,lastTap=0,vy=0,lastY=0,lastT=0;
      root.addEventListener('pointerdown',e=>{
        if(e.target.closest('button')||e.target.closest('.cl-scrim'))return;
        down=true;sy=e.clientY;startOff=-idx*SH;dragging=false;lastY=e.clientY;lastT=nowMs();sp.running=false;
      });
      root.addEventListener('pointermove',e=>{
        if(!down)return;const dy=e.clientY-sy;
        if(Math.abs(dy)>8)dragging=true;
        if(dragging){
          let off=startOff+dy;const min=-(VIDEOS.length-1)*SH;
          if(off>0)off*=0.35;if(off<min)off=min+(off-min)*0.35;
          feed.style.transform=`translateY(${off}px)`;sp.jump(off);
          const t=nowMs();vy=(e.clientY-lastY)/(t-lastT+1e-3)*16;lastY=e.clientY;lastT=t;
        }
      });
      root.addEventListener('pointerup',e=>{
        if(!down)return;down=false;
        if(dragging){
          let n=idx;
          if(vy<-7||( -sp.value+1e-3)/SH-idx>0.35)n=idx+1;
          else if(vy>7||idx-(-sp.value)/SH>0.35)n=idx-1;
          switchTo(n);return;
        }
        const now=nowMs();
        if(now-lastTap<300){doLike(idx,[e.clientX-view.getBoundingClientRect().x,e.clientY-view.getBoundingClientRect().y]);lastTap=0;}
        else lastTap=now;
      });
      _visHandlers.clips=v=>{visible=v;if(v){t0=nowMs();loop();if(!muted)audioStart();}else{if(raf)cancelAnimationFrame(raf);audioStop();}};
    }
  };
})();

/* ---------- Reaktionstest ---------- */
const Reaktion=(function(){
  let state='idle',t0=0,timer=null,best=null;
  return{
    name:'Reaktionstest',
    render(){return `<div id="rk-area" style="position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;padding:30px;text-align:center">

      <div id="rk-sub" style="font-size:16px;color:var(--text-dim);line-height:1.5">Tippe, um zu starten.<br>Warte auf GRÜN — dann tippe so schnell du kannst!</div>
      <div id="rk-best" style="font-size:14px;color:var(--text-dim);margin-top:10px"></div></div>`;},
    mount(view){
      const area=$('#rk-area',view),big=$('#rk-big',view),title=$('#rk-title',view),sub=$('#rk-sub',view),bestEl=$('#rk-best',view);
      const showBest=()=>{bestEl.textContent=best!=null?`Rekord: ${best} ms`:'';};
      state='idle';showBest();
      area.addEventListener('pointerdown',()=>{
        if(state==='idle'||state==='result'||state==='fail'){
          state='waiting';
          area.style.background='#c0392b';big.textContent='✋';title.textContent='Warte auf Grün …';title.style.color='#fff';sub.textContent='Nicht zu früh tippen!';sub.style.color='rgba(255,255,255,.8)';bestEl.style.color='rgba(255,255,255,.7)';
          timer=setTimeout(()=>{
            state='go';t0=nowMs();
            area.style.background='#27ae60';big.textContent='👆';title.textContent='JETZT!';sub.textContent='';
          },1200+((nowMs()*13)%2300));
        } else if(state==='waiting'){
          clearTimeout(timer);state='fail';
          area.style.background='var(--bg)';big.textContent='😅';title.textContent='Zu früh!';title.style.color='var(--text)';sub.textContent='Tippe, um es nochmal zu versuchen.';sub.style.color='var(--text-dim)';bestEl.style.color='var(--text-dim)';
        } else if(state==='go'){

        }
      });
      _visHandlers.reaktion=v=>{if(!v){clearTimeout(timer);state='idle';}};
    }
  };
})();

/* ---------- Snake ---------- */
const Snake=(function(){
  let cv,c2,iv=null,snake=[],dir=[1,0],nextDir=[1,0],food=[10,10],score=0,best=0,dead=false;
  const N=17,CS=20;
  function reset(){snake=[[8,8],[7,8],[6,8]];dir=[1,0];nextDir=[1,0];score=0;dead=false;placeFood();}
  function placeFood(){do{food=[(nowMs()*7.7|0)%N,(nowMs()*13.3|0)%N];}while(snake.some(s=>s[0]===food[0]&&s[1]===food[1]));}
  function step(){
    if(dead)return;
    dir=nextDir;
    const h=[(snake[0][0]+dir[0]+N)%N,(snake[0][1]+dir[1]+N)%N];
    if(snake.some(s=>s[0]===h[0]&&s[1]===h[1])){
      dead=true;best=Math.max(best,score);
      const ov=$('#sn-over');if(ov){ov.style.display='flex';$('#sn-score').textContent=score;$('#sn-best').textContent=best;}
      return;
    }
    snake.unshift(h);
    if(h[0]===food[0]&&h[1]===food[1]){score++;const s=$('#sn-sc');if(s)s.textContent=score;placeFood();}
    else snake.pop();
    draw();
  }
  function draw(){
    c2.fillStyle='#0c1a10';c2.fillRect(0,0,N*CS,N*CS);
    c2.fillStyle='rgba(255,255,255,.04)';
    for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)c2.fillRect(i*CS,j*CS,CS,CS);
    c2.fillStyle='#ff453a';c2.beginPath();c2.arc(food[0]*CS+CS/2,food[1]*CS+CS/2,CS/2-3,0,7);c2.fill();
    snake.forEach((s,i)=>{
      c2.fillStyle=i===0?'#7dff9b':'#30d158';
      c2.beginPath();c2.roundRect(s[0]*CS+1.5,s[1]*CS+1.5,CS-3,CS-3,6);c2.fill();
    });
  }
  return{
    name:'Snake',
    render(){return `<div style="background:#0a140d;min-height:100%;padding-bottom:30px">
      <div class="app-head" style="display:flex;justify-content:space-between;align-items:flex-end"><div class="app-title" style="color:#fff">Snake</div><div style="color:#7dff9b;font-size:22px;font-weight:800;padding-bottom:4px">🍎 <span id="sn-sc">0</span></div></div>
      <div style="position:relative;width:340px;margin:10px auto">
        <canvas id="sn-cv" width="340" height="340" style="display:block;border-radius:14px;touch-action:none"></canvas>
        <div id="sn-over" style="position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(5,15,8,.8);backdrop-filter:blur(4px);border-radius:14px">
          <div style="color:#fff;font-size:24px;font-weight:800">Vorbei!</div>
          <div style="color:rgba(255,255,255,.8)">Äpfel: <b id="sn-score">0</b> · Rekord: <b id="sn-best">0</b></div>
          <button id="sn-again" style="margin-top:8px;padding:11px 28px;border-radius:22px;background:#30d158;color:#04220f;font-weight:800">Nochmal</button></div>
      </div>
      <div style="text-align:center;color:rgba(255,255,255,.45);font-size:13px;margin-top:10px">Wischen zum Steuern</div></div>`;},
    mount(view){
      cv=$('#sn-cv',view);c2=cv.getContext('2d');
      reset();draw();
      if(iv)clearInterval(iv);
      iv=setInterval(step,140);
      let sx=0,sy=0;
      cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});
      cv.addEventListener('pointerup',e=>{
        const dx=e.clientX-sx,dy=e.clientY-sy;
        if(Math.abs(dx)<12&&Math.abs(dy)<12)return;
        let nd;
        if(Math.abs(dx)>Math.abs(dy))nd=[dx>0?1:-1,0];else nd=[0,dy>0?1:-1];
        if(!(nd[0]===-dir[0]&&nd[1]===-dir[1]))nextDir=nd;
      });
      pressable($('#sn-again',view),()=>{reset();$('#sn-over',view).style.display='none';$('#sn-sc',view).textContent='0';draw();});
      _visHandlers.snake=v=>{if(!v&&iv){clearInterval(iv);iv=null;}else if(v&&!iv){iv=setInterval(step,140);}};
    }
  };
})();

/* ---------- 2048 ---------- */
const G2048=(function(){
  let grid,score=0,best=0,over=false,won=false;
  const COLS={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
  function reset(){grid=Array.from({length:4},()=>[0,0,0,0]);score=0;over=false;won=false;spawn();spawn();}
  function empties(){const e=[];for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(!grid[y][x])e.push([x,y]);return e;}
  function spawn(){const e=empties();if(!e.length)return;const[x,y]=e[(nowMs()*7.31|0)%e.length];grid[y][x]=((nowMs()*3.7|0)%10)<9?2:4;}
  function slide(row){
    const a=row.filter(v=>v);
    for(let i=0;i<a.length-1;i++){if(a[i]===a[i+1]){a[i]*=2;score+=a[i];if(a[i]===2048)won=true;a.splice(i+1,1);}}
    while(a.length<4)a.push(0);
    return a;
  }
  function move(dx,dy){
    if(over)return;
    const before=JSON.stringify(grid);
    if(dx===-1)grid=grid.map(r=>slide(r));
    else if(dx===1)grid=grid.map(r=>slide(r.slice().reverse()).reverse());
    else if(dy===-1){for(let x=0;x<4;x++){const col=slide([grid[0][x],grid[1][x],grid[2][x],grid[3][x]]);for(let y=0;y<4;y++)grid[y][x]=col[y];}}
    else if(dy===1){for(let x=0;x<4;x++){const col=slide([grid[3][x],grid[2][x],grid[1][x],grid[0][x]]);for(let y=0;y<4;y++)grid[3-y][x]=col[y];}}
    if(JSON.stringify(grid)!==before){spawn();}
    if(!empties().length&&!canMove()){over=true;best=Math.max(best,score);}
    draw();
  }
  function canMove(){
    for(let y=0;y<4;y++)for(let x=0;x<4;x++){
      if(x<3&&grid[y][x]===grid[y][x+1])return true;
      if(y<3&&grid[y][x]===grid[y+1][x])return true;
    }
    return false;
  }
  let cv,c2;
  const CS=78,GAP=10;
  function draw(){
    if(!c2)return;
    c2.fillStyle='#bbada0';c2.beginPath();c2.roundRect(0,0,cv.width,cv.height,12);c2.fill();
    for(let y=0;y<4;y++)for(let x=0;x<4;x++){
      const v=grid[y][x];const px=GAP+x*(CS+GAP),py=GAP+y*(CS+GAP);
      c2.fillStyle=v?(COLS[v]||'#3c3a32'):'rgba(238,228,218,.35)';
      c2.beginPath();c2.roundRect(px,py,CS,CS,8);c2.fill();
      if(v){
        c2.fillStyle=v<=4?'#776e65':'#f9f6f2';
        c2.font=`800 ${v<100?34:v<1000?28:22}px -apple-system,sans-serif`;
        c2.textAlign='center';c2.textBaseline='middle';
        c2.fillText(v,px+CS/2,py+CS/2+2);
      }
    }
    const sc=$('#g2-sc');if(sc)sc.textContent=score;
    const ov=$('#g2-over');if(ov)ov.style.display=over?'flex':'none';
    const wb=$('#g2-win');if(wb)wb.style.display=(won&&!over)?'block':'none';
  }
  return{
    name:'2048',
    render(){return `<div style="background:#faf8ef;min-height:100%;padding-bottom:30px">
      <div class="app-head" style="display:flex;justify-content:space-between;align-items:flex-end">
        <div class="app-title" style="color:#776e65">2048</div>
        <div style="background:#bbada0;border-radius:10px;padding:6px 16px;text-align:center;margin-bottom:4px"><div style="font-size:10px;color:#eee4da;font-weight:700;letter-spacing:1px">PUNKTE</div><div id="g2-sc" style="color:#fff;font-size:20px;font-weight:800">0</div></div></div>
      <div id="g2-win" style="display:none;text-align:center;color:#edc22e;font-weight:800;font-size:15px;padding:4px">🎉 2048 erreicht! Weiter geht's …</div>
      <div style="position:relative;width:362px;margin:8px auto">
        <canvas id="g2-cv" width="362" height="362" style="display:block;touch-action:none"></canvas>
        <div id="g2-over" style="position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(238,228,218,.78);border-radius:12px">
          <div style="color:#776e65;font-size:26px;font-weight:800">Game Over!</div>
          <button id="g2-again" style="padding:11px 28px;border-radius:22px;background:#8f7a66;color:#fff;font-weight:800">Nochmal</button></div>
      </div>
      <div style="text-align:center;color:#a49a90;font-size:13px;margin-top:12px">Wischen, um die Kacheln zu verschieben</div></div>`;},
    mount(view){
      cv=$('#g2-cv',view);c2=cv.getContext('2d');
      reset();draw();
      let sx=0,sy=0,dn=false;
      cv.addEventListener('pointerdown',e=>{dn=true;sx=e.clientX;sy=e.clientY;});
      cv.addEventListener('pointerup',e=>{
        if(!dn)return;dn=false;
        const dx=e.clientX-sx,dy=e.clientY-sy;
        if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
        if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);
      });
      pressable($('#g2-again',view),()=>{reset();draw();});
    }
  };
})();

  function fmtDur(s){if(s%3600===0)return (s/3600)+(s===3600?' Stunde':' Stunden');if(s>=60)return Math.round(s/60)+(s===60?' Minute':' Minuten');return s+' Sekunden';}
  function calcExpr(q){
    let s=q.toLowerCase().replace(/,/g,'.').replace(/×/g,'*').replace(/(\d)\s*x\s*(?=\d)/g,'$1*').replace(/÷/g,'/').replace(/(\d)\s*:\s*(?=\d)/g,'$1/').replace(/plus/g,'+').replace(/minus/g,'-').replace(/mal/g,'*').replace(/geteilt(\s+durch)?/g,'/');
    const parts=s.match(/[0-9+\-*/().\s]+/g);if(!parts)return null;

  }
  function answer(q0){
    const q=q0.toLowerCase().trim();
    const A=(text,action,intent)=>{lastIntent=intent||null;return{text,action};};
    let m;

    if(/wie heiße ich|wie ist mein name|weißt du.*namen/.test(q))return A(userName?`Du heißt ${userName}! Sowas vergesse ich nicht. 😊`:'Das hast du mir noch nicht verraten — sag einfach „Ich heiße …".');
    if(/^(hi|hallo|hey|servus|moin|guten (morgen|tag|abend))\b/.test(q))return A(`Hallo${userName?' '+userName:''}! Schön, dass du da bist. Frag mich nach Wetter, Timer, Musik, Mathe — oder lass mich eine App öffnen. ✨`);
    if(/wie geht('?s| es dir)/.test(q))return A('Bestens — alle Springs federn, die Insel glüht und kein einziger Konsolen-Error. Und dir? 😄');

    if(/was kannst du|hilfe$|deine funktionen/.test(q))return A('Ich kann: Timer stellen ⏱️, Wetter ansagen 🌤️, Musik steuern 🎵, rechnen 🧮, Einheiten umrechnen 📏, würfeln & Münzen werfen 🎲, Hauptstädte 🌍, Nachrichten schicken ✉️, Apps öffnen, Dark Mode, Lautstärke, Helligkeit, Hintergrund … frag einfach!');
    if(/stopp.*timer|timer.*(stopp|aus|abbrechen)/.test(q))return A('Timer gestoppt.',()=>Timer.reset());
    if(m=q.match(/timer.*?(\d+)\s*(stunden?|std|minuten?|min|sekunden?|sek)?/)){
      const n=+m[1];const unit=m[2]||'min';
      const s=/^st/.test(unit)?n*3600:/^sek/.test(unit)?n:n*60;

      const to=m[1],text=m[2];
      const ok=Messages.sendTo(to,text);
      if(ok)return A(`Erledigt — Nachricht an ${to[0].toUpperCase()+to.slice(1)} geschickt. ✉️ Die Antwort landet in der Nachrichten-App.`);

    }
    if(m=q.match(/(?:öffne|öffnen|starte|mach)\s+(?:mal\s+)?(?:die\s|den\s|das\s)?([a-zäöüß .0-9]+?)(?:\s*(?:app|auf))?[.!?]?$/)){
      const name=m[1].trim();
      const map={rechner:'calc',uhr:'clock',timer:'clock',stoppuhr:'clock',notizen:'notes',notiz:'notes',wetter:'weather',musik:'music',fotos:'photos',galerie:'photos',kamera:'camera','app store':'appstore',appstore:'appstore',store:'appstore',einstellungen:'settings',nova:'nova',assistent:'nova',nachrichten:'messages',messenger:'messages',snap:'snap',snapchat:'snap',clips:'clips',tiktok:'clips',orbit:'orbit',kompass:'kompass','kompass pro':'kompass','pixel maler':'maler',maler:'maler',taktgeber:'metronom',metronom:'metronom','2048':'g2048',snake:'snake',würfel:'wuerfel',wuerfel:'wuerfel',reaktionstest:'reaktion',reaktion:'reaktion'};
      const id=map[name];
      if(id&&(PAGES[0].includes(id)||DOCK.includes(id)||INSTALLED.includes(id)))return A(`Öffne ${APPS[id].name} …`,()=>openFromAnywhere(id));
      if(id)return A(`„${APPS[id].name}" ist noch nicht installiert — schau mal im App Store vorbei. 🛍️`);
      return A(`Eine App namens „${name}" kenne ich nicht.`);
    }
    if(m=q.match(/hauptstadt von ([a-zäöüß]+)/)){
      const c=CAPITALS[m[1]];
      return A(c?`Die Hauptstadt von ${m[1][0].toUpperCase()+m[1].slice(1)} ist ${c}. 🌍`:`Die kenne ich leider nicht auswendig — mein Offline-Atlas ist klein.`);
    }
    if(m=q.match(/(\d+[.,]?\d*)\s*(km|kilometer|meilen?|miles?|kg|kilo(?:gramm)?|pfund|lbs?|grad( celsius)?|°c|fahrenheit|°f|meter|m|fuß|feet|ft)\s*(?:in|zu|nach)\s*(km|kilometer|meilen?|miles?|kg|kilo(?:gramm)?|pfund|lbs?|grad( celsius)?|°c|fahrenheit|°f|meter|m|fuß|feet|ft)/)){
      const v=parseFloat(m[1].replace(',','.'));const from=m[2],to=m[4];
      const R2=x=>Math.round(x*100)/100;
      const cls=u=>/^km|kilometer/.test(u)?'km':/meile|mile/.test(u)?'mi':/^kg|kilo/.test(u)?'kg':/pfund|lb/.test(u)?'lb':/celsius|°c|^grad/.test(u)?'c':/fahrenheit|°f/.test(u)?'f':/fuß|feet|ft/.test(u)?'ft':'m';
      const a=cls(from),b=cls(to);let r=null;
      if(a==='km'&&b==='mi')r=R2(v*0.621371)+' Meilen';else if(a==='mi'&&b==='km')r=R2(v*1.60934)+' km';
      else if(a==='kg'&&b==='lb')r=R2(v*2.20462)+' Pfund';else if(a==='lb'&&b==='kg')r=R2(v*0.453592)+' kg';
      else if(a==='c'&&b==='f')r=R2(v*9/5+32)+' °F';else if(a==='f'&&b==='c')r=R2((v-32)*5/9)+' °C';
      else if(a==='m'&&b==='ft')r=R2(v*3.28084)+' Fuß';else if(a==='ft'&&b==='m')r=R2(v*0.3048)+' m';
      if(r)return A(`${m[1]} ${from} sind <b>${r.replace('.',',')}</b>. 📏`);
    }
    if(/wirf.*münze|münze werfen|kopf oder zahl/.test(q)){const r=(nowMs()*7|0)%2;return A(r?'🪙 <b>Kopf!</b>':'🪙 <b>Zahl!</b>');}
    if(/würfel|würfle/.test(q)&&!/öffne/.test(q)){const r=((nowMs()*13|0)%6)+1;return A(`🎲 Du hast eine <b>${r}</b> gewürfelt!`);}
    if(m=q.match(/zufallszahl.*?(\d+).*?(\d+)/)){const a=+m[1],b=+m[2];const r=a+((nowMs()*17|0)%(Math.abs(b-a)+1));return A(`Deine Zufallszahl zwischen ${a} und ${b}: <b>${r}</b> 🎰`);}
    if(m=q.match(/^und in (münchen|hamburg|palermo)/)){
      if(lastIntent==='weather'){const wd=WeatherData.find(x=>x.city.toLowerCase()===m[1]);return A(`Dort sind es ${wd.now}° und ${wd.cond.toLowerCase()} — heute bis ${wd.hi}°, nachts ${wd.lo}°.`,null,'weather');}
    }
    if(/wetter/.test(q)){
      const cm=q.match(/münchen|hamburg|palermo/);
      const wd=cm?WeatherData.find(x=>x.city.toLowerCase()===cm[0]):WeatherData[0];
      return A(`In ${wd.city} ist es gerade ${wd.now}° und ${wd.cond.toLowerCase()}. Heute: bis ${wd.hi}°, nachts ${wd.lo}°.${cm?'':' (Ich habe München genommen — sag z. B. „Wetter in Palermo". Du kannst auch „und in Hamburg?" nachfragen.)'}`,null,'weather');
    }
    if(/lauter/.test(q))return A('Ich drehe auf. 🔊',()=>{State.volume=clamp(State.volume+0.25,0,1);Music.setVolume(State.volume);buildCC();});
    if(/leiser/.test(q))return A('Etwas leiser. 🔉',()=>{State.volume=clamp(State.volume-0.25,0,1);Music.setVolume(State.volume);buildCC();});
    if(/heller/.test(q))return A('Mehr Licht! 🔆',()=>{State.brightness=clamp(State.brightness+0.25,0,1);document.documentElement.style.setProperty('--brightness',0.35+State.brightness*0.65);buildCC();});
    if(/dimm|dunkler stellen/.test(q))return A('Ich dimme das Display. 🔅',()=>{State.brightness=clamp(State.brightness-0.25,0,1);document.documentElement.style.setProperty('--brightness',0.35+State.brightness*0.65);buildCC();});
    if(/flugmodus (an|ein)/.test(q))return A('Flugmodus ist an. ✈️',()=>{State.airplane=true;State.wifi=false;State.bluetooth=false;renderStatusRight();buildCC();});
    if(/flugmodus aus/.test(q))return A('Flugmodus ist aus — willkommen zurück im Netz. 📶',()=>{State.airplane=false;State.wifi=true;State.bluetooth=true;renderStatusRight();buildCC();});
    if(/musik|song|lied|track/.test(q)){
      if(/aus\b|stopp|pause/.test(q))return A('Musik pausiert. 🔇',()=>{if(Music.playing)Music.toggle();});
      if(/nächst|weiter|skip/.test(q))return A('Nächster Track. 🎵',()=>Music.next());
      return A(`Ich spiele „${Music.cur().title}" von ${Music.cur().artist}. 🎶`,()=>{if(!Music.playing)Music.toggle();});
    }
    if(/dunkel|dark ?mode|nachtmodus/.test(q))return A('Wird dunkel. 🌙',()=>setDark(true));
    if(/\bhell(er|es)?\b|light ?mode/.test(q))return A('Und es werde Licht. ☀️',()=>setDark(false));
    if(/hintergrund|wallpaper/.test(q))return A('Neues Hintergrundbild — schau, wie sich die ganze UI mit umfärbt. 🎨',()=>{State.wallpaper=(State.wallpaper+1)%WALLPAPERS.length;drawWall();setTint(WALLPAPERS[State.wallpaper].tint);updateWidget();});
    if(/batterie|akku/.test(q))return A(`Die Batterie steht bei ${State.battery} %. ${State.battery>50?'Alles entspannt.':'Langsam ans Laden denken!'} 🔋`);
    if(/wie spät|uhrzeit/.test(q)){const d=new Date();return A(`Es ist ${fmtTime(d)} Uhr.`);}
    if(/datum|welcher tag|heute/.test(q)){const d=new Date();return A(`Heute ist ${DAYS[d.getDay()]}, der ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}.`);}
    if(/witz|lustig/.test(q))return A(JOKES[(jokeI++)%JOKES.length]);
    if(/foto|bild/.test(q)&&/mach|schieß|aufnehm/.test(q))return A('Dafür öffne ich dir die Kamera. 📸',()=>openFromAnywhere('camera'));
    if(/danke/.test(q))return A('Immer gerne! 💙');
    if(/[0-9]\s*[+\-*×÷:\/]|was (ist|ergibt|macht).*\d/.test(q)){
      const r=calcExpr(q);
      if(r!=null)return A(`Das ergibt <b>${String(r).replace('.',',')}</b>.`);
    }
    return A('Hm, das habe ich noch nicht gelernt. Versuch es mit „Timer auf 5 Minuten", „Wie ist das Wetter?", „Öffne Rechner" — oder gib mir eine Rechenaufgabe.');
  }
  function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function bubble(who,html){
    const b=el('div','');
    b.style.cssText=who==='me'
      ?'align-self:flex-end;background:var(--tint);color:#fff;border-radius:18px 18px 4px 18px;padding:9px 14px;max-width:82%;font-size:15px;line-height:1.4'
      :'align-self:flex-start;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:18px 18px 18px 4px;padding:9px 14px;max-width:86%;font-size:15px;line-height:1.4';
    b.innerHTML=html;
    const chat=$('#nv-chat');if(chat){chat.appendChild(b);chat.scrollTop=chat.scrollHeight;}
    return b;
  }
  function say(who,html){msgs.push({who,html});return bubble(who,html);}
  function handle(q){
    q=(q||'').trim();if(!q||busy)return;
    say('me',escapeHtml(q));
    const inp=$('#nv-in');if(inp)inp.value='';
    busy=true;
    const th=bubble('nova','<span style="letter-spacing:3px">•••</span>');
    setTimeout(()=>{
      const a=answer(q);
      th.innerHTML=a.text;
      msgs.push({who:'nova',html:a.text});
      busy=false;
      const chat=$('#nv-chat');if(chat)chat.scrollTop=chat.scrollHeight;

  }
  function drawOrb(){
    if(!visible)return;
    const t=nowMs()/1000;const w=orb.width,h=orb.height,cx=w/2,cy=h/2;
    octx.clearRect(0,0,w,h);

    const cols=['#5c7bff','#c05cff','#ff5ca8','#4cd9ff'];
    octx.globalCompositeOperation='lighter';
    cols.forEach((c,i)=>{
      const a=t*sp*(0.6+i*0.13)+i*1.7;
      const x=cx+Math.cos(a)*16,y=cy+Math.sin(a*1.3)*16;
      const g=octx.createRadialGradient(x,y,0,x,y,46);

  }
  return{
    name:'Nova',
    render(){
      return `<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% -10%,#232a54,#05060f 60%);display:flex;flex-direction:column">
      <div style="height:56px;flex:0 0 auto"></div>

      <div style="text-align:center;color:#fff;font-size:21px;font-weight:800;flex:0 0 auto">Nova</div>

      <div style="display:flex;gap:8px;overflow-x:auto;padding:8px 14px;flex:0 0 auto;touch-action:pan-x">${CHIPS.map(c=>`<button class="nv-chip" style="flex:0 0 auto;padding:9px 14px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:13.5px;font-weight:600">${c}</button>`).join('')}</div>

    }
  };
})();

/* Spotlight-Suche (iOS-26/27-Pille über dem Dock) */
function buildSpotlight(){
  const sp=$('#spotlight'),grid=$('#sp-grid'),inp=$('#sp-in');
  const allApps=()=>[...new Set([...PAGES[0],...DOCK,...INSTALLED])];
  const renderGrid=f=>{
    grid.innerHTML='';
    allApps().filter(id=>APPS[id].name.toLowerCase().includes(f)).forEach(id=>{
      const n=el('div','app-ic');
      n.innerHTML=`<div class="squircle">${ICONS[id]()}</div><div class="label">${APPS[id].name}</div>`;
      n.addEventListener('click',()=>{close();openFromAnywhere(id);});
      grid.appendChild(n);
    });
    if(!grid.children.length)grid.innerHTML='<div style="grid-column:span 4;text-align:center;color:rgba(255,255,255,.6);font-size:14px;padding:20px">Keine Treffer</div>';
  };
  const open=()=>{sp.classList.add('on');renderGrid('');inp.value='';};
  const close=()=>{sp.classList.remove('on');};
  pressable($('#search-pill'),open);
  inp.addEventListener('input',()=>renderGrid(inp.value.toLowerCase().trim()));
  $('#sp-cancel').addEventListener('click',close);
  sp.addEventListener('click',e=>{if(e.target===sp)close();});
}

/* ============================================================
   Boot sequence init
   ============================================================ */
function init(){
  // Scroll-Pinning: overflow:hidden-Container dürfen NIE scrollen (Fokus/
  // scrollIntoView können sie sonst programmatisch verschieben — z. B. wenn
  // auf dem iPhone die Tastatur für ein Eingabefeld aufgeht)
  [document.getElementById('screen'),document.getElementById('device')].forEach(n=>{
    n.addEventListener('scroll',()=>{n.scrollLeft=0;n.scrollTop=0;});
  });
  window.addEventListener('scroll',()=>window.scrollTo(0,0));
  sizeWall();drawWall();
  setTint(WALLPAPERS[0].tint);
  setAccent(ACCENTS[0]);
  renderStatusRight();
  renderLockNotifs();
  buildHome();
  buildCC();
  buildSpotlight();
  updateMsgBadges();
  updateClock();
  islandTick();
  // Lebendiges Wallpaper: Mesh-Blobs driften langsam (~20 fps, pausiert bei offener App)
  let wallFrame=0;
  (function wallLoop(){
    requestAnimationFrame(wallLoop);
    if(document.hidden)return;
    if(State.currentApp&&openProgress>0.98)return;
    if((wallFrame++)%3)return;
    drawWall();
  })();
  setInterval(updateClock,1000);
  // battery drain
  setInterval(()=>{if(State.battery>5){State.battery-=1;renderStatusRight();}},45000);
  runBoot();
  // resume audio on first interaction
  const kick=()=>{if(Music&&!State._audioKicked){State._audioKicked=true;}};
  window.addEventListener('pointerdown',kick,{once:true});
}
window.addEventListener('resize',()=>{sizeWall();drawWall();applyPages();});
