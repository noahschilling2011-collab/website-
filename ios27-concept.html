/* ---------- Orbit (Mini-Spiel aus dem Store) ---------- */
const Orbit=(function(){
  let cv,ctx2,raf,visible=false,best=0;
  let angle=0,ringIdx=1,rCur=132,obs=[],score=0,alive=true,last=0,spawnT=0,speed=0.02;
  const R=[78,132];
  function reset(){angle=-Math.PI/2;ringIdx=1;rCur=R[1];obs=[];score=0;alive=true;speed=0.020;spawnT=600;}
  function spawn(){
    const ring=Math.random()<0.5?0:1;
    obs.push({ring,a:angle+Math.PI+(Math.random()*2-1)*1.2,sp:(Math.random()*0.4+0.2)*(Math.random()<0.5?-1:1)*0.004,r:9});
  }
  function tick(t){
    if(!visible)return;
    const dt=Math.min((t-last)/16.6,3);last=t;
    const w=cv.width,h=cv.height,cx=w/2,cy=h/2-10;
    if(alive){
      angle+=speed*dt;score+=dt*0.016;speed+=dt*0.000012;
      spawnT-=dt*16.6;if(spawnT<=0){spawn();spawnT=900+Math.random()*700;}
      rCur+=(R[ringIdx]-rCur)*0.18*dt;
      obs.forEach(o=>o.a+=o.sp*dt);
      for(const o of obs){
        const or=R[o.ring];
        if(Math.abs(or-rCur)<14){
          const d=Math.abs(((angle-o.a)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI);
          if(d<(o.r+8)/or){
            alive=false;best=Math.max(best,Math.floor(score));
            const go=$('#ob-over');if(go){go.style.display='flex';$('#ob-score').textContent=Math.floor(score);$('#ob-best').textContent=best;}
          }
        }
      }
      if(obs.length>14)obs.shift();
    }
    ctx2.fillStyle='#05060f';ctx2.fillRect(0,0,w,h);
    for(let i=0;i<40;i++){const sx=(i*97)%w,sy=(i*211)%h;ctx2.globalAlpha=0.15+((i*37)%10)/16;ctx2.fillStyle='#fff';ctx2.fillRect(sx,sy,1.6,1.6);}
    ctx2.globalAlpha=1;
    R.forEach(r=>{ctx2.strokeStyle='rgba(255,255,255,.14)';ctx2.lineWidth=2;ctx2.beginPath();ctx2.arc(cx,cy,r,0,7);ctx2.stroke();});
    const pg=ctx2.createRadialGradient(cx-8,cy-8,2,cx,cy,26);
    pg.addColorStop(0,'#ffd76b');pg.addColorStop(1,'#ff7a2a');
    ctx2.fillStyle=pg;ctx2.beginPath();ctx2.arc(cx,cy,24,0,7);ctx2.fill();
    obs.forEach(o=>{const or=R[o.ring];const x=cx+Math.cos(o.a)*or,y=cy+Math.sin(o.a)*or;
      ctx2.fillStyle='#8899b0';ctx2.beginPath();ctx2.arc(x,y,o.r,0,7);ctx2.fill();
      ctx2.fillStyle='rgba(0,0,0,.25)';ctx2.beginPath();ctx2.arc(x+2,y+2,o.r*0.5,0,7);ctx2.fill();});
    const sx2=cx+Math.cos(angle)*rCur,sy2=cy+Math.sin(angle)*rCur;
    ctx2.strokeStyle='rgba(107,208,255,.4)';ctx2.lineWidth=3;
    ctx2.beginPath();ctx2.arc(cx,cy,rCur,angle-0.5,angle);ctx2.stroke();
    ctx2.fillStyle='#6bd0ff';ctx2.beginPath();ctx2.arc(sx2,sy2,8,0,7);ctx2.fill();
    ctx2.fillStyle='#fff';ctx2.font='700 26px -apple-system,sans-serif';ctx2.textAlign='center';
    ctx2.fillText(Math.floor(score),cx,44);
    raf=requestAnimationFrame(tick);
  }
  return{
    name:'Orbit',
    render(){return `<div style="background:#05060f;min-height:100%">
      <div class="app-head"><div class="app-title" style="color:#fff">Orbit</div></div>
      <div style="position:relative">
        <canvas id="ob-cv" width="393" height="560" style="display:block;width:100%;touch-action:none"></canvas>
        <div id="ob-over" style="position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(5,6,15,.72);backdrop-filter:blur(6px)">
          <div style="color:#fff;font-size:26px;font-weight:800">Vorbei!</div>
          <div style="color:rgba(255,255,255,.8)">Punkte: <b id="ob-score">0</b> · Rekord: <b id="ob-best">0</b></div>
          <button id="ob-again" style="margin-top:10px;padding:12px 30px;border-radius:24px;background:var(--tint);color:#fff;font-weight:700;font-size:16px">Nochmal</button></div>
      </div>
      <div style="text-align:center;color:rgba(255,255,255,.45);font-size:13px;padding:8px">Tippen wechselt die Umlaufbahn</div></div>`;},
    mount(view){
      cv=$('#ob-cv',view);ctx2=cv.getContext('2d');
      reset();visible=true;last=nowMs();raf=requestAnimationFrame(tick);
      cv.addEventListener('pointerdown',()=>{if(alive)ringIdx=1-ringIdx;});
      pressable($('#ob-again',view),()=>{reset();$('#ob-over',view).style.display='none';});
      _visHandlers.orbit=v=>{visible=v;if(v){last=nowMs();raf=requestAnimationFrame(tick);}else if(raf)cancelAnimationFrame(raf);};
    }
  };
})();

/* ---------- Kompass Pro ---------- */
const Kompass=(function(){
  let cv,kctx,raf,visible=false,hcur=0,listener=false,heading=null;
  function target(){
    if(heading!=null)return heading;
    const t=nowMs();return (24+Math.sin(t/2600)*32+Math.sin(t/730)*2.5+360)%360;
  }
  function dirName(d){const n=['N','NO','O','SO','S','SW','W','NW'];return n[Math.round(((d%360)+360)%360/45)%8];}
  function loop(){
    if(!visible)return;
    const tg=target();
    const diff=((tg-hcur+540)%360)-180;hcur=(hcur+diff*0.08+360)%360;
    const w=cv.width,h=cv.height,cx=w/2,cy=h/2;
    kctx.clearRect(0,0,w,h);
    kctx.save();kctx.translate(cx,cy);kctx.rotate(-hcur*Math.PI/180);
    for(let d=0;d<360;d+=2){
      const maj=d%30===0;
      kctx.save();kctx.rotate(d*Math.PI/180);
      kctx.fillStyle=maj?'rgba(255,255,255,.9)':'rgba(255,255,255,.3)';
      kctx.fillRect(maj?-1.25:-0.75,-h*0.46,maj?2.5:1.5,maj?16:9);
      kctx.restore();
    }
    kctx.textAlign='center';kctx.textBaseline='middle';
    ['N','O','S','W'].forEach((L,i)=>{
      kctx.save();kctx.rotate(i*90*Math.PI/180);kctx.translate(0,-h*0.35);kctx.rotate((hcur-i*90)*Math.PI/180);
      kctx.fillStyle=L==='N'?'#ff453a':'#fff';kctx.font='700 24px -apple-system,sans-serif';kctx.fillText(L,0,0);kctx.restore();
    });
    kctx.restore();
    kctx.fillStyle='#fff';kctx.fillRect(cx-2,2,4,18);
    kctx.font='200 62px -apple-system,sans-serif';kctx.textAlign='center';kctx.fillStyle='#fff';
    kctx.fillText(Math.round(hcur)+'°',cx,cy-6);
    kctx.font='600 22px -apple-system,sans-serif';kctx.fillStyle='rgba(255,255,255,.75)';
    kctx.fillText(dirName(hcur),cx,cy+36);
    raf=requestAnimationFrame(loop);
  }
  return{
    name:'Kompass',
    render(){return `<div style="background:#000;min-height:100%;padding-bottom:40px">
      <div class="app-head"><div class="app-title" style="color:#fff">Kompass</div></div>
      <canvas id="kp-cv" width="340" height="340" style="display:block;margin:22px auto 16px;width:340px;height:340px"></canvas>
      <div style="text-align:center;color:rgba(255,255,255,.85);font-size:15px">48,1374° N · 11,5755° O</div>
      <div style="text-align:center;color:rgba(255,255,255,.5);font-size:13px;margin-top:4px">München · 519 m</div></div>`;},
    mount(view){
      cv=$('#kp-cv',view);kctx=cv.getContext('2d');
      if(!listener){listener=true;window.addEventListener('deviceorientation',e=>{if(e.alpha!=null)heading=(360-e.alpha)%360;});}
      visible=true;loop();
      _visHandlers.kompass=v=>{visible=v;if(v)loop();else if(raf)cancelAnimationFrame(raf);};
    }
  };
})();

/* ---------- Pixel Maler ---------- */
const Maler=(function(){
  const COLORS=['#1c1c1e','#ff453a','#ff9f0a','#ffd60a','#30d158','#40c8e0','#0a84ff','#bf5af2','#ffffff'];
  let cur='#0a84ff';
  const CS=28, COLSN=12, ROWSN=14;
  return{
    name:'Pixel Maler',
    render(){return `<div style="background:var(--bg);min-height:100%;padding-bottom:40px">
      <div class="app-head"><div class="app-title">Pixel Maler</div></div>
      <canvas id="ml-cv" width="${COLSN*CS}" height="${ROWSN*CS}" style="display:block;margin:8px auto;background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);touch-action:none"></canvas>
      <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px 20px">${COLORS.map(c=>`<div class="ml-sw" data-c="${c}" style="width:32px;height:32px;border-radius:50%;background:${c};border:3px solid ${c===cur?'var(--tint)':'rgba(128,128,128,.3)'};box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer"></div>`).join('')}</div>
      <div style="text-align:center"><button id="ml-clear" style="padding:10px 26px;border-radius:20px;background:var(--panel);border:1px solid var(--panel-border);color:var(--text);font-weight:600">Leinwand löschen</button></div></div>`;},
    mount(view){
      const cv=$('#ml-cv',view),c=cv.getContext('2d');
      function grid(){c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.strokeStyle='rgba(0,0,0,.07)';c.lineWidth=1;
        for(let x=0;x<=COLSN;x++){c.beginPath();c.moveTo(x*CS+0.5,0);c.lineTo(x*CS+0.5,cv.height);c.stroke();}
        for(let y=0;y<=ROWSN;y++){c.beginPath();c.moveTo(0,y*CS+0.5);c.lineTo(cv.width,y*CS+0.5);c.stroke();}}
      grid();
      let dn=false;
      const paint=e=>{const r=cv.getBoundingClientRect();
        const x=Math.floor((e.clientX-r.left)/(r.width/COLSN)),y=Math.floor((e.clientY-r.top)/(r.height/ROWSN));
        if(x<0||y<0||x>=COLSN||y>=ROWSN)return;
        c.fillStyle=cur;c.fillRect(x*CS+1,y*CS+1,CS-1,CS-1);};
      cv.addEventListener('pointerdown',e=>{dn=true;cv.setPointerCapture(e.pointerId);paint(e);});
      cv.addEventListener('pointermove',e=>{if(dn)paint(e);});
      cv.addEventListener('pointerup',()=>dn=false);
      $$('.ml-sw',view).forEach(s=>s.addEventListener('click',()=>{cur=s.dataset.c;$$('.ml-sw',view).forEach(x=>x.style.borderColor='rgba(128,128,128,.3)');s.style.borderColor='var(--tint)';}));
      pressable($('#ml-clear',view),()=>grid());
    }
  };
})();

/* ---------- Taktgeber (Metronom, Web Audio) ---------- */
const Metronom=(function(){
  let bpm=100,running=false,timer=null,nextT=0,beatN=0;
  function schedule(){
    if(!running)return;
    const ac=Music.audioCtx();
    while(nextT<ac.currentTime+0.12){
      const t=nextT,acc=(beatN%4===0);
      const o=ac.createOscillator(),g=ac.createGain();
      o.frequency.value=acc?1500:1000;
      g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(acc?0.32:0.2,t+0.004);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.06);
      const dl=Math.max(0,(t-ac.currentTime)*1000);
      setTimeout(()=>{const p=$('#met-pulse');if(p){p.style.transform='scale(1.22)';p.style.background=acc?'var(--tint)':'rgba(128,128,140,.5)';setTimeout(()=>{p.style.transform='scale(1)';},90);}},dl);
      beatN++;nextT+=60/bpm;
    }
    timer=setTimeout(schedule,50);
  }
  function stop(){running=false;if(timer)clearTimeout(timer);const b=$('#met-go');if(b)b.textContent='Start';}
  return{
    name:'Taktgeber',
    render(){return `<div style="background:var(--bg);min-height:100%;padding-bottom:40px">
      <div class="app-head"><div class="app-title">Taktgeber</div></div>
      <div style="text-align:center;margin-top:24px">
        <div id="met-pulse" style="width:110px;height:110px;border-radius:50%;background:rgba(128,128,140,.5);margin:0 auto;transition:transform .09s"></div>
        <div id="met-bpm" style="font-size:64px;font-weight:200;color:var(--text);margin-top:16px">${bpm}</div>
        <div style="color:var(--text-dim);font-size:14px;letter-spacing:2px">BPM</div></div>
      <div id="met-track" style="margin:24px 30px;height:34px;border-radius:17px;background:var(--panel);border:1px solid var(--panel-border);position:relative;overflow:hidden;touch-action:none;cursor:pointer">
        <div id="met-fill" style="position:absolute;top:0;bottom:0;left:0;width:${(bpm-40)/168*100}%;background:var(--tint);border-radius:17px"></div></div>
      <div style="text-align:center;margin-top:6px"><button id="met-go" style="width:84px;height:84px;border-radius:50%;background:var(--tint);color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 24px var(--tint-soft)">${running?'Stopp':'Start'}</button></div></div>`;},
    mount(view){
      const tr=$('#met-track',view),fill=$('#met-fill',view);
      const setB=v=>{bpm=Math.round(clamp(v,40,208));$('#met-bpm',view).textContent=bpm;fill.style.width=((bpm-40)/168*100)+'%';};
      let dn=false;
      const mv=e=>{const r=tr.getBoundingClientRect();setB(40+((e.clientX-r.left)/r.width)*168);};
      tr.addEventListener('pointerdown',e=>{dn=true;tr.setPointerCapture(e.pointerId);mv(e);});
      tr.addEventListener('pointermove',e=>{if(dn)mv(e);});
      tr.addEventListener('pointerup',()=>dn=false);
      pressable($('#met-go',view),()=>{
        if(running){stop();}
        else{const ac=Music.audioCtx();running=true;beatN=0;nextT=ac.currentTime+0.08;schedule();$('#met-go',view).textContent='Stopp';}
      });
      _visHandlers.metronom=v=>{if(!v)stop();};
    }
  };
})();

/* ---------- Nova — eigene Offline-Assistentin ---------- */
const Nova=(function(){
  let orb=null,octx=null,raf=null,visible=false,busy=false,jokeI=0;
  const msgs=[];
  const JOKES=[
    'Warum können Geister so schlecht lügen? Weil man durch sie hindurchsieht. 👻',
    'Treffen sich zwei Magneten. Sagt der eine: „Was soll ich bloß anziehen?"',
    'Warum hat der Mathematiker Angst vor Minusgraden? Er fürchtet sich vor negativen Zahlen. ❄️',
    'Mein WLAN und ich führen eine stabile Beziehung. Meistens.',
  ];
  const CHIPS=['Timer auf 5 Minuten','Wie ist das Wetter?','Spiel Musik','Was ist 12 × 8?','Erzähl einen Witz','Neuer Hintergrund'];
  function fmtDur(s){if(s%3600===0)return (s/3600)+(s===3600?' Stunde':' Stunden');if(s>=60)return Math.round(s/60)+(s===60?' Minute':' Minuten');return s+' Sekunden';}
  function calcExpr(q){
    let s=q.toLowerCase().replace(/,/g,'.').replace(/×/g,'*').replace(/(\d)\s*x\s*(?=\d)/g,'$1*').replace(/÷/g,'/').replace(/(\d)\s*:\s*(?=\d)/g,'$1/').replace(/plus/g,'+').replace(/minus/g,'-').replace(/mal/g,'*').replace(/geteilt(\s+durch)?/g,'/');
    const parts=s.match(/[0-9+\-*/().\s]+/g);if(!parts)return null;
    const toks=parts.join(' ').match(/\d+\.?\d*|[+\-*/()]/g);
    if(!toks||!toks.some(t=>'+-*/'.includes(t))||!toks.some(t=>/\d/.test(t)))return null;
    let i=0;
    function expr(){let v=term();while(toks[i]==='+'||toks[i]==='-'){const op=toks[i++];v=op==='+'?v+term():v-term();}return v;}
    function term(){let v=fact();while(toks[i]==='*'||toks[i]==='/'){const op=toks[i++];v=op==='*'?v*fact():v/fact();}return v;}
    function fact(){if(toks[i]==='('){i++;const v=expr();i++;return v;}if(toks[i]==='-'){i++;return -fact();}return parseFloat(toks[i++]);}
    try{const v=expr();if(v==null||!isFinite(v)||isNaN(v))return null;return Math.round(v*1e9)/1e9;}catch(e){return null;}
  }
  function answer(q0){
    const q=q0.toLowerCase().trim();
    const A=(text,action)=>({text,action});
    let m;
    if(/^(hi|hallo|hey|servus|moin|guten (morgen|tag|abend))\b/.test(q))return A('Hallo! Schön, dass du da bist. Frag mich nach Wetter, Timer, Musik, Mathe — oder lass mich eine App öffnen. ✨');
    if(/wer bist du|wie heißt du|was bist du/.test(q))return A('Ich bin Nova, die Assistentin dieses iOS-27-Concepts. Komplett offline, komplett handgemacht — keine Cloud, nur JavaScript. 💫');
    if(/stopp.*timer|timer.*(stopp|aus|abbrechen)/.test(q))return A('Timer gestoppt.',()=>Timer.reset());
    if(m=q.match(/timer.*?(\d+)\s*(stunden?|std|minuten?|min|sekunden?|sek)?/)){
      const n=+m[1];const unit=m[2]||'min';
      const s=/^st/.test(unit)?n*3600:/^sek/.test(unit)?n:n*60;
      return A(`Alles klar — Timer auf ${fmtDur(s)} gestellt. Du siehst ihn oben in der Insel. ⏱️`,()=>Timer.start(s));
    }
    if(m=q.match(/(?:öffne|öffnen|starte|mach)\s+(?:mal\s+)?(?:die\s|den\s|das\s)?([a-zäöüß .]+?)(?:\s*(?:app|auf))?[.!?]?$/)){
      const name=m[1].trim();
      const map={rechner:'calc',uhr:'clock',timer:'clock',stoppuhr:'clock',notizen:'notes',notiz:'notes',wetter:'weather',musik:'music',fotos:'photos',galerie:'photos',kamera:'camera','app store':'appstore',appstore:'appstore',store:'appstore',einstellungen:'settings',nova:'nova',assistent:'nova',orbit:'orbit',kompass:'kompass','kompass pro':'kompass','pixel maler':'maler',maler:'maler',taktgeber:'metronom',metronom:'metronom'};
      const id=map[name];
      if(id&&(PAGES[0].includes(id)||INSTALLED.includes(id)))return A(`Öffne ${APPS[id].name} …`,()=>openFromAnywhere(id));
      if(id)return A(`„${APPS[id].name}" ist noch nicht installiert — schau mal im App Store vorbei. 🛍️`);
      return A(`Eine App namens „${name}" kenne ich nicht.`);
    }
    if(/wetter/.test(q)){
      const cm=q.match(/münchen|hamburg|palermo/);
      const wd=cm?WeatherData.find(x=>x.city.toLowerCase()===cm[0]):WeatherData[0];
      return A(`In ${wd.city} ist es gerade ${wd.now}° und ${wd.cond.toLowerCase()}. Heute: bis ${wd.hi}°, nachts ${wd.lo}°.${cm?'':' (Ich habe München genommen — sag z. B. „Wetter in Palermo".)'}`);
    }
    if(/musik|song|lied|track/.test(q)){
      if(/aus\b|stopp|pause/.test(q))return A('Musik pausiert. 🔇',()=>{if(Music.playing)Music.toggle();});
      if(/nächst|weiter|skip/.test(q))return A('Nächster Track. 🎵',()=>Music.next());
      return A(`Ich spiele „${Music.cur().title}" von ${Music.cur().artist}. 🎶`,()=>{if(!Music.playing)Music.toggle();});
    }
    if(/dunkel|dark ?mode|nachtmodus/.test(q))return A('Wird dunkel. 🌙',()=>setDark(true));
    if(/\bhell(er|es)?\b|light ?mode/.test(q))return A('Und es werde Licht. ☀️',()=>setDark(false));
    if(/hintergrund|wallpaper/.test(q))return A('Neues Hintergrundbild — schau, wie sich die ganze UI mit umfärbt. 🎨',()=>{State.wallpaper=(State.wallpaper+1)%WALLPAPERS.length;drawWall();setTint(WALLPAPERS[State.wallpaper].tint);updateWidget();});
    if(/batterie|akku/.test(q))return A(`Die Batterie steht bei ${State.battery} %. ${State.battery>50?'Alles entspannt.':'Langsam ans Laden denken!'} 🔋`);
    if(/wie spät|uhrzeit/.test(q)){const d=new Date();return A(`Es ist ${fmtTime(d)} Uhr.`);}
    if(/datum|welcher tag|heute/.test(q)){const d=new Date();return A(`Heute ist ${DAYS[d.getDay()]}, der ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}.`);}
    if(/witz|lustig/.test(q))return A(JOKES[(jokeI++)%JOKES.length]);
    if(/foto|bild/.test(q)&&/mach|schieß|aufnehm/.test(q))return A('Dafür öffne ich dir die Kamera. 📸',()=>openFromAnywhere('camera'));
    if(/danke/.test(q))return A('Immer gerne! 💙');
    if(/[0-9]\s*[+\-*×÷:\/]|was (ist|ergibt|macht).*\d/.test(q)){
      const r=calcExpr(q);
      if(r!=null)return A(`Das ergibt <b>${String(r).replace('.',',')}</b>.`);
    }
    return A('Hm, das habe ich noch nicht gelernt. Versuch es mit „Timer auf 5 Minuten", „Wie ist das Wetter?", „Öffne Rechner" — oder gib mir eine Rechenaufgabe.');
  }
  function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function bubble(who,html){
    const b=el('div','');
    b.style.cssText=who==='me'
      ?'align-self:flex-end;background:var(--tint);color:#fff;border-radius:18px 18px 4px 18px;padding:9px 14px;max-width:82%;font-size:15px;line-height:1.4'
      :'align-self:flex-start;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:18px 18px 18px 4px;padding:9px 14px;max-width:86%;font-size:15px;line-height:1.4';
    b.innerHTML=html;
    const chat=$('#nv-chat');if(chat){chat.appendChild(b);chat.scrollTop=chat.scrollHeight;}
    return b;
  }
  function say(who,html){msgs.push({who,html});return bubble(who,html);}
  function handle(q){
    q=(q||'').trim();if(!q||busy)return;
    say('me',escapeHtml(q));
    const inp=$('#nv-in');if(inp)inp.value='';
    busy=true;
    const th=bubble('nova','<span style="letter-spacing:3px">•••</span>');
    setTimeout(()=>{
      const a=answer(q);
      th.innerHTML=a.text;
      msgs.push({who:'nova',html:a.text});
      busy=false;
      const chat=$('#nv-chat');if(chat)chat.scrollTop=chat.scrollHeight;
      if(a.action)setTimeout(a.action,420);
    },560);
  }
  function drawOrb(){
    if(!visible)return;
    const t=nowMs()/1000;const w=orb.width,h=orb.height,cx=w/2,cy=h/2;
    octx.clearRect(0,0,w,h);
    const sp=busy?2.6:1;
    const cols=['#5c7bff','#c05cff','#ff5ca8','#4cd9ff'];
    octx.globalCompositeOperation='lighter';
    cols.forEach((c,i)=>{
      const a=t*sp*(0.6+i*0.13)+i*1.7;
      const x=cx+Math.cos(a)*16,y=cy+Math.sin(a*1.3)*16;
      const g=octx.createRadialGradient(x,y,0,x,y,46);
      g.addColorStop(0,c+'ee');g.addColorStop(1,c+'00');
      octx.fillStyle=g;octx.beginPath();octx.arc(x,y,46,0,7);octx.fill();
    });
    octx.globalCompositeOperation='source-over';
    octx.strokeStyle='rgba(255,255,255,.35)';octx.lineWidth=2;
    octx.beginPath();octx.arc(cx,cy,54+Math.sin(t*2)*2,0,7);octx.stroke();
    raf=requestAnimationFrame(drawOrb);
  }
  return{
    name:'Nova',
    render(){
      return `<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% -10%,#232a54,#05060f 60%);display:flex;flex-direction:column">
      <div style="height:56px;flex:0 0 auto"></div>
      <canvas id="nv-orb" width="150" height="150" style="width:130px;height:130px;margin:0 auto;flex:0 0 auto"></canvas>
      <div style="text-align:center;color:#fff;font-size:21px;font-weight:800;flex:0 0 auto">Nova</div>
      <div style="text-align:center;color:rgba(255,255,255,.55);font-size:13px;flex:0 0 auto">Deine Offline-Assistentin</div>
      <div id="nv-chat" style="flex:1;overflow-y:auto;padding:14px 16px 6px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y"></div>
      <div style="display:flex;gap:8px;overflow-x:auto;padding:8px 14px;flex:0 0 auto;touch-action:pan-x">${CHIPS.map(c=>`<button class="nv-chip" style="flex:0 0 auto;padding:9px 14px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:13.5px;font-weight:600">${c}</button>`).join('')}</div>
      <div style="display:flex;gap:8px;padding:8px 16px 26px;flex:0 0 auto">
        <input id="nv-in" placeholder="Frag Nova …" style="flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:12px 16px;color:#fff;font-size:15px;outline:none;-webkit-user-select:text;user-select:text">
        <button id="nv-send" style="width:46px;height:46px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 4l7 7-1.4 1.4L13 7.8V20h-2V7.8l-4.6 4.6L5 11z"/></svg></button>
      </div></div>`;
    },
    mount(view){
      orb=$('#nv-orb',view);octx=orb.getContext('2d');
      visible=true;drawOrb();
      msgs.forEach(mg=>bubble(mg.who,mg.html));
      if(!msgs.length)say('nova','Hallo! 👋 Ich bin Nova. Ich kann Timer stellen, das Wetter ansagen, Musik steuern, rechnen und Apps öffnen — komplett offline.');
      $('#nv-send',view).addEventListener('click',()=>handle($('#nv-in',view).value));
      $('#nv-in',view).addEventListener('keydown',e=>{if(e.key==='Enter')handle(e.target.value);});
      $$('.nv-chip',view).forEach(c=>c.addEventListener('click',()=>handle(c.textContent)));
      _visHandlers.nova=v=>{visible=v;if(v)drawOrb();else if(raf)cancelAnimationFrame(raf);};
    }
  };
})();

/* ============================================================
   Boot sequence init
   ============================================================ */
function init(){
  // Scroll-Pinning: overflow:hidden-Container dürfen NIE scrollen (Fokus/
  // scrollIntoView können sie sonst programmatisch verschieben — z. B. wenn
  // auf dem iPhone die Tastatur für ein Eingabefeld aufgeht)
  [document.getElementById('screen'),document.getElementById('device')].forEach(n=>{
    n.addEventListener('scroll',()=>{n.scrollLeft=0;n.scrollTop=0;});
  });
  window.addEventListener('scroll',()=>window.scrollTo(0,0));
  sizeWall();drawWall();
  setTint(WALLPAPERS[0].tint);
  setAccent(ACCENTS[0]);
  renderStatusRight();
  renderLockNotifs();
  buildHome();
  buildCC();
  updateClock();
  islandTick();
  // Lebendiges Wallpaper: Mesh-Blobs driften langsam (~20 fps, pausiert bei offener App)
  let wallFrame=0;
  (function wallLoop(){
    requestAnimationFrame(wallLoop);
    if(document.hidden)return;
    if(State.currentApp&&openProgress>0.98)return;
    if((wallFrame++)%3)return;
    drawWall();
  })();
  setInterval(updateClock,1000);
  // battery drain
  setInterval(()=>{if(State.battery>5){State.battery-=1;renderStatusRight();}},45000);
  runBoot();
  // resume audio on first interaction
  const kick=()=>{if(Music&&!State._audioKicked){State._audioKicked=true;}};
  window.addEventListener('pointerdown',kick,{once:true});
}
window.addEventListener('resize',()=>{sizeWall();drawWall();applyPages();});
init();
