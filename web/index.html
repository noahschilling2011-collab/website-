<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS</title>
<style>
/* ---------------------------------------------------------------------------
   JARVIS — Phase 1.

   Akzent ist ein warmes Bernstein. Bewusst nicht das übliche Indigo: JARVIS
   soll ruhig und warm wirken, nicht wie ein Dashboard. Genau eine Akzentfarbe,
   verwendet für aktive Konversation, Fokusring und den Senden-Knopf.

   Zwei Glasflächen (Seitenleiste, Eingabe), dahinter zwei weiche Verläufe —
   sonst hätte backdrop-filter nichts zu verwischen.
--------------------------------------------------------------------------- */

:root {
  --bg-0: #0a0a0c;
  --bg-1: #121216;
  --bg-2: #1a1a20;
  --bg-3: #22222a;

  --text:      #e8e8ec;
  --text-loud: #f4f4f7;
  --text-dim:  #9a9aa4;   /* 5.0:1 auch auf der aktiven, akzentgetoenten Zeile */

  --accent:      #f2b544;
  --accent-soft: rgba(242, 181, 68, 0.14);
  --accent-line: rgba(242, 181, 68, 0.35);
  --on-accent:   #17140c;

  --danger: #f2726b;

  --line: rgba(255, 255, 255, 0.09);

  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 64px;

  --step--1: clamp(0.83rem, 0.80rem + 0.15vw, 0.90rem);
  --step-0:  clamp(0.94rem, 0.91rem + 0.20vw, 1.02rem);
  --step-1:  clamp(1.13rem, 1.06rem + 0.35vw, 1.32rem);

  --enter: cubic-bezier(.2, .8, .2, 1);
  --exit:  cubic-bezier(.4, 0, 1, 1);

  --sidebar-w: 280px;
}

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  font-size: var(--step-0);
  line-height: 1.55;
  color: var(--text);
  background-color: var(--bg-0);
  /* Struktur hinter dem Glas. Ohne das ist backdrop-filter sinnlos. */
  background-image:
    radial-gradient(900px 620px at 12% -8%,  rgba(242, 181, 68, 0.10), transparent 62%),
    radial-gradient(760px 560px at 92% 108%, rgba(86, 132, 214, 0.10), transparent 60%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

.glass {
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
}
@supports not (backdrop-filter: blur(1px)) {
  .glass { background: rgba(22, 22, 28, 0.94); }
}

/* --- Grundgerüst ---------------------------------------------------------- */

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  height: 100dvh;
}

/* --- Seitenleiste --------------------------------------------------------- */

.sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-radius: 0;
  border-width: 0 1px 0 0;
  padding: var(--s-5) var(--s-3) var(--s-3);
  gap: var(--s-4);
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: 0 var(--s-2);
}
.brand-mark {
  width: 30px; height: 30px;
  flex: none;
  display: grid; place-items: center;
  border-radius: 9px;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
}
.brand-name {
  margin: 0;
  font-size: var(--step-0);
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--text-loud);
}
.brand-phase {
  margin-left: auto;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--text-dim);
}

.btn-new {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  width: 100%;
  padding: 10px var(--s-3);
  border: 1px dashed var(--line);
  border-radius: 11px;
  background: transparent;
  color: var(--text);
  font-weight: 500;
  cursor: pointer;
  transition: background 140ms ease-out, border-color 140ms ease-out,
              color 140ms ease-out;
}
.btn-new:hover { background: var(--bg-2); border-color: var(--accent-line); color: var(--text-loud); }

.conv-list {
  list-style: none;
  margin: 0;
  padding: 0 0 var(--s-2);
  overflow-y: auto;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.conv {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  border-radius: 10px;
  transition: background 140ms ease-out;
  animation: rise 320ms var(--enter) both;
}
.conv:hover { background: var(--bg-2); }
.conv.is-active { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }

.conv-open {
  flex: 1;
  min-width: 0;
  display: block;
  padding: 9px var(--s-2) 9px var(--s-3);
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
  color: var(--text);
}
.conv.is-active .conv-open { color: var(--text-loud); }
.conv-title {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: var(--step--1);
}
.conv-meta { display: block; font-size: 11px; color: var(--text-dim); }

.conv-del {
  flex: none;
  display: grid;
  place-items: center;
  width: 30px; height: 30px;
  margin-right: var(--s-1);
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--text-dim);
  cursor: pointer;
  opacity: 0;
  transition: opacity 140ms ease-out, color 140ms ease-out, background 140ms ease-out;
}
.conv:hover .conv-del, .conv-del:focus-visible { opacity: 1; }
.conv-del:hover { color: var(--danger); background: var(--bg-3); }

.sidebar-foot {
  padding: var(--s-3) var(--s-3) var(--s-1);
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s-2);
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex: none; }
.dot.is-ok   { background: #5fcf8e; }
.dot.is-bad  { background: var(--danger); }

/* --- Hauptbereich --------------------------------------------------------- */

.main {
  display: grid;
  /* Die Spalte muss ausdruecklich begrenzt werden. Eine implizite Grid-Spalte
     ist auto = max-content und waechst mit dem breitesten Kind - dadurch liefen
     Topbar, Thread und Eingabe ueber die Fensterbreite hinaus. */
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  min-width: 0;
  min-height: 0;
}

.topbar {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-4) var(--s-5);
  border-bottom: 1px solid var(--line);
  min-height: 61px;
}
.chat-title {
  /* Ohne flex+min-width:0 schrumpft ein Flex-Element nie unter seinen Text.
     Genau das hat bei 360px die ganze Spalte auf 448px aufgeblaeht. */
  flex: 1;
  min-width: 0;
  margin: 0;
  font-size: var(--step-0);
  font-weight: 500;
  color: var(--text-loud);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: text;
}
.title-input {
  flex: 1;
  min-width: 0;
  padding: 4px var(--s-2);
  border: 1px solid var(--accent-line);
  border-radius: 8px;
  background: var(--bg-2);
}
.model-chip {
  margin-left: auto;
  flex: none;
  padding: 3px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
}

.icon-btn {
  display: none;
  place-items: center;
  width: 34px; height: 34px;
  flex: none;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
}

.thread {
  overflow-y: auto;
  padding: var(--s-5) var(--s-5) var(--s-6);
  display: flex;
  flex-direction: column;
  gap: var(--s-4);
  scroll-behavior: smooth;
}

.msg { max-width: min(70ch, 88%); animation: rise 340ms var(--enter) both; }
.msg-user { align-self: flex-end; }
.msg-assistant, .msg-error { align-self: flex-start; }

.bubble {
  padding: var(--s-3) var(--s-4);
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--bg-1);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.msg-user .bubble {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  border-bottom-right-radius: 5px;
}
.msg-assistant .bubble { border-bottom-left-radius: 5px; }
.msg-error .bubble { border-color: rgba(242, 114, 107, 0.45); color: #ffd9d6; }

.msg-meta {
  margin-top: var(--s-1);
  font-size: 11px;
  color: var(--text-dim);
  padding: 0 var(--s-2);
}
.msg-user .msg-meta { text-align: right; }

.empty {
  margin: auto;
  max-width: 46ch;
  text-align: center;
  color: var(--text-dim);
  animation: rise 400ms var(--enter) both;
}
.empty h2 {
  margin: 0 0 var(--s-2);
  font-size: var(--step-1);
  font-weight: 500;
  color: var(--text-loud);
  letter-spacing: -0.01em;
}
.empty p { margin: 0; }

.typing { display: inline-flex; gap: 5px; align-items: center; height: 1.55em; }
.typing i {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-dim);
  animation: pulse 1.25s ease-in-out infinite;
}
.typing i:nth-child(2) { animation-delay: 0.16s; }
.typing i:nth-child(3) { animation-delay: 0.32s; }

/* --- Eingabe -------------------------------------------------------------- */

.composer-wrap {
  padding: 0 var(--s-5) max(var(--s-5), env(safe-area-inset-bottom, 0px));
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: var(--s-3);
  padding: var(--s-2) var(--s-2) var(--s-2) var(--s-4);
  border-radius: 16px;
  transition: border-color 160ms ease-out;
}
.composer:focus-within { border-color: var(--accent-line); }

.composer textarea {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  resize: none;
  background: transparent;
  padding: 10px 0;
  min-height: 1.5em;
  max-height: 200px;
  line-height: 1.5;
}
.composer textarea::placeholder { color: var(--text-dim); }
/* Das outline:none oben schlaegt die globale :focus-visible-Regel (hoehere
   Spezifitaet). Ohne diesen Ersatz waere das Feld per Tastatur unsichtbar. */
.composer textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 8px;
}

.btn-send {
  flex: none;
  display: grid;
  place-items: center;
  width: 38px; height: 38px;
  border: 0;
  border-radius: 11px;
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
  transition: transform 140ms ease-out, opacity 140ms ease-out;
}
.btn-send:hover:not(:disabled) { transform: translateY(-1px); }
.btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

.hint {
  margin: var(--s-2) var(--s-1) 0;
  font-size: 11px;
  color: var(--text-dim);
  min-height: 1.4em;
}

/* --- Bewegung ------------------------------------------------------------- */

@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
@keyframes pulse {
  0%, 100% { opacity: 0.25; transform: translateY(0); }
  50%      { opacity: 1;    transform: translateY(-3px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* --- Schmal --------------------------------------------------------------- */

@media (max-width: 800px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .icon-btn { display: grid; }
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 20;
    width: min(var(--sidebar-w), 86vw);
    transform: translateX(-102%);
    transition: transform 300ms var(--enter);
  }
  .sidebar.is-open { transform: none; }
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(0, 0, 0, 0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 220ms var(--exit);
  }
  .scrim.is-open { opacity: 1; pointer-events: auto; }
  .thread, .composer-wrap { padding-left: var(--s-4); padding-right: var(--s-4); }
  .msg { max-width: 94%; }
}
</style>
</head>
<body>

<div class="scrim" id="scrim" hidden></div>

<div class="app">
  <aside class="sidebar glass" id="sidebar" aria-label="Konversationen">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M12 2.6v3.2M12 18.2v3.2M2.6 12h3.2M18.2 12h3.2"></path>
          <path d="M5.4 5.4l2.3 2.3M16.3 16.3l2.3 2.3M18.6 5.4l-2.3 2.3M7.7 16.3l-2.3 2.3"></path>
        </svg>
      </span>
      <h1 class="brand-name">JARVIS</h1>
      <span class="brand-phase">Phase 1</span>
    </div>

    <button class="btn-new" id="btn-new" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
      Neue Konversation
    </button>

    <ul class="conv-list" id="conv-list"></ul>

    <div class="sidebar-foot">
      <span class="dot" id="health-dot"></span>
      <span id="health-text">verbinde…</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="btn-menu" type="button" aria-label="Konversationen öffnen">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"></path>
        </svg>
      </button>
      <h2 class="chat-title" id="chat-title" title="Doppelklick zum Umbenennen">Neue Konversation</h2>
      <span class="model-chip" id="model-chip">—</span>
    </header>

    <div class="thread" id="thread" aria-live="polite" aria-busy="false"></div>

    <div class="composer-wrap">
      <form class="composer glass" id="composer">
        <label class="sr-only" for="input" hidden>Nachricht</label>
        <textarea id="input" rows="1" placeholder="Schreib etwas…"></textarea>
        <button class="btn-send" id="btn-send" type="submit" aria-label="Senden">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 12h13M12 5.5l6 6.5-6 6.5"></path>
          </svg>
        </button>
      </form>
      <p class="hint" id="hint"></p>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  // Zustand lebt hier, nicht in localStorage — das ist in manchen
  // Umgebungen nicht verfügbar und die Seite stürbe an der ersten Zeile.
  var state = { conversations: [], activeId: null, busy: false };

  var el = {
    list:      document.getElementById('conv-list'),
    thread:    document.getElementById('thread'),
    title:     document.getElementById('chat-title'),
    chip:      document.getElementById('model-chip'),
    form:      document.getElementById('composer'),
    input:     document.getElementById('input'),
    send:      document.getElementById('btn-send'),
    hint:      document.getElementById('hint'),
    newBtn:    document.getElementById('btn-new'),
    menuBtn:   document.getElementById('btn-menu'),
    sidebar:   document.getElementById('sidebar'),
    scrim:     document.getElementById('scrim'),
    healthDot: document.getElementById('health-dot'),
    healthTxt: document.getElementById('health-text')
  };

  // --- HTTP ---------------------------------------------------------------

  function api(path, options) {
    var opts = options || {};
    if (opts.body !== undefined) {
      opts.headers = { 'content-type': 'application/json' };
      opts.body = JSON.stringify(opts.body);
    }
    return fetch(path, opts).then(function (res) {
      if (res.status === 204) return null;
      return res.text().then(function (raw) {
        var data = null;
        try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
        if (!res.ok) {
          var detail = (data && data.detail) || raw || ('HTTP ' + res.status);
          if (typeof detail !== 'string') detail = JSON.stringify(detail);
          var err = new Error(detail);
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  // --- Bausteine ----------------------------------------------------------

  function svg(paths, size) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('width', size); s.setAttribute('height', size);
    s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round');
    s.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', paths);
    s.appendChild(p);
    return s;
  }

  function renderConversations() {
    el.list.textContent = '';
    state.conversations.forEach(function (conv, i) {
      var li = document.createElement('li');
      li.className = 'conv' + (conv.id === state.activeId ? ' is-active' : '');
      li.style.animationDelay = Math.min(i, 8) * 40 + 'ms';

      var open = document.createElement('button');
      open.type = 'button';
      open.className = 'conv-open';

      var title = document.createElement('span');
      title.className = 'conv-title';
      title.textContent = conv.title;

      var meta = document.createElement('span');
      meta.className = 'conv-meta';
      meta.textContent = conv.message_count + (conv.message_count === 1 ? ' Nachricht' : ' Nachrichten');

      open.appendChild(title);
      open.appendChild(meta);
      open.addEventListener('click', function () { selectConversation(conv.id); });

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'conv-del';
      del.setAttribute('aria-label', 'Konversation „' + conv.title + '“ löschen');
      del.appendChild(svg('M4 7h16M9.5 7V5h5v2M6.5 7l1 13h9l1-13M10.5 10.5v6M13.5 10.5v6', 15));
      del.addEventListener('click', function (e) {
        e.stopPropagation();
        removeConversation(conv);
      });

      li.appendChild(open);
      li.appendChild(del);
      el.list.appendChild(li);
    });
  }

  function messageNode(message) {
    var wrap = document.createElement('div');
    wrap.className = 'msg msg-' + message.role;

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    // textContent, niemals innerHTML: der Inhalt kommt aus einem Modell.
    bubble.textContent = message.content;
    wrap.appendChild(bubble);

    if (message.role === 'assistant' && message.model) {
      var meta = document.createElement('div');
      meta.className = 'msg-meta';
      var tokens = (message.input_tokens || 0) + (message.output_tokens || 0);
      meta.textContent = message.model + (tokens ? ' · ' + tokens + ' Token' : '');
      wrap.appendChild(meta);
    }
    return wrap;
  }

  function showEmpty() {
    el.thread.textContent = '';
    var box = document.createElement('div');
    box.className = 'empty';
    var h = document.createElement('h2');
    h.textContent = 'Womit fangen wir an?';
    var p = document.createElement('p');
    p.textContent = 'Alles, was hier steht, wird lokal gespeichert und ist nach einem Neuladen noch da.';
    box.appendChild(h); box.appendChild(p);
    el.thread.appendChild(box);
  }

  function renderMessages(messages) {
    if (!messages.length) { showEmpty(); return; }
    el.thread.textContent = '';
    messages.forEach(function (m) { el.thread.appendChild(messageNode(m)); });
    scrollDown();
  }

  function scrollDown() {
    requestAnimationFrame(function () { el.thread.scrollTop = el.thread.scrollHeight; });
  }

  function appendError(text) {
    var wrap = document.createElement('div');
    wrap.className = 'msg msg-error';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    el.thread.appendChild(wrap);
    scrollDown();
  }

  function thinkingNode() {
    var wrap = document.createElement('div');
    wrap.className = 'msg msg-assistant';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    var dots = document.createElement('span');
    dots.className = 'typing';
    dots.setAttribute('aria-label', 'JARVIS denkt nach');
    for (var i = 0; i < 3; i++) dots.appendChild(document.createElement('i'));
    bubble.appendChild(dots);
    wrap.appendChild(bubble);
    return wrap;
  }

  // --- Abläufe ------------------------------------------------------------

  function loadConversations() {
    return api('/api/conversations').then(function (list) {
      state.conversations = list || [];
      renderConversations();
    });
  }

  function selectConversation(id) {
    state.activeId = id;
    closeSidebar();
    renderConversations();
    return api('/api/conversations/' + id).then(function (conv) {
      el.title.textContent = conv.title;
      renderMessages(conv.messages);
    }).catch(function (err) {
      appendError('Konversation konnte nicht geladen werden: ' + err.message);
    });
  }

  function startNew() {
    state.activeId = null;
    el.title.textContent = 'Neue Konversation';
    renderConversations();
    showEmpty();
    closeSidebar();
    el.input.focus();
  }

  function removeConversation(conv) {
    if (!window.confirm('„' + conv.title + '“ endgültig löschen?')) return;
    api('/api/conversations/' + conv.id, { method: 'DELETE' }).then(function () {
      if (state.activeId === conv.id) startNew();
      return loadConversations();
    }).catch(function (err) {
      el.hint.textContent = 'Löschen fehlgeschlagen: ' + err.message;
    });
  }

  function setBusy(busy) {
    state.busy = busy;
    el.send.disabled = busy;
    el.input.disabled = busy;
    el.thread.setAttribute('aria-busy', busy ? 'true' : 'false');
  }

  function send(text) {
    setBusy(true);
    el.hint.textContent = '';

    if (el.thread.querySelector('.empty')) el.thread.textContent = '';
    el.thread.appendChild(messageNode({ role: 'user', content: text }));

    var pending = thinkingNode();
    el.thread.appendChild(pending);
    scrollDown();

    var started = Date.now();

    api('/api/chat', {
      method: 'POST',
      body: { message: text, conversation_id: state.activeId }
    }).then(function (data) {
      pending.remove();
      el.thread.appendChild(messageNode(data.reply));
      scrollDown();

      state.activeId = data.conversation.id;
      el.title.textContent = data.conversation.title;
      el.hint.textContent = 'Antwort in ' + ((Date.now() - started) / 1000).toFixed(1)
        + ' s · ' + data.usage.input_tokens + ' Token rein, '
        + data.usage.output_tokens + ' raus';
      return loadConversations();
    }).catch(function (err) {
      pending.remove();
      appendError(err.message);
      el.hint.textContent = '';
    }).then(function () {
      setBusy(false);
      el.input.focus();
    });
  }

  function renameActive() {
    if (state.activeId === null) return;
    var current = el.title.textContent;
    var input = document.createElement('input');
    input.className = 'title-input';
    input.value = current;
    el.title.replaceWith(input);
    input.focus();
    input.select();

    var done = false;
    function finish(save) {
      if (done) return;
      done = true;
      var value = input.value.trim() || current;
      input.replaceWith(el.title);
      if (!save || value === current) { el.title.textContent = current; return; }
      el.title.textContent = value;
      api('/api/conversations/' + state.activeId, { method: 'PATCH', body: { title: value } })
        .then(loadConversations)
        .catch(function (err) {
          el.title.textContent = current;
          el.hint.textContent = 'Umbenennen fehlgeschlagen: ' + err.message;
        });
    }
    input.addEventListener('blur', function () { finish(true); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      if (e.key === 'Escape') { finish(false); }
    });
  }

  function loadHealth() {
    return api('/api/health').then(function (h) {
      el.chip.textContent = h.model;
      el.healthDot.className = 'dot ' + (h.status === 'ok' ? 'is-ok' : 'is-bad');
      var note;
      if (h.provider_error) note = h.provider_error;
      else if (h.provider === 'fake') note = 'Fake-Anbieter — kein echtes Modell, keine Kosten';
      else note = 'Anbieter ' + h.provider;
      el.healthTxt.textContent = note;
    }).catch(function () {
      el.healthDot.className = 'dot is-bad';
      el.healthTxt.textContent = 'Backend nicht erreichbar';
    });
  }

  // --- Seitenleiste schmal -------------------------------------------------

  function openSidebar() {
    el.sidebar.classList.add('is-open');
    el.scrim.hidden = false;
    requestAnimationFrame(function () { el.scrim.classList.add('is-open'); });
  }
  function closeSidebar() {
    el.sidebar.classList.remove('is-open');
    el.scrim.classList.remove('is-open');
    setTimeout(function () {
      if (!el.sidebar.classList.contains('is-open')) el.scrim.hidden = true;
    }, 240);
  }

  // --- Verdrahtung ---------------------------------------------------------

  el.form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = el.input.value.trim();
    if (!text || state.busy) return;
    el.input.value = '';
    autogrow();
    send(text);
  });

  el.input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      el.form.requestSubmit();
    }
  });

  function autogrow() {
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, 200) + 'px';
  }
  el.input.addEventListener('input', autogrow);

  el.newBtn.addEventListener('click', startNew);
  el.menuBtn.addEventListener('click', openSidebar);
  el.scrim.addEventListener('click', closeSidebar);
  el.title.addEventListener('dblclick', renameActive);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSidebar();
  });

  el.hint.textContent = 'Enter senden · Umschalt+Enter neue Zeile';
  showEmpty();
  loadHealth();
  loadConversations().then(function () {
    if (state.conversations.length) selectConversation(state.conversations[0].id);
  }).catch(function () { /* Health zeigt den Fehler bereits an */ });
})();
</script>
</body>
</html>
